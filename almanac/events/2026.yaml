# Almanac: events 2026
# Last sweep: 2026-08-17
#
# Scope of this sweep: 2026-08-17 to 2026-12-31. Entries dated before 17 August
# were not researched, so this file covers the remainder of the year only.
#
# Ratings are set from the three inputs in sweep.md: pull-event match, interest
# match (reading the scope's exclusions), and measured great-circle proximity to
# a base in almanac.yaml. Distances quoted in notes are from Jerez de la Frontera
# (600 km radius) or Gold Coast (1000 km radius). Places named in
# frequent_destinations count as near regardless of distance.
#
# estimates: `attendees` is the whole gate; other segment keys are interest or
# pull_event ids from almanac.yaml. access is observed, not estimated. A segment
# recorded as `none` genuinely does not attend, as distinct from an unpublished
# figure, which is still given a range.
#
# Ordering: star tier, then date within tier. Events whose dates are not yet
# published are grouped in a final block regardless of tier, because the action
# they need is a re-check rather than a diary entry.

events:

  # ============================== 5 stars ==============================

