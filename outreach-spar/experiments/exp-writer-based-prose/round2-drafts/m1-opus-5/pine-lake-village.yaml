quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Both non-final rounds
     carry type and number. The final round holds one email and one phone
     message, within the one-email cap. Addresses are real, not placeholders.
  2. Coverage. fact_provenance reaches every factual claim in the final email
     and the phone script, including the two claims that appear only in the
     phone fallbacks. chosen_usps is set on the draft and final rounds.
  3. Presupposition. The message tells Corey nothing about his own village.
     The unit count, the residents committee and the village bus stay out of
     the text; the bus appears only as the thing an outing would need notice
     for, which is his own frame, not a recital of research.
  4. Manufactured connection. No claim of shared interest. The profile found
     no public statements and no social activity for this contact, and the
     draft asserts nothing that would need them. The one selection claim the
     reader could not verify was cut at review.
  5. Concreteness. The ask is answerable in one sentence: a rough number, or a
     day for a bus outing.
  6. Band pattern. No other approach file exists in this campaign folder yet,
     so there is no band to read against. The next drafter in this segment
     should vary the opener: this one leads with the sender's identity and the
     tent, then the ask.
  7. Final email cardinality. One email in the final round.
