quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Both non-final rounds
     carry type and number. The final round holds one email and one phone
     message, within the one-email cap. Addresses and numbers are real, not
     placeholders.
  2. Coverage. fact_provenance reaches every factual claim in the final email
     and the phone script, including the three that appear only in the phone
     branches: the ninety-minute duration, the daytime session list and the
     free-seat answer. chosen_usps is set on the draft and final rounds.
  3. Presupposition. The message tells her nothing about her own hub. The four
     regions, the term timetables, the Easter BBQ and the Children's Week
     event stay out of the text; they shaped the angle, not the wording. The
     one sentence that did describe her reach back to her was cut at review.
  4. Manufactured connection. No claim of shared interest. The profile records
     no public statements by her and no farm-visit or excursion activity, and
     the draft asserts neither. The forward-it-on ask rests on what a playgroup
     hub demonstrably does with its own timetables.
  5. Concreteness. The ask is answerable in one sentence: a rough number of
     families, or a day in the week after opening.
  6. Band pattern. Two approach files precede this one in the campaign folder.
     Beaudesert Probus opens with the tent and introduces the sender second;
     Pine Lake Village opens with the sender and reaches the tent in the same
     sentence. This one opens with the sender and holds the tent to the second
     paragraph, because the prior-contact line has to clear first, which is a
     sentence no other file in the band carries. The three are close in shape,
     and the next drafter in this segment should open somewhere other than the
     sender's identity.
  7. Final email cardinality. One email in the final round.
