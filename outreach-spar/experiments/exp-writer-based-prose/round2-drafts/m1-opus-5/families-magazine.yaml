  - type: review
    number: 2
    verdict: REVISE
    notes: |
      Reader's graph clean. Nothing in the draft leans on anything outside the message itself or Chinnu's own knowledge of her outlet. Lowest scores were "at any show in the opening run" at 3, a forward reference resolving one sentence later, and "a small number of Queensland family publishers" at 4, tied to the send date.
    in_character: |
      Cold email, never heard of these people. A venue out past Nerang way has a circus tent up on its lawn. Plausible, and we have covered exactly this kind of thing before; I remember running something on a farm animal place near Mount Samson.
      The offer is dead simple to read: come see it myself, four seats, hand five more to my readers, no strings, no list to keep, they book themselves. Product and venue reviews, competitions and giveaways are our own stock in trade, so nothing here reads as a strange ask.
      The timing is what makes me pause. This lands Wednesday and the show opens Thursday. Going myself before writing anything is about twenty-four hours' notice, doable for a session, tight against our production schedule for a first-hand write-up before the run ends Sunday. The giveaway is easier: I do not need to attend, I just need to post it, and since winners book their own seats that part is genuinely possible in the time.
      Nothing would stop me replying. What I would actually ask is practical: how long the giveaway window runs, whether it has to finish before Sunday or can stretch into the second week, and whether I can have a photo or two to run with the post.
      REPLY_PCT: 55
    fact_check:
      - claim: Show times, family pass of four with five reader passes, and the passes not being advertised or on public sale.
        source: circus.yaml sessions 24 to 27 September; segment first_ask; usps.chosen-not-advertised
        result: verified
      - claim: Readers buying their own tickets can do that at the Eventbrite listing.
        source: campaign usps.opening-week-seats.rests_on
        result: disputed
        note: Same objection as round 1, raised again against circus.yaml's Oztix links.
        correction: Not applied, on the grounds recorded in round 1. The director note in the body already carries the flag, and it was left at its existing size rather than argued at greater length inside the draft.
    antifact_check: No violations. Mount Nathan rather than Tamborine Mountain; no code, price or discount in the first email.
    revision_note: |
      Sorted before revising. Absorb by reframing: one. The free seats are opening-week only, so the giveaway window is a fact rather than a negotiation, and it belongs beside the offer it limits. Her own pass already said "any show in the opening run"; the reader passes now say the same seven shows. Without it she cannot write the giveaway post, which makes it the one question that shapes what she can do this week. Leave for the reply: photographs to run with the post, and lead time on a future season, both named by the persona as reply questions, and an offer of assets before the pass is accepted puts the ask second. No change: the clash between a six-issue print cycle and a four-day run is structural, and the only repair in reach is an out-of-segment USP committing seats that need the venue manager's permission.

