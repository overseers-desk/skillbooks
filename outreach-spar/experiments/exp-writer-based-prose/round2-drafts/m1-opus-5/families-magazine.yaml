quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Every draft and review round numbered. The final round carries one email and one phone message, within the cap on emails. Addresses are real.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script. chosen_usps present on each draft and on the final.
  3. Presupposition. One flagged and kept: "Your readers are the families the show was made for" asserts a relation between her audience and the show, which is our claim rather than a recital of her own facts. The third persona read it as flattery and replied anyway. The message carries no recital of her circulation, audience profile or publishing history.
  4. Manufactured connection. Nothing claims a shared interest the profile does not carry. The Trevena Glen precedent and her advertise-page giveaway practice informed the angle without being named at her.
