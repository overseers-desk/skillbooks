  - type: review
    number: 3
    verdict: DONE
    notes: |
      Reader's graph. The opener, the inline introduction of the circus company, the named and dated show, and the backward-resolving "for the same seven shows" all scored 5. "Held for you" scored 3, the selection reason arriving two sentences later. "A small number of Queensland family publishers" scored 2 as an unverifiable claim she must take on trust. "Your readers are the families the show was made for" scored 3. The legal entity in the signature scored 2 as technically opaque but not load-bearing.
    in_character: |
      A circus at a farm venue, that is a nice pitch. I do not know Historic Rivermill and I do not know this Priyanka Das, but the email does the work: where she is from, what the show is, when it opens, what is on offer. I do not have to go digging.
      Free family pass of four, no strings, five to give my readers. That is the kind of easy win I like. Nobody has to bring a bus of kids anywhere, my readers just book their own seats, and she has already thought of the collection problem.
      The bit that makes me pause slightly is "a small number of Queensland family publishers". I cannot check that, and it is the kind of line every one of these pitches uses whether it is true or not. It does not stop me, it just reads as flattery rather than fact.
      Timing: the email lands Wednesday, the first show is Thursday. That is fine for me to say yes, put me down for Sunday 2pm. A giveaway is an Instagram post rather than a print deadline, so I could turn that around same-day too. Nothing here is actually impossible in the time given.
      I would reply. I would ask which of the two link systems is right for readers who do not win a pass, since the Eventbrite link looks different to what the venue's own website usually sends people to, and I would ask for a couple of photos. Neither stops me replying.
      REPLY_PCT: 60
