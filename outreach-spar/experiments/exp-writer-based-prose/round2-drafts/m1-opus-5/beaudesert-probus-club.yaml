quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Both non-final rounds
     carry type and number. The final round holds one email and one phone
     message, within the one-email cap. Addresses are real, not placeholders.
  2. Coverage. fact_provenance reaches every factual claim in the final email
     and the phone script, including the credentials claim that appears only
     in the phone fallbacks and the three contact-detail claims the roster
     rests on. chosen_usps is set on the draft and final rounds.
  3. Presupposition. The message tells Helen nothing about her own club. The
     1984 charter, the Tramway bus trip, the guest-speaker programme and the
     meeting cadence all stay out of the text. The club outing appears only
     as the thing that would need notice, which is her frame rather than a
     recital of research.
  4. Manufactured connection. No claim of shared interest. The profile found
     no public statements by this contact, and the draft asserts none. The
     one selection claim the reader could not verify was cut at review.
  5. Concreteness. The ask is answerable in one sentence: a rough number, or
     a day for a club outing.
  6. Band pattern. Read against pine-lake-village.yaml, the only other
     approach file in this campaign folder. The two drafts opened as
     variations of one template, both leading with the sender's identity and
     the tent, so this one was restructured to lead with the offer and the
     opening date and to introduce the sender second. The subject lines still
     share a shape, differentiated by the recipient's own name; the next
     drafter in this segment should break that pattern rather than extend it.
  7. Final email cardinality. One email in the final round.
