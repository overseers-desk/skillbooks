          Seven sessions go up between Thursday and Sunday: Thursday 24 September at 1pm, Friday and Saturday at 4pm and 7pm each day, and Sunday 27 September at 11am and 2pm. Members book whichever one suits them, so there is no bus to arrange and nothing for you to run.

          Reply with roughly how many members might take them up. A guess is fine. I will hold that many in the club's name and send you the booking details to pass around. These seats are not on sale at any price and they are not advertised anywhere, so they are for your own members and their families rather than for posting publicly.

          If the club would sooner come along together, the following week gives you the notice that needs. Tell me a day that works and I will come back to you about seating.

