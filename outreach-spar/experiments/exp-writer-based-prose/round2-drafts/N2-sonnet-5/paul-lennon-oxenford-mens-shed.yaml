quality_checklist: |
  1. YAML structure: root keys and round keys drawn from §6's canonical set; every round carries type and number where required; final round has exactly one email message plus one phone message (cardinality cap respected).
  2. Coverage: fact_provenance covers every factual claim in the final draft; chosen_usps set on every draft/final round; a_note states angle, channel, warmth, language.
  3. Presupposition test: the Buderim bus-trip reference is used once, as supporting evidence for the ask rather than as the opener, so it does not tell the recipient something about themselves as if it were news.
  4. Manufactured-connection test: every claim of shared interest traces to the profile (Buderim trip, April prior email) or the campaign USP registry.
  5. Concreteness: the ask ("reply, and I'll send the code and link") is answerable in one sentence.
  6. Band-level pattern check: not applicable at single-contact assembly; deferred to the band-level review after all community-organisation drafts are complete.
  7. Final round email cardinality: one email message in the final round; phone is a separate channel, not a second email.
