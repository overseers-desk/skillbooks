quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; draft, review
     and final rounds each carry type and number where required; final round
     has exactly one email message and one phone message (cap is on email
     only); addresses are real (imurray@playmatters.org.au, 1800 007 529),
     not placeholders. Passed.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft, including the prefetch-sourced March reference; chosen_usps set
     on draft and final rounds; a_note states angle, channel, warmth and
     language. Passed.
  3. Presupposition test: no sentence tells Iona something she already knows
     about her own programme or reach; the message introduces the sender's
     world (the offer) rather than narrating hers. Passed.
  4. Manufactured-connection test: the hub-coordinator-forwards-to-network
     angle traces to two specific profile data points (the regional hub
     role, the Easter BBQ/Children's Week events); no claim of existing
     Rivermill interest invented, matching the profile's own "no evidence of
     farm-visit outings" note. Passed.
  5. Concreteness: the recipient can answer "yes, pass it on" or "no" in one
     sentence. Passed.
  6. Band-level pattern check: deferred to band-level review once other
     mothers-group drafts exist; this draft's opener (self-intro, prior
     contact, dates, ask) follows the segment's first_ask template with the
     prior-contact line as the one point of variation.
  7. Final round email cardinality: one email message in the final round;
     the phone script is a separate channel, not a second email. Passed.
