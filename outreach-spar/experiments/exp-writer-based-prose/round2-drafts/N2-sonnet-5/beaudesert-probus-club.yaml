angle_rationale: |
  Helen Parnell, Secretary, is the only named office-bearer the profile found,
  sourced from a single uncorroborated directory listing; no primary source
  names an outings-specific officer, so the message is addressed to her role
  and the organisation rather than leaning on personal detail that can't be
  stood behind. No prior correspondence was found on any mailbox and the
  profile records no dated conduct between the club and Rivermill, so the
  opener treats this as a first approach and claims no relationship.
  chosen-not-advertised anchors the offer (the seats aren't sold anywhere,
  the club was picked by name), paired with nothing-to-organise (forward to
  members, nothing to arrange) and opening-week-seats (any of seven shows,
  Thursday to Sunday, free) to make the ask answerable in one line.
  big-top-at-a-heritage-farm supplies the setting in one clause rather than
  its own paragraph. group-visit-later is offered as the alternative ask,
  matching the segment's dual conversion path and the club's own evidenced
  mechanism: a 2025 bus outing (the Beaudesert Tramway trip) shows it already
  runs member excursions, so a proper group visit the following week is a
  credible second option, not just filler.
response_likelihood: 45
a_note: Cold approach, chosen-not-advertised angle with nothing-to-organise, opening-week-seats and group-visit-later support, email primary with phone fallback next morning, English (Australian). Challenger persona rated 60% reply likelihood and found no factual errors.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, nothing-to-organise, opening-week-seats, big-top-at-a-heritage-farm, group-visit-later]
    notes: First draft. Cold opener addressing the club's situation, no code or price, second-week outing offered as the alternative ask.
    messages:
      - channel: email
        to: beauyprobus@gmail.com
        subject: Free circus seats for Beaudesert Probus this week
        body: |
          Hello Helen,

          I'm Priyanka Das, from Partnerships at Historic Rivermill, the heritage venue at Mount Nathan. A circus, WANTED – A Cirque Heist, opens in a big top on our lawn this Thursday 24 September and runs seven shows through to Sunday 27 September.

          I want to give Beaudesert Probus Club a block of free seats for that opening week, for your members and any grandchildren visiting these school holidays. Your club is one of a small number we're offering these to directly; the seats aren't for sale anywhere at this price. There's nothing to organise on your end: reply with roughly how many seats to hold, and I'll send you the booking code and link to pass on to members, for the club's own people rather than for posting publicly. There are daytime sessions on both the Thursday and the Sunday, if that suits your members better than an evening out.

          If the club would rather come along together as a group instead, the following week suits that better. Just tell me a day and I'll come back to you.

          Kind regards,
          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
      - channel: phone
        to: "0417 794 873"
        text: Follow-up call the next morning if no reply to the email.
        script:
          - point: Opening hook
            text: "Hello, could I speak with Helen Parnell please? This is Priyanka Das, calling from Historic Rivermill out at Mount Nathan. I emailed yesterday about some free circus tickets for Beaudesert Probus, for the opening week of our new show, this Thursday through Sunday."
          - point: Context if asked
            text: "We've got a family circus running in a big top on our lawn this week, and we've set aside free seats for a small number of local clubs, including Beaudesert Probus. I wanted to check the email reached you."
          - point: Ask
            text: "There's a daytime show on Thursday and on Sunday if that suits better than an evening. How many should I hold for your members?"
          - point: Close
            text: "If she hasn't seen the email, offer to resend it to beauyprobus@gmail.com on the call, and confirm a rough number and preferred show before hanging up."
        phone_note: Roster lists 0417 794 873; the profile also found 0494 049 513 (directory) and 0412 629 377 (new Facebook page), unresolved. Use the roster number; if it doesn't reach the club, the other two are fallbacks noted in the profile.
  - type: review
    number: 1
    verdict: DONE
    in_character: |
      Right, an email from someone I've never heard of, "Priyanka Das,
      Partnerships at Historic Rivermill." Never dealt with them, never heard
      the club mentioned it. First reaction is mild wariness — "free" offers
      landing cold in the inbox usually have a catch, and addressing me by
      first name feels like they've looked us up somewhere, which is a bit
      odd but not alarming; plenty of businesses trawl club directories for
      outreach like this.

      The actual ask is simple enough that it doesn't put me off: no forms,
      no bus to book, just tell her roughly how many seats and she sends a
      code. That I could do from my armchair. The timing gives me pause,
      though — she's written Tuesday for a show opening Thursday. That's two
      days to get the word out to members before the first tickets need
      booking, though the show runs right through to Sunday so there's a bit
      more room if I move today rather than sitting on it. It's tight, but
      not impossible; I'd forward it to whoever does our newsletter or phone
      the couple of members I know check email daily, and it can trickle out
      over the week since the offer covers all seven shows, not just
      Thursday.

      What I would actually ask in my reply, not objections that stop me: is
      this legitimate (I'd probably have a quick look at their website
      first), can members bring a spouse or a grandchild who isn't strictly
      "the club's," and which of the daytime sessions — Thursday or Sunday —
      she'd recommend for older members who don't love a night out. None of
      that stops me replying; it's just what I'd want cleared up alongside my
      reply.

      The line about "not for sale anywhere at this price" and being "one of
      a small number" we're offering to — flattering, and it reads as
      sincere rather than a hard sell, especially with the option to come as
      a group instead the following week if opening week's too rushed for
      us.

      REPLY_PCT: 60
