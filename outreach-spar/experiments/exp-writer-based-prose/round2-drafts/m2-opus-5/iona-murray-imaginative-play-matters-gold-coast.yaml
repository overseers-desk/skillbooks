quality_checklist: |
  1. Structure. Root keys drawn from the §6 set. The draft and review rounds carry numbers. The final round holds one email and one phone message, within the email cardinality cap. Addresses are real, not placeholders. No profile_hash line, per the harness's instruction.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script. chosen_usps is on the draft round and the final round.
  3. Presupposition. No sentence tells the hub something it already knows about itself. The network it circulates to is never recited, only presupposed by the ask for a number of families.
  4. Manufactured connection. The pass-it-on ask rests on the profile's dated evidence of a term timetable posted to a 549-follower page and a Children's Week event at The Well. The second-week group option rests on the same event. No shared interest is asserted beyond these.
  5. Concreteness. The ask is a rough number of families, answerable in one sentence.
  6. Band pattern. Second approach drafted in this band. It shares the campaign's voice with the Oxenford Men's Shed file and differs in its middle ask, a number of families rather than a day, so the two do not read as one template.
  7. Antifacts. Clear on all five, recorded in the review round's antifact_check.
  8. Author appendix. No code, no price, no ticket link, no session times, no running time, no seat count, nothing implying seats are unsold or that the offer serves the sender, no feed-bag offer, no subscriber discount, no Oztix link. The unanswered March approach is disclosed in one plain line with its subject.
  9. Open caveat. The A2 pass returned no persona reaction and no fact-check, so the draft's landing is untested for this contact and the verification is author-side only.
