quality_checklist: |
  1. Structure. Root keys drawn from the section 6 set. Every draft and
  review round carries a number; the final round carries none, as the
  skeleton shows. The final round holds one email message and one phone
  message, within the email cardinality cap. The recipient address comes from
  the village's own contact page by way of the profile, not a pattern guess.
  No profile_hash written, per the instruction that the harness prepends it.

  2. Coverage. fact_provenance covers every factual claim in the final email
  and the phone script, eighteen rows. chosen_usps is present on both draft
  rounds and the final round. a_note carries angle, channel, warmth and
  language.

  3. Presupposition. No sentence tells Corey Hegge something he knows about
  his own village. The bus appears only as the reason next week would suit a
  group, never as a recital that Pine Lake runs one. The unit count, the
  operator and the Levande brand are all in the profile and none reaches the
  message.

  4. Manufactured connection. No claim of shared interest is made. The
  profile records that no public statements or social activity were found for
  this contact, and nothing in the draft implies otherwise. The only
  village-specific element is the bus, which the profile's mechanism evidence
  establishes.

  5. Concreteness. The ask is answerable in one sentence: a rough number, or
  a day that suits for an outing. The challenger confirmed the reply cost in
  character and called it trivial.

  6. Band pattern. No other approach file exists in this campaign folder yet,
  so there is nothing to read the openers against. The next contacts in this
  band should be checked against this opener, which introduces the sender and
  the venue before the tent.

  7. Appendix compliance re-run on the final text. No code, no price, no
  discount, no subscriber offer, no Oztix link, and no link of any kind.
  Nothing states or implies that seats are unsold, that the tent needs
  filling, or that the offer serves the sender. No feed-bag or animal-food
  offer. Show times come from the showtimes file alone. Timing is in the
  first two lines. Style: no em-dashes, no negation seesaw, no template
  verbs; the longest sentence in the email body is twenty-six words.
