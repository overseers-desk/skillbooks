profile_hash: sha256:eec3a0acd73154f24ab99422ff3420ed3c12da93b3af387403a4bacf21fb47d5
decisions:
  channel: email
  channel_detail: |
    Roster carries a deliverable address and a direct mobile, no platform URL,
    so SPAR-A section 4.2 gives email first with a phone fallback. The
    segment's approach_sequencing overrides the generic three-day wait with
    its own step 3, phone the next morning where there is no reply and a
    number is listed. Email Tuesday 22 September, call Wednesday morning
    23 September, the day before the season opens.
  language: en-au
  angle: tickets-to-pass-to-residents
angle_rationale: |
  Warmth is cold. The dispatcher prefetch ran two passes across all five
  accounts, an address match and a subject match on name and organisation,
  and returned no hits. There is no thread to reply on, so section 4.1.1
  takes its false branch and the message opens a fresh subject. The campaign
  appendix's "we wrote before and heard nothing" line does not apply, because
  the prefetch found no earlier note. The profile records no dated conduct
  with us either, so no prior dealing is named.

  The profile is a qualification-only profile. It establishes role fit,
  Village Manager being one of the three buyer roles the segment names, and
  scale, 147 independent-living units, mid-sized for the segment. It records
  explicitly that no public statements, talks or social activity were found
  for Corey Hegge, and that nothing distinguishes this village's outing
  volume from its peers. Under section 4.4 item 2 that absence licenses
  nothing, so the angle rests on role and mechanism alone.

  The angle is the segment's own primary shape: a free ticket a resident can
  use with visiting grandchildren during the school holidays, with no outing
  for the manager to run. Independent-living residents book for themselves.
  The manager's work is a notice on the board and a line in whatever goes out
  to residents. That is what makes a two-day lead time survivable here where
  it would not be for a segment that must assemble a group, and the
  challenger confirmed it in character: the runway is fine for what is
  actually asked.

  The second ask, a village bus outing the following week, is carried because
  message_goal names it as an acceptable reply and because the profile
  confirms an on-site village bus. It sits last and runs to two sentences, so
  it does not compete with the first ask. Following section 4.5 the bus is
  presupposed rather than narrated back: the wording is that next week gives
  a bus the notice it needs, not a recital that the village runs one.

  Element ordering is a then b then c: who I am, the tickets and the ask,
  then the reasons. The timing sits in the first two lines per the campaign
  appendix, so the reader knows the season opens Thursday without working it
  out from the date. The subject line carries the organisation name as its
  recipient-specific element, since the activity itself is generic across the
  segment.
response_likelihood: 55
a_note: |
  Free opening-week tickets for residents and their visiting families, with
  nothing for the manager to organise, plus a village bus outing offered for
  the following week; email Tuesday 22 September with a phone follow-up
  Wednesday morning; cold, no prior correspondence found on any account;
  en-au.
rounds:
  - type: draft
    number: 1
    chosen_usps:
      - opening-week-seats
      - nothing-to-organise
      - chosen-not-advertised
      - group-visit-later
    notes: |
      Four USPs rather than the typical one to three. message_goal requires
      both asks, and group-visit-later is the second ask rather than a
      supporting claim. chosen-not-advertised is the segment's emotional
      framing and answers the question a cold reader of a free offer does
      ask, which is why this is arriving at all; held to two sentences.
      big-top-at-a-heritage-farm rides inside the offer sentence as plain
      description rather than worked as its own beat. make-a-day-of-it is not
      in this segment's list and is not used.
    messages:
      - channel: email
        to: corey.hegge@levande.com.au
        bcc: partnerships@rivermill.au
        subject: Free circus tickets for Pine Lake residents, shows open Thursday
        body: |
          Hi Corey,

          I am Priyanka Das, partnerships at Historic Rivermill, the heritage venue on the Coomera River at Mount Nathan, about thirty minutes from central Gold Coast.

          A circus company, CHARC Performance, has a big top up on our lawn for the school holidays, and I have free tickets to their family show, WANTED – A Cirque Heist, for Pine Lake residents and the families visiting them. Seven shows, from this Thursday 24 September to Sunday 27 September, with daytime sessions on the Thursday and the Sunday. Reply with a rough number and I will send you the code and the booking link to pass around the village.

          There is nothing to organise at your end. Residents book whichever session suits them and whoever is visiting that week, so there is no bus to arrange and no list to collect. The tickets are for your residents, their families and your staff, and I would ask that they stay inside the village rather than go up anywhere public.

          The same shows sell at full price to the public. The free seats go to a small number of local organisations that bring families together, and I picked yours from a list of Gold Coast villages.

          If a village outing would suit you better than tickets, next week gives a bus the notice it needs. Tell me a day that works and I will come back to you about seating.

          Priyanka Das
          Partnerships, Historic Rivermill
          Colourful.land Pty Ltd
          950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
          partnerships@rivermill.au
      - channel: phone
        to: "0401 417 480"
        text: |
          Wednesday morning 23 September, the day before the season opens, if
          the Tuesday email drew no reply.
        script:
          - point: Opening
            text: "Morning Corey, it's Priyanka from Historic Rivermill at Mount Nathan. I sent you an email yesterday and I am ringing because it is time-sensitive rather than to chase it. Have I caught you at a bad moment?"
          - point: The offer, in one breath
            text: "There is a circus in a big top on our lawn for the school holidays, and I have free tickets for your residents and the families visiting them. Seven shows, opening tomorrow afternoon and running through to Sunday. The Thursday and the Sunday sessions are daytime ones. If it is any use to you, I send you a code and a booking link, you put it out to residents, and they book whatever suits them. There is no bus and no group to get together."
          - point: If he asks what it costs or what the catch is
            text: "Nothing. The same shows sell at full price to the public. We set aside the opening week for a few local organisations and Pine Lake was on my list."
          - point: If he is interested
            text: "Give me a rough number and I will send the code and the link through this morning. It is for residents, their families and your staff, so I would keep it inside the village rather than anywhere public."
          - point: If tickets do not suit but he is not saying no
            text: "Then the other option is a proper village outing the week after, which gives your bus the notice it needs. Give me a day that works and I will come back to you about seating."
          - point: If he is not the right person
            text: "No trouble at all. Who looks after residents' social side there, and is it better if I go to them directly or would you rather pass it on?"
          - point: If he cannot talk
            text: "I will let you go. The email is in your inbox from yesterday, subject line has Pine Lake in it. The only thing that matters is that the first show is tomorrow, so a one-line reply today is enough and I will do the rest."
        phone_note: |
          Direct mobile published on the village's own contact page, so it
          reaches the manager rather than a switchboard. Call before the
          Thursday 1pm opening, and early enough that a code sent the same
          morning still gives residents a day to book.
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      I don't know Historic Rivermill or Priyanka Das. Nothing about this
      reads as spam: real venue, real address, a specific circus name, and
      the ask on me is trivial, reply with a rough headcount. Today is
      Tuesday, the first show is Thursday afternoon, but I'm not being asked
      to organise an outing by Thursday. Residents book their own seats once
      I forward a code, so the two-day runway is fine for what's actually
      asked of me. What lands oddly is "a list of Gold Coast villages", which
      makes it sound like a mail-merge exercise, and "your staff" getting
      free tickets alongside residents wasn't something I expected to be
      offered; I'd wonder if that's really on the table or a slip. Neither
      would stop me replying, but I'd probably ask how many tickets "a rough
      number" is, and whether there is a cap, before I forward anything to
      147 households. REPLY_PCT 60.

      Sentence scores, confusing / surprising / interesting, in the order
      met. The two openers scored 0,0,0 and 1,1,1. The offer sentence scored
      2,3,3 and the show-dates sentence 1,2,2. The ask scored 1,1,2.
      "Nothing to organise" scored 0,1,2 and the residents-book sentence
      0,1,2. The residents-families-staff sentence scored 1,3,2 and the
      full-price sentence 0,2,2. The picked-yours sentence scored 1,4,3, the
      only 4 on surprise. The outing offer scored 0,2,2 and its ask 0,1,1.
    fact_check:
      - claim: The tickets are for your residents, their families and your staff.
        source: |
          Campaign usps registry, nothing-to-organise claim; retirement-village
          segment first_ask.
        result: failed
        note: |
          Both sources scope the offer to residents and the families who visit
          them, or to an organisation's members, families or residents.
          Neither reaches the organisation's employees. No source authorises
          free tickets for village staff.
        correction: They are for your residents and their families.
      - claim: I picked yours from a list of Gold Coast villages.
        source: Campaign usps registry, chosen-not-advertised claim and rests_on.
        result: failed
        note: |
          The claim gives the source list as the venue's own list of local
          organisations that bring families together, with no geography
          attached. The segment's stems also run into northern New South
          Wales, Tweed Heads, Banora Point and Kingscliff, so a Gold Coast
          only list is not supported. Naming the list also inverted the
          claim's effect, turning a reason for choosing him into evidence of
          bulk, which is what drew the 4 on surprise.
        correction: |
          The free seats go to a small number of local organisations that
          bring families together, and yours is one of them.
      - claim: Seven shows, from this Thursday 24 September to Sunday 27 September, with daytime sessions on the Thursday and the Sunday.
        source: |
          plan-events/2026-09-25-wanted-a-cirque-heist/2026-09-23-stampede-arena-showtimes.md,
          read with historicrivermill.au/data/circus.yaml sessions; segment
          first_ask.
        result: verified
        note: |
          Four dates carry seven start times: Thursday 1pm, Friday 4pm and
          7pm, Saturday 4pm and 7pm, Sunday 11am and 2pm. Thursday and Sunday
          are the daytime sessions.
      - claim: The heritage venue on the Coomera River at Mount Nathan, about thirty minutes from central Gold Coast.
        source: business-overview.md, opening paragraph and U6.
        result: verified
      - claim: Sender name, role, organisation and address.
        source: Campaign sender and venue blocks; business-overview.md facts for outreach drafting.
        result: verified
      - claim: No code, price, discount, Oztix link, or suggestion that seats are unsold appears in either piece.
        source: Campaign prompt_appendices a_author and a_challenger.
        result: verified
    antifact_check: |
      Checked against business-antifacts.md in full. The word farm is avoided
      throughout, including in the self-introduction, because the farming
      question is unsettled in either direction; the venue is introduced as a
      heritage venue on the river, which is the form the antifact file
      prescribes. No stone buildings, no hundred-year-old or original mill
      structures, no vineyard, and no claim the venue is on Tamborine
      Mountain. Nothing in the draft denies any of these, so the file leaves
      no trace of having been consulted.
    revision_note: |
      Two claims were fixed as factual errors rather than sorted. "Your
      staff" extended the offer past what nothing-to-organise and the
      segment's first_ask authorise, and is cut. "A list of Gold Coast
      villages" misdescribed the source list, and the geography is dropped.

      The one sentence scoring 4 on surprise was "I picked yours from a list
      of Gold Coast villages". The question it was answering: why is a venue
      I have never heard of giving my residents something for nothing, and am
      I one name in a mail-merge? The question is real and a cold reader does
      ask it, so the sentence keeps its position and its job. What failed was
      the answer. Naming a list as the reason for choosing him told him he
      was a row in one. The revision gives the criterion instead of the list:
      the seats go to organisations that bring families together, and his is
      one of them.

      Absorbed into a sentence already present: "how many tickets is a rough
      number, is there a cap?" No per-segment allocation figure exists in the
      campaign, so no number can be stated. The ask sentence now says the
      number he names is held in Pine Lake's name, which is the offer's
      actual shape under the campaign header and tells him he sets the
      figure. He raised it as something he would ask before forwarding to 147
      households, and forwarding happens after the code arrives, so the rest
      belongs in the reply. A phone branch was added for the same question.

      Absorbed: the opening offer sentence scored 2 on confusing and 3 on
      surprising. Thirty-eight words carrying the operator, the tent, the
      season, the show title and two classes of recipient at once. Split into
      two sentences, one idea each, with no content removed.

      Kept on the challenger's positive reading: the two-day runway, which he
      called workable; "nothing to organise"; and "the same shows sell at
      full price", which drew no confusion and rules out a discount without
      touching price.
    notes: |
      Challenger ran context-isolated on Sonnet, playing the recipient, and
      returned REPLY_PCT 60 on draft 1.
  - type: draft
    number: 2
    chosen_usps:
