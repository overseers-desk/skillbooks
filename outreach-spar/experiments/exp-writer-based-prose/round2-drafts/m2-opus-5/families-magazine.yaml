    fact_check:
      - claim: Family pass of four for the recipient and five more for readers.
        source: travel-blogger-domestic plan block, first_ask
        result: verified
        note: No per-stem allocation override exists for families-magazine.
      - claim: The show opens on Thursday 24 September.
        source: 2026-09-23-stampede-arena-showtimes.md and circus.yaml, first session 2026-09-24T13:00
        result: verified
      - claim: Public tickets for the show are sold on the Eventbrite listing.
        source: opening-week-seats USP, rests_on
        result: verified
        note: Per-show public tickets also run through Oztix, but the campaign names Eventbrite as the only link a message carries, so the Eventbrite link is correct.
      - claim: Our marketing manager wrote to Janine in August last year about the Gold Coast article.
        source: admin-rivermill-au mailbox, INBOX/Work Done, UIDs 31579 and 31583, 13 and 14 August 2025
        result: verified
        note: Reported invented a second time by a challenger that cannot read the mailbox. The claim holds, but the artefact was carrying an assertion no reader of the repository can check, which is a fair objection to the artefact.
        correction: Spoken line removed from the script and replaced by a caller's note naming account, folder, UIDs and dates.
    antifact_check: Clean on every item. No stone buildings, no century-old structures, no vineyard, no Tamborine Mountain, no farming claim, no feed-bag offer, no Oztix link, no code or price.
    revision_note: |
      Persona raised more than three points, sorted before revising.

      Absorb by reframing: the Eventbrite link sat two sentences after "not on sale anywhere" and read as undercutting it. The challenger asked what question that sentence was answering. It was answering "what do I give the readers who do not win, or who want to come anyway?" The campaign requires the public-facing element of a publisher message to be the Eventbrite listing at the paid price, so the link stays; the wobble came from adjacency. The two claims are now separated and the distinction stated outright: the passes are not sold, the tickets are.

      Absorb by reframing: "tied to those same seven shows, so they suit something that can go out quickly" drew a confusion score. It was draft 2's own fix and had not landed. The inference about her publishing speed is cut and the plain fact kept.

      Leave for the reply: the 48-hour turnaround. She says she would reply and open with a question about it, so it does not stop the reply, and there is nothing honest to offer, since the free seats are opening-week only and second-week seating needs the manager's decision. Also left for the reply: how the reader passes are redeemed, which the campaign puts in the answering message along with the code and the link. A line was added to the phone script for the same question.

      No change: "how did she get my editorial address". Answering it would narrate her world and it did not stop the reply.

      Unchanged: the pass held in her name, highest on interest across both passes; show times, pass sizes, venue description and the link, all verified again.
