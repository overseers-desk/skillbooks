      Verdict DONE, so the draft is unchanged. The challenger asked one question-naming, on the pass sentence that scored 4 on surprising: "There is a family pass of four held in your name for any show from Thursday to Sunday 27 September, and five more of the same for your readers." The question it answers is the first one a cold recipient asks, which is what she is actually being given, and it is placed second in the message because the method orders a first touch as introduction, then ask, then reasons.

      Two persona points left for the reply, neither changing the draft. She would ask for flexibility on the giveaway close date: the free seats are opening-week only, so the honest answer is no for the free passes, and the reply can offer the paid listing for anything later. She would ask for photographs of the big top: supply them in the answering message, which is also where the code and the Eventbrite link go.
