  - type: review
    number: 3
    verdict: DONE
    in_character: |
      I don't know this "Priyanka" or "Historic Rivermill", never crossed my desk before. First read, it registers as one of the many circus and venue PR pitches that land in editor@ each school holidays: free tickets in exchange for coverage, dressed up as generosity. The line about the seats "not sold anywhere at any price" is doing a lot of work to sound exclusive, and it reads a little like a sales pitch trying not to sound like one.

      Today is Tuesday 22 September, and she's naming a show window that opens in two days and closes Sunday. What she's asking of me, accept a pass myself and also organise a five-ticket reader giveaway, is barely possible in that time. I run a bi-monthly print magazine; nothing prints in 48 hours. But I do run active social channels, so a quick Instagram or Facebook giveaway post before Thursday is realistic if I move today or tomorrow. It's tight, not impossible, and it would need me to drop other things to hit it.

      What I'd ask in my reply rather than object to: is there any flexibility on the reader-giveaway close date given the short notice, and can I get a couple of production-quality photos of the big top for the post, since I have nothing to use yet.

      What would give me pause, not quite stop me: "send me the winners' names and I will book their seats" is a little unusual. Most giveaway partners just hand over a code and let me manage it end to end. It's a small extra step, not a dealbreaker.

      Nothing here stops me from replying outright, but the turnaround is the real friction, not the offer itself.

      Sentence scores, confusing / surprising / interesting. Self-introduction 1/1/2. Big top 0/1/2. Show name and opening date 0/1/2. Pass of four plus five 1/4/4. Reply with the show 0/1/2. Short list and not sold anywhere 2/3/3. Start times 1/1/1. Reader passes are for those seven shows 0/1/1. Send me the winners' names 1/3/3. Tickets on public sale, with the link 0/2/2.

