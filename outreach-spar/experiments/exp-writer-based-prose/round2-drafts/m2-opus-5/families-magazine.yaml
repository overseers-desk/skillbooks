quality_checklist: |
  1. Structure. Root keys are drawn from the canonical set. Every draft and review round carries a number. The final round holds one email and one phone message, within the one-email cap. Both addresses are real: editor@familiesmagazine.com.au is the magazine's published editorial address and 0437 866 869 is on its Facebook About block and team page.
  2. Coverage. fact_provenance reaches every factual claim in the final email and phone script, including the two claims that rest on the mailbox rather than the repository.
  3. Presupposition. No sentence tells the recipient something she already knows about herself. The short-list sentence states our reason for choosing her, which is our side, not hers. Draft 2's inference about how fast she can publish was cut for breaching this.
  4. Manufactured connection. The email claims no shared interest. The fit rests on the profile's Trevena Glen Farm feature and school-holiday guide, which informed the angle without being recited back to her.
  5. Concreteness. "Reply with the show you would come to" is answerable in one sentence.
  6. Band pattern. Not checkable from this file alone. The opener leads with the sender and the venue rather than with a compliment or a question, so a reviewer reading the band in sequence should watch for that shape repeating across travel-blogger-domestic.
  7. Final email cardinality. One email message in the final round.

  Flagged for the human: the profile records no prior contact, but the mailbox does. Until segments/travel-blogger-domestic/families-magazine.md carries the August 2025 exchange, every context-isolated check of this contact will report the prior-dealing claim as invented, as two of the three passes did.
