            text: "I have a family pass of four held for you, and five more for your readers. Which show would suit you?"
          - point: If the giveaway timing is the problem
            text: "Then take the pass for yourself, and put the reader ones wherever you can this week. I book the seats at this end, so there is nothing for you to set up."
          - point: If she asks how the reader passes work
            text: "You send me the names, I book each seat under that name, and I email you the confirmations to pass on."
          - point: If she asks for photographs for a post
            text: "I'll send you pictures of the tent with the booking details."
          - point: If she quotes a rate for coverage
            text: "Let me take the figure back to the office. The pass stands either way, so pick a show while there are seats to pick from."
          - point: Close
            text: "I'll email the booking details straight after this call."
        phone_note: |
