  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      I'd never heard of Historic Rivermill before this landed in my inbox, and my first thought is: who is this person and how did she get my editorial address. She's specific enough, venue, show name, dates, that it doesn't read as spam, and the "held in your name" framing flatters me a bit. But two things make me hesitate. First, she tells me these seats are "not on sale anywhere", then two sentences later hands me a public booking link for the same show, which reads like they are on sale somewhere, just not to me for free. That's a small credibility wobble. Second, the timing: today is Tuesday 22 September, the first show is Thursday 24 September, and I'm being asked to pick a show, forward five reader passes, and get a giveaway post up, all inside about 48 hours. That's tight for anything I'd want to do properly. I'd want a day just to write a decent post, let alone collect entries. I'd reply, but I'd open with a question about the turnaround and ask exactly how the reader passes get redeemed, since the email only says "send me the winners' names" without explaining what happens after.

      Nothing here is a hard stop. It's a genuine local venue with a concrete, checkable offer, and the ask costs me nothing to accept.

