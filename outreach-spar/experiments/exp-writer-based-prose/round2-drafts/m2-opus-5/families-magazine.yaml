# Contact: Chinnu Sravya, Owner, Families Magazine (editor@familiesmagazine.com.au, 0437 866 869)
# Channel: email primary, phone follow-up from 24 September if no reply
# Language: en-au
# Angle: a pass held in her name, because her readers are the families the seats are for
decisions:
  channel: email
  channel_detail: Email on 23 September to editor@familiesmagazine.com.au, the only published address; the profile found no individual writer address. Phone follow-up on 0437 866 869 from 24 September if no reply, per the campaign's one-day secondary channel.
  language: en-au
  angle: pass-held-in-her-name-for-her-readers
angle_rationale: |
  Warmth is cold in the message's register, though not strictly cold in fact. The dispatcher prefetch surfaced an August 2025 exchange on this contact's address, and reading it (admin-rivermill-au, INBOX/Work Done, UIDs 31579 and 31583, 13 and 14 August 2025) shows the dealing ran the other way from the usual case: Barbara Quinones, then Marketing Manager, used the magazine's contact form asking the price of a listing in its "Things to do on the Gold Coast with kids" article. Janine Mergler quoted $250 plus GST, offered the top of the Animal Encounters section, and asked for 100 words, an image and invoicing details. We never sent the copy. The correspondent was the predecessor owner, not this recipient, and the thread is thirteen months old.

  That dealing was named in the email in draft 1 and tested badly. The challenger's persona scored the line 5 on surprising, read it as a mail-merge error, and said she would want it clarified before touching the reader giveaway, which is the half of the ask the campaign most wants. The campaign's own authoring rule points the same way: a prior dealing is named where the profile records the contact's own dated conduct with us, and this profile records none. The line came out of the email at draft 2 and out of the spoken phone script at draft 3, where it survives only as a caller's note carrying its source.

  Reply-on-thread was considered and rejected. The rule requires a current thread on a compatible topic. This one is thirteen months old, sits in a different mailbox addressed to a colleague who has left, and its subject is a paid listing quote we did not answer. A Re: on it would open the message in the frame of an unpaid invoice, which is the wrong frame for offering a pass.

  The angle is the plan block's emotional framing for chosen-not-advertised: a pass held in her name, because her readers are the families the seats are for. The profile's evidence for the fit is the Trevena Glen Farm feature of February 2025, a Mount Samson farm animal experience with pony rides, which is the nearest thing in her published work to what is being offered; and the ongoing Brisbane school-holiday activities guide, which is the slot a circus running only through the September holidays fits. Her stated readership covers Brisbane, Ipswich, Toowoomba, the Gold Coast and the Sunshine Coast, so Mount Nathan sits inside her geography rather than at its edge.

  Where the draft does not push: the profile records that she sells venue reviews, sponsored editorial, competitions and giveaways, with no published rates. A reply naming a rate is likely whatever the message says. Arguing against a price she has not yet quoted would read as haggling, so the email leaves it alone and the phone script carries one line for it.
response_likelihood: 50
a_note: Pass-held-in-her-name angle (chosen-not-advertised, emotional) plus the reader giveaway; email first with phone follow-up; cold in register though a 2025 dealing with the predecessor owner exists in the mailbox; en-au. The prior dealing was drafted in, tested badly, and withdrawn to a caller's note; the profile should record it or every future pass will flag it as invented.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm, nothing-to-organise]
    notes: First draft names the August 2025 dealing in the email and repeats it in the phone script. Phone script asserts the show "opened yesterday" on a call the draft itself dates to opening day.
    messages:
      - channel: email
        to: editor@familiesmagazine.com.au
        bcc: partnerships@rivermill.au
        subject: Circus tent opens Thursday at Mount Nathan, a pass for you and five for readers
        body: |
          Hello Chinnu,

          I am Priyanka Das, partnerships at Historic Rivermill, a riverside venue at Mount Nathan with a cafe, horses and farm animals, half an hour inland from the Gold Coast.

          CHARC Performance has put a big top on our lawn for the school holidays, and their family show, WANTED – A Cirque Heist, opens on Thursday 24 September. There is a family pass of four held in your name for any show from Thursday to Sunday 27 September, and five more of the same to give away to your readers. Reply with the show you would come to and I will send the booking details. The reader passes are booked through me the same way, so nothing needs arranging at your end.

          Start times are Thursday 1pm, Friday 4pm and 7pm, Saturday 4pm and 7pm, Sunday 11am and 2pm.

          These passes are not on sale anywhere. They are held for a short list of people whose audiences are the families these seats are for. Readers who would rather just book can do that here: https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924

          If our name looks familiar: Barbara from our office asked Janine about a listing in your Gold Coast kids guide in August last year, and we never sent the copy through.

          Priyanka Das
          Partnerships, Historic Rivermill (Colourful.land Pty Ltd)
          partnerships@rivermill.au
      - channel: phone
        to: "0437 866 869"
        text: Follow-up call if the email draws no reply, mid-morning, asking for Chinnu.
        script:
          - point: Opening
            text: "Hi Chinnu, it's Priyanka from Historic Rivermill at Mount Nathan. I sent you a note yesterday about the circus tent on our lawn. Have you had a chance to see it?"
          - point: What it is
            text: "CHARC Performance is running a family circus show in a big top here for the school holidays. It opened yesterday and runs through to the fourth of October."
          - point: The ask
            text: "I have a family pass of four held for you, and five more to give away to your readers. Which show would suit you? There's Friday at four or seven, Saturday at four or seven, Sunday at eleven or two."
          - point: If the timing is too tight
            text: "Then take a later show and we'll sort the reader passes separately. Tell me roughly how many and I'll hold them."
          - point: If she asks how we know the magazine
            text: "Our marketing manager wrote to Janine last August about a listing in your Gold Coast kids guide. We never sent the copy through, so this is us coming back with something better than a listing."
          - point: If she quotes a rate for coverage
            text: "Let me take the figure back to the office. The pass stands either way, so pick a show while there are seats to pick from."
          - point: Close
            text: "I'll email the booking details straight after this call."
        phone_note: Mid-morning, before the school run home.
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      A venue I've genuinely never heard of, writing as if we're already half-acquainted. The pass "held in your name" is a nice touch, flattering, and I'd probably reply just to see the tent. The last line stops me cold, though. I don't run a "Gold Coast kids guide", that's not what my magazine is, and I have no idea who Barbara or this supposed August conversation with Janine (my predecessor, who I haven't spoken to in a while) even was. It reads like she's got me mixed up with someone else, which makes me trust the rest of the email less, not more. Did she even look at what I publish? I'd probably still reply, mostly for the free pass, but I'd want to ask her to clarify that line before I did anything with the reader giveaway, because right now it sounds like a mail-merge error.

      On timing: today is Tuesday 22 September, the show opens Thursday. The email arrives the 23rd, giving me one day's notice to pick a show for my own family and to decide whether to run a reader giveaway before or during opening week. Attending myself on a day or two's notice is plausible. Turning around a reader giveaway that fast is not realistic for a print title, though a quick Instagram shout-out could happen. Nothing in the ask distinguishes what's achievable from what isn't in that window.

      Sentence scores, confusing / surprising / interesting. Self-introduction 0/1/2. Big top and show name 0/1/3. Pass of four plus five for readers 1/3/4. Reply with the show 0/1/2. Reader passes booked through me 1/2/2. Start times 0/0/1. Not on sale anywhere 0/2/2. Short list of people 0/2/2. Readers who would rather book 0/0/1. Barbara and Janine line 2/5/3.

      REPLY_PCT: 55
    fact_check:
      - claim: Start times are Thursday 1pm, Friday 4pm and 7pm, Saturday 4pm and 7pm, Sunday 11am and 2pm.
        source: historicrivermill.au/data/circus.yaml, opening-week sessions
        result: verified
      - claim: The Eventbrite listing is the only ticket link the message carries.
        source: opening-week-seats USP, rests_on
        result: verified
      - claim: A riverside venue at Mount Nathan with a cafe, horses and farm animals.
        source: business-overview.md
        result: verified
      - claim: No code, no price, and no suggestion that seats are unsold.
        source: prompt_appendices.a_author and the chosen-not-advertised USP
        result: verified
      - claim: Barbara from our office asked Janine about a listing in your Gold Coast kids guide in August last year, and we never sent the copy through.
        source: admin-rivermill-au mailbox, INBOX/Work Done, UIDs 31579 and 31583, 13 and 14 August 2025
        result: verified
        note: The challenger reported this as invented. It is sourced, but from the mailbox, which a context-isolated challenger cannot read; the profile records no prior contact, so the finding is absence of evidence in the files the challenger holds. The phrase the challenger took for another publisher's beat was a loose paraphrase of the magazine's own article title, "Things to do on the Gold Coast with kids".
        correction: Cut from the email regardless, on the persona's reaction rather than on the fact-check.
      - claim: Phone script says the show "opened yesterday" on a call the draft dates to 24 September.
        source: historicrivermill.au/data/circus.yaml, first session 2026-09-24T13:00
        result: error
        correction: The script no longer asserts any relation to opening day.
    antifact_check: No stone buildings, no century-old structures, no vineyard, no Tamborine Mountain, no farming claim. No feed-bag or animal-food offer, no Oztix link, no discount or subscriber code.
    revision_note: |
      Persona raised more than three points, sorted before revising.

      Answer in this email: the Barbara and Janine line reads as a mail-merge error. Removed. The question it was answering was "do I know these people, and will my inbox contradict them?" Her inbox does hold the thread, but it is thirteen months old, addressed to a colleague who has left, and signed by a predecessor she no longer speaks to, so it does not carry the recognition the line was reaching for.

      Absorb by reframing: a reader giveaway cannot be turned around in a day for a print title, and the ask did not separate what is achievable from what is not. The reader-pass sentence was recast to tie the passes to the seven opening-week shows. The same recast answered the confusion score on "booked through me the same way", which compared the reader passes to something instead of saying what happens.

      Leave for the reply: nothing in this pass.

      Script correctness, not a persona point: "opened yesterday" contradicted a call placed on 24 September. Corrected.

      Unchanged: the pass held in her name, which scored highest on interest; show times, the link and the venue description, all verified.
