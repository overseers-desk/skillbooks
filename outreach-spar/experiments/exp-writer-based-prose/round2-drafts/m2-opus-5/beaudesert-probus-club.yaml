quality_checklist: |
  1. Structure. Root keys are drawn from the §6 set. Both non-final rounds carry type and number. The final round holds one email and one phone message, within the §7.7 cardinality cap. Both addresses are real: the email is primary-source confirmed, and the phone number is the roster's, with the alternates in phone_note. No profile_hash line, which the harness prepends.

  2. Coverage. fact_provenance reaches every factual claim in the final draft, including the sender identity and the two contact details the messages depend on. chosen_usps is on the draft and the final round. a_note carries the angle, the channel, the warmth, the language, and the two reliability caveats R will need.

  3. Presupposition. Passed after revision. Draft 1's phone line "best kept off the Facebook page" told the recipient about her own page and is replaced. No sentence in the final draft tells the club anything about itself. The meeting date and the tramway bus trip that shaped the angle stay out of the message.

  4. Manufactured connection. Nothing claims a shared interest. The only statement about the club is that we picked it, which is our own act and is what the chosen-not-advertised USP asserts.

  5. Concreteness. "Tell me roughly how many" is answerable in one sentence, and matches the segment's message_goal.

  6. Band pattern. Checked against the one sibling approach written so far, Oxenford Men's Shed. Draft 1's subject and opening sentence were near-copies of it, and both are recast in the final. The shared substance is deliberate and consistent, per §4.4.4.

  7. Final round email cardinality. One email, one phone message.
