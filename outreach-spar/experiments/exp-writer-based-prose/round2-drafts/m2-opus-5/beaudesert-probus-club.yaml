        note: The challenger's authority is the campaign YAML, the USP registry and the antifacts file. These two facts come from the profile and sit outside that authority, so the challenger neither confirmed nor disputed them. The contact name remains single-source and uncorroborated, which the director_note carries.
    antifact_check: |
      Checked against every item in business-antifacts.md. The venue is called a heritage venue, never a farm, since the farming question is unsettled in either direction. No stone buildings, no aged or original mill structures, and no vineyard. Mount Nathan is named and Tamborine Mountain is not. The geographic anchor is the venue's own street address, Beaudesert Nerang Road, which is the road out of the club's own town; no drive time is stated, because no source gives one.
    revision_note: |
      The challenger asked that the revision note name the question behind each sentence it scored 4 or 5 on surprising. Two qualified, both in the email.

      "I have free tickets for your members and their grandchildren" was answering "what does this stranger want from me", placed before any justification per the §4.5 ask-before-justification ordering. "These seats are not on sale anywhere; the same shows sell at full price" was answering "is this a leftover, or a lesser seat than the paying public gets". Both surprises are the ones the message is built to produce, so both sentences stand unchanged.

      Three further points came out of the in-character read, sorted before revising.

      1. The phone script's "so best kept off the Facebook page" is revised. The challenger reported it as presumptuous on a first contact, and it also fails the §7.3 presupposition test by telling the recipient about their own page. It now carries the same wording as the email, that the tickets are for the club's own members and their families rather than for a public notice, which makes the point without naming their page.

      2. "Is there a catch, a mailing list signup" is left for the reply. A sentence answering a question the reader has not asked is cut, per the author appendix, and denying a condition that does not exist would plant it.

      3. "Where exactly is this, and is it a reasonable drive" is absorbed rather than answered. The email already names Mount Nathan and Beaudesert Nerang Road, which is the road running out of the club's own town. No source states a drive time from Beaudesert, so none is given.

      Two changes were then made against §7.6, the band pattern check, which the challenger could not see because it read one message in isolation. The only sibling approach written so far, Oxenford Men's Shed, opens "I am Priyanka Das and I look after partnerships at Historic Rivermill, the heritage venue..." under the subject "Free circus tickets for Oxenford Men's Shed members, opening Thursday". Draft 1 here was a near-copy of both. The subject now leads with the event and the place, and the opening sentence names the road instead of repeating the sibling's clause. The offer's shape is also stated more accurately: seats are put aside in the club's name before the link is sent, which is how the campaign defines the reservation.
    notes: |
      The challenger returned DONE with no factual error against its authority files, so the budgeted single pass for a yield-5 profile closes here.
