quality_checklist: |
  1. Structure. Root keys drawn from the §6 set. Every draft and review round carries a number. The final round holds one email and one phone message, within the email cardinality cap. Addresses are real, not placeholders.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script. chosen_usps is on both draft rounds and the final round.
  3. Presupposition. No sentence tells the shed something it already knows about itself. The bus trip that justifies the second-week option is never recited back.
  4. Manufactured connection. The group-visit option rests on the profile's confirmed Facebook bus trip to Buderim Men's Shed. The claim that the shed serves members and their families rests on the 100+ membership and the Women's Shed programme. No shared interest is asserted beyond these.
  5. Concreteness. The ask is a day and a rough number of seats, answerable in one sentence.
  6. Band pattern. First approach drafted in this band, so no opener pattern to break yet.
  7. Antifacts. Clear on all five, recorded in the review round's antifact_check.
  8. Author appendix. No code, no price, no ticket link, no session times, no running time, no seat count, nothing implying seats are unsold or that the offer serves the sender, no feed-bag offer, no subscriber discount, no Oztix link.
