quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. The draft and review rounds carry a number, the final round does not. Addresses are real, taken from the profile and the campaign sender block. No profile_hash line, which the harness prepends.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script, including the cafe-prices answer the script holds in reserve and the three conflicting numbers. chosen_usps is present on the draft and final rounds, and a_note carries angle, channel, warmth, language and the addressee caveat.
  3. Presupposition. No sentence tells her something she already knows about her own club. The absence of a meeting before Sunday is framed as what follows for the offer rather than as a recital of her meeting calendar.
  4. Manufactured connection. No claim of shared interest appears. The angle rests on the outing and meeting mechanism the profile evidences, not on anything the profile is silent about.
  5. Concreteness. The ask is answerable in one sentence: a rough number, or a day for a club outing.
  6. Band pattern. Read against the two approach files already written in this campaign. Pine Lake opens with the sender's introduction, Oxenford with an unanswered earlier note, and this one with the place itself, so the three do not read as one template.
  7. Final round email cardinality. One email and one phone message in the final round.
