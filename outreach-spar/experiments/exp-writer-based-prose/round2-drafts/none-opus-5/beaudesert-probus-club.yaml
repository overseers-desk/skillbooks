        source: Campaign author appendix and the chosen-not-advertised rests_on.
        result: verified
        note: No Oztix link, no feed-bag or animal-food offer and no subscriber discount appears anywhere in the draft.
    antifact_check: |
      Checked against every item in the antifact checklist. The venue is described as the riverside place at Mount Nathan on the Beaudesert Nerang Road. No stone buildings, no original or century-old mill structures, no vineyard, no claim to sit on Tamborine Mountain, and no statement either way about farming. No claim of a shared council area with Beaudesert is made, since Mount Nathan sits in the City of Gold Coast.
    revision_note: |
      No revision. The challenger returned no factual error and gave DONE at the first pass. The persona raised four points, which is above the three-point sorting threshold, so each is sorted here. How the code works is answered in the reply that carries it, which is where the campaign puts the code. Children's and concession seating is a question for the operator and belongs in the reply rather than in a first message that names no price. Parking for older members is answerable on the reply or the call, and the venue's car parking is not a claim the first message needs. The lean towards the week-after option is not an objection: the draft already offers that arm, and a reply asking about it reaches step 1 of the conversion funnel either way. The persona's one real cost, composing a note to the membership list without the committee, is the work the offer asks for, and the draft already keeps it to the smallest form by asking for a rough number first. The draft therefore stands as the final.
