profile_hash: sha256:83befcdcdf233dc72cbcccb5b92b814e54dc3a807113c93bbd6fa0eb1c04281f
# Contact: Chinnu Sravya, Owner, Families Magazine (travel-blogger-domestic)
# Channel: email 23 September, phone follow-up 24 September
# Language: en-au
# Angle: the school-holiday giveaway she already runs, for a show opening this week
decisions:
  channel: email
  channel_detail: |
    Email first on Wednesday 23 September to editor@familiesmagazine.com.au, the address the magazine publishes and the one that answered our marketing team in August 2025. Phone follow-up on 0437 866 869 the next day where there is no reply, per the campaign's secondary channel, which waits one day rather than three because the opening week closes on Sunday 27 September. No platform channel is used: the magazine publishes no individual writer address, and Instagram carries no email in the bio.
  language: en-au
  angle: school-holiday-giveaway
angle_rationale: |
  Warmth is cold in the message and prior on the record. The dispatcher prefetch found two messages in August 2025 between editor@familiesmagazine.com.au and marketing@rivermill.au, subject "New Entry: Simple Contact Form", filed under INBOX/Work Done on the admin account. That exchange sat on a different inbox to this sender's and has been quiet thirteen months. The campaign's author appendix allows a named prior dealing only where the profile records the contact's own dated conduct with us, and this profile records none, so the first draft's line naming it was cut at the first pass. The substance of the 2025 exchange is unreadable from a form-notification subject line in any case, so the line could not have survived a "what was that about?" reply. A fresh subject was already right under the reply-versus-new-thread rule, the old thread being neither current nor compatible with this offer.

  The angle rests on two things the profile evidences. The magazine maintains an ongoing Brisbane school-holiday activities guide, live during the very week the opening-week seats fall in. Its advertise page sells competitions and giveaways as a standing line item, so a reader giveaway is a format the office already runs rather than a favour being asked. The message presupposes that habit instead of reciting it: neither the guide nor the February 2025 Trevena Glen Farm feature is named, because naming them spends the specificity budget on proving the sender read the site rather than on the proposition.

  The profile's own caution shapes the ask. Coverage here may be a paid product rather than editorial choice, and no rates are published. The message therefore offers passes and asks for no post, feature or mention. Whether to quote a rate is hers to raise, and the challenger persona treated it exactly that way, as a reply-stage question rather than a reason not to reply.

  USPs chosen from the segment's list: chosen-not-advertised, opening-week-seats and nothing-to-organise, with big-top-at-a-heritage-farm carried in one clause of setting rather than claimed at length. chosen-not-advertised is used here, unlike in the retirement-village band, because a publisher reads "not advertised anywhere, offered to a few publications" as the standing of the invitation rather than as a hint that seats are unsold. The persona confirmed that reading across two passes. make-a-day-of-it sits outside this segment's list and was left out, which also avoids a cafe claim around the 4pm and 7pm sessions, both of which start at or after the venue closes.

  Element ordering is a then b then c. She has never heard of Historic Rivermill, so two short sentences introduce the sender and the venue, the offer follows immediately, and the reasons to say yes come after. The timing is in the first lines, so the two days' notice is hers to weigh from the outset.
response_likelihood: 60
a_note: |
  School-holiday-giveaway angle, resting on the magazine's live holiday guide and its standing giveaway product rather than on any personal hook. Email first on 23 September with a phone follow-up the next day. Cold in the message: a two-message exchange with our marketing address in August 2025 exists in the prefetch but is not named, the campaign confining a named prior dealing to profile-recorded conduct. English (en-au). USPs chosen-not-advertised, opening-week-seats and nothing-to-organise. Three challenger passes: the first cut the prior-dealing line, the second cut an invented redemption mechanism, the third returned DONE with no factual errors. The persona read the ask as answerable in thirty seconds and put itself at 70 per cent both times it reacted; the estimate here is discounted for an editor's inbox that doubles as a sales desk and for two days' notice.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, opening-week-seats, nothing-to-organise]
    notes: |
      Subject line carries the masthead and the Thursday, so it reads as one local organisation writing to another. This segment is the publisher wave, so the first message carries the Eventbrite link at the public price, per the campaign header and the segment's own first_ask; only the code is held for the reply. No price is stated. The seven opening-week start times come from the season data the showtimes file points at.
    messages:
      - channel: email
        to: editor@familiesmagazine.com.au
        bcc: partnerships@rivermill.au
        subject: "Circus passes for Families Magazine readers, opening Thursday"
        body: |
          Hello Chinnu,

          I am Priyanka Das and I look after partnerships at Historic Rivermill, at Mount Nathan in the Gold Coast hinterland, on the old arrowroot mill site by the Coomera River. Families Magazine and our marketing team exchanged emails in August last year, so the name may already be familiar.

          CHARC Performance has a big top up on our lawn for the school holidays, and the first show of WANTED – A Cirque Heist is this Thursday, 24 September. I am holding a family pass of four for you to come and see it at whichever opening-week show suits, and five more passes for your readers if a giveaway fits what you have running this holidays.

          Opening week is seven shows: Thursday at 1pm, Friday and Saturday at 4pm and 7pm, Sunday at 11am and 2pm. Tell me which one you would come to and how many reader passes you want, and I will send the booking details back the same day. Reader passes are booked in your winners' names rather than handed out as a code, so they stay inside your readership.

          The passes are not advertised anywhere. I am offering them to a few publications whose readers are the Gold Coast and Brisbane families these seats are for. Readers who would rather book their own seats can do that at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          Priyanka Das
          Partnerships, Historic Rivermill
          Colourful.land Pty Ltd
          950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
          partnerships@rivermill.au
        director_note: |
          The code is held back for the reply. The Eventbrite link is in the message because this is the publisher wave, whose public-facing part is the listing at the paid price.
      - channel: phone
        to: "0437 866 869"
        text: |
          Follow-up call on Thursday 24 September where the email has gone unanswered.
        phone_note: |
          The number is the magazine's published line and reaches the owner directly. Opening day, so the call can name the 1pm show as happening that afternoon.
        script:
          - point: Opening
            text: "Hello, is that Chinnu? This is Priyanka Das from Historic Rivermill at Mount Nathan. I sent you an email yesterday about circus passes and thought I would ring rather than let it sit in the inbox."
          - point: The offer, in one breath
            text: "There is a circus in a big top on our lawn for the school holidays, WANTED – A Cirque Heist. I am holding a family pass of four for you to come and see it, and five more for you to give away to readers."
          - point: The timing
            text: "It opens today at 1pm, then Friday and Saturday at 4pm and 7pm, and Sunday at 11am and 2pm. Any of those seven."
          - point: The ask
            text: "If you tell me the show you would come to and how many reader passes you want, I will book them and send the details through this afternoon."
          - point: If she asks what we want in return
            text: "Nothing set. If a giveaway suits the way you run them, that is the ideal, and if you would rather just come and have a look first, that is fine too."
          - point: If she asks about rates or advertising
            text: "Send me what you have and I will put it in front of our marketing manager. This call is about the passes."
          - point: If she cannot take it this week
            text: "The season runs to Sunday 4 October. Tell me what would work and I will ask about holding seats in the second week."
          - point: If she is not the right person
            text: "Is there someone on the listings desk I should send it to instead? I can email it across today."
          - point: Close
            text: "I will send the booking details as soon as you have picked a show. My email is partnerships@rivermill.au."
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      The challenger returned no separate in-character passage on this pass, opening at the fact-check. Its closing summary recorded the persona's only reservation as a timing question, whether a second week's seats could be given away instead, and stated that this was not an objection.
    fact_check:
      - claim: Families Magazine and our marketing team exchanged emails in August last year.
        source: Campaign author appendix, read against the profile.
        result: unsupported
        note: |
          The challenger runs context-isolated and holds the profile, not the dispatcher prefetch, so it read the line as invented. The prefetch does record the exchange: two messages on 13 and 14 August 2025 between editor@familiesmagazine.com.au and marketing@rivermill.au, subject "New Entry: Simple Contact Form", INBOX/Work Done on the admin account.
        correction: Line removed. The campaign confines a named prior dealing to conduct the profile records, and this profile records none.
      - claim: Opening-week start times, the operator's name, the pass counts, the Eventbrite link, the venue description and the absence of any code, price, discount or Oztix link.
        source: Season data, campaign USP registry and segment plan block, business overview, antifact checklist.
        result: verified
        note: Challenger checked each and found no error.
    antifact_check: |
      No hits. The venue is described by the mill site and the river, with no stone buildings, no surviving or century-old mill structures, no vineyard, no Tamborine Mountain claim and no statement either way about farming.
    revision_note: |
      One point, sorted as answer-in-this-email: the prior-dealing line was cut. It is true on the prefetch record but sits outside the campaign's rule, and a form-notification subject line is too thin to defend if she asked what the exchange was about. The persona's second-week question was left for the reply, the group-visit-later USP sitting outside this segment's list and the free seats being opening-week only. Two sentences were also split where they ran long.
  - type: draft
    number: 2
    chosen_usps: [chosen-not-advertised, opening-week-seats, nothing-to-organise]
    notes: |
      Prior-dealing line removed, so the opener now introduces the sender cold. Otherwise unchanged from draft 1.
