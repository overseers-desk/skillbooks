  - type: review
    number: 3
    verdict: DONE
    in_character: |
      I have never heard of Historic Rivermill or this Priyanka Das. First read, it is a nice offer. A circus in a big top on a heritage property at Mount Nathan is exactly what our readers go looking for over school holidays, and a farm feature did well for us before. A free family pass with no strings for me personally is easy to say yes to.

      But look at the calendar. Today is the 22nd, this lands in my inbox on the 23rd, and she wants a show and a number of reader passes the same day so she can book them that afternoon, with the first show on the 24th. That is under 24 hours to organise a reader giveaway. I run a bimonthly print magazine with a fortnightly email and a Facebook page. I can post something same-day if I move fast, but "readers you pick rather than a public post" is an odd ask. Most giveaways I run are announced publicly and winners drawn from entries, not me personally choosing who gets a pass. I would stop and ask her how she expects the reader passes to reach readers, because as written it does not match how I do giveaways.

      The tight window is the main practical snag, not enough runway to do the first week properly, though the season running to 4 October gives me room to ask about a later week, which the email itself half-invites. Nothing reads as spammy or fake. It is specific, it names the show, real dates, real address. So I would likely reply, mostly to say I cannot turn a giveaway around by Thursday, to ask whether passes for a later week are possible, and to ask how she pictures me choosing which readers get one. REPLY_PCT 70.
