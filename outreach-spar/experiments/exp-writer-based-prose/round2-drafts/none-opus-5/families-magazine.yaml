  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      A stranger writing about circus tickets. I do not know Historic Rivermill, never heard of it, but the details are concrete enough to feel real: a real address, an actual show name, an actual booking link, specific times. Not a spam-shaped email.

      The ask is simple and I can answer it in thirty seconds, pick a show and say how many reader passes I want. That is low friction, and I like it. Most of these offers want three paragraphs back from me before they will commit to anything.

      The thing that would give me pause is the calendar. Today is Tuesday, the first show is Thursday, and there is a "which show suits me" question sitting in my inbox for a family pass. Fine, I can pick one of seven over four days. Nothing here is asking me to organise a bus trip or round up families by tomorrow morning, so the timing itself is not a problem.

      What I would actually query in my reply is whether this is a compensated arrangement, whether hosting a giveaway costs me anything or needs a sponsored disclosure, and whether I can get a media kit or photos for a write-up. Neither is a reason not to reply. They are what any editor asks before saying yes.

      One thing reads oddly and I would want it confirmed before running a giveaway. It says the reader passes are booked in my winners' names rather than handed out as a code. I have run enough of these to know venues usually just give a promo code for the reader to enter themselves. If they want me sending a list of winners' names to book individually, that is more admin than a giveaway usually is, and I would want it spelled out plainly rather than half-said in one line.

      Otherwise nothing here would stop me replying. Free tickets to a legitimate-sounding local circus, minimal effort, good school-holiday filler. I would reply. REPLY_PCT 70.
    fact_check:
      - claim: Reader passes are booked in your winners' names rather than handed out as a code.
        source: Campaign USP registry, opening-week-seats, and the segment's conversion funnel.
        result: failed
        note: The campaign's mechanism is a hold confirmed by reply, then the code sent with the Eventbrite link for the organisation's own booking. No source describes booking in winners' names.
        correction: Sentence rewritten to carry the not-public constraint without naming a redemption method, the first message naming no code.
      - claim: Venue address and river location, opening-week start times, the pass counts, the Eventbrite link rather than Oztix, the season running to Sunday 4 October, and the absence of any code, price, discount or unsold-seats framing.
