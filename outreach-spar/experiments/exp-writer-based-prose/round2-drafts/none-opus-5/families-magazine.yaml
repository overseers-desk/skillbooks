      No hits on this pass either.
    revision_note: |
      Three points, sorted. Answer in this email: the redemption mechanism, rewritten as the readers she picks rather than a public post, with what they need to book following in the reply. That also answers the admin worry, since nothing asks her for a list of names. Left for the reply: whether the arrangement is compensated and whether a disclosure is needed, which she said herself would not stop her replying, and which raising unprompted would turn into a negotiation she has not opened. Also left for the reply: a media kit and photos, which she wants at the point of writing something up. Two lines were added to the phone script so the call can answer the mechanism and the photos if she raises them there.
