quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Every non-final round carries a number. Addresses are real, taken from the profile and the campaign sender block.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script, including the second-week line the script holds in reserve, which is an undertaking to ask rather than a promise of seats. chosen_usps is present on all three draft rounds and the final.
  3. Presupposition. No sentence tells her something she already knows about her own magazine. The holiday guide and the earlier farm feature are the evidence for the angle and are deliberately not narrated back at her.
  4. Manufactured connection. Every element of the angle traces to a profile data point: the ongoing school-holiday guide, and the advertise page's standing giveaway and competition product. No claim of shared interest is made beyond those.
  5. Concreteness. The ask is answerable in one sentence: a show and a number.
  6. Band pattern. The retirement-village, community and seniors approaches open by naming the sender, the venue and the distance from the Gold Coast before the offer. This one opens the same way but drops the distance, which a Brisbane publisher does not need, and reaches the ask a sentence earlier. The proposition differs in kind, a pass and a giveaway rather than tickets to circulate, so the two do not read as one template.
  7. Final round email cardinality. One email and one phone message in the final round.
