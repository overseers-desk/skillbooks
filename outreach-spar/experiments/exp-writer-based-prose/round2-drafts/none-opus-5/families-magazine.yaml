      Checked against every item in the antifact checklist. No hits across all three passes.
    revision_note: |
      Verdict DONE at the third pass, the budget for a yield-8 profile. The persona raised two reply-stage points and one wording point. Left for the reply: whether passes can be had for a later week, the group-visit-later USP sitting outside this segment's list and the free seats being opening-week only, so the sender answers it when she asks. Absorbed by reframing a sentence already there: the giveaway mechanism, which the persona queried on both passes it reacted. The final's line now reads that she runs the giveaway however she normally would, and the booking details go to her winners rather than into the post. That adds no claim and removes the reading that she must hand over a list of names, while keeping the campaign's rule that the code stays off a public feed. The matching phone-script point carries the same wording. The tight window is the offer's own shape and is not something the message can fix.
