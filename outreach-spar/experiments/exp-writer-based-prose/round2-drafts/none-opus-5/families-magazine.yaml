  - claim: CHARC Performance has a big top on the venue's lawn for the school holidays.
    source: Season showtimes file and the campaign's description of the season.
  - claim: The show is WANTED – A Cirque Heist and the first performance is Thursday 24 September.
    source: Season showtimes file; the opening was pushed to the Thursday after the Wednesday noon show was dropped.
  - claim: Opening week holds seven shows, Thursday at 1pm, Friday and Saturday at 4pm and 7pm, Sunday at 11am and 2pm.
