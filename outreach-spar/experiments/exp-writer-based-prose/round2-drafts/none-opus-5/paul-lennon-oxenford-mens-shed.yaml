quality_checklist: |
  1. Structure. Root keys from the section 6 set. Every draft and review round numbered. The final round carries one email and one phone message, within the email cardinality cap. Addresses are real: oxenfordmensshed@gmail.com from the roster, 0410 639 184 from the profile.

  2. Coverage. fact_provenance reaches every factual claim in the final email and phone script. chosen_usps present on both draft rounds and the final. a_note carries angle, channel, warmth, language and the addressee caveat.

  3. Presupposition. No sentence tells the shed something it already knows about itself. The meeting times, the membership count and the Buderim bus trip shaped the call window and the angle, and appear nowhere in the text. The closing offer says "come out together on the bus" without asserting that they have done so.

  4. Manufactured connection. Every claim of fit traces to a profile data point: the retiree membership to the grandkids angle, the circulate-to-members habit to the nothing-to-organise USP, the Oxenford address to the proximity in the phone opener. The profile is silent on heritage venues and outing destinations, and nothing in the draft supposes otherwise.

  5. Concreteness. The ask is a rough number, answerable in one sentence.

  6. Band pattern. The opener starts from an unanswered April note, which no other message in this band shares.

  7. Final email cardinality. One.
