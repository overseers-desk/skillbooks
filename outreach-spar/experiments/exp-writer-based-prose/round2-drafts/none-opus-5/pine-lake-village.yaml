quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Both non-final rounds carry a number. Addresses are real, taken from the profile and the campaign sender block.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script, including the cafe-prices answer the script holds in reserve. chosen_usps is present on the draft and final rounds.
  3. Presupposition. No sentence tells him something he already knows about his own village. The distance is given once, about the venue rather than about him, because he has never heard of it.
  4. Manufactured connection. No claim of shared interest appears. The angle rests on the independent-living mechanism the profile evidences, not on anything the profile is silent about.
  5. Concreteness. The ask is answerable in one sentence: a rough number, or a day for an outing.
  6. Band pattern. First approach written in this campaign's retirement-village band, so there is no opener to vary against yet. The opener names the sender and the venue before the offer, which the next contacts in the band should vary.
  7. Final round email cardinality. One email and one phone message in the final round.
