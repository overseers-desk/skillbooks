quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Both non-final rounds carry a number. Addresses are real, taken from the profile and the campaign sender block. No profile_hash line, which the harness prepends.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script, including the cafe-prices answer the script holds in reserve. chosen_usps is present on the draft and final rounds.
  3. Presupposition. No sentence tells her something she already knows about her own programme. The Children's Week event and the hub's Facebook activity are used to choose the angle, not recited back at her. The one reference to her groups beyond Upper Coomera exists to extend the offer, not to demonstrate research.
  4. Manufactured connection. No claim of shared interest appears. The angle rests on the birth-to-five age band and the hub's published-and-let-families-come habit, both evidenced in the profile. The profile is silent on farm visits, and nothing in the message assumes otherwise.
  5. Concreteness. The ask is answerable in one sentence: a rough number of families, or a day for a group visit.
  6. Band pattern. Failed on first reading and fixed. The draft opener matched the Pine Lake Village approach word for word, so the final email opens on a shorter self-introduction and reaches the venue a sentence later. The phone opening was reworked for the same reason and to suit a switchboard. This is the first message written in the mothers-group band, and the next contacts in it should vary against this opener.
  7. Final round email cardinality. One email and one phone message in the final round.
