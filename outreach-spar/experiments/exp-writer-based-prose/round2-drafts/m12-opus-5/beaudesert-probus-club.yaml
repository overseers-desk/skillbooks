quality_checklist: |
  1. Structure: root keys are from the canonical set, both numbered rounds carry type and number, the final round holds one email and one phone message, and beauyprobus@gmail.com is a real address confirmed at source.
  2. Coverage: fact_provenance reaches every factual claim in the final email and phone script, and chosen_usps is set on both draft rounds and the final.
  3. Presupposition: the email tells the club nothing about itself. The one line touching its own world asks where the code should go, which is a request rather than a recital. The phone script's meeting line was reworded so it no longer asserts knowledge of the club's calendar.
  4. Manufactured connection: no claim of shared interest. The profile found no public statements by the contact, and none is implied.
  5. Concreteness: the ask is answerable in one sentence, and takes a loose figure so a reader who cannot yet count heads can still reply.
  6. Band pattern: failed on draft 1, whose opener nearly matched the retirement-village approach in this campaign. Rewritten in draft 2, with a different opening construction, paragraph shape and order of show times.
  7. Final round carries one email.
