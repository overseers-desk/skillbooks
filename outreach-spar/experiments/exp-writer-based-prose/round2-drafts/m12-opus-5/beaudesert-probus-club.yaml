# Contact:  Helen Parnell, Secretary, Beaudesert Probus Club (The Club, 23-25 William Street, Beaudesert)
# Channel:  Email first, phone the next morning where there is no reply
# Language: en-au
# Angle:    The secretary as the club's own circulation channel, with a club outing the following week as the second ask
decisions:
  channel: email
  channel_detail: |
    Email to beauyprobus@gmail.com, the address published in the club's own Facebook Contact info block and matching the roster exactly, then a phone call on the morning of Wednesday 23 September if no reply has come. The segment's approach_sequencing sets the one-day wait, which suits an offer whose first show is Thursday 24 September. The roster carries no LinkedIn for this contact, and the club's Facebook page is a public page, so it is not a channel for an offer that has to stay inside the organisation. The phone is the weak channel: three different numbers were found across three sources and none is confirmed as current.
  language: en-au
  angle: secretary-circulates-to-members-club-outing-as-second-ask
angle_rationale: |
  Warmth is cold. Both dispatcher prefetch passes returned no hits across all five accounts, so there is no prior correspondence to open on and no earlier unanswered note to name. The profile records no dated conduct with us; it is a qualification-only profile built from the club's two Facebook pages, a community directory listing and local press coverage.

  The profile establishes a mechanism, not a personal hook. No public statements by the named contact were found, so no claim of shared interest is available and none is made. What the profile does establish is that this club circulates things to members and organises group travel: a dated bus trip along the old Beaudesert Tramway line in July 2025, a running guest-speaker programme, and a monthly general meeting on the first Wednesday at The Club in William Street. The first Wednesday falls on 7 October, after the free week has closed, so the message cannot rely on the meeting and does not mention it. It asks instead for what a secretary can do from a desk in two days, which is send it to the member list.

  None of that research is recited. The one place the club's own world surfaces is the line asking that the code go out on the member list rather than anywhere public, and that line is there because the campaign requires the code to stay inside the organisation.

  Beaudesert is the far end of the road the venue sits on. Naming the Beaudesert Nerang Road is a restatement of the venue address that resolves at once for this reader. No drive time is quoted, because the only sourced figure is measured from central Gold Coast rather than from Beaudesert.

  USPs, in the segment's own framings: opening-week-seats and nothing-to-organise carry the offer, chosen-not-advertised sits in one plain sentence, big-top-at-a-heritage-farm is carried in the descriptive clause rather than argued, and group-visit-later carries the second ask as the segment's first_ask sets out. The nothing-to-organise caveat about enrolled-family contact lists does not bite here, because circulating an offer to members is what a Probus secretary already does.

  Timing is stated rather than implied. The first lines say the show opens this Thursday, and the seven sessions are listed in full with the daytime ones first, because a seniors audience sorts on that before anything else.
response_likelihood: 55
a_note: |
  Cold approach, en-au, email then phone. Angle is the secretary as the club's own circulation channel (free opening-week seats, members book their own), with a club outing the following week as the second ask. Challenger found no factual errors and scored reply at 65%; discounted to 55% because the address is a volunteer committee's shared inbox that may not be read before the opening week, and because the club's next general meeting falls on 7 October, after the free seats have gone. The contact name rests on one uncorroborated directory citation and the phone number is one of three conflicting numbers, so the email is written to read correctly to whoever opens the club inbox.
rounds:
  - type: draft
    number: 1
    chosen_usps: [opening-week-seats, nothing-to-organise, chosen-not-advertised, group-visit-later]
    notes: |
      Element order is a to b to c: who I am, the offer and the ask, then the reasons. The code and the Eventbrite link are held for the reply. No price, no subscriber discount, no Oztix link, nothing about how the season is selling and nothing about what the offer does for us.
    messages:
      - channel: email
        to: beauyprobus@gmail.com
        subject: "Free circus tickets for Beaudesert Probus members, this Thursday to Sunday"
        body: |
          Hello Helen,

          I am Priyanka Das and I look after partnerships at Historic Rivermill, the heritage property with the cafe, horses and farm animals out along the Beaudesert Nerang Road at Mount Nathan.

          A circus company has put a big top up on our lawn for the school holidays, and I have free tickets to the opening week for your members and their grandchildren. The show is WANTED – A Cirque Heist. Seven performances run from this Thursday 24 September to Sunday 27 September: Thursday at 1pm, Friday and Saturday at 4pm and 7pm, and Sunday at 11am and 2pm.

          Reply with roughly how many members would want them, and I will send you the booking link and a code that takes the price to nil, for you to circulate. Members book whichever session suits them, so there is no bus to book and nothing for the committee to run.

          The seats are not advertised anywhere and I am offering them to a small number of clubs near us. They are for Beaudesert Probus members and their families, so the code is best kept to the club's own email list rather than the Facebook page.

          If the club would rather come along together, the following week gives the notice that takes. Tell me a day that suits and I will come back to you about seating.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
        to_note: |
          The address is the club's shared inbox, confirmed from the club's own Facebook Contact info block. The greeting names Helen Parnell on a single directory citation that was not independently corroborated.
        director_note: |
          The reply is what carries RIVERMILLFRIENDS and the Eventbrite link, with the Sunday cut-off stated. The number she gives goes onto the per-show tally at that point.
      - channel: phone
        to: "0417 794 873"
        text: |
          Wednesday 23 September, morning, only if the email has drawn no reply.
        script:
          - point: Opening
            text: "Good morning, is that Helen? It's Priyanka from Historic Rivermill at Mount Nathan, out on the Beaudesert Nerang Road. I sent an email to the Probus club address yesterday about free circus tickets for your members. Have you got two minutes?"
          - point: The offer
            text: "There is a circus in a big top on our lawn for the school holidays, and I have free tickets to the opening week for your members and their grandchildren."
          - point: Ask
            text: "If you tell me roughly how many members would want them, I will email you the booking link and a code this morning."
  - type: review
    number: 1
    verdict: DONE
    in_character: |
      Oh, Historic Rivermill, out past Beaudesert, I know roughly where that is, though we have never had anything to do with them. First reaction to an unsolicited email offering free tickets from an organisation I have never dealt with: is this legitimate, or is this one of those things where you turn up and there is a catch. Nothing in it actually reads as a scam. No money asked for, no link to click yet, and it explains itself calmly, so that suspicion softens by the end, but it is there on the first read.

      The practical problem is the timing. Today is Tuesday 22 September and the show starts Thursday. Our meeting is the first Wednesday of the month, so there is no meeting between now and then to put this to anyone. I would have to email it round myself if I have addresses for people, or hope someone checks Facebook. Members are the sort who would love the idea of taking a grandchild to a circus, but telling her roughly how many members would want them by tomorrow, when I do not yet know who is free Thursday to Sunday on two days' notice, is optimistic. That is not a reason to say no. It is a reason to reply and say leave it with me, I will see who I can reach in time, which is really the honest answer.

      The bit about keeping the code off the Facebook page, as if there is one, made me pause for half a second. We are mid-move between two pages at the moment and the old one is being retired. I would just read it as do not post it publicly, which is clear enough regardless.

      I would reply. I might ask a couple of things in that reply: is there a website I can have a look at first, and would tickets still work if we only manage to get a couple of families sorted in time rather than a proper number. None of that stops me writing back.

      REPLY_PCT: 65
    notes: |
      Reader's graph, phrases scored below 4 for resolvability: "the opening week" at 3, presupposing a season she has never heard of, firming up at the sentence that lists the dates; "a code that takes the price to nil" at 4, presupposing an unstated normal price; "the Facebook page" at 3, a definite singular where this club currently runs two pages mid-transition. Sentence scores: only the sentence carrying the offer scored 4 or higher on surprising.
    fact_check:
