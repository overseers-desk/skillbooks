            text: "No trouble at all. I am after whoever sends things out to members. Is there a better number for them, or a good time to ring back?"
          - point: The offer
            text: "There is a circus in a big top on our lawn for the school holidays, and I have free tickets to the opening week for your members and their grandchildren."
          - point: Timing
