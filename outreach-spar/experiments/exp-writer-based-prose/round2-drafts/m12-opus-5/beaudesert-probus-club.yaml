        script:
          - point: Opening
            text: "Good morning, is that Helen? It's Priyanka from Historic Rivermill at Mount Nathan, out along the Beaudesert Nerang Road. I sent an email to the Probus club address yesterday about free circus tickets for your members. Have you got two minutes, or is there a better time to ring back?"
