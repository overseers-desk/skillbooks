        source: historicrivermill.au/data/circus.yaml, read through plan-events/2026-09-25-wanted-a-cirque-heist/2026-09-23-stampede-arena-showtimes.md
        result: verified
      - claim: Seven performances run from Thursday 24 September to Sunday 27 September, Thursday at 1pm, Sunday at 11am and 2pm, Friday and Saturday at 4pm and 7pm.
        source: historicrivermill.au/data/circus.yaml, read through plan-events/2026-09-25-wanted-a-cirque-heist/2026-09-23-stampede-arena-showtimes.md
        result: verified
        note: 24 Sep 13:00; 25 Sep 16:00 and 19:00; 26 Sep 16:00 and 19:00; 27 Sep 11:00 and 14:00. Seven sessions, all inside the stated window.
      - claim: A code takes the ticket price to nil, and it is sent in the reply rather than the first message.
        source: campaign usps.opening-week-seats
        result: verified
        note: The draft names neither the code nor the Eventbrite link.
      - claim: The free seats are not on sale anywhere and the club was approached by name.
        source: campaign usps.chosen-not-advertised
        result: verified
      - claim: Members book their own seats, so there is no bus and nothing for the committee to run.
        source: campaign usps.nothing-to-organise
        result: verified
      - claim: A group visit can be arranged for the following week, with seating to come back to her on.
        source: campaign usps.group-visit-later
        result: verified
        note: group-visit-later is not tagged to the seniors-club segment's usps list, but the segment's own first_ask carries the same offer in its closing line. The draft promises to come back about seating rather than promising the seats, which matches the USP.
      - claim: Historic Rivermill is a heritage property with a cafe, horses and farm animals on the Beaudesert Nerang Road at Mount Nathan.
        source: business-overview.md
        result: verified
    antifact_check: |
      Checked against every item in business-antifacts.md. No stone buildings, no 100-year-old timber or original mill structures, no claim about whether the venue farms, no vineyard, and the location is given as Mount Nathan on the Beaudesert Nerang Road rather than Tamborine Mountain. No drive time is quoted, because the sourced figure is from central Gold Coast and Beaudesert is not that. No feed-bag or animal-food offer, no subscriber discount, no Oztix link, no price, and nothing about how the season is selling.
    revision_note: |
      The challenger raised four points and reported no factual errors. Sorted before revising.

      Answered in this email: the headcount barrier. She said plainly that she cannot name a number by tomorrow, because she does not yet know who is free on two days' notice, and that the honest answer is leave it with me. The message asks for a number, so a reader who cannot produce one has a reason to put the email aside. The ask now takes a loose figure, which is answerable the moment she reads it.

      Absorbed by reframing a sentence already there: the Facebook page. The campaign requires the code to stay inside the organisation, and the club is mid-move between two pages, so the definite singular had nothing to attach to. The sentence now asks that it go out on the member list rather than anywhere public, which says the same thing without naming a page.

      Left for the reply: whether there is a website to look at first, and whether a couple of families is worth taking up. Both are questions she would ask on replying rather than instead of replying, so neither earns a sentence here.

      The sentence scored 4 for surprise is the one carrying the offer: a circus company has put a big top up on our lawn, and I have free tickets to the opening week for your members and their grandchildren. The question it was answering is the reader's first one, what is this email for. The surprise is the offer itself rather than the wording, and the alternative is to lead with something other than the offer, which the segment's first_ask rules out. It stands, reworded only for the band check below.

      Not from the challenger: the quality checklist's band-level pattern check failed. The opener ran almost word for word with the retirement-village approach already drafted in this campaign, and the two clubs could compare notes. The opening sentence, the paragraph shape and the order of the show times are rewritten, with the daytime sessions first, which is what this audience sorts on.
