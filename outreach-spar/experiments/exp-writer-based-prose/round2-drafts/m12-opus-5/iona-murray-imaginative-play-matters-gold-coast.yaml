quality_checklist: |
  1. Structure. Root keys are drawn from the canonical set. Draft and review rounds carry numbers, the final round does not. The final round holds one email and one phone message. Both addresses are real: hers is the direct address the Play Matters directory publishes, and the sender's is the campaign sender. No profile_hash line, per the harness.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script. chosen_usps is on the draft and the final round. a_note carries angle, channel, warmth and language, and flags that the phone number is a national line.
  3. Presupposition. Nothing tells her about her own programme. The Children's Week attendance, the register-to-attend format and the venue at The Well stay out; her hub role appears only inside an offer, not as a recital.
  4. Manufactured connection. No shared interest is claimed. The profile found no public statements by her and no farm-visit activity, and the message rests on role, proximity and offer alone.
  5. Concreteness. She can answer with a number of families, or with a day for a group visit, in one sentence.
  6. Band pattern. The sibling file in this campaign, pine-lake-village.yaml, opens on the sender's own introduction. This one opens on the unanswered March note, so the two do not read as one template. Later mothers-group drafts with no prior correspondence should avoid a third opener of either shape.
  7. Final email cardinality. One email in the final round.
