quality_checklist: |
  1. Structure. Root keys are drawn from the canonical set. Draft and review rounds carry numbers, the final round does not. The final round holds one email and one phone message, within the email cap. Both addresses are real: the recipient's is published on the village's own contact page, and the sender's is the campaign sender.
  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script. chosen_usps is on the draft and the final round. a_note carries angle, channel, warmth and language.
  3. Presupposition. Nothing in the message tells him about his own village. The bus appears only inside an offer, not as a recital of how he runs outings, and the unit count, the operator name and the residents committee stay out.
  4. Manufactured connection. No shared interest is claimed. The profile found no public statements by him, and the message rests on role and offer alone.
  5. Concreteness. He can answer with a session and a number, or with a day for the outing, in one sentence.
  6. Band pattern. This is the first approach file written in the campaign, so there are no sibling openers to vary against yet. Later retirement-village drafts should avoid opening on the sender's own introduction if they are to differ from this one.
  7. Final email cardinality. One email in the final round.
