        result: verified
      - claim: Shed phone 0410 639 184, sessions Monday, Wednesday, Friday, Saturday 8am to 11am; 0447 667 606 listed against Paul Lennon.
        source: spar-campaigns/segments/community-organisation/paul-lennon-oxenford-mens-shed.md
        result: verified
