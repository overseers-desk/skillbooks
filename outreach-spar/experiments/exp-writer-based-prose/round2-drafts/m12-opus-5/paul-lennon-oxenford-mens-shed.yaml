        source: campaign prompt_appendices.a_author
        result: verified
    antifact_check: |
      Checked against business-antifacts.md. The venue is introduced as a
      riverside venue at Mount Nathan with a cafe, horse riding and farm
      animals, which is the description the antifact file prescribes. No
      stone buildings. No 100-year-old or original mill structures. No
      heritage-building claim of any kind. No vineyard. No Tamborine
      Mountain. No farming claim in either direction. No drive time from
      Oxenford is stated, because no source carries one.
    revision_note: |
      No revisions. The challenger returned DONE with no factual errors and
      no reader's-graph phrase below 2.

      The appendix requires the question behind a surprising sentence to be
      named before that sentence is touched. The challenger scored sentence
      12 surprising at 4: "We wrote to this address in April about a group
      outing and did not hear back." It was answering the reader's question
      "why is a venue I have never heard of writing to us out of the blue,
      and have we dealt with you before". That is the question the author
      appendix obliges the message to answer where the prefetch finds an
      unanswered note. The challenger read the surprise as candour and rated the
      sentence the most interesting in the email, so the sentence stays as
      drafted.

      Two challenger observations logged without change. The "Hello"
      salutation reads as a form letter: deliberate, because the profile
      leaves the role unconfirmed and naming Paul Lennon to an inbox read by
      Keith Ward or Les Chapman would be worse. The forward-internally-
      rather-than-reply path is the reason the last line asks for the right
      address, and the reason the phone follow-up targets the shed line
      rather than Paul Lennon's mobile.
