quality_checklist: |
  1. Structure. Root keys drawn from the section 6 set. Both non-final
  rounds carry type and number. The final round holds one email and one
  phone message. Addresses are real: oxenfordmensshed@gmail.com confirmed
  by our own April send, partnerships@rivermill.au from the campaign sender
  block. No profile_hash, per the harness instruction.

  2. Coverage. fact_provenance carries sixteen entries and reaches every
  factual claim in the final email and the phone script, including the
  April note and the two phone numbers. chosen_usps is on the draft round
  and the final round. a_note carries angle, channel, warmth, language and
  the unconfirmed-role caveat R needs.

  3. Presupposition. No sentence tells the shed something it already knows
  about itself. The profile's bus-trip evidence shapes the group-visit
  sentence without being recited. The only backward reference is to our own
  conduct in April, which is ours to state.

  4. Manufactured connection. No claim of shared interest. The profile is
  silent on heritage venues, rural tourism and outing destinations, and the
  draft asserts nothing on any of the three.

  5. Concreteness. "Reply with a rough number" is answerable in one
  sentence, and the alternative reply, the address of whoever runs outings,
  is one line as well.

  6. Band pattern. No sibling approach file exists in this campaign folder
  yet, so the band comparison cannot be run here. Flagged for whoever
  assembles the band: this opener is self-introduction then ask, and it
  should not be the shape every message in the band takes.

  7. Final email cardinality. One email in the final round. Passed.

  Open item for the human, not a draft defect: the reply that follows a yes
  must use the Eventbrite listing from usps.opening-week-seats, not the
  per-session Oztix links the website and circus.yaml carry. The code works
  on Eventbrite only.
