  antifact_check: |
    Checked against every claim in the antifact list. No stone buildings. No 100-year-old or original mill buildings: the draft names the site's past as a mill and describes nothing standing. No farming claim in either direction, the venue being described by what it offers visitors. No vineyard. No Tamborine Mountain: the venue is placed at Mount Nathan on Beaudesert Nerang Road. Also checked against the campaign's own prohibitions: no code, no price, no discount, no Oztix link, no feed bags, no suggestion that seats are unsold or that the offer serves the sender.
  revision_note: |
    The challenger returned DONE with no factual corrections and no persona objection. Its three in-character questions were sorted before deciding not to revise. "Is this legitimate" is answered in the draft already, by the named operator, the street address and the venue phone, and it is a question the reader asks on replying rather than one that stops the reply. "What is the catch" is answered by the not-advertised paragraph, and is held for the phone script, which carries it as its own branch. "Who do I forward it to" is the recipient's own internal step and the draft asks for it in its closing line. Nothing changed between draft and final.
