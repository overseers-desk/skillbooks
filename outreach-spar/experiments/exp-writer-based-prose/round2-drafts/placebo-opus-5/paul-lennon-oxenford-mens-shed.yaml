quality_checklist: |
  1. Structure: root keys drawn from the canonical set, no profile_hash (the harness prepends it), draft and review rounds numbered, one email in the final round alongside one phone script, real addresses throughout.
  2. Coverage: fact_provenance reaches every factual claim in the final email and the phone script, chosen_usps sits on the draft and final rounds, and a_note carries angle, channel, warmth and language.
  3. Presupposition: the email tells the shed nothing about itself. It names no membership figure, no meeting times and no past outing. The reader's world shows only in the shape of the offer, which is something to hand to members rather than an excursion to run.
  4. Manufactured connection: no claim of shared interest. The offer to arrange a group visit next week rests on the bus trip the profile records from the shed's own Facebook page, and the email makes it an option rather than an assumption.
  5. Concreteness: the ask is a reply with a rough number, answerable in one sentence.
  6. Band pattern: the opener introduces the sender and places the venue geographically, then moves to the offer. Within the community-organisation band this is the first drafted approach, so there is no pattern yet to break; the opener avoids the compliment and the recited-history forms that would make one.
  7. Final round email cardinality: one email, one phone script.
