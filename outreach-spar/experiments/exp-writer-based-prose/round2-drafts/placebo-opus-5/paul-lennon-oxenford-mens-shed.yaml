decisions:
  channel: email
  channel_detail: Email 22 September to the shed's shared inbox; phone the shed line on the morning of Wednesday 23 September where there is no reply, per the segment's approach sequencing.
  language: en-au
  angle: grandchildren-in-the-school-holidays
angle_rationale: |
  **Warmth: prior contact, one way.** The dispatcher prefetch found one outbound message from our own partnerships address to oxenfordmensshed@gmail.com, sent 9 April 2026 by Lia Movsisyan under the subject "Group outing to Historic Rivermill from Oxenford". Nothing came back. That is prior contact rather than a relationship, so the draft opens on the offer and not on a history, and names the April note in one plain line as the campaign's author appendix requires.

  **Thread decision: fresh subject, not a reply on the April thread.** Method section 4.1.1 points at replying on the existing chain when warmth is prior and the roster address appears in it. This draft takes the other branch deliberately, using the in-body reference that branch provides for. Three reasons. The chain is a single unanswered outbound five months old, so there is no conversation to continue. The recipient is a shared volunteer inbox, where a "Re:" on an ignored outing enquiry reads as a second nudge on a question already answered by silence. The subject line has to carry the only time-critical fact in the message, which is that the season opens in two days. The parent Message-ID sits in the prefetch if the director prefers the message threaded.

  **Addressee: the shed, not Paul by name.** The profile records Keith Ward as President and Les Chapman as Secretary on the shed's own website as of March 2026, with Paul Lennon's current role unconfirmed and 0447 667 606 apparently his personal number. The email goes to the shared inbox, so it opens without a personal salutation and closes by asking to be passed to whoever looks after the social side. Greeting a shared inbox as "Paul" when the president is someone else is the one error that would cost the reply outright. The phone script names Paul only when his own number is dialled, and asks for the right name rather than assuming it.

  **Angle.** The hook is not the Buderim bus trip. It is the shape of the membership: 100-plus members, retirees and semi-retirees, a Women's Shed programme alongside, four meeting mornings a week. In the last week of the school holidays, what such a shed can hand its members is something for the grandchildren. That makes the offer a thing to circulate at Wednesday's session rather than an excursion to organise, which is all the two days before opening allow. The bus-trip evidence still earns its place, supporting the closing line that offers a proper group visit in the second week.

  **USPs.** Lead is nothing-to-organise, functional: forward it, no bus, no names collected. Then opening-week-seats, functional: seven shows Thursday to Sunday, free. Then chosen-not-advertised, emotional: picked by name, on sale to nobody. big-top-at-a-heritage-farm is carried in the single line describing what the show is. group-visit-later closes, because this shed has run a bus before. make-a-day-of-it is dropped: it is not in the segment's list, and two of the seven shows start after the venue closes, so it would need qualifying and is not worth the words.

  **Element ordering.** Introduction, then the offer, then the ask, then the reasons to say yes. The reader is a volunteer reading on a phone between 8 and 11 in the morning, so the ask sits above the justification.
response_likelihood: 45
a_note: Grandchildren-in-the-school-holidays angle (nothing to organise, forward the free opening-week seats to members and their families); email to the shed's shared inbox with a Wednesday-morning phone follow-up; prior contact, one unanswered outbound from our office in April 2026; Australian English; addressed to the shed rather than to Paul Lennon, whose role the profile could not confirm.
rounds:
- type: draft
  number: 1
  chosen_usps: [nothing-to-organise, opening-week-seats, chosen-not-advertised, big-top-at-a-heritage-farm, group-visit-later]
  notes: |
    Drafted against the community-organisation plan block. No code, no price, no link, per the campaign's author appendix. Seven opening-week start times taken from the showtimes file and the circus data it names as their home.
  messages:
  - channel: email
    to: oxenfordmensshed@gmail.com
    subject: Free circus tickets for Oxenford Men's Shed members and their families
    body: |
      Hello,

      I am Priyanka Das, from Historic Rivermill at Mount Nathan, the riverside place on Beaudesert Nerang Road with the cafe, the horses and the alpacas, on the old arrowroot mill site.

      A circus company, CHARC Performance, has put a big top up on our lawn for the school holidays, and I have free tickets to the opening shows for your members and the families they bring. The season opens this Thursday, 24 September, and the free seats cover the seven shows through to Sunday: Thursday at 1pm, Friday and Saturday at 4pm and 7pm, Sunday at 11am and 2pm.

      If the shed wants them, reply with a rough number and I will send you the booking code and the link to pass around. Nobody has to run an outing for it. Each family books the show that suits them. The tickets are for your members and the families with them rather than for putting up on Facebook or anywhere public.

      These seats are not advertised and are not on offer to the public at any price. We went through the local organisations that bring families together and wrote to them one at a time, and yours is one.

      If the shed would rather come along as a group instead, the following week suits that better. Tell me a day that works and I will see what can be held.

      Lia Movsisyan from our office wrote to the shed in April about a group outing here and we did not hear back, so this may be the first of ours anyone has read. Could you pass it to whoever looks after the social side.

      Priyanka Das
      Partnerships, Historic Rivermill
      950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
      partnerships@rivermill.au | 07 3703 1307
    to_note: The shed's shared inbox, taken from the roster and confirmed in the profile. Paul Lennon is not greeted by name because the shed's own website named Keith Ward as President in March 2026.
  - channel: phone
    to: "0410 639 184"
    text: Follow-up call on the morning of Wednesday 23 September where the email has drawn no reply, timed to land inside a shed session.
    script:
    - point: Opening, shed line
      text: "Morning, it's Priyanka from Historic Rivermill at Mount Nathan. Is whoever looks after the shed's social outings about this morning?"
    - point: The offer
      text: "Thanks for taking the call. I sent an email to the shed address yesterday and I know that inbox gets a lot. We have a circus company in a big top on our lawn at Mount Nathan for the school holidays, and I have free tickets to the opening shows for your members and their families. It opens tomorrow afternoon and the free seats run through to Sunday, seven shows, Thursday at one, Friday and Saturday at four and seven, and Sunday at eleven and two."
    - point: The ask
      text: "There is nothing to organise. If you tell me roughly how many, I will email you a booking code and a link this morning, and you pass it round the shed. Families book whichever show suits them. We are asking that it stays inside the shed rather than going up on Facebook. Would that be worth putting to your members on Friday?"
    - point: If a group outing would suit better
      text: "That works too, and next week is the better week for it, because we can look at holding seating once the opening weekend is through. Give me a day that suits and I will come back to you on what can be held."
    - point: If this is not the right person
      text: "Who should I be speaking to about the social side? I have Keith Ward as president and Les Chapman as secretary from the shed's website, but I would rather get the right name from you than guess."
    - point: If asked what the catch is
      text: "None. The tickets are not on sale at that price anywhere and they are not going to the public. We picked a handful of local organisations that bring families together and rang round."
    - point: Voicemail
      text: "Morning, this is Priyanka Das from Historic Rivermill at Mount Nathan. I emailed the shed address yesterday about free tickets to the circus that opens on our lawn tomorrow afternoon, for your members and their families. It runs through to Sunday and there is nothing to organise at your end. If someone can reply to that email with a rough number, I will send the booking code straight back. My number here is 07 3703 1307 and the email is partnerships at rivermill dot au. Thank you."
    phone_note: Shed sessions run Monday, Wednesday, Friday and Saturday 8am to 11am, so the Wednesday call lands while someone is at the shed line. If nobody answers, try 0447 667 606, listed for Paul Lennon and probably his personal number.
- type: review
  number: 1
  verdict: DONE
  in_character: |
    Reading it on Tuesday morning in the shed's shared inbox, having never heard of Historic Rivermill or Priyanka Das. A business I do not know is offering my members free circus tickets, starting Thursday, two days away.

    The timing is the first thing to give me pause. Either way, whoever it lands with, there is no bus or group to organise, just a link to forward once it arrives. That is realistic in two days. A proper outing would not be, and the email recognises that by offering the following week for a group visit instead.

    The line about Lia writing in April and getting no reply is a good touch. It explains why this feels like a first contact even though it is not, and it does not read as a guilt trip. I would want to know it is genuinely for my shed's members rather than us being used as a marketing channel, and the email says outright it is not for Facebook or public posting, which reads as protecting the offer rather than fishing for exposure.

    My website is out of date if it still says Keith Ward is president. I might be a past president being written to on a stale contact list, which is faintly comic but would not stop a reply, because I would just forward it to Keith or Les.

    Questions rather than objections: is this legitimate, what is the catch, and who at the shed do I forward it to. A circus in a big top at a cafe and farm-animal venue is specific enough to sound real. None of those would stop me replying or simply passing it on.

    Nothing reads as fishing for free publicity, nothing reads as a discount code from a business trying to fill empty seats, and nothing feels demanding for a group my size.

    REPLY_PCT: 70
