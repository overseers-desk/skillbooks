quality_checklist: |
  1. Structure. Root keys are from the section 6 set. Both non-final rounds carry type and number. The final round holds one email and one phone message, so the email cardinality cap holds. The recipient address is the one the publication writes from, confirmed in the August 2025 thread on the admin account.
  2. Coverage. fact_provenance lists every factual claim in the final email and phone script, including the two that rest on the profile rather than the campaign. chosen_usps is set on the draft and final rounds. a_note carries the angle, channel, warmth, language and the decision to leave the 2025 thread unnamed.
  3. Presupposition. The message tells Chinnu Sravya nothing about Families Magazine that she already knows. Circulation, readership, audience age, the Trevena Glen feature and the school-holiday guide are all absent from the text. The guide appears in the subject line as the place the offer suits, not as a fact recited back to her.
  4. Manufactured connection. The only claim touching her world is that she writes for families, which the profile's stated audience supports. Nothing is asserted about her opinions or interests, and the profile's silence on her public statements is respected.
  5. Concreteness. The ask is answerable in one sentence: the show she would come to.
  6. Band pattern. The four approach files already in this campaign folder all open with the same sentence frame, "I am Priyanka Das, partnerships at Historic Rivermill, the ... venue at Mount Nathan". Draft 1 was a fifth instance of it. The final opens differently, and its subject line leads on the pass rather than on the word free, which the other four subjects all use. This is the first file in the travel-blogger-domestic band, so the within-band comparison is flagged for the reviewer once siblings exist.
  7. Antifacts. Checked item by item, recorded in the review round's antifact_check.
