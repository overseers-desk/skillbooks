profile_hash: sha256:1a17971d61577e223fe21d908d1e2f02f9017fa1c7914c5e35374f8d5dab6b0f
# Contact: Iona Murray, Program Coordinator, Imaginative Play Matters Gold Coast (Play Matters Australia, Gold Coast hub; The Well, 58 Highland Way, Upper Coomera QLD 4209)
# Channel: email 22 September, phone follow-up the next morning if no reply
# Language: en-au
# Angle: tickets to hand to the families already on her registers this week, with the group visit deferred to the second week
decisions:
  channel: email
  channel_detail: Email first on 22 September to imurray@playmatters.org.au, the direct address on the Play Matters directory listing. Phone 1800 007 529 on the morning of Wednesday 23 September where there is no reply, per the segment's approach_sequencing, which shortens the standard three-day wait because the first show is Thursday 24 September. That number is Play Matters Australia's national line rather than her desk, so the script opens by asking for her at the Gold Coast hub and carries a voicemail variant.
  language: en-au
  angle: tickets-to-hand-on-this-week
angle_rationale: |
  Warmth is prior contact, one way and unanswered. The dispatcher prefetch found one message in the admin-rivermill-au account: 31 March 2026, partnerships@rivermill.au to imurray@playmatters.org.au, subject "Historic Rivermill: complimentary visit for Gold Coast playgroup coordinators". I read the message itself rather than working from the subject line (Partnerships folder, UID 155). It was signed by Lia Movsisyan, Partnership Manager, and offered group coordinators a visit as our guests: coffee, a walk around the grounds, and a pony ride for any child brought along. No reply in any of the five accounts. prompt_appendices.a_author requires an unanswered prior note to be named in one plain line, so the message names the person, the month and what the note offered.

  Reply-on-thread was considered and rejected. Section 4.1.1's reply branch wants a live thread, and a single unanswered note from almost six months ago is not one. Hanging a Thursday deadline under a March subject about a coordinator visit would also bury the timing. So: fresh subject, prior touchpoint named in the body, which is the section's own "otherwise" branch.

  The profile records no personal public statements by Iona Murray at all, so the angle rests on mechanism rather than on anything she has said. Three things in the mechanism carry it. Her programme is free, registered rather than drop-in, and birth to five, so there is a known list of families and a weekly point of contact with them. The hub runs family events beyond its own room, the Easter BBQ at Abraham Park and the Children's Week event that drew 75-plus, so an outdoor family event is not foreign to the programme. And the base at The Well, Upper Coomera sits in the venue's northern catchment. Against that, the profile records no farm visits and no excursion history, which is why the message asks her to hand something on rather than to bring a group anywhere.

  Two details of her world are presupposed rather than recited. The show times are sorted into daytime and evening for her, because a coordinator of birth-to-five groups reads a 7pm start differently from a men's shed secretary. And the school-holiday timing is named as taking in older brothers and sisters, which is what makes a circus work for a cohort whose own children are too young to be its main audience.

  The public-page boundary needed care. Her circulation habit is a public Facebook page with 549 followers where the term timetable goes up, and the campaign's code must stay off social media. The message names the Facebook page as the thing it is asking her not to use, which is plainer than a general request for discretion and matches how she actually distributes. It also confines the pass to the families across her own groups. Her hub oversight of other coordinators across northern, central and southern Gold Coast and the Scenic Rim is the long-term value in this contact, but those other playgroups are separate organisations and most are separately on this segment's roster. Widening the pass to them belongs to a later conversation, not to a first message.

  USPs are taken from the segment's plan block, with group-visit-later added because the block's own first_ask carries it. make-a-day-of-it and credentials-on-request are not on that list, so the cafe, the animals and the insurance paperwork are left out even though four of the seven opening shows are daytime sessions.
response_likelihood: 45
a_note: Tickets-to-hand-on-this-week angle (free opening-week seats forwarded to the families across her playgroups, group visit offered for the second week) resting on the profile's registered birth-to-five family lists rather than on anything she has said publicly; email first with a next-morning phone follow-up to a national switchboard; warmth is prior contact, one way and unanswered since 31 March 2026, and the message names that note; en-au; the first message carries no code, no price and no link, all of which go in the reply.
rounds:
  - type: draft
    number: 1
    chosen_usps: [opening-week-seats, nothing-to-organise, chosen-not-advertised, big-top-at-a-heritage-farm, group-visit-later]
    notes: Structure varied from the two sibling files in this campaign folder by opening on the unanswered March note, which section 4.5 prefers where prior correspondence exists. big-top-at-a-heritage-farm supplies the picture in the second paragraph rather than a claim of its own. The show title is written with a hyphen in this round; the season's own spelling uses an en dash.
    messages:
      - channel: email
        to: imurray@playmatters.org.au
        bcc: partnerships@rivermill.au
        subject: "Free circus seats Thursday to Sunday for Play Matters Gold Coast families"
        body: |
          Hello Iona,

          Lia Movsisyan from our office wrote to you at the end of March, offering Gold Coast playgroup coordinators a visit here as our guests, and we did not hear back. This is a different thing and the timing on it is short, so I will be quick.

          I am Priyanka Das, partnerships at Historic Rivermill, the riverside venue on Beaudesert Nerang Road at Mount Nathan, inland from Nerang. CHARC Performance has a big top up on our lawn for the school holidays with a family show in it, WANTED - A Cirque Heist, and I have free tickets to the opening shows for the families across your groups.

          The first show is this Thursday 24 September at 1pm. Friday and Saturday run at 4pm and 7pm, and Sunday at 11am and 2pm. Seven shows over the four days, and the tickets are good for any of them. The daytime ones, Thursday at 1pm and Sunday at 11am and 2pm, are the easier times with babies and toddlers, and being school holidays it takes in the older brothers and sisters too.

          Reply with a rough number of families and I will send the code and the booking link for you to pass on. There is no outing to arrange. Each family books the show that suits them. The tickets are for your families rather than for the Facebook page or anywhere public.

          These seats are not advertised and are not on offer to the public at any price. We went through the local organisations that bring families together and wrote to them one at a time.

          If one of your groups would rather come along together, the following week suits that better. Tell me a day and I will come back to you on seating.

          Priyanka Das
          Partnerships, Historic Rivermill
          950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
          partnerships@rivermill.au | 07 3703 1307
        director_note: The subject carries the organisation name and the window, which distinguishes it from every other subject in the mothers-group band, where "playgroup families" alone would not.
      - channel: phone
        to: "1800 007 529"
        text: Morning call on Wednesday 23 September where the email of 22 September drew no reply.
        script:
          - point: Getting to her
            text: "Morning, it's Priyanka Das calling from Historic Rivermill at Mount Nathan. Could I speak with Iona Murray at the Gold Coast hub?"
          - point: Who is calling
            text: "Morning Iona, Priyanka Das, partnerships at Historic Rivermill, the riverside place on Beaudesert Nerang Road at Mount Nathan. I emailed you yesterday and I am ringing because the timing is tight. Lia from our office also wrote to you back at the end of March about coordinators coming to visit us, so this may be the first of ours that has reached you."
          - point: The offer
            text: "A circus company has a big top up on our lawn for the school holidays, a family show called WANTED, A Cirque Heist. I have free tickets to the opening shows for the families across your groups."
          - point: The timing
            text: "The first one is tomorrow at 1pm. Then Friday and Saturday at 4 and 7, and Sunday at 11 and 2. Seven shows, and the tickets work for any of them. The daytime ones are the easier times with babies and toddlers, and the school holidays mean the older brothers and sisters are about too."
          - point: What it asks of her
            text: "There is nothing for you to organise. Give me a rough number of families and I will email you the code and the booking link straight after this call, and you pass it on. Families book whichever show suits them. I am asking that it stays with your families rather than going up on the Facebook page."
          - point: If a group visit would suit better
            text: "If one of your groups would rather come along together, next week is the better week for that. Give me a day and I will come back to you on seating."
          - point: If she is not the one who decides
            text: "If this needs to go through someone else at the hub, or sits better with one of your group coordinators, give me a name and I will send it straight across."
          - point: Close
            text: "How many should I put down? I will confirm it by email this morning."
          - point: Voicemail
            text: "Morning Iona, Priyanka Das from Historic Rivermill at Mount Nathan, 950 Beaudesert Nerang Road. I emailed you yesterday about free tickets to the circus that is on our lawn these school holidays, for the families across your groups. The first show is tomorrow at 1pm and they run through to Sunday. Reply to that email with a rough number and I will send the booking details across the same day. Thanks Iona."
        phone_note: The roster number is the Play Matters Australia national line, so expect a switchboard and allow for a callback. Call mid-morning, after session drop-off.
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      Iona Murray, Tuesday 22 September, having never dealt with these people before. First thing noticed is that someone else from their office wrote in March and got no reply. She does not remember it, and does not love an opening that says so. It reads slightly like a nudge, not aggressively, and she would skim past it rather than take offence.

      The offer itself lands immediately and is genuinely useful. Free circus tickets for her playgroup families, Thursday to Sunday, no outing to organise, families book themselves. She runs community and supported playgroups across three regions, she has a Facebook page and mailing contacts, and forwarding a booking link to families is exactly what she does all the time. Two days' notice to forward a link is completely doable. Being asked to arrange a bus trip by Thursday would have been impossible, and the message has clearly thought about that.

      What she would want answered before pushing anything to families: is this legitimate, are Historic Rivermill a real and appropriate outdoor family venue, and is there anything to sign or vouch for. A quick look answers the venue question for her. None of it stops her replying, and the ask gives her an easy way in.

      Nothing here stops the reply. The worst of it is the opening line about a prior email she cannot confirm she received. Persona's own estimate: 70 per cent.
