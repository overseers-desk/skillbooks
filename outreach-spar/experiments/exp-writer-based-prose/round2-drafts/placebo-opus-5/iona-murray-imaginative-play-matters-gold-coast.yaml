quality_checklist: |
  1. Structure. Root keys are from the section 6 set. Both draft rounds and the review round carry type and number. The final round holds one email and one phone message, so the email cardinality cap holds. The address is the direct one published on the Play Matters directory listing, not a pattern guess, so no roster_patch is needed.
  2. Coverage. fact_provenance reaches every factual claim in the final email and phone script, including the three that rest on the profile and the one that rests on the mail record rather than on a campaign file. chosen_usps is set on both draft rounds and the final.
  3. Presupposition. The message tells Iona Murray nothing about her own organisation. Her regions, her venue, her follower count, her programme's age range and her peak-body affiliation are all absent. Her Facebook page enters only as the place the tickets should not go, and her families enter only as the people she would pass them to.
  4. Manufactured connection. The daytime and evening sorting traces to the profile's birth-to-five cohort. The pass-it-on shape traces to the programme's registered family lists. Nothing is asserted about her interests or opinions, and the profile's silence on her public statements is respected: no line claims she cares about farm visits, outings or circuses.
  5. Concreteness. The ask is answerable in one sentence: a rough number of families, or a day for a group visit.
  6. Band pattern. Checked against the two sibling files in this campaign folder. The post-spar draft opened with the same sentence as pine-lake-village.yaml, word for word, which fails this check, so the final identifies the venue by the Coomera River instead of by Beaudesert Nerang Road. That river runs through her own Upper Coomera, which makes the substitution a local anchor rather than a reshuffle. The same change is carried into the phone script's second point. The show title also takes the season's en dash in the final, where both drafts had a hyphen. The middles of the three messages stay closer than their openers, because the segment plan blocks share a first_ask; the difference here is the prior-note line and the sorting of the sessions by the age of the audience.
  7. Antifacts. Checked item by item, recorded in the review round's antifact_check.
