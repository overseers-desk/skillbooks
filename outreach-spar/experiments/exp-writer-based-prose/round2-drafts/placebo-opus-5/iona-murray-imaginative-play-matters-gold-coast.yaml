        result: verified
      - claim: A group visit suits the following week, with seating to come back on.
        source: usps.group-visit-later.
        result: verified
      - claim: No code, no price, no discount, no Oztix link, no feed-bag or animal-food offer, and nothing implying seats are unsold.
        source: prompt_appendices.a_challenger checklist.
        result: verified
      - claim: Address 950 Beaudesert Nerang Rd, Mount Nathan QLD 4211.
        source: the campaign's venue block and sot/S2-fees-and-service-hours.md section 1.
        result: verified
      - claim: Lia Movsisyan from our office wrote at the end of March offering coordinators a visit as our guests, and we heard nothing back.
        source: "IMAP record, admin-rivermill-au account: message-id 0108019d4298a275-5c0a4677-55f1-4faf-9c02-4e4e2ef0d3ac-000000@ap-southeast-2.amazonses.com, dated 2026-03-31, from partnerships@rivermill.au to imurray@playmatters.org.au, subject \"Historic Rivermill: complimentary visit for Gold Coast playgroup coordinators\", signed Lia Movsisyan, Partnership Manager, offering coffee, a walk around the grounds and a pony ride. Read at Partnerships UID 155; the same message is filed at INBOX/Work Done UID 67604. No reply in any of the five accounts."
        result: verified
        note: The challenger flagged this as unsourced. It runs context-isolated on the profile, the draft and the date, so the mail record is outside what it can reach, and the profile's silence on contact history does not negate it. prompt_appendices.a_author requires the line where the prefetch finds an unanswered prior note. Kept.
      - claim: Phone 07 3703 1307 in the signature.
        source: >-
          sot/S2-fees-and-service-hours.md section 1, whose business
          information block carries the phone number 07 3703 1307 against
          customer service hours of 7:00 AM to 2:30 PM Brisbane time. S2 is
          one of the campaign's three declared fact_sources.
        result: verified
        note: The challenger flagged this as unsourced after checking the campaign sender block and business-overview.md. It listed S2 among the files it checked but did not reach section 1. The number is the venue's and sits under the venue address in the signature, where it is not presented as a partnerships direct line. Kept.
    antifact_check: Checked item by item against business-antifacts.md. No stone buildings, no 100-year-old or original mill buildings, no vineyard, no claim that the venue is on Tamborine Mountain, and no farming claim. The final draft describes the venue by its river and its locality, which is the hinterland position the antifact file states.
    revision_note: |
      Both factual flags were checked and neither held, for the reasons recorded against them in fact_check. Nothing factual changed.

      The persona raised four points, sorted under section 4.6 before the draft was touched. (1) The opening "you didn't get back to us" line, which she named twice, once as her first reaction and once as the worst of the message: absorbed by reframing. It moved out of the opening to second-to-last, and the wording now puts the failure on our side rather than hers. (2) Whether the sender is legitimate and the venue appropriate: left for the reply. She resolved the venue question herself with a quick look and said it would not stop her replying, and this segment's USP list carries no credential framing to answer it with. (3) Whether there is anything to sign or vouch for: left for the reply, where the code and the link go out. (4) That two days is workable because there is no outing to arrange: positive, so that paragraph is unchanged.

      Repositioning the prior note freed the first paragraph, which now introduces the sender, the show and the Thursday date in four sentences, the a-b-c order of section 4.5 with the timing where prompt_appendices.a_author wants it. Three long sentences were split, including the 39-word one the challenger's inventory caught.
    notes: One pass, which is the budget for a yield-3 profile.
