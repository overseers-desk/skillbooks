quality_checklist: |
  1. Structure. Root keys are from the section 6 set. Both draft rounds and the review round carry type and number. The final round holds one email and one phone message, so the email cardinality cap holds. The recipient address is the club's own published one, not a pattern guess.
  2. Coverage. fact_provenance reaches every factual claim in the final email and phone script, including the three that rest on the profile and roster rather than the campaign. chosen_usps is set on both draft rounds and the final round. a_note carries the angle, channel, warmth, language and the identity caveat.
  3. Presupposition. Nothing tells Helen Parnell something she already knows about her own club. The charter year, the membership, the meeting venue and the 2025 tramway bus trip are all absent. The meeting cadence enters only as the reason the offer cannot wait, in one clause, not as a recital of her calendar.
  4. Manufactured connection. The group-visit line traces to the profile's dated bus-trip evidence. The grandchildren line is an offer for school-holiday visitors, not a claim about this club's members. Nothing is asserted about Helen Parnell's interests, and the profile's silence on her public activity is respected.
  5. Concreteness. The ask is answerable in one sentence: a rough number, or a day next week for a group.
  6. Band pattern. Compared against pine-lake-village.yaml, the one sibling in this band. That file opens on the self-introduction and closes on the not-advertised line; this one leads the subject with the event and the deadline, compresses the show list, moves the not-advertised paragraph off the close, and ends on a redirect to the right office-bearer. The openers do not read as the same template.
  7. Antifacts. Checked item by item, recorded in the review round's antifact_check.
