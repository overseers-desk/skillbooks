quality_checklist: |
  1. Structure. Root keys are from the section 6 set. Both non-final rounds carry type and number. The final round holds one email and one phone message, so the email cardinality cap holds. The recipient address is the real one from the village's own contact page.
  2. Coverage. fact_provenance lists every factual claim in the final email and phone script, including the two claims that rest on the profile rather than the campaign. chosen_usps is set on the draft and final rounds.
  3. Presupposition. The message tells Corey Hegge nothing about Pine Lake that he already knows. Unit count, operator, registry number and brand are all absent. The village bus enters only as an option he may take, not as a fact recited back to him.
  4. Manufactured connection. The bus line traces to the profile's mechanism evidence. The grandchildren line is an offer for school-holiday visitors, not a claim about this village's residents. Nothing is asserted about his interests, and the profile's silence on his public activity is respected.
  5. Concreteness. The ask is answerable in one sentence: a rough number, or a day for the bus.
  6. Band pattern. No other approach file existed in this campaign folder at drafting time, so the opener could not be compared across the band. Flagged for the reviewer to check once siblings exist.
  7. Antifacts. Checked item by item, recorded in the review round's antifact_check.
