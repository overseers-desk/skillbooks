# Contact: Chinnu Sravya | Families Magazine | travel-blogger-domestic
# Channel: email + phone
# Language: en
# Angle: chosen-not-advertised / opening-week-seats / big-top-at-a-heritage-farm / nothing-to-organise
decisions:
  channel: email
  channel_detail: Email first touch; phone follow-up script only if no reply by Saturday 26 September.
  language: en
  angle: chosen-not-advertised

angle_rationale: |
  Warmth is cold. The one prefetch hit (admin-rivermill-au, August 2025,
  "RE: New Entry: Simple Contact Form" between editor@familiesmagazine.com.au
  and marketing@rivermill.au) is thirteen months old, ran on a different
  sender address than this campaign's partnerships@rivermill.au, and both
  sides replied, so it is not the "wrote and heard nothing back" case the
  campaign's a_author guidance calls out for a one-line mention. The profile
  records no dated conduct between Chinnu Sravya and the venue either, so no
  prior dealing is named in the draft.
  Channel is email with a phone follow-up: no LinkedIn on the roster, so
  SPAR-A section 4.2's email-plus-phone rule applies.
  Angle: the profile's strongest evidence is that Families Magazine already
  runs an ongoing Brisbane school-holiday activities guide and covered a
  comparable farm-animal venue, Trevena Glen Farm, in February 2025. A
  circus in a big top on a heritage riverside farm during the
  September-October school holidays sits directly in that beat
  (big-top-at-a-heritage-farm). Framing the pass as reserved for her rather
  than on sale (chosen-not-advertised) matches a publisher whose advertise
  page already sells venue reviews and giveaways on enquiry. The ask itself
  stays low-friction: any opening-week show for her own pass
  (opening-week-seats), and a giveaway she forwards to readers with no
  excursion to organise (nothing-to-organise).

response_likelihood: 45
a_note: |
  Angle chosen-not-advertised (with opening-week-seats, big-top-at-a-heritage-farm,
  nothing-to-organise); channel email, phone follow-up if no reply by
  26 September; warmth cold (a 13-month-old, unrelated 2025 thread on a
  different sender address does not count); language en. Challenger's role-play
  reply estimate moved from 55% to 45% between passes because the persona
  weighed the unfamiliarity of the sender and operator more heavily on the
  second read; verdict on the revised draft was DONE.

rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm, nothing-to-organise]
    notes: |
      First draft. Element order: self-introduction, then the concrete ask
      (four-person pass plus five giveaway passes), then the Eventbrite
      fallback link for readers. No code, no price, no claim beyond the
      campaign's usps registry.
    messages:
      - channel: email
        to: editor@familiesmagazine.com.au
        subject: Free circus passes for Families Magazine's school-holiday guide
        body: |
          Hi Chinnu,

          I'm Priyanka Das from Partnerships at Historic Rivermill, a heritage riverside venue at Mount Nathan in the Gold Coast hinterland. From this Thursday 24 September to Sunday, we're running WANTED – A Cirque Heist, a family circus in a big top on our lawn, for the school holidays.

          I have a family pass for four for you to see it at any of the seven opening-week shows, and five more passes to give away to your readers if you'd like to run it in your school-holiday guide. Reply with the show that suits you and I'll send the booking details straight back. Tickets for readers otherwise are at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          Priyanka
          Partnerships, Historic Rivermill
          950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
      - channel: phone
        to: "0437 866 869"
        text: Follow-up call if no reply to the email by Friday 25 September.
        script:
          - point: Opening
            text: "Hi, is that Chinnu? This is Priyanka from Historic Rivermill, calling about the circus passes I emailed Families Magazine on Tuesday."
          - point: Context, only if asked what it's about
            text: "We're running a family circus in a big top through the school holidays and I've held a pass for four for you, plus five to give away to your readers."
          - point: Ask
            text: "Would any of the shows from this Thursday to Sunday suit you, so I can send the booking details?"
          - point: If she wants time
            text: "No rush, I'll send the details as soon as you let me know which show."
          - point: Close
            text: Confirm the best email or number to send the booking details to, and end the call.

  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      I run Families Magazine out of a PO box, six issues a year, and I've
      never heard of "Priyanka Das" or "Historic Rivermill" before this
      email landed in my inbox. First thing I notice: she wants me to run
      this in my school-holiday guide, but the show opens this Thursday,
      two days from now. My guide for these holidays is long since written,
      laid out and either printed or scheduled. There's no way a print
      magazine turns around a new listing in 48 hours, so if she's
      picturing me slotting this into "the school-holiday guide" she means
      online, not the printed book, and she hasn't said which. That's a bit
      sloppy for a first approach.
      That said, the ask itself is easy: a family pass for four, five more
      passes for my readers, no strings quoted up front, no price or code
      dangled at me, just "reply with the show and I'll send the details."
      That's a normal, low-friction offer of the kind PR people send me
      regularly, and it reads like she actually looked at what I do rather
      than a blast. I'd want to know the age-suitability and running time
      before I commit myself and four family members to a Thursday-to-Sunday
      circus show, and I'd want to know what "run it" means exactly before
      I promise anything back. I'd probably reply, mostly to see the offer
      in more detail and because there's zero cost to a reply, but I
      wouldn't commit to publishing anything until I'd seen it.
      REPLY_PCT: 55
    fact_check:
      - claim: Phone script states the email was sent "Tuesday."
        source: Campaign approach_sequencing for segments.travel-blogger-domestic, step 1 ("Email on 23 September").
        result: incorrect
        note: 23 September 2026 is a Wednesday, one day after the draft's implied send date.
        correction: Change the phone script's day reference to "Wednesday" and move the follow-up trigger to three days after the 23 September send.
      - claim: Venue description ("heritage riverside venue at Mount Nathan in the Gold Coast hinterland"), address, sender name/role/email, "this Thursday 24 September to Sunday," "seven opening-week shows," Eventbrite URL.
        source: business-overview.md; campaign sender: and venue: blocks; plan-events/2026-09-25-wanted-a-cirque-heist/2026-09-23-stampede-arena-showtimes.md; usps.opening-week-seats.rests_on.
        result: verified
        note: All match their sources verbatim; no code, price, discount, feed-bag offer, Oztix link, or unsold-seats suggestion present; no business-antifacts.md claim asserted.
    antifact_check: No stone buildings, vineyard, Tamborine Mountain, or building-age claim present; checked against business-antifacts.md.
    revision_note: |
      Sorted the challenger's points: (1) answer now — the phone script's
      day mismatch, a factual error, fixed; (3) absorb by reframing — "in
      your school-holiday guide" became "on your school-holiday guide and
      socials," pointing the ask at her online channels rather than the
      print run the persona flagged as too slow to turn around. (2) left
      for the reply — age-suitability, running time, and what "running" the
      giveaway involves, since the persona said she'd reply to see detail
      before committing to anything.
    notes: First pass, revise for the print/online ambiguity and the date error.

