      - claim: Showtimes file states "Oztix sells these fourteen," apparently conflicting with the Eventbrite link used throughout the campaign.
        source: plan-events/2026-09-25-wanted-a-cirque-heist/2026-09-23-stampede-arena-showtimes.md; usps.opening-week-seats.rests_on.
        result: verified
        note: |
          Not a draft error. The conflict is pre-resolved by the campaign's
