quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; every round
     carries type and number where required; final round has exactly one
     channel:email message (plus one channel:phone) — passes.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; chosen_usps present on every draft and final round; a_note
     states angle, channel, warmth, language — passes.
  3. Presupposition test: no sentence tells the recipient something she
     already knows about herself — passes.
  4. Manufactured-connection test: no claim of shared interest beyond the
     profile's own evidence (school-holiday guide, Trevena Glen Farm
     feature) — passes.
  5. Concreteness: the ask ("reply with the show that suits you") is
     answerable in one sentence — passes.
  6. Band-level pattern check: deferred to band review alongside the rest
     of the travel-blogger-domestic band.
  7. Final round email cardinality: one channel:email message, one
     channel:phone message — passes.
