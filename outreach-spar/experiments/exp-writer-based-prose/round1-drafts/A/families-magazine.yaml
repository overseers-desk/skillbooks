  - type: review
    number: 2
    verdict: DONE
    in_character: |
      Right, so it's Tuesday, and this "Priyanka" wants me to say which one
      of seven shows I'll turn up to between Thursday and Sunday. That's
      two days' notice from a total stranger. I don't know Historic
      Rivermill from a bar of soap, never had a media enquiry from them
      before, never seen a listing.
      That said, the ask itself is light: no forms, no bus, no group, just
      "which show suits you" and forward some passes to my readers. That I
      could physically do on two days' notice, this is an Instagram/socials
      thing, or a quick add to the online what's-on guide. Mount Nathan is
      close enough for us to actually get there this weekend if a show time
      works with the kids' school schedule.
      The bit that makes me pause is being handed "five passes to give away
      to readers" from someone I've never dealt with, no rates, no
      background on the operator, nothing about insurance or whether this
      is even legit. I'd want to at least Google "WANTED – A Cirque Heist"
      and check the Eventbrite listing before I commit my name to promoting
      it. But it costs me nothing to reply and ask a couple of questions, or
      just say "we could do Sunday" and see what comes back.
      REPLY_PCT: 45
    fact_check:
      - claim: Venue description, address, sender details, show dates, seven opening-week shows, and the Eventbrite link.
