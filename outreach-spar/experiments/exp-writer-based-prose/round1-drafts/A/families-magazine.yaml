        result: verified
        note: |
          No factual errors found. Eventbrite link and URL match
          usps.opening-week-seats.rests_on, which names Eventbrite (not
          Oztix) as the code's channel, consistent with the a_challenger
          gate against an Oztix link. No code, price, or discount in the
          first message. No suggestion that seats are unsold or that the
          offer serves the sender. No feed-bag/animal-food offer. No
