quality_checklist: |
  1. YAML structure: root keys match §6's canonical set; every round carries
     type and number where required; the final round carries exactly one
     channel: email message plus one channel: phone message.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft, including the March correspondence line and the sender
     identity. chosen_usps set on both draft rounds and the final round.
  3. Presupposition test: no sentence tells Iona something she already
     knows about herself or her programme.
  4. Manufactured-connection test: the hub-coordinator framing and the
     Easter BBQ/Children's Week pattern are both traceable to the profile;
     no invented farm-visit history.
  5. Concreteness: the ask ("reply with roughly how many families") is
     answerable in one sentence.
  6. Antifact check: clear, see review-1 antifact_check.
  7. Final round email cardinality: one email message, one phone message;
     passes the cap.
