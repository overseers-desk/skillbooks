quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; every round
     carries type and number where required; final round has exactly one
     email message plus one phone message (cardinality check passed);
     email address is a real deliverable address, not a placeholder.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft (season dates, the free-vs-paid distinction, the two asks,
     sender identity, venue description). a_note carries angle, channel,
     warmth, and language.
  3. Presupposition test: no sentence tells Corey something she already
     knows about her own village; the message states the sender's world
     (the offer) rather than narrating hers.
  4. Manufactured-connection test: no claim of shared interest is made;
     the profile found no public statements to draw on, and none are
     invented. The approach rests on role fit alone, disclosed nowhere in
     the message itself.
  5. Concreteness: the ask (reply to get the code, or name a day for an
     outing) is answerable in one sentence.
  6. Band-level pattern check: deferred to the band review across the
     retirement-village segment; this file is a single contact.
  7. Final round email cardinality: one email message in the final round;
     the phone message is a separate channel, not a second email. Passed.
