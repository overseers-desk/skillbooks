          If a proper village outing would suit better than this week allows, the week after gives your bus the notice it needs. Tell me a day and I'll come back to you about seating.

          Kind regards,
          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
      - channel: phone
        to: "0401 417 480"
        text: Follow-up call if no reply after 3 days.
        script:
          - point: Opening hook
            text: "Hi Corey, it's Priyanka from Historic Rivermill. I emailed Tuesday about free circus tickets for Pine Lake Village residents this opening week, wanted to check it landed."
          - point: Context if asked
            text: "It's a family circus in our big top at Mount Nathan, running through Sunday. Alongside the public tickets, we've set aside some free seats for a few local villages to pass to residents and their families."
          - point: Ask
            text: "Would you like me to send the booking code through now, or would a proper village outing the week after suit your bus better?"
          - point: Close
            text: "Either way, just let me know a day or a number and I'll sort the seating."
  - type: final
    chosen_usps: [chosen-not-advertised, nothing-to-organise, opening-week-seats]
