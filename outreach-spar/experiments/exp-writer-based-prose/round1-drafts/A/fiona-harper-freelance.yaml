quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; every round
     carries type and number (final omits number per skeleton); the final
     round carries at most one channel:email message (one linkedin, one
     email); no placeholder email addresses, both email messages use the
     roster address hello@fionaharper.com.au.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft (venue, show dates, season end, show count, pass, link,
     sender). a_note states angle, channel, warmth, language and the
     spar outcome. chosen_usps set on both draft rounds and the final
     round.
  3. Presupposition test: no sentence tells the recipient something she
     already knows about herself; the message presents the venue's world
     and the ask, not a narration of her own beat.
  4. Manufactured-connection test: no claim of shared interest is made.
     The pass is offered on the segment's fixed USPs, not on an assumed
     fit with her wildlife/adventure or TravHost work that the profile
     does not establish for this specific ask.
  5. Concreteness: she can answer the ask, a show and a yes/no, in one
     sentence.
  6. Band-level pattern check: not run here (single-contact file); to be
     read against the rest of the earned-media band's openers before the
     band goes to human review.
  7. Final round email cardinality: one channel:email message in the
     final round (the linkedin message is the other final-round piece).
