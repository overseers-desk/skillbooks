          The season runs through to 4 October.

          I have a family pass of four held in your name for any of the
          seven opening-week shows, Thursday 24 to Sunday 27 September.

          Reply with the show that suits and I'll send the booking
          details. Public tickets are at [the Eventbrite listing](https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924).

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
        director_note: |
          Alternative opening line for the five-day fallback, if sent
          without a LinkedIn acceptance: replace "Thanks for connecting."
          with "I'm Priyanka Das, Partnerships at Historic Rivermill, a
          heritage venue on the Coomera River in the Gold Coast
          hinterland, about 30 minutes from central Gold Coast."
  - type: review
    number: 2
    verdict: DONE
    in_character: |
      A LinkedIn request from an unfamiliar sender and venue: mildly
      interesting, worth a glance. The email's ask is a family pass of
      four for any of the seven opening-week shows, Thursday 24 to Sunday
      27 September, against today's date of Tuesday 22 September. That is
      two days' notice for the earliest show and five for the latest.
      Bundaberg to the Gold Coast hinterland is the best part of a day's
      travel each way, for a show never seen advertised, from an outlet
      never dealt with before. No outlet is named for the coverage, no
      story angle is suggested, and no reason is given for why she
      specifically was picked beyond a generic partnerships outreach; it
      reads as a list-based pitch rather than a tailored one. If already
      in the area for something else, a reply asking for a weekday
      matinee is plausible. As it stands, the likely outcome is a
      "can't make opening week, is there a later date" reply at best, or
      the message gets buried under deadline work. REPLY_PCT: 20.
    fact_check:
