    antifact_check: No stone-building, vineyard, Tamborine Mountain, or farming claim present; no code, price, discount, Oztix link, or feed-bag/animal-food offer present.
    revision_note: No factual errors found in this pass. The persona's low reply estimate is a business-realism read. It reflects the notice period, the distance from Bundaberg, and the lack of a confirmed masthead pickup, not an objection to anything false or improper in the message, so the draft was not changed further.
    notes: Pass 2 of up to 3 (yield 11, ≥6 band). Verdict DONE; no further pass run.
