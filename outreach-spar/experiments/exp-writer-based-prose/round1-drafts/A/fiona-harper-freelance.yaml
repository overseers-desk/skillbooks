# Contact: Fiona Harper | Freelance: AFR, Australian Geographic Adventure | earned-media
# Channel: LinkedIn connection note, then email | Language: en-au | Angle: editorial-preview-pass
decisions:
  channel: linkedin
  channel_detail: |
    LinkedIn connection note first (a pitch form/phone is not on the
    roster). Email follows once the connection is accepted, or after five
    days if it is not.
  language: en-au
  angle: editorial-preview-pass
angle_rationale: |
  Warmth is cold: the dispatcher prefetch found no prior correspondence
  with hello@fionaharper.com.au or with her name or organisation across
  any mailbox, so the message opens as a stranger's approach with no
  earlier touchpoint to name.

  Channel is LinkedIn plus email, per the dispatcher's channel selection:
  her roster row carries a LinkedIn URL and an email but no phone.

  The segment's plan block fixes the USPs for earned-media at
  chosen-not-advertised, opening-week-seats, and big-top-at-a-heritage-farm,
  and fixes the message goal as a reply accepting a family pass for an
  opening-week show. Her profile records national-masthead travel bylines
  (AFR Life & Leisure, Australian Geographic Adventure) and a
  wildlife/adventure specialisation, not a family or kids beat, so the
  draft does not claim she covers family content. It offers the press
  pass on the terms the segment defines and lets her decide whether it
  fits her platforms. Her Bundaberg base is Queensland but a day's travel
  from the Gold Coast hinterland each way, so the subject line uses a
  geographic anchor (Mount Nathan) as the honest differentiator rather
  than a topical match to her existing bylines.
response_likelihood: 22
a_note: |
  Angle: editorial preview pass, offered on the earned-media segment's
  fixed USPs (chosen-not-advertised, opening-week-seats,
  big-top-at-a-heritage-farm), not a family/kids-beat claim her profile
  doesn't support. Channel: LinkedIn connection note, then email after
  acceptance or five days; no phone on file. Warmth: cold, no prior
  correspondence found. Language: en-au. Two-pass spar: pass 1 caught a
  show-count error (said four, source says seven) and a false
  "ahead of the public" claim; pass 2 (after fixing both) found no
  factual errors and closed DONE. Both passes read the low reply odds as
  a genuine freelancer-logistics constraint (Bundaberg to Mount Nathan is
  a day's travel each way, on two to five days' notice, with no confirmed
  masthead pickup) rather than a defect in the message; response
  likelihood is set low to reflect that, not the drafting.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm]
    notes: |
      First draft. Element order self-intro, ask, evidence per §4.5. Show
      count and "ahead of the public" framing were not yet checked against
      the showtimes source.
    messages:
      - channel: linkedin
        to: https://linkedin.com/in/fionaharper-travel-cruise-boating-adventure-content-writer
        body: |
          Hi Fiona — I'm Priyanka from Historic Rivermill, a heritage venue
          on the Coomera River in the Gold Coast hinterland. We're opening
          a family circus in a big top on the lawn this Thursday and I
          have a pass held for you. Keen to connect and send the details.
      - channel: email
        to: hello@fionaharper.com.au
        subject: A family pass for the Cirque Heist season, Mount Nathan
        body: |
          Hi Fiona,

          Thanks for connecting. I'm Priyanka Das, Partnerships at
          Historic Rivermill, a heritage venue on the Coomera River in
          the Gold Coast hinterland, about 30 minutes from central Gold
          Coast.

          We open WANTED – A Cirque Heist this Thursday 24 September: a
          family circus in a big top pitched on the lawn by the river,
          running through to 4 October. I have a family pass of four
          held in your name for any of the four opening-week shows,
          Thursday 24 to Sunday 27 September, ahead of the season
          opening to the public.

          Reply with the show that suits and I'll send the booking
          details. Public tickets are at
          https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
        director_note: |
          Alternative opening line for the five-day fallback, if sent
          without a LinkedIn acceptance: replace "Thanks for connecting."
          with "I'm Priyanka Das, Partnerships at Historic Rivermill, a
          heritage venue on the Coomera River in the Gold Coast
          hinterland, about 30 minutes from central Gold Coast."
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      A cold LinkedIn request, but a specific one: a named show, a named
      date range, an actual Eventbrite link rather than a vague "let's
      chat." The email reads plainly, no hard sell. The catch is timing:
      today is Tuesday 22 September, and the note asks for a show pick
      between Thursday 24 and Sunday 27 September, two to five days'
      notice for a family pass of four. Press-trip logistics normally
      need more runway than that, and there is no assignment editor
      waiting on this and no proof of pickup. If the window doesn't suit,
      the offer just evaporates; nothing offers a second week instead,
      and nothing engages the TravHost side for something bigger than
      four personal seats. Likely outcome: a glance at the Eventbrite
      link, a note that the dates are too tight to commit to a pitch,
      and the message left to sit. REPLY_PCT: 25.
    fact_check:
      - claim: any of the four opening-week shows, Thursday 24 to Sunday 27 September
        source: plan-events/2026-09-25-wanted-a-cirque-heist/2026-09-23-stampede-arena-showtimes.md; campaign usps registry and header
        result: incorrect
        note: The showtimes source lists seven performances in that window (24 Sep 1pm; 25 Sep 4pm and 7pm; 26 Sep 4pm and 7pm; 27 Sep 11am and 2pm), matching the campaign's own "seven shows" language. Four undercounts the offer.
        correction: any of the seven opening-week shows, Thursday 24 to Sunday 27 September
      - claim: ahead of the season opening to the public
        source: data/circus.yaml; campaign a_author appendix; usps chosen-not-advertised
        result: incorrect
        note: circus.yaml shows all opening-week sessions already on public sale via Oztix since 2026-09-11, the same performances offered here; the public and the pass window both open 24 September. The phrase also risks implying the tent needs filling, which the campaign forbids stating or implying.
        correction: Remove the phrase; state the pass without any public-timing claim.
    antifact_check: No stone-building, vineyard, or Tamborine Mountain claims present; no farming claim.
    revision_note: |
      Sorted: (1) answer in this email — the show-count error and the
      false "ahead of the public" claim were both fixed, since leaving
      either would mean the recipient acts on a wrong fact. (2) leave for
      the reply — the freelancer-logistics tightness (Bundaberg travel
      time, no confirmed masthead pickup) and any TravHost
      editorial-coordination angle are left for her to raise if she
      wants to, since the segment's plan block fixes the ask to opening
      week with no built-in second-week option and inventing a TravHost
      angle the profile doesn't evidence for this ask would be a
      manufactured connection. No point required absorption by
      reframing beyond the show-count fix, which incidentally gives her
      more scheduling room across the same four days.
    notes: Pass 1 of up to 3 (yield 11, ≥6 band).
  - type: draft
    number: 2
    chosen_usps: [chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm]
    notes: Show count corrected to seven; "ahead of the season opening to the public" removed. Eventbrite URL wrapped as a markdown link.
    messages:
      - channel: linkedin
        to: https://linkedin.com/in/fionaharper-travel-cruise-boating-adventure-content-writer
        body: |
