  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      A LinkedIn note and, the same day, an email from Priyanka Das of
      Historic Rivermill, a venue never dealt with before. She wants to
      hold four free tickets for the desk to see a circus opening
      Thursday, two days away, and wants a reply naming a day "Thursday
      to Sunday this week." Tight but not impossible; someone from guest
      services could plausibly go on a Saturday or Sunday. It does not ask
      for personal attendance, and she offers to have it forwarded to
      guest services, the sensible move since a GM does not make the
      front-desk day-trip recommendations. The "see it before recommending
      it, the way you send guests to Tamborine and Springbrook" pitch is a
      reasonable hook that lines up with what the desk already does. It
      reads as a low-effort, no-cost ask with nothing that smells like
      filling empty seats. Most likely forwarded to guest services rather
      than dealt with personally; given the workload, this is a
      delegate-and-forget item.
