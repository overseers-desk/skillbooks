# Contact: Christian Wachter | Dorsett Gold Coast | accommodation-referral
# Channel: LinkedIn connection note + email (sent the same day) + phone follow-up
# Language: en-au
# Angle: dorsett-day-trip-guide

decisions:
  channel: email
  channel_detail: |
    LinkedIn connection note sent the same day as the email, not gating it.
    Phone follow-up the next morning (Thursday 24 September) if there is no
    reply to the email.
  language: en
  angle: dorsett-day-trip-guide
  sender:
    name: Priyanka Das
    email: partnerships@rivermill.au

angle_rationale: |
  The profile's strongest evidenced hook is behavioural, not structural.
  Dorsett Gold Coast already publishes its own hinterland day-trip guide
  (Tamborine, Springbrook, Canungra) and markets a concierge function built
  to answer "where should I go" questions. The profile's own relevance
  assessment calls this a partial behavioural fit: infrastructure and
  stated intent for the segment's mechanism, short of a proven referral
  habit with a named local partner. The angle speaks to that existing
  function directly, offering the show as a second thing the desk can
  point families to, rather than narrating research as a credential. The
  300+-room, convention-and-exhibition guest base supports treating this
  as worth a GM's attention. Christian Wachter is a strong, named, verified
  contact, the rubric's top-tier contact type.

response_likelihood: 15
a_note: |
  Angle: Dorsett's own hinterland day-trip guide and concierge function,
  offered a firsthand family pass. Channel: LinkedIn connection note plus
  immediate email plus next-morning phone follow-up. Warmth: cold, no
  prior correspondence found on any account. Language: en-au. Sparred to
  DONE over three passes; the reply likelihood reflects a General Manager
  who is very likely to delegate to guest services rather than reply
  personally.

rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm]
    notes: |
      First draft. Channel sequenced per the generic SPAR-A §4.2 table for
      a LinkedIn + email + phone contact: connection note first, email
      after acceptance or after 5 days, phone after 3 further days with
      no reply.
    messages:
      - channel: linkedin
        text: |
          Christian, I'm Priyanka Das from Historic Rivermill at Mount
          Nathan. We're holding a family pass for your desk to see WANTED
          – A Cirque Heist, opening in our big top this Thursday, so you
          can recommend it alongside your hinterland day trips. Happy to
          send details by email.
      - channel: email
        subject: "For Dorsett's hinterland day-trip guide: a family circus this week"
        body: |
          I'm Priyanka Das, Partnerships at Historic Rivermill, a heritage
          riverside venue at Mount Nathan, thirty minutes from Broadbeach.

          WANTED – A Cirque Heist, a family circus in a big top on our
          lawn, opens this Thursday 24 September and runs through the
          school holidays to 4 October.

          I want to hold a family pass of four for your desk, so your team
          sees the show firsthand before pointing guests with children to
          it, the way your guide already sends them up to Tamborine and
          Springbrook. Reply with a show between Thursday and Sunday this
          week and I'll send the booking details.

          Evening shows run Fridays and Saturdays through to 3 October,
          for guests staying longer in the season. Public tickets for
          anyone you'd rather send straight there are at
          https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
        to_note: Email sent after LinkedIn acceptance, or after 5 days with no response.
      - channel: phone
        text: Follow-up call if no reply to the email within 3 days.
        script:
          - point: Opening
            text: "Hi, is that Christian? This is Priyanka Das from Historic Rivermill at Mount Nathan — I sent an email about a family pass to see our circus, WANTED – A Cirque Heist."
          - point: Context
            text: "It's on in our big top through the school holidays, and I thought your desk might want to see it before pointing guests to it, the way you already do with Tamborine and Springbrook."
          - point: Ask
            text: "Would this Thursday to Sunday work for your team to come out on the pass? I can hold four seats for whichever show suits."
          - point: Close
            text: "I'll send the booking details as soon as you let me know a day, or you're welcome to reply to the email instead."

  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      Another LinkedIn connection note from someone never dealt with
      before. Historic Rivermill is an unknown venue, and the desk already
      has an established, years-settled list of what it sends guests to
      (Tamborine, Springbrook, O'Reilly's). A family pass for a circus
      opening in two days is not something acted on off a cold LinkedIn
      note. The timing kills it more than the offer: it is Tuesday, the
      show opens Thursday, and the ask for a reply naming a day "between
      Thursday and Sunday" cannot survive a sequence where the email may
      only land after connection acceptance or, worse, five days on. By
      then the opening-week window is closed. A GM does not personally
      evaluate a concierge recommendation on two days' notice; that goes
      to guest services, and even they would not turn it around that
      fast. The offer itself is reasonable and low-pressure, a hold with
      no price and no gimmick, and would likely be passed to the team
      with two or three weeks' runway. As written, cold outreach plus a
      two-day fuse plus a multi-step sequence that structurally cannot
      complete before the window shuts makes a reply very unlikely.
    fact_check:
      - claim: Season opens Thursday 24 September, runs through the school holidays to 4 October.
        source: plan-events/2026-09-25-wanted-a-cirque-heist/2026-09-23-stampede-arena-showtimes.md
        result: verified
      - claim: Evening shows run Fridays and Saturdays through to 3 October.
        source: historicrivermill.au/data/circus.yaml
        result: verified
      - claim: No code, price, or discount in the first message.
        source: campaign YAML, usps.opening-week-seats.rests_on
        result: verified
      - claim: No suggestion that seats are unsold or that the offer serves the sender.
        source: campaign YAML, usps.chosen-not-advertised.rests_on
        result: verified
      - claim: Eventbrite link matches the registry.
        source: campaign YAML, usps.opening-week-seats.rests_on
        result: verified
      - claim: "Heritage riverside venue at Mount Nathan."
        source: business-overview.md, USPs U1 and U4
        result: verified
    revision_note: |
      Sorting: (1) answer in this email — the connect-wait-email-wait-call
      cadence structurally cannot complete before the Thursday-to-Sunday
      window closes; fixed by sending the email immediately alongside the
      LinkedIn note, not gated on acceptance, and moving the phone
      follow-up to the next morning instead of a 3-day wait. (3) absorb by
      reframing — a GM would hand this to guest services rather than
      evaluate it personally; added a line inviting Christian to forward
      it to his team. (2) leave for the reply — the offer's low-pressure
      shape landed correctly and needed no change; the pass stays
      opening-week only per the opening-week-seats USP, so the window was
      not widened.

