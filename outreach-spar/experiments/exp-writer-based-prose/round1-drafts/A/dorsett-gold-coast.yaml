  - type: review
    number: 3
    verdict: DONE
    in_character: |
      Priyanka Das, Historic Rivermill, never heard of either. A LinkedIn
      request the same day as a cold email, a dozen of these arrive most
      weeks and most go unread. The email itself is fine as these go:
      short, no money asked for, nothing complicated. A family pass of
      four, come see the show before recommending it. The timing is real
      though: a reply naming a day "this Thursday to Sunday" on a
      Wednesday, a same-day-to-four-days-out ask on a General Manager's
      calendar during a week a 300-plus room hotel is juggling arrivals
      and events. Nobody on the desk drops everything for a circus with
      24 to 48 hours' notice, whatever it costs; a two-week window would
      have registered more seriously. The "the way your guide already
      sends them up to Tamborine and Springbrook" line is a nice touch,
      though it reads slightly presumptuous, telling the reader what his
      own guide does; it registers as homework done, dressed as a favour,
      not as a red flag. The line offering to forward it to guest services
      is the natural out: that is almost certainly what happens, a
      forward and move on rather than a personal calendar rearrangement.
      No reason to distrust the email; also no particular reason to
      prioritise it over the rest of the week's inbox.
