quality_checklist: |
  1. YAML structure: root keys drawn from the §6 canonical set; every
  round carries type and number where required; the final round carries
  exactly one channel: email message alongside one linkedin and one
  phone message, within the §7.7 cap. Email addresses and phone number
  are real, taken from the profile's roster_patch, not placeholders.
  2. Coverage: fact_provenance covers every factual claim in the final
  draft (dates, evening-show pattern, the Eventbrite link, the venue
  description, the day-trip-guide claim, and the no-prior-contact state).
  chosen_usps set on every draft and final round.
  3. Presupposition test: no sentence tells Christian something he
  already knows about himself; "the way your guide already sends them up
  to Tamborine and Springbrook" was flagged by the challenger as slightly
  presumptuous but not disqualifying, and stands as the strongest
  evidenced hook available.
  4. Manufactured-connection test: the day-trip-guide claim traces to the
  profile's Institutional context section, not to an assumption.
  5. Concreteness: the ask (reply with a day, or forward to guest
  services) is answerable in one sentence.
  6. Antifact check passed: no stone buildings, no "100-year-old" or
  "original mill" claim, no vineyard, no on-Tamborine-Mountain claim.
  7. Sparred to DONE over three passes (REPLY_PCT 8, 20, 12); the final
  open item was a timing/date correction, fixed in draft 3 and carried
  into the final round.
