quality_checklist: |
  1. YAML structure self-check: root keys drawn from §6's canonical set; every round has
     type and number where required; final round carries exactly one channel: email
     message plus one channel: phone message; no placeholder addresses. Passed.
  2. Coverage and completeness: fact_provenance covers every factual claim in the final
     draft, including the one claim (the April email) sourced outside the campaign
     authority files; chosen_usps present on the draft and final rounds; a_note states
     angle, channel, warmth and language. Passed.
  3. Presupposition test: no sentence tells the recipient something they already know
     about themselves. Passed.
  4. Manufactured-connection test: every claim of shared history (the April email) or
     relevance (shed's forward-to-members pattern) traces to a specific prefetch or
     profile data point, not an invented one. Passed.
  5. Concreteness: recipient can answer the ask ("reply with roughly how many") in one
     sentence. Passed.
  6. Band-level pattern check: not yet applicable, single-contact file; opener uses this
     contact's specific prior-contact fact rather than a template line.
  7. Final round email cardinality: exactly one channel: email message in the final
     round, plus one channel: phone message. Passed.
