quality_checklist: |
  1. YAML structure: root keys drawn from §6 canonical set; every round carries
     type and number where required; final round has exactly one email message
     plus one phone message (cardinality check passed, cap is on emails only).
  2. Coverage: fact_provenance covers every factual claim in the final draft;
     chosen_usps set on both draft and final rounds.
  3. Presupposition test passed: no sentence tells the recipient something
     about their own club they already know.
  4. Manufactured-connection test passed: no claim of shared interest beyond
     "your club is one of them"; the profile's bus-trip evidence is not cited
     back to the recipient.
  5. Concreteness: the ask (circulate this week, or a day for a group visit
     next week, with a rough number either way) is answerable in one reply.
  6. Band-level pattern check: single-contact file, not applicable here.
  7. Final round email cardinality: one email message in the final round.
