quality_checklist: |
  1. YAML structure: root keys drawn from the §6 canonical set; every round
     carries type and number where required; the final round has exactly
     one channel: email message (cardinality check passed) plus one
     channel: phone message.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; chosen_usps set on every draft and final round; a_note states
     angle, channel, warmth and language.
  3. Presupposition test: no sentence tells Carly something she already
     knows about her own centre; passed.
  4. Manufactured-connection test: every claim traces to the profile or the
     campaign's usps registry; no invented shared interest.
  5. Concreteness: the ask (a day and a rough headcount) is answerable in
     one sentence.
  6. Channel-availability fix (found at assembly, not by the A2 challenger,
     who tested the email-first scenario): the roster and profile carry no
     deliverable email for Carly, only a shared centre inbox already
     assigned to the excluded predecessor row. Per SPAR-A §4.2 this is the
     phone-only case, so the final round was restructured with the phone
     script as the actual first touch and the email as a template to send
     once an address is obtained on the call; the phone script's opener was
     rewritten to not presuppose an email already sent. Draft 1 and Draft 2
     are left as the historical record of what the A1/A2 pass actually
     tested; the fix applies only to the final round.
  7. response_likelihood (45%) set below the challenger's 55% email-scenario
     estimate, since the corrected phone-first channel is untested by the
     A2 pass and cold calls to a childcare centre typically face gatekeeper
     screening the email scenario did not model.
