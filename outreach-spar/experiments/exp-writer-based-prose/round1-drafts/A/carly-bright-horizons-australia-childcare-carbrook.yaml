a_note: |
  Angle: registered vacation-care mechanism plus Carly's booking authority,
  asking for a second-week group visit (not opening week). Channel: phone
  primary (no deliverable email on file; email above is a template to send
  once an address is captured on the call), phone follow-up already covered
  by the primary call. Warmth: cold, no prior correspondence with Carly
  found. Language: en-au. A2 verdict REVISE on pass 1 (yield 5, one pass
  budgeted); one factual correction applied (venue identity line) and
  absorbed into the final draft; response_likelihood set below the
  challenger's 55% email-scenario estimate to reflect the corrected
  phone-first channel, which the challenger did not test.
