quality_checklist: |
  1. YAML structure self-check: root keys drawn from §6's canonical set (decisions,
     rounds, angle_rationale, response_likelihood, a_note, fact_provenance,
     quality_checklist). Each round carries type and number where required
     (drafts and review numbered; one final round). The final round carries exactly
     one channel: email message plus one channel: phone message — passes the
     final-round email cardinality cap (§7.7). Email addresses are real, not
     placeholders; the one uncertain address is flagged in to_note and
     director_note rather than presented as confirmed.
  2. Coverage and completeness: fact_provenance covers every factual claim in the
     final draft, including the venue identity, the date/timing claims, the visit
     structure, the certificate offer, the contact number, and Carly's role and
     registration status. chosen_usps is present on both draft rounds and the final
     round. a_note states angle, channel, warmth, and language.
  3. Presupposition test: no sentence tells Carly something she already knows about
     herself (e.g. does not narrate "you run vacation care" as news) — it names her
     situation once, as the opening hook, then moves to the offer.
  4. Manufactured-connection test: every claim of relevance (registered vacation
     care, booking authority) traces to a specific profile data point, not an
     assumed shared interest.
  5. Concreteness: Carly can answer in one sentence — a day in the window and a
     rough headcount.
  6. Band-level pattern check: not yet applicable — this is the first contact
     processed in this band; the opener (leading with the recipient's own holiday
     roster rather than a compliment or a manufactured connection) sets a pattern
     to compare subsequent band contacts against.
  7. Final round email cardinality: one channel: email message in the final round
     (plus one channel: phone message, which is not capped) — passes.
