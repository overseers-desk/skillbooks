# Contact: Christian Wachter, General Manager, Dorsett Gold Coast
# Channel: email
# Language: en-au
# Angle: hinterland-guide-desk-recommendation
decisions:
  channel: email
  channel_detail: |
    Draft 1 prepared a LinkedIn connection note, an email, and a phone
    script, following the general connection+email+phone default. The A2
    fact-check found the accommodation-referral segment's own
    approach_sequencing specifies only two steps, "Email on 23 September"
    and "Confirm each pass by reply within the hour" — no LinkedIn note,
    no phone follow-up. From Draft 2 onward the channel is email only,
    sent 23 September, per the segment's plan block. His phone number
    stays on the roster for any follow-up a human reviewer adds; the
    segment's plan does not call for one.
  language: en-au
  angle: hinterland-guide-desk-recommendation
  subsegment: null
angle_rationale: |
  Warmth is cold: the dispatcher prefetch found no prior correspondence
  with Christian Wachter or Dorsett Gold Coast on any account, so the
  message opens with his situation rather than a fabricated relationship.

  The segment's plan block frames this contact type around a desk
  recommending what its own staff have seen (usp chosen-not-advertised),
  delivered as a family pass rather than the free-ticket giveaway used
  for the organiser segments. accommodation-referral's first_ask puts the
  public Eventbrite link in the first message itself, since the only
  thing held back for the reply is the pass itself, not a public price.

  The profile's one behavioural hook is concrete and traceable: Dorsett
  Gold Coast's own website publishes a hinterland day-trip guide covering
  Tamborine Mountain, Springbrook and Canungra, and its general marketing
  copy describes a concierge that gives guests "insider's recommendations"
  of where to go. That is evidence of an existing recommend-local-things
  function. It is not evidence of any relationship with Rivermill, so the
  message presupposes the function rather than claiming a connection that
  does not exist.

  Geography carries the rest. The venue sits at the foot of Tamborine
  Mountain, not on it (business-overview.md; business-antifacts.md), on
  the same corridor the guide already sends guests along, 30 minutes from
  central Gold Coast (U6). No claim is made about drive time from
  Broadbeach specifically, since that figure is not sourced.

  Two challenger passes corrected the draft. Pass 1 found the channel
  plan did not match the segment's own approach_sequencing (email only,
  no LinkedIn, no phone); Pass 2 found the pass's opening-week validity
  window had been blurred with the season's longer run. Pass 3, run
  against the corrected draft, returned VERDICT: DONE with no further
  factual errors.
response_likelihood: 45
a_note: |
  Angle: Dorsett's own hinterland day-trip guide as a desk-recommendation
  hook, paired with a free family-of-four pass so the desk sees the show
  before recommending it. Channel: email only, sent 23 September, per the
  segment's approach_sequencing (the segment plan overrides the general
  connection+email+phone default; two challenger passes caught this).
  Warmth: cold, no prior correspondence found. Language: en-au.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm]
    notes: |
      First draft prepared a three-touch sequence (LinkedIn connection
