  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      I'm Christian Wachter, GM of the Dorsett Gold Coast. I don't know
      this "Historic Rivermill" or this "Priyanka Das." Cold email from
      an unknown venue, arriving my inbox two days before the thing even
      starts.

      First reaction: another unsolicited partnership pitch. I get a few
      of these a month — local operators wanting a foothold in our guest
      recommendations. Most go straight past me to whoever handles
      concierge relationships, if I even open them.

      Second read: the pitch itself is coherent. They clearly did some
      homework — they know we push our own hinterland day-trip content
      up toward Tamborine and Canungra, and they're positioning
      themselves as the thing at the bottom of that drive. That's a fair
      hook, not generic spam boilerplate.

      But the timing is a problem. Today is Tuesday 22 September. They
      say the season "opens this Thursday" — that's two days away — and
      want me to reply, wait for them to send a pass, and then somehow
      route it to a guest, all before opening night if I want to catch
      the opening-week excitement. That's an unreasonably tight
      turnaround for a GM's desk to action, especially since I'd first
      want to check this is legitimate — I've never heard of this place,
      there's no phone call, no prior relationship, just an email with a
      link.

      I also notice the offer is a bit fuzzy about what exactly I'm
      getting and for how long — "runs through to 3 October" reads like
      the whole season is on the table, which makes me wonder why the
      urgency about Thursday at all. If it runs for two weeks, what's
      the rush.

      Realistically, this sits in my inbox, I might forward it to guest
      services or the concierge team to look into "if it's legit," and
      it's unlikely I personally engage given the short notice and the
      fact I don't know these people at all.

      REPLY_PCT: 20
    fact_check:
      - claim: |
          "The season opens this Thursday 24 September and runs with
          evening shows on Fridays and Saturdays through to 3 October,"
