          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
  - type: review
    number: 3
    verdict: DONE
    in_character: |
      Circus, Mount Nathan, free family pass for four — I don't know
      this venue and I don't know this Priyanka Das. Cold email to my
      desk. First read is: is this a company trying to get a freebie
      review out of me, or an actual local partner? "Free family pass
      for four" for staff, with no strings visible in this message,
      reads plausible enough — it's a small ask, reply with a preferred
      date. Today is Tuesday, opening week runs Thursday to Sunday, so
      if I want to send someone this week I need to answer in the next
      day or so, which is tight but doable — it's a two-line reply, not
      a logistics exercise.

      The line about our own hinterland guide is a nice touch — they've
      clearly looked at our site rather than blasted a template. That
      raises it slightly above generic spam in my mind.

      Whether I personally reply: this is the kind of email that gets
      forwarded to guest services or marketing rather than answered by
      the GM directly, and plenty of these partnership pitches just sit
      in the inbox. I might glance at it, think "sure, why not, free
      tickets for the team to check out," and either reply myself in
      thirty seconds or flick it to my front-desk team lead to handle.
      It's low-risk and low-effort to respond to.

      REPLY_PCT: 55
