      file, or business-antifacts.md.
    revision_note: |
      Dropped the LinkedIn note and the phone script. Channel narrowed
      to a single email, sent 23 September, per the segment's own
      approach_sequencing. This also resolves the role-play's dating
      objection: a note waiting on LinkedIn acceptance, or 4–5 days,
      would land after half the season had run.
