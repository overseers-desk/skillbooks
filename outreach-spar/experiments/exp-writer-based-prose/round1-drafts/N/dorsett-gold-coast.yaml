          circus at the bottom of that drive, for the weeks your guests
          are asking what to do with their children.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
        director_note: Superseded — see revision_note on round 2.
      - channel: phone
        text: Follow-up call if no email reply within 3 days.
        script:
          - point: Opening
            text: "Hi, is that Christian? It's Priyanka calling from Historic Rivermill at Mount Nathan — I sent an email a few days ago about a free family pass to our circus season."
          - point: Context
            text: "We've got a big top up on the lawn through until early October, and I wanted your desk to see it firsthand before recommending it to guests."
          - point: Ask
            text: "Would a pass for four work for you or your team this week or next? I can hold a show and send the details straight after."
          - point: If unavailable
            text: "No trouble — could you point me to whoever handles guest recommendations, or should I try email again?"
        director_note: Superseded — segment plan calls for no phone follow-up.
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      A LinkedIn note from someone called Priyanka at "Historic
      Rivermill" — never heard of it. I run the desk at a 300-plus room
      hotel plugged straight into The Star and the convention centre; I
      get pitches like this weekly and most go nowhere. Reading it:
      family circus, big top, opening this week. Fine, mildly relevant —
      we already send guests hinterland-ward and get "what do we do with
      the kids" questions during school holidays, so the premise isn't a
      stretch.

      But look at the dates on this. Today is Tuesday 22 September. She
      says the season opens Thursday 24th. Her own sequence has me
      accepting a LinkedIn connection first, and only sending the actual
      email once I accept — or waiting 4 to 5 days if I don't. Four or
      five days from now is past 27 September. Half the season,
      including the whole "opening week" she's dangling, would be gone
      before her own process gets around to emailing me. That's either
      sloppy planning on her end or she doesn't expect me to accept the
      connection request quickly, in which case why lead with LinkedIn
      at all rather than just emailing a GM's public address, which I
      check daily and LinkedIn I don't.

      If I happen to see the LinkedIn note today and reply today, it's
      workable — there's a live email address and a real ask. If I'm
      slow (and I usually am with cold LinkedIn notes), the pass offer
      is stale before it reaches me. I don't love being pitched as
      "before we ask you to recommend it," which reads a little
      presumptuous, but it's honest about what she wants. No price, no
      discount code, nothing weird. It's a plausible, low-risk ask —
      free tickets, no money changing hands, no obligation beyond
      replying.

      REPLY_PCT: 35
    fact_check:
