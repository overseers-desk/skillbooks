quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; every
     round has type and number (except final); final round contains one
     channel:email message; email address is real, not a placeholder.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft (location, pass terms, season dates, link, hinterland-guide
     hook); a_note states angle, channel, warmth, language.
     chosen_usps set on every draft and final round.
  3. Presupposition test: no sentence tells Christian something he
     already knows about himself; the hinterland-guide line is framed
     as what Rivermill observed about his property, not narrated back
     to him as news.
  4. Manufactured-connection test: the hinterland-guide claim traces to
     a specific profile data point (the Institutional context section);
     no claim of an existing relationship with Rivermill is made.
  5. Concreteness: the ask (reply with a preferred opening-week show)
     is answerable in one sentence.
  6. Band-level pattern check: not yet applicable — single contact
     processed; to be checked against the rest of the
     accommodation-referral band before the band is presented.
  7. Final round email cardinality: one channel:email message in the
     final round — passes.
