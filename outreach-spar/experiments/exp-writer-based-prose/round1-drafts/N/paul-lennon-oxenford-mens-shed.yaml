quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; every round
     carries type and number where required; final round holds exactly one
     channel: email message plus one channel: phone message; email and
     phone are real, not placeholders. Passed.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft, including the April prior-contact line, the show dates, the
     non-public framing, the pass-on instruction, the following-week
     offer, and the Buderim evidence behind the angle. chosen_usps set on
     both draft and final rounds. Passed.
  3. Presupposition test: draft 1 failed this on the April line, phrased
     as something the reader should personally recall; draft 2 fixes it by
     attributing the note to the shed, not the individual. Passed after
     revision.
  4. Manufactured-connection test: the outing-culture angle traces to the
     Buderim Facebook post; the April note traces to the courier prefetch,
     not to the profile or campaign plan, and is recorded as such above
     rather than left looking like it came from either. Passed.
  5. Concreteness: the reader can answer in one sentence, either a rough
     number to pass tickets to or a day for a following-week visit.
     Passed.
  6. Band-level pattern check: deferred to band review across all
     community-organisation drafts; this message follows the segment's
     first_ask template with contact-specific hooks (the April note, the
     Buderim evidence) rather than a bare template fill. Passed at this
     contact's level.
  7. Final round email cardinality: one channel: email message in the
     final round; the phone piece is a separate channel. Passed.
