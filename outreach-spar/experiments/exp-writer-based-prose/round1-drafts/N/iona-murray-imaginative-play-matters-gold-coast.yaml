quality_checklist: |
  1. YAML structure: root keys drawn from the §6 set; every round carries
     type and, where draft/review, number; the final round carries one
     email message and one phone message (cap is on email only); email
     address is real, not a placeholder.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; chosen_usps set on both draft rounds and the final round;
     a_note states angle, channel, warmth, language.
  3. Presupposition test: no sentence tells Iona something she already
     knows about her own programme; the register-to-attend detail is used
     to justify the ask, not recited at her.
  4. Manufactured-connection test: the Upper Coomera / register-to-attend
     hook traces to the profile; the broader hub-coordinator reach was
     deliberately not claimed, since the profile doesn't establish she'd
     forward outside this programme.
  5. Concreteness: the ask (pass it on, reply with a rough number) is
     answerable in one sentence.
  6. Band-level pattern check: not yet applicable — first contact drafted
     in this band.
  7. Final round email cardinality: one email message in the final round;
     satisfied.
  All checks pass in the final draft after the antifact correction and the
  headcount-ask softening from the A2 pass.
