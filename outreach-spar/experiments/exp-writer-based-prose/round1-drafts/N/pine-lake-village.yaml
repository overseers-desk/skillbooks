quality_checklist: |
  1. YAML structure self-check: root keys drawn from the §6 canonical set (decisions, rounds, angle_rationale, response_likelihood, a_note, fact_provenance, quality_checklist); every round has type and number; final round has exactly one channel: email message plus one channel: phone message; email address is real, not a placeholder.
  2. Coverage: fact_provenance covers every factual claim in the final draft; a_note states angle, channel, warmth and language; chosen_usps set on draft and final rounds.
  3. Presupposition test passed: no sentence tells the recipient something they already know about themselves.
  4. Manufactured-connection test passed: no claim of shared interest is made; the angle rests on segment mechanism and role fit, not invented rapport.
  5. Concreteness: the ask (reply to receive the code, or name a day for a village outing) can be answered in one sentence.
  6. Band-level pattern check deferred to R at band review; this is the first retirement-village contact processed.
  7. Final round email cardinality: one channel: email message; the phone message does not count against the cap.
