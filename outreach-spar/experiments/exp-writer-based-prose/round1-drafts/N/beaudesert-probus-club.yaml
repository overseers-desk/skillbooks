quality_checklist: |
  1. YAML structure self-check: root keys drawn from §6's canonical set
     (decisions, rounds, angle_rationale, response_likelihood, a_note,
     fact_provenance, quality_checklist). Draft and review rounds carry
     type and number; one final round is present. The final round carries
     exactly one channel: email message plus one channel: phone message —
     passes the final-round email cardinality cap. The email address is
     real (confirmed via the club's own Facebook page); the uncertain
     contact name/role and phone number are flagged in to_note and
     phone_note rather than presented as confirmed.
  2. Coverage and completeness: fact_provenance covers every factual claim
     in the final draft, including venue identity, the opening date and
     time, the offer's shape, the group-visit alternative, sender details,
     and the contact-detail caveats. chosen_usps is present on both draft
     rounds and the final round. a_note states angle, channel, warmth and
     language.
  3. Presupposition test: no sentence tells Helen something she already
     knows about herself; the message introduces the sender and the offer
     rather than narrating the club's own activities back to her.
  4. Manufactured-connection test: every claim traces to a specific source
     (business-overview.md, the showtimes file, the campaign USP registry,
     or the profile); the club's own bus-trip history is not cited as a
     manufactured connection.
  5. Concreteness: Helen can answer in one sentence — reply with rough
     numbers, or name a day for a group visit.
  6. Band-level pattern check: this file's opener (self-introduction, then
     the offer, then the ask) is consistent with the other seniors-club and
     community-organisation band contacts processed so far, without being
     identical wording.
  7. Final round email cardinality: one channel: email message in the
     final round (plus one channel: phone message, which is not capped) —
     passes.
