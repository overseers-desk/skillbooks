          email sent Tuesday 22 September calls for a follow-up call
          Wednesday morning 23 September, not Friday 25 September.
        correction: >-
          Change the header to "if no reply by Wednesday morning, 23
          September" and the opening line to "I emailed the club yesterday"
          rather than "on Tuesday."
      - claim: Historic Rivermill, Mount Nathan, cafe, horses and farm animals, Coomera River
        source: business-overview.md (U1, U3, U5, address block)
        result: verified
      - claim: The season opens at 1pm on Thursday 24 September
