        result: verified
      - claim: Opening four days, Thursday to Sunday, seats not for sale, picked by name
        source: "campaign.yaml usps.chosen-not-advertised; campaign.yaml header"
        result: verified
      - claim: No code, price, discount, Oztix link, or claim of unsold seats in the first message
