        result: verified
      - claim: The following week gives the notice a bus trip needs
        source: "campaign.yaml usps.group-visit-later"
        result: verified
      - claim: Sender name, role, organisation, email
        source: campaign.yaml sender block
        result: verified
      - claim: beaudesert-probus-club is a listed stem in segments.seniors-club
        source: campaign.yaml segments.seniors-club.stems
        result: verified
    antifact_check: >-
      No claim of stone or 100-year-old original mill buildings, no
      vineyard claim, no Tamborine Mountain location claim, and no
      assertion on whether the venue farms — none of the antifact items are
      implicated by either draft.
    revision_note: >-
      Corrected the phone follow-up timing from "Friday 25 September" to
      "Wednesday morning, 23 September," matching the campaign's
      next-morning rule, and changed the opening line from "I emailed the
      club on Tuesday" to "I emailed the club yesterday" to match a
      Wednesday call.
    notes: One revision pass; yield 5 falls in the 3-5 band, budgeted for 1 pass.
