quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; every round
     carries type and number where required; final round holds exactly one
     channel: email message plus one channel: phone message; email address
     is real, not a placeholder. Passed.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft (show dates/times, venue location, the pass being non-public,
     the Eventbrite link, and Families Magazine's own editorial fit).
     chosen_usps set on both draft and final rounds. Passed.
  3. Presupposition test: no sentence tells Chinnu something she already
     knows about herself; the school-holiday-guide and farm-feature
     references are offered as the sender's reason for writing, not
     recited back to her as fact. Passed.
  4. Manufactured-connection test: both claims of fit (the farm feature,
     the school-holiday guide) trace to specific profile evidence; no
     invented shared interest. Passed.
  5. Concreteness: Chinnu can answer in one sentence, a show and a number
     for the reader passes. Passed.
  6. Band-level pattern check: deferred to band review across all
     travel-blogger-domestic drafts; this message follows the segment's
     first_ask template with contact-specific hooks rather than a bare
     template fill. Passed at this contact's level.
  7. Final round email cardinality: one channel: email message in the
     final round; the phone piece is a separate channel. Passed.
