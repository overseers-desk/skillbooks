quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; each round has
     type and number where required; the final round carries one email
     message and one linkedin message, within the email cap; both addresses
     (LinkedIn URL, email) are real, not placeholders.
  2. Coverage: fact_provenance covers every factual claim in the final draft;
     a_note states angle, channel, warmth and language; chosen_usps present
     on the draft and final rounds.
  3. Presupposition test: passed. No sentence tells her something she already
     knows about herself; the message introduces the sender and the offer.
  4. Manufactured-connection test: passed. No claim of shared interest is
     made; her beat and TravHost inform only the subject line's
     distinguishing keyword, not a body claim.
  5. Concreteness: passed. "Reply with the show that suits" is answerable in
     one sentence.
  6. Band-level pattern check: not applicable to a single-contact file; the
     opener follows the segment's own first_ask template.
  7. Final round email cardinality: passed, one email message in the final
     round.
