        source: Campaign earned-media segment first_ask template, cross-checked against the showtimes file.
        result: verified
      - claim: Sender name, role and email (Priyanka Das, Partnerships, partnerships@rivermill.au).
        source: Campaign YAML sender block.
        result: verified
      - claim: Eventbrite link, and absence of any code, price, discount or Oztix link in the first message.
        source: Campaign YAML usps.opening-week-seats.rests_on.
        result: verified
      - claim: Venue description (cafe, horse riding, animal experiences, Coomera River, Mount Nathan hinterland).
        source: business-overview.md
        result: verified
      - claim: "The pass is not something we are offering publicly; we hold one for you to see it first."
        source: Campaign YAML usps.chosen-not-advertised framing for the earned-media segment.
        result: verified
    antifact_check: |
      Checked against business-antifacts.md: no stone-building or 100-year
      original-structure claim, no vineyard, no Tamborine Mountain location,
      no claim on the farming question. None of these appear in the draft.
    revision_note: |
      No revision made. The fact-check found no errors, so nothing in the
      wording changed. The role-play raised a genuine timing and distance
      mismatch, not a factual one: the segment's first_ask template carries no
      travel-support variant to draw on, so the concern is reflected in a
      lower response_likelihood rather than in a rewritten message.
    notes: Single pass; yield 11 falls in the "yield >= 6, up to 3 passes" band, but the fact-check found nothing to revise, so one pass stands.
