quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; both rounds carry
     type and number where required; final round has exactly one
     channel: email message plus one channel: phone message; addresses are
     real, not placeholders. Passed.
  2. Coverage: fact_provenance covers every factual claim in the final draft
     (venue description, show count, Thursday/Sunday times, chosen-not-
     advertised framing, reply mechanic, outing fallback, contact details);
     a_note states angle, channel, warmth and language; chosen_usps present
     on both the draft and final rounds. Passed.
  3. Presupposition test: challenger's pointing list found no dangling
     reference; every claim is either new or grounded in the same message.
     Passed.
  4. Manufactured-connection test: no claim of shared interest is made; the
     only claim about the recipient is the buyer-role fit already
     established in the profile. Passed.
  5. Concreteness: the ask (reply with a show and a rough number) is
     answerable in one sentence. Passed.
  6. Band-level pattern check: not applicable to a single-contact file;
     defer to the band-level review when the retirement-village band is
     assembled.
  7. Final round email cardinality: one channel: email message in the final
     round (plus one channel: phone message, which is not counted). Passed.
