        correction: Changed to "(if no reply by the next morning)" to match the segment's approach_sequencing, which specifies phoning the next morning, not waiting three days.
    antifact_check: |
      Checked against business-antifacts.md: no stone-building, vineyard,
      100-year-original-building, or Tamborine Mountain claims present.
    revision_note: |
      Challenger raised four points; sorted before revising: (1) answer in
      this email — the unattributed "your Buderim trip" line reads as
      unsettling familiarity from a stranger, fixed by naming the source
      (their own Facebook page). (1) factual error, fixed regardless of
      channel — the phone script's three-day wait contradicted
      approach_sequencing's next-morning call; corrected. (2) left for the
      reply — the timing-tightness question (two days to circulate before
      Thursday) is not blocking; the persona would still reply and can
      raise flexibility then, and the email already states the offer runs
      through Sunday. (3) no change needed — the phone script not being
      referenced in the email is normal multi-channel practice, not a
      flaw.
    notes: One pass; yield 4 falls in the "yield 3–5: 1 pass" band.
