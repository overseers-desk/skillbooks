# Contact: Paul Lennon | Oxenford Men's Shed Inc
# Channel: email + phone
# Language: en-au
# Angle: chosen-not-advertised / nothing-to-organise / group-visit-later (community-organisation)

decisions:
  channel: email
  channel_detail: Email primary; phone follow-up the next morning if no reply.
  language: en
  angle: chosen-not-advertised+nothing-to-organise+group-visit-later
  subsegment: community-organisation
angle_rationale: |
  Warmth is "prior contact": the courier prefetch found a one-way touchpoint,
  2026-04-09, from partnerships@rivermill.au to oxenfordmensshed@gmail.com,
  no reply on record. The message names this in one plain line, without
  apology or repeating the earlier ask, per SPAR-A §4.1 and the campaign's
  a_author instruction. The topic differs enough from the April note (a
  general group-outing overture versus this specific circus offer) that a
  fresh subject line is used rather than reply-on-thread, per §4.1.1.
  The profile flags that Paul Lennon's presidency is unconfirmed (the
  shed's website as of March 2026 names Keith Ward as President). The
  roster email is the shed's shared inbox, not a personal address, so
  whoever currently handles it will see the note. Paul is addressed by
  name, as the listed contact, without asserting or referencing a title.
  USPs chosen from the community-organisation plan block: chosen-not-
  advertised (the seats aren't on sale, a small allocation for the shed),
  nothing-to-organise (forward to members and families, nothing to
  arrange), and group-visit-later (a proper outing the following week,
  enough notice for a bus). These fit the profile's strongest evidence
  point: the confirmed Buderim Men's Shed bus trip, direct proof the shed
  already runs group excursions.
response_likelihood: 65
a_note: |
  Angle: chosen-not-advertised + nothing-to-organise + group-visit-later,
  built on the shed's confirmed Buderim bus-trip history. Channel: email
  to the shed's shared inbox, phone follow-up to Paul Lennon's own number
  the next morning if no reply. Warmth: prior contact (one-way April
  outreach, no reply, named in one line). Language: en-au. Note: Paul's
  presidency is unconfirmed per profile; addressed by name only, no title
  asserted, so a title change since profile date doesn't misfire.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, nothing-to-organise, group-visit-later]
    notes: |
      First draft. Element order a→b→c (intro, ask, evidence) per §4.5.
      No code, price, or Eventbrite link in the first message, per the
      campaign's a_author instruction.
    messages:
      - channel: email
        to: oxenfordmensshed@gmail.com
        subject: Free circus seats for Oxenford Men's Shed this week
        body: |
          Hi Paul,

          I'm Priyanka Das from Partnerships at Historic Rivermill, the heritage riverside venue at Mount Nathan. Someone from our team wrote to the shed's email back in April about a group outing here and didn't hear back, so this is a fresh note rather than a repeat of that one.

          WANTED – A Cirque Heist, a family circus in a big top on our lawn, opens this Thursday 24 September and runs seven shows through to Sunday. The seats aren't for sale anywhere; I've got a small allocation set aside for Oxenford Men's Shed to pass on to your members and their families this week, free of charge.

          Reply and I'll send the booking code and link straight back for you to pass around, nothing for you to organise. If the shed would rather bring a group out together instead, the week after gives enough notice to arrange a bus, the way your Buderim trip would have.

          Either way, let me know.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
      - channel: phone
        to: "0447 667 606"
        text: Phone follow-up script, first draft.
        script:
          - point: Opening hook
            text: "Hi, is that Paul? This is Priyanka, calling from Historic Rivermill out at Mount Nathan. I sent an email through to the shed's inbox a few days back about some free circus tickets for your members this week, wanted to check it landed."
          - point: Context
            text: "It's for WANTED – A Cirque Heist, the family circus we've got running in a big top on our lawn this week. We've set aside some free seats for the shed to pass on to members and their families."
          - point: Ask
            text: "Would that suit, passing tickets around this week, or would the shed rather come out together as a group? If it's a group visit, the following week gives us enough notice to sort a bus."
          - point: Close
            text: "Happy to send the details again to whichever email's easiest, and I'll get the booking code straight over once I hear back."
        phone_note: "Draft header said 3 days; corrected to next-morning in review round to match approach_sequencing."
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      I don't know this Priyanka or Historic Rivermill, never heard of
      either. First thing that catches my eye: she says someone from her
      team wrote to us in April and we didn't reply. I'd want to check
      that's true before I take the rest of the email at face value, but
      if it is true, fair enough, that's a reasonable way to open a second
      attempt rather than pretend it's the first.

      The "your Buderim trip" line is odd. I haven't told this woman about
      our bus trip to Buderim Men's Shed. She must have found that on our
      Facebook page, but she doesn't say so; it reads like she already
      knows me, and that's a bit unsettling from a stranger. It doesn't
      stop me replying, but I'd wonder how she knows that and might ask.

      The offer itself is plausible and appealing: free circus tickets for
      members and their families, nothing to organise, just forward a
      code. That's an easy yes to consider. The timing is tight, though:
      today's Tuesday, the show opens Thursday. If I want to actually get
      this out to members before the show, that's two days to reply, get
      the code, and circulate it before people can act on it for the first
      few shows. It's do-able for the later shows in the run (Saturday,
      Sunday), less so for Thursday itself, and she does flag that the
      offer runs right through Sunday, so it's realistic for at least
      three of the four days.

      Nothing here stops me replying outright. I'd ask, before committing
      to a number, whether the seats are only good for the days listed or
      if there's any flexibility, and I might ask how she came across our
      Buderim trip.

      REPLY_PCT: 65
