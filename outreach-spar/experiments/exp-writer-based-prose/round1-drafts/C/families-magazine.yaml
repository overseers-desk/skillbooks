quality_checklist: |
  1. YAML structure: root keys drawn from the §6 canonical set; every round has type and number; final round has exactly one channel: email message plus one channel: phone message; email address is real, not a placeholder. Passed.
  2. Coverage: fact_provenance covers every factual claim in the final draft; chosen_usps set on both the draft and final rounds. Passed.
  3. Presupposition test: pointing list run by the challenger (A2 Step 1) found no "nowhere" cases; every referent is introduced before use. Passed.
  4. Manufactured-connection test: both recipient-specific claims (the school-holiday guide, the giveaway-selling advertise page) trace to the profile document, not invented. Passed.
  5. Concreteness: the ask ("reply with the show that suits you") is answerable in one sentence. Passed.
  6. Band-level pattern check: not run here (single-contact draft); to be checked against the rest of the travel-blogger-domestic band before the band is presented for review.
  7. Final round email cardinality: one channel: email message in the final round (plus one channel: phone message, which does not count against the cap). Passed.
