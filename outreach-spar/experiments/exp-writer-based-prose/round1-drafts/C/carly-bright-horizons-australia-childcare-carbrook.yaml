quality_checklist: |
  1. YAML self-check: root keys drawn from §6's canonical set; every round
  carries type and number (final round's number omitted per skeleton);
  one email message cap does not apply (no email messages in this file);
  phone number is real, not a placeholder.
  2. Coverage: fact_provenance covers every factual claim in the final
  script; chosen_usps set on both draft rounds and the final round;
  a_note summarises angle, channel, warmth, language.
  3. Presupposition test: no sentence tells Carly something she already
  knows about herself; the pointing list in the A2 log found no dangling
  references, appropriate for a cold first contact.
  4. Manufactured-connection test: no claim of shared interest is made;
  the "picked by name" framing is a USP claim, not a fabricated personal
  connection.
  5. Concreteness: the ask (a day between 30 September and 4 October, plus
  a rough headcount) is answerable in one sentence.
  6. Band-level pattern check: not yet applicable — first contact drafted
  in this band; to be re-checked once sibling segment drafts exist.
  7. Final round email cardinality: not applicable, no email message in
  this file.
