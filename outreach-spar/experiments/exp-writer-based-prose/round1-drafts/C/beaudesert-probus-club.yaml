quality_checklist: |
  1. YAML structure self-check: root keys drawn from the §6 canonical set; both draft and review rounds carry type and number; the final round has exactly one channel: email message plus one phone message; no placeholder addresses. Passed.
  2. Coverage and completeness: fact_provenance covers every factual claim in the final draft; a_note states angle, channel, warmth and language. Passed.
  3. Presupposition test: A2's pointing list found no unresolved "nowhere" cases. Passed.
  4. Manufactured-connection test: every claim of fit (outings capacity, member channel) traces to the profile's dated bus-trip and Facebook evidence, not to an invented interest. Passed.
  5. Concreteness: the ask (reply with a rough member count) is answerable in one sentence. Passed.
  6. Band-level pattern check: single-contact file, not applicable at this stage; deferred to the band-level review after this band is drafted.
  7. Final round email cardinality: one email message in the final round, one phone message. Passed.
