# Contact: Helen Parnell, Secretary, Beaudesert Probus Club
# Channel: email + phone
# Language: en
# Angle: club-already-circulates

decisions:
  channel: email
  channel_detail: Email first. Phone follow-up next morning if no reply, per the campaign's approach_sequencing.
  language: en
  angle: club-already-circulates

angle_rationale: |
  The profile's strongest evidence is that Beaudesert Probus already runs the mechanism this offer needs. A dated 2025 bus trip (the Beaudesert Tramway line) shows the club organises group outings. A live Facebook page and a monthly meeting with a guest-speaker slot show it has a working channel to members. That licenses nothing-to-organise concretely: this club is already equipped to pass something on, not being asked to build the capability from scratch. chosen-not-advertised and big-top-at-a-heritage-farm add the picture and the reason these seats are not a discount code. group-visit-later is offered as the secondary path, since the bus-trip evidence shows this club already plans outings, so a week's more notice for a proper group visit is a real fit rather than a generic add-on.

  Warmth is cold. IMAP search across every mailbox found no prior correspondence with beauyprobus@gmail.com or with Helen Parnell or Beaudesert Probus Club by name. The profile records the club's own dated conduct with Probus generally, not any prior dealing with Rivermill, so there is no earlier touchpoint to name.

  Two open items sit outside drafting and belong to the human reviewer. The contact name "Helen Parnell" rests on a single uncorroborated directory listing. Three different phone numbers were found across sources with none confirmed; the roster's 0417 794 873 is used because it is the number of record, and the phone script carries a caution note about the other two.

response_likelihood: 70
a_note: Angle club-already-circulates (nothing-to-organise, chosen-not-advertised, big-top-at-a-heritage-farm, group-visit-later). Channel email + phone. Warmth cold, no prior correspondence found. Language en. Challenger verdict DONE, no revisions; response_likelihood 70% reflects a strong, low-friction ask to an organisation with demonstrated capacity to circulate it, offset by cold warmth and unresolved contact-detail uncertainty.

rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, nothing-to-organise, opening-week-seats, big-top-at-a-heritage-farm, group-visit-later, credentials-on-request]
    notes: A1 draft, written to the profile's outings-and-channel evidence and the campaign's cold-open rules (no code, no price, no "unsold seats" framing).
    messages:
      - channel: email
        to: beauyprobus@gmail.com
        subject: Free circus seats for Beaudesert Probus, this week only
        body: |
          Hi Helen,

          I'm Priyanka Das, Partnerships at Historic Rivermill, the heritage riverside venue at Mount Nathan. We've got a family circus, WANTED – A Cirque Heist, opening in a big top on our lawn this Thursday 24 September and running through to Sunday 27th.

          I have free opening-week seats set aside for Beaudesert Probus Club, for your members and their grandchildren to use. They're not on sale anywhere, the club was picked by name from the local groups we wanted to have in for opening week. The daytime sessions in that window are Thursday at 1:00pm and Sunday at 11:00am and 2:00pm.

          If that suits, reply and let me know roughly how many, and I'll send you the booking code and link to pass on to your members. They're for the club's own people to book, not for posting publicly.

          If the committee would rather bring a group out properly, the week after opening suits that better. Tell me a day and I'll come back to you on holding seats.

          Happy to send our public liability details and the operator's insurance if that helps you put it to the committee.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
        director_note: Contact name and role rest on a single uncorroborated directory citation (profile p_note). Reasonable confidence, not independently verified.
      - channel: phone
        to: "0417 794 873"
        text: Follow-up call, next morning, if no email reply. Two other phone numbers were found for this contact elsewhere and left unresolved (profile p_note); verify recognition early in the call.
        script:
          - point: Opening
            text: "Hi, is that Beaudesert Probus Club? My name's Priyanka, I'm calling from Historic Rivermill at Mount Nathan. I emailed yesterday about some free circus tickets for your members this week."
          - point: Confirm the ask
            text: "We've got a family circus in a big top on our lawn, opening tomorrow through Sunday, and I've set aside some free seats for your club to hand out to members and grandchildren. No cost, just need a rough headcount from you so I know how many to hold."
          - point: If they didn't see the email
            text: "No problem, I can read you the details now, or resend it while we're talking."
          - point: Close
            text: "If a number works for you today or tomorrow, I'll send the booking code straight through."
        phone_note: Number is the roster's number of record. Two other numbers found for this contact elsewhere remain unconfirmed (profile p_note).

  - type: review
    number: 1
    verdict: DONE
    in_character: |
      Reads as addressed to her club specifically, not a mass blast, since the club is named correctly and the address matches the club's own Facebook contact block. Two days' notice is short, but the ask is only to forward a code, not to organise anything, which eases that concern. The unprompted offer of public liability details reads as a proper business, not a pressure sell. Would likely reply, at minimum to ask a question, rather than let it go unanswered.
