quality_checklist: |
  1. YAML structure: root keys drawn from the §6 canonical set; every round
     carries type and number where required; the final round holds one
     email message and one phone message, within the one-email cap.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; chosen_usps is set on every draft and final round.
  3. Presupposition test: passed at A2 pass 1; the pointing list found no
     "nowhere" cases.
  4. Manufactured-connection test: every claim of fit traces to the profile
     (The Well, Upper Coomera, northern catchment) or the campaign USP
     registry; no claim rests on the untested hub-coordinator role.
  5. Concreteness: the recipient can answer in one sentence, a seat count
     for opening week or a day for a group visit next week.
  6. Band-level pattern check: not run here, single-contact file; flagged
     for the human reviewing the mothers-group band as a whole.
  7. Final round email cardinality: one email message in the final round;
     the phone message is a second channel, not a second email.
