quality_checklist: |
  Root keys and round structure drawn from SPAR-A §6; every draft and
  review round carries type and number; the final round carries exactly
  one email message (cap is on emails only, multi-channel finals are
  fine) alongside the linkedin and phone pieces. Coverage: fact_provenance
  covers every factual claim carried into the final draft (location, show
  dates, evening sessions, pass window, ticket link, phone timing, sender
  identity); chosen_usps set on every draft and final round.
  Presupposition test: passed after three revision passes, most recently
  a structural fix (email no longer gated behind LinkedIn acceptance)
  rather than a wording fix. Manufactured-connection test: the angle
  (Dorsett's own published hinterland day-trip guide and concierge
  function) is traceable to the profile's Institutional context section;
  no claim of shared interest goes beyond what the profile states.
  Concreteness: the recipient can answer "which day, Thursday to Sunday"
  in one sentence. Antifact check: no stone buildings, no 100-year timber
  structures, no vineyard, no Tamborine Mountain placement, no farming
  claim, no code or price in the first touch, no suggestion seats are
  unsold. One judgment call recorded in review round 2: C2's fact-check
  authority (campaign YAML) does not carry the per-contact dispatcher
  instruction that authorised the LinkedIn+email+phone sequence under
  SPAR-A §4.2; treated as a visibility gap in C2, not a drafting error.
