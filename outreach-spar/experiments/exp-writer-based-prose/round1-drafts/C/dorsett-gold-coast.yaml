decisions:
  channel: email
  channel_detail: |
    Roster carries LinkedIn, email and phone, so per SPAR-A §4.2 three pieces
    are prepared: a LinkedIn connection note, an email, and a phone
    follow-up. The LinkedIn note and the email send the same day; the email
    is not gated on the connection being accepted, since the pass it carries
    expires Sunday 27 September and a multi-day acceptance wait risked the
    email landing after the offer closed (raised in A2 pass 3). Phone
    follows 1 day after the email if there is no reply, matching the
    campaign's secondary_channel.wait_days.
  language: en
  angle: hinterland-concierge-fit

angle_rationale: |
  Warmth is cold: the IMAP prefetch found no prior correspondence with this
  address, and the profile records no earlier dealing with Historic
  Rivermill, so the opener carries no false familiarity.

  The profile's strongest behavioural-fit evidence is that Dorsett Gold
  Coast already publishes its own hinterland day-trip guide (Tamborine,
  Springbrook, Canungra) and markets a concierge function built to answer
  "where should we go" questions from guests. No named partner appears in
  that guide and no referral habit is proven, so the angle sits at
  guest-throughput and existing day-trip content, not at an established
  cross-referral relationship. The draft does not narrate this research
  back to Wachter; it presupposes his world by shaping the ask for a desk
  that already fields this question, without saying so.

  The ask is a firsthand-experience pass for the desk, not free public
  tickets. Guests book and pay through the public Eventbrite listing; the
  message states this plainly rather than implying free entry for anyone
  but the pass-holders. No code appears in the first message, consistent
  with the opening-week-seats USP's rests_on.

response_likelihood: 45
a_note: |
  Angle: hinterland-concierge fit (Dorsett's own published day-trip guide
  and concierge function, presupposed rather than narrated). Channel:
  LinkedIn connection note + email, sent same day, phone follow-up at 1 day
  no-reply. Warmth: cold, no prior correspondence found. Language: en.
  Three A2 passes used (yield 6, budget up to 3); final pass fixed a
  structural timing collision between a LinkedIn-gated email and the
  pass's four-day (Thu 24-Sun 27 Sept) validity window by sending the
  LinkedIn note and email together rather than gating the email on
  acceptance.

rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, big-top-at-a-heritage-farm]
    notes: A1 Draft 1. First pass; email timing gated on LinkedIn acceptance (or 4-5 day fallback), phone follow-up at 3 days.
    messages:
      - channel: linkedin
        to: https://www.linkedin.com/in/christian-w-7a02442a/
        text: |
          Hi Christian, I'm Priyanka from Historic Rivermill, a heritage
          riverside venue in the Gold Coast hinterland. We're running a
          family circus this month and I'd like to hold a firsthand pass
          for your desk. Keen to connect and send the details.
      - channel: email
        to: christian.wachter@dorsetthotels.com
        subject: A family pass for Dorsett guests asking about hinterland day trips
        body: |
          I'm Priyanka Das, Partnerships at Historic Rivermill (Colourful.land Pty Ltd), a heritage riverside venue at Mount Nathan in the Gold Coast hinterland, about 30 minutes from Broadbeach.

          From this Thursday 24 September we're hosting WANTED – A Cirque Heist, a family circus in a big top on our lawn on the Coomera River. Opening week runs Thursday to Sunday, and the season continues with evening shows on Fridays and Saturdays through to 3 October.

          I'd like to hold a family pass of four for your desk, so your team can see the show before pointing guests with children toward it. This pass isn't a public offer, it's for your own visit. Reply with the day that suits and I'll send the booking details.

          Guests book seats directly at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924. Evening sessions on Fridays and Saturdays may suit guests staying overnight better than a daytime show.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
        director_note: Draft 1. Email sequencing gated on LinkedIn acceptance or a 4-5 day fallback; superseded in draft 4.
      - channel: phone
        to: "+61 7 5504 1000"
        text: Follow-up call if no reply 3 days after the email (superseded; campaign sets wait_days to 1).
        script:
          - point: Opening
            text: "Hi, could I speak with Christian Wachter please? It's Priyanka Das from Historic Rivermill, calling about an email I sent through about a family circus pass for your desk."
          - point: If reaching Christian
            text: "I sent through a family pass of four for WANTED – A Cirque Heist, the circus running on our lawn at Mount Nathan through to early October. I wanted to check whether a day this week or next would suit your team to come out and see it."
          - point: Ask
            text: "Would Thursday, Friday or the weekend work, or would an evening show later in the season suit better?"
          - point: If unavailable
            text: "No trouble, I'll leave my number. Historic Rivermill, at Mount Nathan, and my email's in the message I sent through. Thanks for your time."
        phone_note: Switchboard number only; the call may need to be routed to Christian Wachter by name.

  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      I don't know Historic Rivermill or Priyanka Das. The LinkedIn note
      reads as ordinary industry outreach, low commitment, costs nothing to
      accept. The email is plausible: a heritage venue 30 minutes away, a
      family circus opening Thursday, a comp pass so my team can speak from
      firsthand experience before recommending it. That's a normal ask in
      my business.

      What stops me for a second: today is Tuesday 22 September and the
      show opens Thursday. If the email waits on LinkedIn acceptance or the
      stated 4-5 day fallback, it could land around 26-27 September, and a
      visit "this week" is nearly over by then. Nothing reads as pushy or
      like they need me to fill an empty tent. My hesitation is a practical
      scheduling question, which days the pass is actually good for, since
      the email doesn't say. I'd likely forward this to my duty manager or
      concierge team rather than organise it myself.
    fact_check:
      - claim: "I'd like to hold a family pass of four for your desk... Reply with the day that suits and I'll send the booking details."
        source: accommodation-referral segment first_ask; opening-week-seats USP rests_on
        result: correction needed
        correction: The pass must be bounded to "any show from this Thursday 24 September to Sunday" in the email; the draft stated no date bound at all.
      - claim: Venue on the Coomera River, Mount Nathan, 30 minutes from Broadbeach; opening week Thursday to Sunday; evening shows Fridays and Saturdays through 3 October; Eventbrite URL; no code/price/antifact claims
        source: business-overview.md; showtimes file; accommodation-referral first_ask; opening-week-seats rests_on
        result: verified
    revision_note: |
      Only one point required a change: the pass's date window was stated
      nowhere in the draft, so "reply with the day that suits" had nothing
      to answer against. Fixed by adding "it covers any show from this
      Thursday 24 September to Sunday" before the ask. The LinkedIn note not
      being cross-referenced in the email was raised but judged not a
      problem: the persona read the email as a fine fresh introduction on
      its own.

