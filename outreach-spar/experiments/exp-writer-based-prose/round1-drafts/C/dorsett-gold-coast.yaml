  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      Odd little LinkedIn note, low commitment, reads as standard
      tourism-partnership outreach. The email is plausible and matches the
      sort of hinterland day-trip content we already publish. The pass is a
      genuine no-strings offer, nothing fishing for a sale.

      What I'd notice: opening week is Thursday to Sunday and today's
      Tuesday, so two to five days' notice against a 300-room property I run
      is not always flexible. If I can't get out there by Sunday, the pass
      as written doesn't roll over, it's opening week only, not the evening
      shows through 3 October mentioned afterward. The question I'd put back
      isn't an objection, it's logistics: can someone on my team other than
      me use it, or is there anything later in the season. Nothing would
      stop me replying outright; the friction is purely the short runway.
    fact_check:
