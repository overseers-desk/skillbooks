          the opening-week shows, Thursday through Sunday.

          Reply with the show that suits and I'll send the booking
          details. Public tickets for the season, which runs to 4 October,
          are at [WANTED – A Cirque Heist tickets](https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924).

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
        actioned_date: null
        replied_date: null
