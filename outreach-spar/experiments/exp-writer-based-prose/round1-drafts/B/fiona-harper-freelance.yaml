quality_checklist: |
  1. YAML structure: root keys drawn from the §6 canonical set; every
     round carries type and number; the final round has one email
     message and one LinkedIn message (cardinality check passes);
     hello@fionaharper.com.au is a real, non-placeholder address.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft (venue description, show open date, opening-week span, season
     end date, ticket link, code-in-reply-only rule); a_note states
     angle, channel, warmth, language; chosen_usps present on both draft
     and final rounds.
  3. Presupposition test: no sentence tells Fiona something she already
     knows about herself; the message presents the sender's world
     (venue, offer) rather than narrating hers.
  4. Manufactured-connection test: the draft does not claim a Gold
     Coast/Scenic Rim beat or cite any profile detail she hasn't stated;
     it addresses the offer on its own terms.
  5. Concreteness: the ask ("reply with the show that suits") is
     answerable in one sentence.
  6. Band-level pattern check: not applicable to this single-contact
     draft; deferred to the band-level review across the earned-media
     segment.
  7. Final round email cardinality: one email message in the final
     round; the LinkedIn message is a separate channel, so the cap on
     emails only is respected.
