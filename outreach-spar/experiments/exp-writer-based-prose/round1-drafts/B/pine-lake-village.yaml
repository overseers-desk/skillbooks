quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; both rounds
     carry type and number; the final round has exactly one email message
     and one phone message; email address is real, not a placeholder.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; chosen_usps set on the draft and final rounds; a_note
     summarises angle, channel, warmth, language.
  3. Presupposition test: passed after revision. "seven shows", "a bus
     visit" and "the group" were ungrounded in draft 1 and are now either
     grounded earlier in the message or removed.
  4. Manufactured-connection test: no claim of shared interest beyond
     role/mechanism fit, which the profile supports directly; no
     invented personal hook.
  5. Concreteness: the recipient can answer in one sentence, a day and a
     rough number, or a plain "yes, forward it."
  6. Band-level pattern check: deferred to band-level review across the
     retirement-village segment; this file uses the segment's standard
     first_ask shape since the profile carries no contact-specific hook.
  7. Final round email cardinality: one email message in the final round;
     the phone script is a separate channel, not a second email.
