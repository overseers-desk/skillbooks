quality_checklist: |
  1. YAML structure: root keys drawn from the §6 canonical set (decisions,
     angle_rationale, response_likelihood, a_note, rounds, fact_provenance,
     quality_checklist). One final round, one message in it, channel phone
     (no email cardinality question). No placeholder contact addresses;
     "[Priyanka's number]" is a script line for the sender to fill at send
     time, not a stored contact field.
  2. Coverage: fact_provenance covers every factual claim in the final
     script. chosen_usps present on the draft and final rounds. a_note
     states angle, channel, warmth, language.
  3. Presupposition test: no sentence tells Carly something about her own
     situation she has not just been given in the same call; confirmed by
     the challenger's pointing list, no "nowhere" results.
  4. Manufactured-connection test: every claim of relevance (vacation care
     over the holidays, excursion authority) traces to the profile's
     register-level evidence, not invented.
  5. Concreteness: the ask (a day between 30 September and 4 October, and a
     headcount) can be answered in one sentence.
  6. Band-level pattern check: not yet applicable — single contact drafted;
     defer to the band review when other childrens-holiday-outing contacts
     are drafted.
  7. Final round email cardinality: not applicable, channel is phone.
