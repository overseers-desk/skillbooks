quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; every round
     has type and number; final round carries one linkedin message, one
     email message, and one phone message (cardinality check passes, the
     cap is on emails only, and there is exactly one); to/email/phone/
     LinkedIn values are real, non-placeholder contact details from the
     roster and profile. Pass.
  2. Coverage and completeness: fact_provenance covers every factual claim
     in the final draft; a_note states angle, channel, warmth, language;
     chosen_usps present on both the draft and final rounds. Pass.
  3. Presupposition test: challenger's pointing list (A2 response) returned
     zero "nowhere" instances; every referring expression in the draft is
     given within the draft itself. Pass.
  4. Manufactured-connection test: the hinterland-guide claim is traceable
     to the profile's Institutional context section (Dorsett's own
     published guide); the draft does not claim Dorsett already refers
     guests to named hinterland operators, which the profile does not
     evidence. Pass.
  5. Concreteness: the ask, a day for the pass, is answerable in one
     sentence. Pass.
  6. Band-level pattern check: not assessable from a single approach file;
     flag for the human reviewing the full accommodation-referral band
     once more contacts in this segment are drafted, to confirm this
     opener does not repeat the pattern used for other hotel-desk
     contacts in the band.
  7. Final round email cardinality: one email message in the final round;
     the linkedin and phone pieces are separate, non-email messages.
     Pass.
