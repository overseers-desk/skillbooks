    antifact_check: No claim in the draft touches business-antifacts.md (stone buildings, 100-year-old original mill structures, vineyard, "on Tamborine Mountain"). The draft says "at Mount Nathan" and describes the hinterland only as something the guest's own guide already covers, never placing Rivermill on Tamborine Mountain itself.
    revision_note: No revision needed. Challenger's pointing list returned zero "nowhere" instances (every referring expression traces to something given earlier in the same draft), and fact-check raised no correction. REPLY_PCT of 45 and the persona's own stated concerns (who exactly "your team" covers, tight timing if the connection sits unaccepted) are left for the reply, matching the pass criterion that only what would stop the reply counts.
    notes: Single pass; profile yield 6 (yield ≥6 band allows up to 3 passes, one pass sufficed).
