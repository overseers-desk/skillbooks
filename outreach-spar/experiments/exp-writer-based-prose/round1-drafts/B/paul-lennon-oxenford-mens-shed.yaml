quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; every round
     has type and number; final round carries one email message and one
     phone message (cardinality check passes, cap is on emails only);
     to-address is a real, non-placeholder address. Pass.
  2. Coverage and completeness: fact_provenance covers every factual claim
     in the final draft; a_note states angle, channel, warmth, language;
     chosen_usps present on both the draft and final rounds. Pass.
  3. Presupposition test: challenger's pointing list returned zero
     "nowhere" instances; every referring expression is given in the draft
     itself. Pass.
  4. Manufactured-connection test: the one prior-contact claim (the April
     email) is traceable to the April approach file; no claim of shared
     interest is drawn from the profile's silence (the Buderim trip is not
     cited). Pass.
  5. Concreteness: the ask, a rough headcount by reply, is answerable in
     one sentence. Pass.
  6. Band-level pattern check: not yet assessable from a single approach
     file; flag for the human reviewing the full community-organisation
     band once more contacts are drafted.
  7. Final round email cardinality: one email message in the final round;
     the phone script is a separate, non-email message. Pass.
