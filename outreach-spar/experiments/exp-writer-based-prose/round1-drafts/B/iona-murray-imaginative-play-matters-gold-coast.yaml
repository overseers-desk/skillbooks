quality_checklist: |
  1. YAML structure: root keys drawn from §6 canonical set; both rounds
     carry type and number where required; final round has exactly one
     channel:email message plus one channel:phone message; no placeholder
     addresses.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft (dates, venue, address, offerings, prior email, code mechanism);
     chosen_usps set on both draft and final rounds; a_note states angle,
     channel, warmth, language.
  3. Presupposition test: no sentence tells the recipient something about
     herself she has not already been given in the message or that is not
     an independently verifiable fact of her public role (confirmed by the
     challenger's pointing list, no "nowhere" cases).
  4. Manufactured-connection test: the hub-reach and prior-events framing
     trace to the profile's documented role and Facebook posts, not
     invented interest in farm visits.
  5. Concreteness: the ask (reply with roughly how many families) is
     answerable in one sentence.
  6. Antifact check: "heritage farm" corrected; no stone-building, no
     original-mill-building, no vineyard, no Tamborine Mountain claim.
  7. Final round email cardinality: one email message in the final round,
     satisfied.
