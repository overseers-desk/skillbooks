decisions:
  channel: linkedin+email+phone
  channel_detail: LinkedIn connection note first, email after acceptance or after 4-5 days, phone fallback if no email reply after 3 days.
  language: en-au
  angle: hinterland-concierge-fit
angle_rationale: |
  Christian Wachter is a named, verified General Manager, the profile's
  strongest-standing contact type. No prior correspondence was found on any
  mailbox and the profile records no dated conduct with Rivermill, so this
  is treated as a first approach with no relationship to reference.

  The angle rests on the profile's behavioural-fit signal: Dorsett Gold
  Coast's own website publishes a hinterland day-trip guide covering
  Tamborine Mountain, Springbrook and Canungra, and markets a concierge
  function that fields "where should I go" questions. No partner business is
  named in that guide and no proven referral habit to Rivermill exists, so
  the message claims only that the desk already answers this question, not
  that it already sends guests our way. chosen-not-advertised, opening-week-
  seats and big-top-at-a-heritage-farm are the segment's three assigned
  USPs, carrying the pass-not-a-public-offer framing, the opening-week date
  window, and the setting in one clause each.
response_likelihood: 25
a_note: Cold approach, hinterland-concierge-fit angle (chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm), LinkedIn connection note then email then phone fallback, English (Australian). Challenger rated 30%, 30%, then 20% reply likelihood across three passes; verdict DONE on pass three with no unresolved factual errors.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm]
    notes: First draft. Cold opener naming the recipient's own hinterland guide as the fit, LinkedIn connection note plus email plus phone script, no code or price in the first message.
    messages:
      - channel: linkedin
        to: https://www.linkedin.com/in/christian-w-7a02442a/
        body: |
          Hi Christian, I'm Priyanka Das from Historic Rivermill, a heritage venue at Mount Nathan. A family circus opens in our big top this week and I'd like to send your desk a pass to see it. Emailing you too, keen to connect.
      - channel: email
        to: christian.wachter@dorsetthotels.com
        subject: A pass for the Dorsett hinterland desk — the circus opens Thursday
        body: |
          Hi Christian,

          I'm Priyanka Das, Partnerships at Historic Rivermill, a heritage riverside venue at Mount Nathan, about 30 minutes from central Gold Coast. Your website's hinterland day-trip guide already sends Dorsett guests out to Tamborine Mountain, Springbrook and Canungra, so I thought your desk would want to see something new in that direction before recommending it.

          We've a family pass of four for you or your team to come and see WANTED – A Cirque Heist, a circus in a big top on our lawn, any show from this Thursday 24 September through the Sunday after, with evening shows on Fridays and Saturdays running through to 3 October. Reply with the show that suits and I'll send the booking details for your pass. Guests can book their own tickets at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          It's a proper big top on a working heritage property, animals and cafe included, so a family with an afternoon free has somewhere to go that isn't another beach day.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
      - channel: phone
        to: "+61 7 5504 1000"
        text: Follow-up call if no reply to the email after 3 days.
        script:
          - point: Opening hook
            text: "Hi, is that Christian Wachter? This is Priyanka Das from Historic Rivermill, the heritage farm venue out at Mount Nathan. I emailed you a couple of days ago about a family pass for your desk."
          - point: Ask
            text: "We've a circus running in a big top on our lawn through the school holidays, and I wanted to send you and your team a pass to come and see it, so your concierge desk has seen it before recommending it. Is that something you'd take, and is there a show this week or next that would suit?"
          - point: Close
            text: "If unavailable, offer to leave a number and email, or ask for someone else on the desk who handles this kind of thing."
        phone_note: Roster phone is the property's published reception switchboard, not a personal direct line; no personal mobile found.
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      Running a 300-plus-room hotel next to The Star and the convention
      centre, this reads as a recognisable cold-outreach pattern: LinkedIn
      note plus follow-up email. The hinterland day-trip guide callout is a
      specific, correct observation about the recipient's own site, which
      buys credibility a form letter would not. The ask itself is easy: a
      family pass of four, no cost, no commitment beyond picking a show and
      replying, and not a request to organise a group.

      Today is Tuesday, the season opens Thursday, and the window as stated
      runs through the Sunday after with more evening shows into the
      following weeks, so nothing forces action in the next 48 hours. What
      would be asked in the reply rather than a reason not to reply: which
      night works best, whether it is really free with no catch, and why the
      offer stretches across two-plus weeks rather than being tied to
      opening week specifically.

      REPLY_PCT: 30
    fact_check:
      - claim: "Any show from this Thursday 24 September through the Sunday after, with evening shows on Fridays and Saturdays running through to 3 October."
        source: campaigns/2026-09-cirque-heist-season.yaml, usps.opening-week-seats.rests_on; segments.accommodation-referral.usps (opening-week-seats framing "Any opening-week show for the pass")
        result: incorrect
        note: The opening-week-seats USP is valid for the opening-week shows only (Thursday 24-Sunday 27 September). Extending the pass into the second week's Friday/Saturday evenings reaches into territory the campaign reserves for group-visit-later, which requires the sender to separately seek the manager's allocation; it is not offered as standing availability.
        correction: Any show from Thursday 24 September to Sunday 27 September.
    antifact_check: Checked against business-antifacts.md — no stone-building, 100-year-building, vineyard, or Tamborine Mountain-location claims present.
    revision_note: |
      Persona raised more than three points, sorted per §4.6: (1) answer in
      this email — the date range overstated the offer past opening week;
      corrected to Thursday 24-Sunday 27 September, matching the segment's
      opening-week-seats framing. (2) left for the reply — whether the pass
      is genuinely free with no catch, and whether it is a padded gimmick
      versus a real trade familiarisation; the persona named these as reply
      questions, not blockers. (3) absorbed by reframing — the "why does
      this stretch across two-plus weeks" question resolves automatically
      once the date range is corrected, with no separate sentence needed.
