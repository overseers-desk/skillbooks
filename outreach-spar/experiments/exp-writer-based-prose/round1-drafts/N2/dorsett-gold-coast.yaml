    number: 3
    verdict: DONE
    in_character: |
      A LinkedIn note from an unfamiliar sender gets little day-to-day
      attention; the desk fields dozens like it. The email is what earns a
      second look, opening with something verifiable: the recipient's own
      hinterland day-trip guide does send guests to Tamborine, Springbrook
      and Canungra. The ask stays small and concrete: a family pass of four,
      pick any show Thursday to Sunday, reply with the day. Two days' notice
      for something this size, not an organised group outing, is not a
      problem.

      What remains a question rather than an objection: whether there is a
      catch, or whether it is genuinely just "come see it, then decide."
      Nothing reads as needing the recipient to fill seats. It is a small,
      well-targeted ask from a stranger organisation that most GMs would
      leave in a "maybe later" pile, not because it is flawed but because
      cold outreach mostly does not convert.

