        result: incorrect
        note: The make-a-day-of-it USP holds for daytime sessions only; the evening sessions start after the venue has closed, and S2 §2.1 confirms the kitchen's last order is 1:00 PM weekdays / 2:30 PM weekends. The draft offers any show Thursday to Sunday, which includes Friday and Saturday evening sessions, for which animals and the cafe are not available, and states the inclusion without that qualification.
