  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      A cold LinkedIn note tied to a follow-up email reads as a sales pitch
      wearing a partnership hat, but it is polite and asks for no money, so
      it does not get archived outright. The email is the stronger piece: it
      names something specific about the recipient's own site, the
      hinterland day-trip guide, which is the one thing that makes it worth
      opening rather than filing.

      It is Tuesday 22 September; the ask covers "this Thursday to Sunday",
      two days' notice for a family pass. That is workable but not something
      to action today; it sits in the inbox until there is five minutes
      spare, which on a busy Tuesday might be Thursday itself. Nothing here
      is a hard stop: no price, no code, no sense of an empty tent to fill.
      The one thing wanted before committing a family afternoon is
      practical — parking, running time, and whether a personal family visit
      counts or the desk must send a rep — but that belongs in the reply,
      not a reason to ignore the email.

      REPLY_PCT: 30
