quality_checklist: |
  1. YAML structure: root keys and round keys drawn from §6's canonical set; final round has exactly one channel:email message, plus one channel:linkedin and one channel:phone message; email address and LinkedIn URL are real, not placeholders. Passed.
  2. Coverage and completeness: fact_provenance covers every factual claim in the final draft (venue identity, pass mechanism, show dates, Eventbrite link, daytime animals/cafe detail, recipient's own hinterland guide, contact identity); a_note states angle, channel, warmth, and language; chosen_usps set on every draft and the final round. Passed.
  3. Presupposition test: the hinterland-guide reference is offered as evidence of fit, not narrated back as something Christian doesn't already know; no sentence tells him something about himself with no informational value. Passed.
  4. Manufactured-connection test: the sole claim of fit (the hinterland day-trip guide) is traceable to the profile's Institutional context section, not invented; no partner relationship or referral habit is claimed. Passed.
  5. Concreteness: Christian can answer in one sentence, naming a show day. Passed.
  6. Band-level pattern check: not applicable to a single-contact review; the opener is situational (the recipient's own published guide) rather than a template line repeated across the segment.
  7. Final round email cardinality: one channel:email message in the final round; LinkedIn and phone are separate channels. Passed.
