quality_checklist: |
  1. YAML structure self-check: root keys drawn from the §6 canonical set
     (decisions, angle_rationale, response_likelihood, a_note, rounds,
     fact_provenance, quality_checklist); every round carries type and
     number where required; the final round holds one phone message, no
     email. profile_hash intentionally omitted per instructions.
  2. Coverage: fact_provenance covers every factual claim in the final
     script (opening date, second-week window, daytime restriction, animals,
     no cost, certificate offer, direct-invite framing); a_note states
     angle, channel, warmth and language; chosen_usps present on draft and
     final rounds.
  3. Presupposition test: no sentence tells Carly something she already
     knows about her own service; the opener addresses the venue's timing
     constraint, not her circumstances.
  4. Manufactured-connection test: no claim of shared interest beyond what
     the profile supports (booking authority, vacation care, proximity);
     no invented rapport or prior relationship.
  5. Concreteness: the ask (a day in a named week, and a rough headcount) is
     answerable in one sentence.
  6. Antifact check: no stone-building, heritage-mill, vineyard or Tamborine
     Mountain claim anywhere in the script.
  7. Final round email cardinality: not applicable; the final round carries
     one phone message and no email.
