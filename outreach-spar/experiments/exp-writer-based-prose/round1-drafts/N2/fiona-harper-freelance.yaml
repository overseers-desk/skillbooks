quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; each round
     carries type and number where required; final round has exactly one
     email message and one linkedin message (cap is on email only);
     addresses are real (LinkedIn URL and verified email from the profile's
     roster_patch), not placeholders. Passed.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; chosen_usps set on both draft rounds and the final round; a_note
     states angle, channel, warmth and language. Passed.
  3. Presupposition test: no sentence tells the recipient something she
     already knows about herself; her career, TravHost, and masthead history
     are not recited back to her. Passed.
  4. Manufactured-connection test: no claim of shared interest beyond what
     the profile records (Queensland base); the message does not assert a
     family/kids beat the profile does not show. Passed.
  5. Concreteness: the recipient can answer "yes, [show]" or "no" in one
     sentence. Passed.
  6. Band-level pattern check: deferred to band-level review once other
     earned-media drafts exist; this draft's angle (venue-as-destination,
     not family-writer framing) departs from a pure copy of the segment
     template, which is the intended variation for a profile with no
     family/kids beat.
  7. Final round email cardinality: one email message in the final round;
     the LinkedIn message is a separate channel, not a second email. Passed.
