quality_checklist: |
  1. YAML structure: root keys and round keys drawn from §6's canonical set; final round has exactly one channel:email message plus one channel:phone message; email address is real, not a placeholder. Passed.
  2. Coverage and completeness: fact_provenance covers every factual claim in the final draft (venue identity, show dates and times, not-on-sale framing, reply-for-code mechanism, second-week outing); a_note states angle, channel, warmth, and language; chosen_usps set on draft and final rounds. Passed.
  3. Presupposition test: no sentence tells Corey something he already knows about himself or his village; the message presents the sender's offer, not his situation narrated back to him. Passed.
  4. Manufactured-connection test: no claim of shared interest beyond role/organisation fit, which the profile supports directly. Passed.
  5. Concreteness: Corey can answer in one sentence — reply to receive the code, or name a day for an outing. Passed.
  6. Band-level pattern check: not applicable to a single-contact review; opener is cold and situational per §4.1, consistent with the segment's other cold contacts without being templated language.
  7. Final round email cardinality: one channel:email message in the final round; the phone message is a separate channel. Passed.
