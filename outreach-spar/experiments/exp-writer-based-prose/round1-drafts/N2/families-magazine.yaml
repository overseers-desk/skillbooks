quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; draft, review and
     final rounds each carry type and number where required; final round has
     exactly one email message and one phone message (cap is on email only);
     addresses are real, not placeholders. Passed.
  2. Coverage: fact_provenance covers every factual claim in the final draft;
     chosen_usps set on the draft and final rounds; a_note states angle,
     channel, warmth and language. Passed.
  3. Presupposition test: no sentence tells the recipient something they
     already know about themselves (no narration of their giveaway practice
     or existing school-holiday guide back to them). Passed.
  4. Manufactured-connection test: the demonstrated-hosting-practice angle
     traces to two specific profile data points (the advertise page's listed
     services, the Trevena Glen Farm feature); no claim of shared interest
     invented beyond those. Passed.
  5. Concreteness: the recipient can answer "yes, [show]" or "no" in one
     sentence. Passed.
  6. Band-level pattern check: deferred to band-level review once other
     travel-blogger-domestic drafts exist; this draft's opener (self-intro,
     venue, dates) follows the segment's first_ask template as intended.
  7. Final round email cardinality: one email message in the final round;
     the phone script is a separate channel, not a second email. Passed.
