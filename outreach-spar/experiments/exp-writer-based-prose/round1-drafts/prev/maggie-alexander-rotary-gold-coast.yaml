quality_checklist: >-
  1. YAML structure self-check: root keys within §6's canonical set; every
  round carries type and number where required; final round carries one
  email message. 2. Coverage: fact_provenance covers every factual claim
  in the final draft; chosen_usps set on the draft and final rounds. 3.
  Presupposition test: no sentence tells Maggie something she already
  knows about herself; the club's outing history is used as the sender's
  reason for choosing the club, not recited back to her. 4.
  Manufactured-connection test: the fellowship/outing angle traces to the
  profile's outing-history evidence; no claim of interest in heritage
  venues, which the profile marks absent. 5. Concreteness: the ask (reply
  to get the code, or name a day for a second-week visit) is answerable
  in one sentence. 6. Band-level pattern check: not yet run at
  campaign level; single-contact draft. 7. Final round carries exactly
  one channel:email message, plus one linkedin and one phone message,
  within the cap on email messages. The A2 fact-check's inverted
  prior-dealing claim was corrected in the final draft; no other flagged
  items.
