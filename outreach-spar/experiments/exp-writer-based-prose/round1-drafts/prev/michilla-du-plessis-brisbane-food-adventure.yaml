quality_checklist: |
  1. YAML structure self-check: root keys drawn from the canonical set;
     every round has type and number (final omits number per structure);
     the final round contains exactly one channel: email message, no other
     channel available; email address is real, not a placeholder. Pass.
  2. Coverage and completeness: fact_provenance covers every factual claim
     in the final draft (venue description, dates, pass structure, ticket
     link, invitation framing); a_note states angle, channel, warmth,
     language; chosen_usps present on every draft and final round. Pass.
  3. Presupposition test: no sentence tells the recipient something she
     already knows about herself or her account; the fit is carried by the
     offer's substance, not by narrating her published history. Pass.
  4. Manufactured-connection test: no claim of shared interest beyond what
     the offer itself states; her "things to do" positioning was used to
     select the angle, not quoted back at her. Pass.
  5. Concreteness: the ask (reply naming a show) is answerable in one
     sentence. Pass.
  6. Band-level pattern check: not run at single-contact level; deferred to
     the band-level review after this segment's other contacts are drafted.
  7. Final round email cardinality: one channel: email message in the
     final round, no other channel messages present. Pass.
