quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; final round has one
     channel:email message and one channel:phone message (cap applies to email
     only); email address (imurray@playmatters.org.au) is the real roster value,
     not a placeholder.
  2. Coverage: fact_provenance covers every claim in the final draft (sender
     identity, venue description, the March email, show dates, the seat offer,
     the code mechanism, the second-week option).
  3. Presupposition test: no sentence tells Iona something she already knows
     about herself; the March-email line states our own past action, not hers.
  4. Manufactured-connection test: the profile's note on Iona's region-wide hub
     role informed angle selection only; the message does not claim she has said
     or done anything she hasn't, and does not invite her to pass the code beyond
     her own organisation's families.
  5. Concreteness: she can answer in one sentence (send the code, name a day, or
     decline).
  6. Band-level pattern check: the opener is specific to this contact's actual
     correspondence history (the March email), not a reused template line.
  7. Final round email cardinality: exactly one channel:email message in the
     final round; the phone piece is a separate channel.
