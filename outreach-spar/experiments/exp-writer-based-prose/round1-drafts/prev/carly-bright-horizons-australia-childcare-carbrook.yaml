          - point: Supporting offer
            text: "I can send our public liability certificate and the visit arrangements through as well, so you've got what you need to put it to your director. The animals and the farm are open in the morning too, so it can be more than just the show."
          - point: Close
            text: "What's the best email for me to send that to?"
