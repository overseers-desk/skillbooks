quality_checklist: >-
  YAML structure: root keys drawn from §6's canonical set; every round has
  type and number; final round carries one phone message and one email
  message (email cardinality cap satisfied). Coverage: fact_provenance
  covers every factual claim in the final draft; chosen_usps set on draft
  and final rounds. Presupposition test: no sentence tells Carly something
  she already knows about her own centre. Manufactured-connection test:
  every claim of fit (vacation care approval, excursion-booking authority)
  traces to the profile's register-sourced evidence, not invented interest.
  Concreteness: the ask (a day and a headcount) can be answered in one
  sentence. Antifact check: passed, no prohibited claims present.
