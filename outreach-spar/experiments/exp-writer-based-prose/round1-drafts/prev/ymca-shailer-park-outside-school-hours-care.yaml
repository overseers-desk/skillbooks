quality_checklist: >-
  YAML structure: root keys drawn from §6's canonical set; every round has
  type and number; final round carries one email message and one phone
  message (email cardinality cap satisfied, one channel: email item only).
  Coverage: fact_provenance covers every factual claim in the final draft;
  chosen_usps set on both draft and final rounds. Presupposition test: no
  sentence tells Jasper something he already knows about his own site (the
  site's own excursion practice is used as drafting evidence, not narrated
  back to him). Manufactured-connection test: the claim of fit (vacation
  care approval, a named coordinator with excursion authority) traces to
  the profile's register- and site-sourced evidence, not invented interest.
  Concreteness: the ask (a day and a headcount) can be answered in one
  sentence. Antifact check: one violation found in draft 1 (the "farm"
  claim) and corrected in the final; no other prohibited claims present.
  Band-level pattern check: opener structure (self-intro, then the
  free-seats context, then the second-week ask) matches the pattern used
  for other childrens-holiday-outing contacts in this band, which is
  expected within one segment's plan block; wording and the specific
  evidence cited differ per contact.
