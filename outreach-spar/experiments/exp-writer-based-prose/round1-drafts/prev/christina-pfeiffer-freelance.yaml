      - channel: email
        to: christina@travel2next.com
        subject: A circus opens at Mount Nathan this week
        body: |
          Hi Christina,

          I'm Priyanka Das, from Partnerships at Historic Rivermill, a heritage tourism venue on the Coomera River at Mount Nathan, in the Gold Coast hinterland, with a cafe, equestrian activities, farm animals and private events. From Thursday 24 September a family circus, WANTED – A Cirque Heist, opens in a big top on our lawn for the school holidays, running to Sunday 4 October.

          I have a family pass of four held in your name for any of the opening week shows: Thursday 24 September at 1pm, Friday 25 September at 4pm or 7pm, Saturday 26 September at 4pm or 7pm, or Sunday 27 September at 11am or 2pm. The pass isn't offered through any public channel. It's held in your name so you see the show before your readers do. Reply with the show that suits you and I'll hold the seats and send the booking details.

          Public tickets are at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
  - type: review
    number: 2
    verdict: DONE
    in_character: |
      Never heard of Historic Rivermill before this. First thing I notice:
      it's Tuesday, and this "opening week" pass is for Thursday, two days
      out. That's an odd amount of notice to give a journalist, either they
      don't understand how far in advance we usually plan copy, or they
      know it's short and are just hoping someone's free. I've got existing
      commitments this week, so a Thursday 1pm show or Friday evening ones
      aren't things I can just drop everything for on a whim, but weekends I
      might be able to shuffle around. The Sunday 11am or 2pm slot is
      realistically the only one I could turn around in time if I decide to
      go.

      The offer itself reads fine, a family pass of four, no strings
      stated, a heritage venue I don't know but sounds like the
      wildlife/hinterland stuff I already cover (Currumbin, Tamborine). No
      discount code dangled at me, no "hurry, seats are going" pressure, no
      request that I post anything specific. It's a plausible, low-key
      regional PR pitch, a bit generic ("A circus opens at Mount Nathan this
      week" is a flat subject line, doesn't tell me why I'd care), but not
      spammy or over-eager. The bit about "you see the show before your
      readers do" is a nice touch, makes it feel less like a mail-merge.

      My hesitation is mostly logistical: the timing is tight, I don't know
      this venue, and there's no clear ask about a story or deadline, so I
      don't know if they expect coverage or just want bums on seats. If
      Sunday works with my diary I'd probably take it and see if there's a
      piece in it, hinterland day-trip content is exactly my beat. If Sunday
      doesn't work, this lapses unanswered, same as most inbound PR pitches
      with tight turnarounds.

      REPLY_PCT: 45
