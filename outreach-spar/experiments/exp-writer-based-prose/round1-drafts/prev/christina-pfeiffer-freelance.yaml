decisions:
  channel: email
  channel_detail: LinkedIn connection note first; email after acceptance or after 5 days, whichever comes first. No phone number on file.
  language: en
  angle: chosen-not-advertised + opening-week-seats + big-top-at-a-heritage-farm
angle_rationale: |
  Warmth is cold: courier search on christina@travel2next.com and on her name
  and organisation returned no prior correspondence across any account, and
  the profile records no prior dealing with Historic Rivermill. The opener
  introduces the sender and venue rather than claiming a relationship that
  does not exist.

  Channel: LinkedIn + email, per the dispatcher's channel note and the
  roster's available fields (LinkedIn URL, verified email, no phone).
  Connection note first, email after acceptance or after 5 days.

  USPs: the earned-media plan block fixes one USP set for the whole segment,
  with no subsegment override, so all three (chosen-not-advertised,
  opening-week-seats, big-top-at-a-heritage-farm) were used as given. Her
  profile's strongest personalisation point is her dated, on-beat Gold Coast
  hinterland coverage (Currumbin Wildlife Sanctuary, Tamborine Mountain
  village, Dreamworld animal encounters, under her own byline 3 June 2026)
  and her Queensland base, which removes the travel-logistics barrier that
  limits other freelancers in this segment. Per SPAR-A §4.5, this was not
  recited back to her: the draft presents the venue's own specifics and lets
  the fit stand on its own rather than telling her what she already knows
  about her own beat.

  Revision (pass 1): the challenger's role-play was favourable, specific,
  real dates, no price or code, cleared the spam bar on inspection, but
  flagged "a heritage farm and wildlife venue" against business-antifacts.md,
  which holds the farming question open in either direction and prescribes
  describing the venue by what it offers. Revised to the antifact's own
  phrasing in both the LinkedIn note and the email. No other change: the
  parts of the draft the challenger reacted well to were left as they were.

  Revision (pass 2): the second challenger pass raised a timing concern, a
  Tuesday send for a Thursday opening leaves her with realistically only the
  Sunday 27 September slots against existing commitments earlier in the
  week, and a light tone note that the subject line ("A circus opens at
  Mount Nathan this week") does not itself say why she should care. Verdict
  was DONE; no factual errors were found on either pass, and the segment's
  fixed opening-week-only ask is not this draft's to redesign. Recorded as a
  response-likelihood factor rather than a rewrite, consistent with how the
  same short-notice constraint was handled for fiona-harper-freelance.
response_likelihood: 45
a_note: |
  Cold contact, LinkedIn connection note then email, English. Angle:
  chosen-not-advertised + opening-week-seats + big-top-at-a-heritage-farm,
  carried by her existing Gold Coast hinterland wildlife/destination beat
  and QLD base rather than narrated back to her. One revision: "heritage
  farm and wildlife venue" replaced with the antifact's prescribed
  description after pass 1 flagged it. Pass 2 verdict DONE, no factual
  errors; challenger put reply odds at 45%, held back mainly by the
  two-to-five-days' notice against her existing commitments early in the
  opening week, with the Sunday slots most realistic for her.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, opening-week-seats, big-top-at-a-heritage-farm]
    notes: |
      First draft. Followed the earned-media segment's first_ask template,
      substituting the geographic anchor for the recipient placeholder.
    messages:
      - channel: linkedin
        to: https://www.linkedin.com/in/christinapfeiffer/
        text: |
          Hi Christina, I'm Priyanka from Historic Rivermill, a heritage farm at Mount Nathan in the Gold Coast hinterland. A family circus opens in our big top this week and I have a pass of four held in your name for an opening show. Keen to connect and send details.
      - channel: email
        to: christina@travel2next.com
        subject: A circus opens at Mount Nathan this week
        body: |
          Hi Christina,

          I'm Priyanka Das, from Partnerships at Historic Rivermill, a heritage farm and wildlife venue on the Coomera River at Mount Nathan, in the Gold Coast hinterland. We run horse riding, animal experiences and a cafe on the river, and from Thursday 24 September a family circus, WANTED – A Cirque Heist, opens in a big top on our lawn for the school holidays, running to Sunday 4 October.

          I have a family pass of four held in your name for any of the opening week shows: Thursday 24 September at 1pm, Friday 25 September at 4pm or 7pm, Saturday 26 September at 4pm or 7pm, or Sunday 27 September at 11am or 2pm. The pass isn't offered through any public channel. It's held in your name so you see the show before your readers do. Reply with the show that suits you and I'll hold the seats and send the booking details.

          Public tickets are at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      A LinkedIn note from someone I've never heard of, "Priyanka from
      Historic Rivermill," saying there's a pass held in my name for a
      circus opening this week. My first instinct is mild suspicion, this
      reads like the templated influencer-outreach pitches I get several
      times a month, "we've held something in your name" is a familiar
      hook. But it's specific: a named venue, a named show, real dates, a
      real address I can look up (Mount Nathan is a place I actually cover,
      I've written about Currumbin, Tamborine, that hinterland corridor
      before). So it clears the spam bar quickly once I check.

      The ask is realistic time-wise. Today's Tuesday, the show opens
      Thursday, and there are still five days of opening-week sessions
      through Sunday the 27th to choose from, evenings and a weekend
      included. I'm QLD-based, this is a 40-minute-ish drive, no flights or
      interstate logistics, so yes, I could physically make one of these
      sessions on a few days' notice. That's the one thing that actually
      makes this offer plausible rather than performative.

      What I like: no price, no discount code dangled at me, no "help us
      fill seats" vibe, it reads as "you're invited because of who you
      are," which is the register that makes a journalist actually consider
      it rather than feel used as a marketing channel. What gives me slight
      pause: "a heritage farm and wildlife venue" is a slightly odd,
      over-eager combination of descriptors, makes me wonder exactly what
      this place is (farm? wildlife park? venue?) before I'd commit, but
      it's not a dealbreaker, just a thing I'd google before replying.

      Realistically, I get pitched a lot, and a family pass to a circus
      isn't automatically an editorial story unless I have a hook or an
      outlet interested. But the specificity, the real dates, and the fact
      I already cover this exact micro-region tips this from "delete" to
      "maybe, if I have a free evening or want to scout it for a future
      roundup."

      REPLY_PCT: 45
