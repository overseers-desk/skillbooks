          Tickets are on public sale for these shows. Separately, we're giving free seats to a handful of local organisations, and Pine Lake Village is one. I have a code that makes tickets free at any of the seven opening shows, for your residents and the families who visit them these school holidays. Reply and I'll send the code with the booking link. Nothing else to organise beyond passing it on.

