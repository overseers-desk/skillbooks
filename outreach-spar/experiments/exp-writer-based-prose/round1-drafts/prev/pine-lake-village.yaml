quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; each round has
     type and number where required; final round carries exactly one
     channel: email message plus one channel: phone message (cap is on
     emails only); no placeholder addresses.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; chosen_usps present on both draft and final rounds; a_note
     summarises angle, channel, warmth, language.
  3. Presupposition test: passed. No sentence tells Corey something he
     already knows about his own village.
  4. Manufactured-connection test: passed. No claim of shared interest
     beyond what the campaign's own USPs assert; the profile's absence of
     public statements was not filled in with invented relevance.
  5. Concreteness: passed. The ask ("reply and I'll send the code," or name
     a day for an outing) is answerable in one sentence.
  6. Band-level pattern check: deferred to R at band review (single-contact
     file).
  7. Final round email cardinality: passed, one email message in the final
     round.
  8. Antifact check: passed, no stone-building, no 100-year/original-mill
     building, no vineyard, no Tamborine Mountain claim.
