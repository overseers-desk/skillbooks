quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; every round
     has type and number; final round carries exactly one email message;
     no placeholder addresses.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; a_note states angle, channel, warmth, language; chosen_usps
     set on draft and final rounds.
  3. Presupposition test: no sentence tells the recipient something they
     already know about themselves; no reference to the Tyrone
     Russell-Smith arrangement, since it is not Lee Morgan's own dated
     conduct with us.
  4. Manufactured-connection test: proximity, rubric standing, and named
     decision-maker all trace to the profile's "Relevance assessment";
     no invented shared interest.
  5. Concreteness: the ask, "reply with the show that suits," is
     answerable in one sentence.
  6. Band-level pattern check: not yet applicable; this is not the first
     contact drafted in the accommodation-referral band, but the opener
     (self-introduction, then the concrete ask, then supporting detail)
     is not a copy of the Dorsett draft's day-trip-guide angle, and uses
     a different concrete hook (rubric exemplar, proximity) rather than a
     shared template.
  7. Final-round email cardinality: one email message in the final round;
     within the cap.
