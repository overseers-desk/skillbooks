quality_checklist: |
  1. YAML structure: root keys, round types/numbers, and message shapes
     drawn from §6's canonical set; final round carries exactly one
     channel: email message plus one channel: phone message (cap is on
     emails only). Addresses are real, not placeholders.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; a_note states angle, channel, warmth, language, and the
     challenger outcome; chosen_usps set on both draft rounds and final.
  3. Presupposition test: no sentence tells Jennifer something she
     already knows about her own group; the postcode and end-of-term
     framing are our observations, not hers restated.
  4. Manufactured-connection test: every claim of fit (postcode, church
     outreach reach, additional-needs suitability) traces to a specific
     profile data point; the profile's "no personal statements found" is
     respected, no relevance invented from silence.
  5. Concreteness: the ask ("reply and I'll send the code") is answerable
     in one sentence; the alternative ask (a day for a group visit) is
     equally concrete.
  6. Band-level pattern check: not applicable within this file; deferred
     to the band-level review once other mothers-group drafts exist.
  7. Final round email cardinality: one email message in the final round,
     satisfied.
