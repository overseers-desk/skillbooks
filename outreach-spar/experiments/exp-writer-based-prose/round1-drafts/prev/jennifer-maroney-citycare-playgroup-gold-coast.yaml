        result: fail
        note: The antifact file states the farming question is not settled in either direction and requires describing the venue by what it offers visitors, not as a farm.
        correction: "the heritage venue with a cafe, farm animals and horse riding"
      - claim: "1300 535 391 not needed here; contactable via this address"
        source: roster / profile (Jennifer Maroney's own phone number)
        result: fail
        note: This is Jennifer's own CityCare number, not Rivermill's; it has no place in the sender's signature and reads as a stray drafting artefact.
        correction: Line removed from the signature.
      - claim: Showtimes (Thursday 1pm; Friday 4pm and 7pm; Saturday 4pm and 7pm; Sunday 11am and 2pm)
        source: historicrivermill.au/data/circus.yaml
        result: verified
      - claim: Sender name and role (Priyanka Das, Partnerships)
