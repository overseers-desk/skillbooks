        result: verified
      - claim: Address and postcode (950 Beaudesert Nerang Rd, Mount Nathan QLD 4211, same postcode as Highland Park)
        source: business-overview.md; profile
        result: verified
      - claim: March prior-contact (coordinator-visit email, 2026-03-31, no recorded reply)
        source: dispatcher IMAP prefetch
        result: verified
    antifact_check: Checked against business-antifacts.md; "heritage farm" flagged and corrected, no other antifact present.
    revision_note: |
      Replaced "the heritage farm and function venue" with "the heritage
