quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; each round
     carries type and number where required; final round has exactly one
     channel: email message plus one channel: linkedin message (cap is on
     emails only); no placeholder addresses.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; chosen_usps present on draft and final rounds; a_note
     summarises angle, channel, warmth, language.
  3. Presupposition test: passed. No sentence tells her something she
     already knows about herself; her TravHost role and QLD base inform the
     geographic anchor and framing but are not narrated back to her.
  4. Manufactured-connection test: passed. No claim of shared interest
     beyond what the campaign's own USPs assert; her wildlife/adventure beat
     was deliberately not claimed as a fit.
  5. Concreteness: passed. The ask (reply with a show, or decline) is
     answerable in one sentence.
  6. Band-level pattern check: deferred to R at band review (single-contact
     file).
  7. Final round email cardinality: passed, one email message in the final
     round, plus one non-email (linkedin) message.
  8. Antifact check: passed, no stone-building, no 100-year/original-mill
     building, no vineyard, no Tamborine Mountain, no farming claim.
