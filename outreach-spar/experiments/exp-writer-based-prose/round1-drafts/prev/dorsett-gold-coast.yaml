quality_checklist: |
  1. YAML structure: root keys drawn from §6's canonical set; every round
     has type and number; final round carries exactly one email message
     (plus non-email channels); no placeholder addresses.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; a_note states angle, channel, warmth, language; chosen_usps
     set on draft and final rounds.
  3. Presupposition test: no sentence tells the recipient something they
     already know about themselves; the hinterland-guide line reflects
     back what they publish, used as a bridge to the ask, not narrated as
     "I did my research."
  4. Manufactured-connection test: the day-trip-guide claim traces to the
     profile's "Institutional context" section (Dorsett's own website);
     no invented shared interest.
  5. Concreteness: the ask, "reply with the show that suits," is
     answerable in one sentence.
  6. Band-level pattern check: not yet applicable, this is the first
     contact drafted in the accommodation-referral band.
  7. Final-round email cardinality: one email message in the final round,
     plus one linkedin_connection message; within the cap.
