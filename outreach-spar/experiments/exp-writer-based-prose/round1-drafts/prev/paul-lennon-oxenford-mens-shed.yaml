quality_checklist: |
  1. YAML structure: root keys drawn from the canonical set; draft, review
     and final rounds each carry type (and number where required); the
     final round has exactly one channel: email message plus one
     channel: phone message; email address and phone numbers are real,
     not placeholders.
  2. Coverage: fact_provenance covers every factual claim in the final
     draft; a_note states angle, channel, warmth, language; chosen_usps
     set on both draft and final rounds.
  3. Presupposition test: no sentence tells Paul something he already
     knows about himself or the shed; the outing-habit evidence is offered
     as Rivermill's reason for picking the shed, not recited back as his
     own fact.
  4. Manufactured-connection test: the angle traces to the profile's
     confirmed Buderim bus trip; no claim of a heritage or farm-tourism
     interest is made, since the profile is silent on that.
  5. Concreteness: the ask (reply with a rough number, or name a day the
     following week) is answerable in one sentence.
  6. Band-level pattern check: not run here; deferred to the band review
     across all community-organisation drafts.
  7. Final round email cardinality: one channel: email message in the
     final round; the phone message does not count against the cap.
