            text: "Hi, is this Chinnu? My name's Priyanka, I'm calling from Historic Rivermill, out at Mount Nathan. I sent you an email a couple of days ago about a family pass for our circus season, WANTED – A Cirque Heist."
          - point: Context, if needed
            text: "It's a family circus in a big top on our lawn, on now through to 4 October. I held a pass of four for you for any of the opening-week shows, and some spare passes if you wanted to run a reader giveaway."
          - point: Ask
            text: "Would that be something you'd like to do? If you give me a show that suits, I can lock the pass in today."
          - point: Close if no
            text: "No trouble at all. If it's useful later in the season, my email's on the earlier message, feel free to reach out."
  - type: review
    number: 2
    verdict: DONE
    in_character: |
      No prior relationship with the sender or venue, but the pitch does not smell
      like spam: no discount code, no "as seen on" puffery, no link-bait subject.
      A big top on a heritage riverside property at Mount Nathan, opening
      Thursday, is exactly the kind of thing covered here, and a reader giveaway
      matches an existing farm-venue feature run before (Trevena Glen, last year).
      The "picked a small number of publications" line reads as generic enough to
      assume other outlets were also approached, which is unremarkable for this
      kind of pitch. The real friction is timing: Tuesday for a Thursday opening
      leaves about 48 hours to decide, reply, and get any content live, tighter
      than the normal content-planning cycle (social posts done a few days ahead,
      next e-newsletter a week or more out). Likely outcome: take the family pass
      as an easy yes, and possibly a quick social shout-out for the reader passes
      rather than a full write-up, given the short runway. No pushy or "help us
      fill the tent" framing. Estimated reply likelihood 55%.
    fact_check:
      - claim: No code, price, discount, unsold-seats framing, feed-bag/animal-food offer, or Oztix link in the draft; no antifact-checklist claims present
        source: campaign.yaml (usps registry, a_author, a_challenger), business-antifacts.md
        result: verified
