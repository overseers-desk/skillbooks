          The opening-week-seats USP resolves this in Eventbrite's favour ("the
          code RIVERMILLFRIENDS takes the price to nil on the operator's
          Eventbrite listing ... tested by the Director on 22 September 2026"),
          and the campaign's a_challenger block bans an Oztix link outright, so
          the draft follows the campaign's most current internal decision. The
          two source documents disagree with each other on which platform sells
          the season; that conflict is unresolved on the record and is flagged
          here rather than silently picking a side.
      - claim: Venue description ("heritage riverside venue at Mount Nathan in the Gold Coast hinterland")
        source: business-overview.md; business-antifacts.md
        result: verified
    antifact_check: No stone or 100-year-old-building claim, no vineyard claim, no Tamborine Mountain location claim, consistent with business-antifacts.md.
    revision_note: No further change; draft 2 carried forward to final unchanged.
    notes: Passed. One open item flagged for the human, not fixed in the draft — see fact_provenance note on the Eventbrite/Oztix source conflict.
