          Reply with the show you would come to and I will send the booking
          details for your own pass. Public tickets for readers otherwise are at
          [the Eventbrite listing](https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924).

          Priyanka Das
