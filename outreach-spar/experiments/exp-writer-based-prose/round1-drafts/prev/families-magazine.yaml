decisions:
  channel: email
  channel_detail: Email primary, phone follow-up if no reply after 3 days (no connection channel on file).
  language: en
  angle: nothing-to-organise
  subsegment: null
angle_rationale: |
  Contact: Chinnu Sravya, Owner, Families Magazine (travel-blogger-domestic).
  Channel: email + phone, no LinkedIn on file. Language: English (en-au per campaign default).
  Primary angle is nothing-to-organise: the profile's strongest evidence is that the
  magazine's advertise page explicitly sells "competitions and giveaways" as a paid
  product, so a reader giveaway is a transaction the recipient already runs, not a
  novel ask. Supported by big-top-at-a-heritage-farm (the magazine has run a farm/
  animal-experience feature, Trevena Glen Farm, February 2025, matching the venue's
  beat) and chosen-not-advertised (the pass is by name, not a bulk send, without
  implying the tent needs filling). opening-week-seats is folded into the concrete
  ask rather than given its own sentence.
  Warmth: cold. One IMAP hit exists (Aug 2025, editor@familiesmagazine.com.au to
  marketing@rivermill.au, "Simple Contact Form") but it is unrelated in topic,
  addressed to a different mailbox, and not recorded in the profile. Per the
  campaign's a_author rule, a prior dealing is named only where the profile records
  the contact's own dated conduct with us; this one is not, so it is not referenced
  and warmth is treated as cold.
  Presupposition check: the draft does not narrate the recipient's own history back
  to them (no explicit mention of the Trevena Glen Farm piece); the fit is carried
  through the offer's substance (farm venue, giveaway format) rather than through
  research-performance language.
response_likelihood: 55
a_note: |
  Angle nothing-to-organise (reader giveaway, matches the magazine's own paid
  giveaway product) supported by big-top-at-a-heritage-farm and chosen-not-
  advertised. Channel email + phone fallback (3 days). Warmth cold. Language en.
  Two challenger passes: round 1 flagged an implicit price/scarcity line ("at this
  price"), fixed; round 2 verdict DONE, no further factual issues, response
  estimate raised from a starting 45% to 55%.
rounds:
  - type: draft
    number: 1
    chosen_usps: [chosen-not-advertised, nothing-to-organise, big-top-at-a-heritage-farm]
    notes: |
      First draft. Element order self-intro -> ask -> evidence per SPAR-A 4.5.
      Public Eventbrite link included per the wave-two rule (publisher segments
      carry the paid public link; the free code goes only in the pass-confirmation
      reply).
    messages:
      - channel: email
        to: editor@familiesmagazine.com.au
        subject: A circus giveaway for Families Magazine readers, opening Thursday
        body: |
          Hello Chinnu,

          I'm Priyanka Das, from Partnerships at Historic Rivermill, a heritage
          riverside venue at Mount Nathan in the Gold Coast hinterland.

          WANTED – A Cirque Heist, a family circus in a big top on our lawn, opens
          this Thursday 24 September and runs to Sunday 4 October.

          I have a family pass of four held in your name for any of the
          opening-week shows, and five more passes to give away to Families
          Magazine readers if you would like to run one. The seats aren't on sale
          at this price anywhere. We picked a small number of publications that
          put family outings and farm experiences in front of South East
          Queensland parents, and included Families Magazine.

          Reply with the show you would come to and I will send the booking
          details for your own pass. Public tickets for readers otherwise are at
          https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          Priyanka Das
          Partnerships, Historic Rivermill
          partnerships@rivermill.au
      - channel: phone
        to: "0437 866 869"
        text: Follow-up call if no email reply after 3 days (from 26 September).
        script:
          - point: Opening hook
            text: "Hi, is this Chinnu? My name's Priyanka, I'm calling from Historic Rivermill, out at Mount Nathan. I sent you an email a couple of days ago about a family pass for our circus season, WANTED – A Cirque Heist."
          - point: Context, if needed
            text: "It's a family circus in a big top on our lawn, on now through to 4 October. I held a pass of four for you for any of the opening-week shows, and some spare passes if you wanted to run a reader giveaway."
          - point: Ask
            text: "Would that be something you'd like to do? If you give me a show that suits, I can lock the pass in today."
          - point: Close if no
            text: "No trouble at all. If it's useful later in the season, my email's on the earlier message, feel free to reach out."
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      Reads as a legitimate pitch: named venue, real dates, a checkable Eventbrite
      link, a genuine "what's on this school holidays" item. The Tuesday-for-
      Thursday timing gives pause but the ask itself (reply with a show) takes
      thirty seconds regardless of the show date, so it is not a blocker on the
      ask. One line niggles: "the seats aren't on sale at this price anywhere"
      reads as dangling a special price on what is actually a free comp ticket,
      making the message read more like scripted sales copy. Otherwise the offer
      is clean and low-effort: a pass held in the recipient's name, spare passes
      for readers, no code demanded up front, no obligation beyond "if you would
      like to run one." Estimated reply likelihood 45%.
    fact_check:
      - claim: "The seats aren't on sale at this price anywhere."
        source: campaign.yaml prompt_appendices.a_author and usps.chosen-not-advertised.rests_on
        result: fail
        note: |
          a_author states the first message names no code and no price. The
          chosen-not-advertised USP's rests_on warns that a recipient told the
          tent is empty, or shown pricing/scarcity framing, reads the offer as a
          request to be a marketing channel. This sentence is not in the
          segment's approved first_ask template and introduces an implicit price
          reference ("at this price") the registry rules out.
        correction: "These seats aren't for sale."
      - claim: Show name, opening date (Thursday 24 September), season end date (Sunday 4 October), venue description, Eventbrite link, pass structure (four held, five to give away, reply with a show, code sent only in the follow-up)
        source: usps registry, showtimes file, business-overview.md
        result: verified
    antifact_check: No stone or 100-year-old-building claim, no vineyard claim, no Tamborine Mountain location claim. No Oztix link, no code, no discount, no showtime outside the showtimes file in the draft or phone script.
    revision_note: Replaced the flagged price/scarcity sentence with the approved chosen-not-advertised framing.
    notes: Single valid finding; one line revised, rest of the draft kept unchanged per challenger's positive reaction.
  - type: draft
    number: 2
    chosen_usps: [chosen-not-advertised, nothing-to-organise, big-top-at-a-heritage-farm]
    revision_note: "\"The seats aren't on sale at this price anywhere\" changed to \"These seats aren't for sale.\" to remove the implicit price reference; no other change."
    messages:
