quality_checklist: |
  1. YAML structure self-check: root keys drawn from the canonical set; every
     round has type and number (final omits number per structure); the final
     round contains exactly one channel: email message plus one channel: phone
     message; email address is real, not a placeholder. Pass.
  2. Coverage and completeness: fact_provenance covers every factual claim in
     the final draft (venue description, dates, pass structure, ticket link,
     not-for-sale framing); a_note states angle, channel, warmth, language;
     chosen_usps present on every draft and final round. Pass.
  3. Presupposition test: no sentence tells the recipient something they
     already know about themselves; the farm/giveaway fit is carried by the
     offer's substance, not by narrating the recipient's own published history.
     Pass.
  4. Manufactured-connection test: no claim of shared interest is asserted
     beyond what the offer itself states; the Trevena Glen Farm piece and the
     advertise page's giveaway product were used to select the angle, not
     quoted at the recipient. Pass.
  5. Concreteness: the ask (reply naming a show) is answerable in one sentence.
     Pass.
  6. Band-level pattern check: not run at single-contact level; deferred to
     the band-level review after this segment's other contacts are drafted.
  7. Final round email cardinality: one channel: email message in the final
     round; the phone script is a separate channel: phone message. Pass.
