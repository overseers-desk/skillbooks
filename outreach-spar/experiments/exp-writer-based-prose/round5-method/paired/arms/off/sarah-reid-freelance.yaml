quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Both review rounds and
  the draft round carry numbers; the final round omits one, as the method's
  skeleton does. The final round holds one email and one LinkedIn message,
  inside the one-email cap. The to-addresses are the roster's real email and the
  corrected LinkedIn URL, neither a placeholder. No profile_hash: the harness
  prepends it.

  2. Coverage. fact_provenance carries an entry for every factual claim in both
  final messages, including the seven start times added after the second review
  round and the Byron Bay anchor that appears only in the subject line. The nil
  prefetch is recorded as its own entry, since the absence of a prior-contact
  line is a claim about the record. chosen_usps is present on the draft and
  final rounds.

  3. Presupposition. The message tells her nothing about herself. The profile's
  findings on her location, her beat and her outlets shape what is offered and
  what is left unsaid rather than what is recited. Her clippings, her awards and
  her book do not appear.

  4. Manufactured connection. The body makes no claim of shared interest at all.
  The only use of her own attributes is the subject line's geographic anchor,
  which rests on the profile's Byron Bay locality. The profile's recorded
  silence on Rivermill, venues and accommodation is respected: nothing claims
  she covers them, and nothing claims she has an interest in circuses, which the
  profile evidences nowhere either.

  5. Concreteness. The ask is to name one of seven performances, and the seven
  are listed with their times, so it is answerable in one sentence. Listing them
  was the second change made after the final spar pass.

  6. Band pattern. This check failed on the post-spar draft and the final email
  was rewritten for it. Four approach files already drafted in this campaign,
  for Canungra RSL, Oak Tree Victoria Point, The Verge at Burleigh and Southport
  Day VIEW, open on the sender introducing herself and the venue in the first
  sentence, and the draft did the same. A fifth, Robina VIEW, had already been
  rewritten off that pattern for the same reason. The facts, the USPs, the ask
  and the elements are unchanged. What changed is the first move: this message
  opens with the pass itself, which suits a recipient who is being offered
  something rather than asked to circulate it, and which no message in the
  organiser segments can copy.

  7. Final-round email cardinality. One email, one LinkedIn note.
