quality_checklist: |
  1. YAML structure. Root keys drawn from the §6 set: decisions, angle_rationale,
     response_likelihood, a_note, rounds, fact_provenance, quality_checklist. The contact header
     is a comment block, not a key, since §6's vocabulary is closed and carries no contact key;
     the file's stem and parent directory are the contact and campaign attribution. Draft and
     review rounds carry number; the final round does not. No profile_hash, prepended by the
     harness. Recipient address is real, not a placeholder. No decisions.sender block, since the
     campaign default sender applies.
  2. Coverage. chosen_usps on the draft and final rounds. fact_provenance reaches every factual
     claim in the final draft, including the two claims that appear only in the phone script
     (second-week daytime show times, and the CHARC wheelchair-seating position). a_note carries
     angle, channel, warmth with its evidence, and language.
  3. Presupposition test. No sentence tells Tarmar something she already knows about herself.
     The award, the interview, the career history and the inter-village outings are all absent.
     The bus outing appears as an unexplained conditional, not as a recitation.
  4. Manufactured-connection test. The angle rests on the Form 3 VCD's bus check and her DCM
     Institute interview, both in the profile. The visiting-grandchildren framing rests on the
     school-holiday dates and the plan block's own deciding_interest, not on an assumption about
     her residents.
  5. Concreteness. The ask is answerable in one sentence: a rough number, or a day for the
     village bus.
  6. Band-level pattern check. The other stem at this organisation,
     jeff-burchell-the-verge-at-burleigh, has no approach file yet. This message takes the
     village-wide pass-on and the bus outing, leaving the social-committee angle free.
  7. Final round email cardinality. One channel:email message plus one channel:phone message.
     The cap is on emails only.
