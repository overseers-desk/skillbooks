quality_checklist: |
  1. Structure. Root keys drawn from §6's set; no profile_hash written (harness prepends
  it, issue #63). Draft and review rounds carry number; the final round carries one
  channel: email message and one channel: phone message, within the email cardinality cap.
  Addresses are live, not placeholders.

  2. Coverage. fact_provenance reaches every factual claim in the final draft, including
  the venue phone and website added at revision, and the April note. chosen_usps is on the
  draft and final rounds. a_note carries angle, channel, warmth, language and the
  challenger outcome, including which of its fact-checks were rejected and why.

  3. Presupposition. Two failures found and fixed at revision. The email's "April is the
  month your branch has least room in" told her something she knows about her own branch;
  it became "That one needs no answer; this one needs only a number", which says nothing
  about her. The phone script's "your members have grandchildren the right age" went the
  same way. What remains about the recipient is her address, her name and where Canungra
  is.

  4. Manufactured connection. Nothing claims a shared interest the profile does not carry.
  The profile is explicit that she has said nothing publicly about heritage excursions,
  tourism or outings beyond ANZAC, so the message does not suggest the branch wants an
  outing; the group-visit line is offered as an alternative, not attributed to her. The
  ANZAC Day record is not recited back at her. "the grandchildren" was cut because the
  profile's age skew is an inference about members, not a record of them.

  5. Concreteness. The ask is answerable in one sentence: a number, or a day for a group.

  6. Band pattern. The opener introduces the sender and the big top before anything else,
  which is the campaign's shape for this wave; the recipient-specific element is the
  subject line's organisation name and the April reference, neither of which repeats in
  another file in this segment.

  7. Final round email cardinality. One email, one phone script. Passes.
