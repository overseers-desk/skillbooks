quality_checklist: |
  1. Structure. Root keys from §6's set. Both non-final rounds carry number.
     The final round holds exactly one email message, plus one LinkedIn and one
     phone message, which the email-only cap permits. The addresses are the
     verified ones from the roster, not placeholders.
  2. Coverage. fact_provenance covers every factual claim in the final draft:
     the seven show times, the show and operator, the free seats, the
     no-outing shape, the later-visit alternative, the pass-on wording, the
     venue description and the contact details. chosen_usps is on the draft
     and final rounds. a_note carries angle, channel, warmth, language, the
     sequencing departure and the LinkedIn caveat.
  3. Presupposition. No sentence tells Megan Lia anything about her own
     village. The profile's Form 3 findings shape the ask rather than appear
     in it.
  4. Manufactured connection. No claim of shared interest is made. The only
     inference about her world is that residents have families visiting in
     the school holidays, which is the plan block's stated deciding interest,
     not an attribution to her.
  5. Concreteness. The ask is a rough number, answerable in one sentence. The
     alternative ask is a day, likewise.
  6. Band pattern. The opener leads with the sender's own introduction and
     the big top, then the ask. Where other messages in this band open the
     same way, vary this one before sending.
  7. Final email cardinality. One email in the final round.
