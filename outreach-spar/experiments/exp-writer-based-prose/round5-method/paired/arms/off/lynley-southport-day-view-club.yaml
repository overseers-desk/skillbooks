quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Draft and review rounds
  carry numbers; the final round omits one, as the method's skeleton does. The
  final round holds one email message and one phone message, inside the
  one-email cap. The to-address is the club's real roster address. No
  profile_hash: the harness prepends it.

  2. Coverage. fact_provenance carries an entry for every factual claim in the
  final email and the phone script, including the two that appear only in the
  caller's notes (parking, and CHARC's unstated accessibility position).
  chosen_usps is present on the draft and final rounds.

  3. Presupposition. The message tells her nothing about her own club. The
  profile's findings on its lunch culture, its age profile and its meeting cycle
  shape what is asked rather than what is recited. The one sentence that could
  have narrated her world back to her, about the third-Wednesday meeting falling
  outside the season, was cut for that reason.

  4. Manufactured connection. The only claim touching her members is that the
  tickets suit grandchildren and families, which rests on the profile's
  confirmed 55-to-80-plus membership and on the segment plan block's own framing.
  The profile is silent on heritage venues and rural outings, and the draft
  claims no interest in either.

  5. Concreteness. The ask is a rough number, answerable in one sentence, which
  is the plan block's message_goal exactly.

  6. Band pattern. The opener leads with the sender's own introduction and a
  dated prior approach, a shape no other message in this band can copy, since
  the prior approach is particular to this contact.

  7. Final-round email cardinality. One email, one phone script.
