quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Draft and review rounds
  carry numbers; the final round omits one, as the method's skeleton does. The
  final round holds one email message and one phone message, inside the
  one-email cap. The to-address is the club's real roster address. No
  profile_hash: the harness prepends it.

  2. Coverage. fact_provenance carries an entry for every factual claim in the
  final email and the phone script, including the three that appear only in the
  caller's notes (parking, the role discrepancy, and CHARC's unstated
  accessibility position). chosen_usps is present on the draft and final rounds.

  3. Presupposition. The message tells her nothing about her own club. The
  profile's findings on its outing culture, its age profile and its meeting
  cycle shape what is asked rather than what is recited. The sentence that could
  have narrated her world back to her, about the first-Wednesday meeting falling
  outside the season, is reduced to one clause saying this need not wait for a
  meeting.

  4. Manufactured connection. The only claim touching her members is that the
  tickets suit grandchildren and families, which rests on the profile's
  confirmed 55-to-80-plus membership and on the segment plan block's own
  framing. The profile is silent on heritage venues and rural outings, and the
  draft claims no interest in either. It also records no statement by Jennifer
  on any subject, and nothing in the message attributes a view to her.

  5. Concreteness. The ask is a rough number, answerable in one sentence, which
  is the plan block's message_goal exactly.

  6. Band pattern. This check failed on the post-spar draft and the final email
  was rewritten for it. The other VIEW club in this band, Southport Day, had
  already been drafted, and the two openers had converged: both introduced the
  sender in the first sentence, both then gave the unanswered April approach,
  and both third paragraphs began with a circus company putting a big top up on
  our lawn for the school holidays. Two secretaries of neighbouring clubs in the
  same national organisation, who plausibly compare notes, would have read one
  letter with the names swapped. The facts, the USPs, the ask and the element
  order are unchanged. What changed is the first move: this message opens with
  the tickets and with the fact that hers is the only name we hold for the club,
  which no other message in the band can copy, because it comes from this
  contact's unsettled office. The circus sentence is recast around the show
  rather than around the company.

  7. Final-round email cardinality. One email, one phone script.
