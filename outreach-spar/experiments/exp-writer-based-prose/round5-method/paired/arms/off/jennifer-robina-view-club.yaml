profile_hash: sha256:db412ae99ba4bbaeca77b07cb0f175dcb47d6a014d5823412091e8fa738466d2
# Contact:  Jennifer, Robina VIEW Club (community-organisation)
# Channel:  Email first touch, phone follow-up the next morning if no reply
# Language: en-au
# Angle:    Pass-it-on. Free tickets for members to hand to grandchildren, with
#           nothing for the club to arrange inside the four-day window.
decisions:
  channel: email
  channel_detail: |
    Email plus phone, no platform channel on the roster, so SPAR-A 4.2 gives
    email first and a phone follow-up. The campaign's approach_sequencing sets
    that call for the morning after the email, which is Thursday 24 September,
    with the first performance that afternoon. The roster number is a mobile
    rather than a club line, so the follow-up reaches a person rather than an
    unattended handset between monthly meetings.

    New subject rather than a reply on the April thread. SPAR-A 4.1.1 wants a
    current thread on a compatible topic. The April message is five and a half
    months old, was never answered, concerns a group outing rather than the
    circus, and went out under a different person's name. Threading a four-day
    offer onto it would bury the ask under a stale subject.
  language: en-au
  angle: pass-it-on-nothing-to-organise
angle_rationale: |
  Warmth is prior contact, one way, unanswered. The dispatcher prefetch returns
  two hits across all five mail accounts. The first is an outbound message of
  9 April 2026, "Group outing at Historic Rivermill — Robina VIEW Club", sent by
  Lia Movsisyan from partnerships@rivermill.au to robinaviewclub1@gmail.com and
  filed in the admin account's Partnerships folder. The second, dated 20 April,
  is an unsent draft in that account's Drafts folder addressed to the same
  address. A draft is our own text, and its "Re:" prefix is not evidence that
  the club wrote back. No inbound message from the club address exists anywhere.
  Both directions were searched on the club address in one query, so the absence
  is the result of a search designed for the inbound message rather than an
  inference from a hit on something else. The campaign's a_author appendix
  requires that fact in one plain line naming its subject.

  The profile's evidenced facts are a confirmed outing culture at external
  venues (High Tea at Royal Pines, a Christmas party at Club Robina, themed
  country and western events), a named and active committee, and a membership of
  women typically aged 55 to 80 and over. The profile records no statements from
  Jennifer on any subject, and none from the club on heritage venues, hinterland
  or farm excursions, so nothing in the draft claims an interest in any of them.

  Three things follow, and they fix the angle.

  First, a circus is not something this membership attends for itself. It is
  something members hand to grandchildren. The offer is therefore framed as
  tickets to pass on rather than as an outing to attend, which is the segment's
  nothing-to-organise USP.

  Second, the club meets on the first Wednesday at 9:30am. The first Wednesday
  of October is the 7th, after the season has ended, and today is the 23rd. No
  club meeting falls anywhere inside the opening week. Asking her to raise it at
  the next meeting would be asking for something the calendar cannot deliver.
  The message asks only for a reply and a rough number, which is the plan
  block's message_goal, and everything after that moves by email between her and
  the members. The reasoning stays out of the text, because stating it would
  narrate her own world back to her (SPAR-A 4.5). It shows instead in what the
  message does not ask for, and in one clause saying this need not wait for a
  meeting.

  Third, her office is unsettled. The Smith Family VIEW directory lists Janine
  as Secretary and Jennifer as Treasurer, where the roster has Jennifer as
  Secretary, and the profile flags the discrepancy for correction. So the
  message carries no role in the salutation and opens by saying hers is the name
  we hold for the club, which invites her to hand it to whoever runs the
  programme without naming a committee member back at her. The profile's
  candidate, Patricia the Programmer, stays out of the text: reciting a public
  committee list to a stranger buys nothing.

  USPs are taken from the segment's own list. nothing-to-organise is the spine.
  opening-week-seats supplies the seven shows and the free seat.
  free-by-code appears only as the promise that a code and a link come back in
  the reply; the code itself and any price stay out of the first message.
  big-top-at-a-heritage-farm is one descriptive clause. make-a-day-of-it is
  deliberately unused: it is not in this segment's list, it holds for daytime
  sessions only, and the individual session times are not in the showtimes file,
  so any invitation to come early for lunch would rest on times with no source.
  group-visit-later is not in the segment's USP list but is written into
  first_ask, so it appears in the sentence the plan block supplies. For a club
  whose only gathering falls after the season, that sentence is also the most
  likely reason to reply at all.
response_likelihood: 35
a_note: |
  Pass-it-on angle (free tickets for members to hand to grandchildren, nothing
  for the club to arrange), email first touch with a Thursday-morning phone
  follow-up to a personal mobile, warmth prior-contact-unanswered (one outbound
  message of 9 April 2026 about a group outing, no reply), en-au. Three things
  worth carrying into R: her office is unsettled, the Smith Family directory
  putting Janine as Secretary and Jennifer as Treasurer against the roster's
  Jennifer-as-Secretary, so the message names no role and asks to be passed on;
  the club's first-Wednesday meeting cycle puts no meeting inside the opening
  week, so the ask is a forward rather than an agenda item; and the challenger's
  single fact-check finding was rejected on evidence it could not see, which is
  recorded in the review round.
rounds:
  - type: draft
    number: 1
    chosen_usps: [nothing-to-organise, opening-week-seats, free-by-code, big-top-at-a-heritage-farm]
    notes: |
      First touch. Element order follows SPAR-A 4.5: introduce the sender, make
      the ask, then give the reasons. The prior-contact line sits in the opening
      paragraph as part of establishing who is writing.
    messages:
      - channel: email
        to: robinaviewclub1@gmail.com
        subject: Free circus tickets for Robina VIEW members, opening Thursday
        body: |
          Hi Jennifer,

          I am Priyanka Das, partnerships at Historic Rivermill, a riverside venue at Mount Nathan in the Gold Coast hinterland with a cafe, horses and farm animals. My colleague Lia wrote to the club back in April about a group outing here, and we did not hear back.

          A circus company has put a big top up on our lawn for the school holidays, and I have free tickets to the family show, WANTED – A Cirque Heist, for your members and their grandchildren. Seven shows, from this Thursday 24 September through to Sunday 27 September, opening at 1pm on Thursday. Reply with a rough number and I will send you a code and a booking link to pass around the club.

          They are for your members and the families they bring, rather than for posting publicly. Nothing needs organising at your end: each family books the show that suits them, so it does not have to wait for a meeting.

          If the club would rather come along together, the week after suits that better. Tell me a day and I will come back to you.

          Priyanka Das
          Partnerships, Historic Rivermill
          950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
          partnerships@rivermill.au
      - channel: phone
        to: 0408 005 458
        text: |
          Follow-up call on the morning of Thursday 24 September, made only if
          the email has drawn no reply. The number is Jennifer's own mobile.
        script:
          - point: Open
            text: |
              Good morning, is that Jennifer? Priyanka Das calling from Historic
              Rivermill at Mount Nathan. I sent the club an email yesterday and
              thought I would follow it up while there is still time in it.
          - point: What it is
            text: |
              There is a circus company performing in a big top on our lawn
              these school holidays, a family show called WANTED – A Cirque
              Heist. I have free tickets for your members and their
              grandchildren. It opens this afternoon at 1pm and runs through to
              Sunday, seven shows.
          - point: The ask
            text: |
              If you can put it out to the members, I will email you a code and
              a booking link this morning. Roughly how many would you say, so I
              know what to hold?
          - point: If the club only meets on the first Wednesday
            text: |
              That is why I am ringing rather than waiting. It does not need a
              meeting, or an outing organised. If there is an email list or a
              phone tree, families book whichever show suits them themselves.
          - point: If she is not the right person
            text: |
              Who looks after the programme? I am happy to send it straight to
              them, or to you to pass on, whichever is easier.
          - point: If the timing is too tight
            text: |
              Then the week after is the better one for a club outing. If you
              tell me a day that suits, I will ask our manager to hold seats
              together for you.
          - point: Close
            text: |
              The tickets are for your members and their families rather than
              anything public. Is robinaviewclub1@gmail.com the right address
              for the code, or would you rather I sent it to you directly?
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      Reading this cold, my first thought is that it is a low-risk, no-cost
      offer: free circus tickets for members and their grandchildren, nothing to
      organise, no card details, no click-through required to reply. That in
      itself would not stop me.

      Two things register as odd rather than as reasons to refuse. First, the
      line about a colleague writing to the club in April about a group outing
      and hearing nothing back. I do not recall any such email, and nothing in
      what I hold about the club records it. That would not stop me replying,
      but I would ask about it in my reply, something like "I don't recall an
      email from April, was it sent to this address?" Second, the timing is
      tight: the show opens tomorrow and runs only to Sunday, and our club only
      meets as a body once a month, on the first Wednesday. But the email
      pre-empts this by saying nothing needs a meeting, families book for
      themselves, so this is not a blocker either, just something I note.

      Whether what is asked of me is possible in the time given: yes. The ask is
      only a reply with a rough number, not an organised excursion, and the
      message is explicit that no meeting or bus-and-forms exercise is needed.
      That is realistic inside one day.

      What would stop me from replying: nothing here rises to that level. It is
      unsolicited and I don't independently know Historic Rivermill, but the ask
      is small, a reply rather than a payment or a click, and the offer is
      plausible for a hinterland venue with a family circus running these
      holidays.

      REPLY_PCT: 55
    fact_check:
      - claim: My colleague Lia wrote to the club back in April about a group outing here, and we did not hear back.
        source: Dispatcher courier prefetch, admin mail account, folder Partnerships.
        result: rejected
        note: |
          The challenger called this claim unsourced, on the ground that the
          a_author appendix permits a prior dealing only where the profile
          records the contact's own dated conduct with us, and this profile
          records none. The appendix carries a second clause the finding does
          not reach: where the prefetch finds that we wrote to this contact
          before and heard nothing back, the message says so in one plain line
          and names what that earlier note was about. That is this case. The
          prefetch supplied with the drafting brief returns, on 9 April 2026,
          "Group outing at Historic Rivermill — Robina VIEW Club", from Lia
          Movsisyan at partnerships@rivermill.au to robinaviewclub1@gmail.com,
          in the admin account's Partnerships folder.

          The challenger could not see it. Under SPAR-A 4.6 the role-play step
          receives only the profile, the draft and today's date, and the
          fact-check step's authority is the campaign YAML, the USP registry and
          the antifacts file. The prefetch is in none of those. The finding is
          an absence claim drawn from a document set that structurally cannot
          hold the thing it reports missing, and the profile's silence about
          April asserts nothing about April.

          Deleting the line would also put the draft out of conformance with the
          campaign, whose a_author appendix requires it. The line stays. Its
          wording changed for the separate reason recorded in revision_note.
      - claim: Historic Rivermill is a riverside venue at Mount Nathan in the Gold Coast hinterland with a cafe, horses and farm animals.
        source: business-overview.md, address block and U1, U2, U3, U5; wording follows business-antifacts.md.
        result: verified
      - claim: The show is WANTED – A Cirque Heist, opening 1pm Thursday 24 September 2026.
        source: 2026-09-23-stampede-arena-showtimes.md.
        result: verified
      - claim: Seven shows across the opening week, free to the organisation.
        source: campaign YAML, usps.opening-week-seats.
        result: verified
      - claim: No code, price, discount, subscriber offer or Oztix link appears in the first message or the call.
        source: campaign YAML, prompt_appendices.a_author and a_challenger.
        result: verified
      - claim: The club email is robinaviewclub1@gmail.com and Jennifer's number is 0408 005 458.
        source: Roster row jennifer-robina-view-club.
        result: verified
    antifact_check: |
      Checked against business-antifacts.md. No stone buildings, and no building
      of any age is claimed. No original or hundred-year-old mill structures. No
      vineyard. No farming claim: the venue is described by what it offers
      visitors, a riverside venue with a cafe, horses and farm animals, which is
      the wording that file prescribes. The venue is placed at Mount Nathan in
      the Gold Coast hinterland, never on Tamborine Mountain. Nothing states or
      implies that seats are unsold, that the tent needs filling, or that the
      club would be doing us a favour. No feed-bag or animal-food offer appears,
      and the only ticket route named is the link that follows in the reply.
    revision_note: |
      The persona raised three points and made one fact-check finding. Sorted
      before touching the draft, per SPAR-A 4.6.

      1. The April line reads as something she cannot confirm. Absorbed by
      reframing. The fact stays, mandated by the campaign appendix and carried
      by the prefetch; the fault is in the wording. She asked whether it came to
      this address, so the line now says so, which answers the question where it
      arises and leaves her nothing to remember. A club inbox read by several
      committee members over five months is reason enough not to recall it, and
      the wording keeps that open rather than implying she ignored us.

      2. Timing tight against a monthly meeting cycle. No change. She answered
      it herself from the draft's own text, which says nothing needs a meeting.
      Acting on it again would restate what already works.

      3. Unsolicited, and she does not independently know the venue. No change.
      She rated the ask small enough to carry that, and the opening paragraph
      introduces the venue. Adding credentials would push the message past the
      one screen a club secretary reads.

      4. The fact-check finding was rejected. Reasoning in the fact_check entry
      for that claim.
    notes: |
      Challenger: sonnet, context-isolated, one pass. The profile's yield of 3
      puts this contact in the 3-to-5 band, which the method budgets at one
      pass, so the round closes here.
  - type: final
    chosen_usps: [nothing-to-organise, opening-week-seats, free-by-code, big-top-at-a-heritage-farm]
    notes: |
      The final email differs from the post-spar draft in arrangement and
      wording, not in facts or elements, on the SPAR-A 7.6 band-pattern check.
      Reasoning in quality_checklist item 6.
