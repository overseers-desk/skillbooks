          The show is WANTED – A Cirque Heist, staged in a big top on our lawn for the school holidays. There are seven performances, from this Thursday 24 September through to Sunday the 27th, and the first is at one o'clock on Thursday afternoon. Tell me roughly how many the club could use and I will hold that many in the club's name. The code and the booking link come back to you by email, to send round to members. They are for your members and the families they bring rather than for a public page.

          Nobody has to organise an outing. Members book the performance that suits them and drive out on the day, so it does not have to wait for a meeting.

          If the club would sooner come out together, the week after suits a group better. Tell me a day that works and I will come back to you about seating.

