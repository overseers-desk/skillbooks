quality_checklist: |
  1. Structure. Root keys drawn from the canonical set. Draft and review rounds
  carry numbers; the final round omits one, as the method's skeleton does. The
  final round holds one email message and one phone message, inside the
  one-email cap. The to-address is the contact's real roster address. No bcc is
  written: the campaign sender block supplies it. No profile_hash: the harness
  prepends it.

  2. Coverage. fact_provenance carries an entry for every factual claim in the
  final email and the phone script, including the two that appear only in the
  script, the alpacas and goats and the road name. chosen_usps is present on the
  draft and final rounds.

  3. Presupposition. The message tells her nothing about her own playgroup. The
  profile's findings on its Friday term-time session, its cultural focus and its
  1,100-follower page shape what is asked and what is avoided rather than what
  is recited. Neither the meeting day nor the follower count appears in the text.

  4. Manufactured connection. The profile is explicit twice that the group runs
  no outings and that its focus is cultural and linguistic, so nothing claims an
  interest in farms, heritage or nature. The profile's own speculation that a
  farm setting could be framed as a nature-connection experience is not used: it
  is an inference about her rather than a statement by her. The cultural register
  is held to what is evidenced, the Whaea honorific and the te reo posts on her
  page, which supports a greeting and the word whānau and nothing further.

  This check is also what changed the prior-contact line at assembly. Draft 2
  said "I wrote to you back in March". The prefetch evidences the message, its
  date and its subject, but its From line carries partnerships@rivermill.au with
  no display name, so the claim that Priyanka personally wrote it rests on
  nothing. "We wrote" is what the record supports. Recorded in the final round's
  notes.

  5. Concreteness. The ask is answerable in one sentence: a rough number of
  families, or a day next week.

  6. Band-level pattern. Read against the approach files already in this campaign
  folder. The mothers-group and community-organisation openers share a structure,
  an introduction of the venue followed by the unanswered prior approach, because
  the campaign appendix mandates the second element and SPAR-A 4.5 orders the
  first. They differ in what follows: this one turns on there being no outing to
  invent, the Southport Day VIEW one on grandchildren and a meeting cycle that
  falls outside the season. No two subject lines match.

  7. Final email cardinality. One email, one phone script.
