    antifact_check: |
      Second pass checked the draft against business-antifacts.md and found no
      item touched: no stone buildings, no hundred-year-old mill structures, no
      vineyard, no Tamborine Mountain siting. The added phone-script point about
      the grounds claims only lawn, shade trees, parking and free entry, each
      traced above. Toilets, step-free access and baby-change facilities are not
      claimed anywhere, because no source in the campaign's fact_sources states
      them; the script offers to find the answer instead.
    revision_note: |
      No change. The persona raised three questions and named no stopper, and
      the fact-check found no error.

      The two hesitations she named are both answered by things already in the
      draft or already outside its reach. Reaching families during the break is
      the point the "nothing for you to run while the playgroup is on holidays"
      sentence and the phone script's not-meeting point both address, and
      whether Kalwun holds a holiday-period contact list is a fact about her
      organisation that no wording of ours can change. Wanting to check with
      someone at Kalwun before sending an outside code to families is proper
      practice at a community-controlled service, not an objection to answer;
      the phone script's needs-to-check point already says the code will be
      waiting when she has an answer.

      Step-free access and a place to feed or change a baby stay unclaimed. The
      script's offer to get the answer from the team is the honest response and
      it is already there.
    notes: |
      Challenger: sonnet, context-isolated, second pass. Verdict DONE, so the
      rounds close at two against the three the yield band allows.
