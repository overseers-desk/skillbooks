quality_checklist: |
  1. Structure. Root keys drawn from the section 6 set. Every draft and review
  round carries type and number; the final round carries type and no number.
  The final round holds one email message and one phone message, so the email
  cardinality cap holds. The recipient address is real and passes the format
  gate. No profile_hash line, the harness prepending it.

  2. Coverage. fact_provenance carries every factual claim in the final email
  and in the phone script, the three script-only claims marked as such.
  chosen_usps is on both draft rounds and the final round. a_note carries the
  angle, channel, warmth, language and the four things R will want.

  3. Presupposition. The message tells her nothing about herself. It does not
  name her playgroup's meeting day, its age range, its funding, or her
  organisation's standing. The one statement about her world, that the
  playgroup is on holidays, is the campaign's own school-holiday frame rather
  than a fact recited back at her, and it sits in a clause explaining why the
  offer has the shape it has.

  4. Manufactured connection. No claim of shared interest appears, because the
  profile records none: no public statement on outings, nature play, heritage
  venues or Rivermill, and no excursion in thirty harvested posts. The message
  claims only proximity and a group of families, both in the profile. The
  profile's inference that a gift-to-community register would suit is honoured
  by what the message refrains from doing rather than asserted in it, and no
  cultural claim is made.

  5. Concreteness. The ask is a number. She can answer it in one sentence, and
  both challenger passes did answer it in one sentence.

  6. Band pattern. Read against the sibling approaches already in this campaign
  folder. The Coomera playgroup opens on a prior unanswered approach, the
  Canungra RSL opens on the same, and this one opens on the sender and the
  venue, having no prior contact to name. The ask sentence differs too: this
  one asks how many tickets she could use and invites a large number, where the
  siblings ask for a rough number of families. Subject lines are differentiated
  by the program's own name, Jarjums.

  7. Final round email cardinality. One email.
