          or another staff member first. She may not be reachable at all during
          the holidays.

          The roster says the playgroup meets Mondays and Kalwun's own site says
          Tuesdays. The profile left that unresolved for the first phone contact
          to verify. Ask it only if the conversation goes well and there is room
          for it; do not open with it.

          Do not raise country, culture or community standing. This is one local
          organisation ringing another about tickets.
        script:
          - point: Opening
            text: |
              Good morning, this is Priyanka Das from Historic Rivermill at
              Mount Nathan. I sent an email to the Burleigh office yesterday for
              Leilani Summers, about the Jarjums playgroup. Is she about?
          - point: If someone else answers and she is unavailable
            text: |
              No trouble at all. It is in the Burleigh admin inbox, under a
              subject about free circus tickets. If you can point her at it, or
              tell me a better time to ring, that would help. I can send it
              anywhere else that reaches her faster.
          - point: The offer, in one breath
            text: |
              A circus company has a big top up on our lawn for the school
              holidays. We are giving opening-week seats to local groups, and I
              would like the Jarjums families to have some.
          - point: The ask
            text: |
              Tell me how many tickets you could use and I will send a code and
              the booking link straight after this call. The code works on any
              of the seven shows. Today is one o'clock, Friday and Saturday are
              four and seven, and Sunday is eleven and two.
          - point: If the number sounds hedged or small
            text: |
              Give me the real figure rather than a safe one. If your list runs
              well past a handful, I will come back with what we can hold for
              you.
          - point: Keeping it inside the group
            text: |
              The tickets are for your own families rather than for posting
              publicly, so a message round the group is the way it works.
          - point: If she asks what the place is like for little ones
            text: |
              The tent sits on open lawn with the big trees around it for shade,
              there is parking on site, and entry to the grounds costs nothing.
              If there is something specific on access you need to check before
              you send it round, tell me what and I will get you the answer from
              the team today.
          - point: If she says the playgroup is not meeting
            text: |
              That is the reason it is shaped this way. There is no outing to
              arrange and no group to assemble. It is one message to your
              families, and they do the rest.
          - point: If she would rather bring everyone together
            text: |
              Next week suits a group visit better. Give me a day that works and
              I will come back to you on what we can hold.
          - point: If she needs to check with someone
            text: |
              Of course. I will send the code and the link so it is ready when
              you have an answer, and you can use it or not.
          - point: Close
            text: |
              Thanks for your time. What is the best address for the code?
        actioned_date: null
        replied_date: null
