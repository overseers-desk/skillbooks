  - type: review
    number: 2
    verdict: DONE
    in_character: |
      Reading this at the Burleigh admin inbox: I do not know this person or
      this venue. It is a cold email into a shared admin inbox, not to me by
      name, offering something free with no ask for money or personal details up
      front. That is a mild point in its favour, since most scams want something
      now.

      What would stop me replying: nothing here is a hard stop. But two things
      would make me hesitate before forwarding anything to families. Jarjums is
      on school-holiday break right now, so there is no session to pass a note
      round at. I would need some other channel to reach our families directly, a
      group chat or a text list, and I am not certain we have one set up for
      holiday periods. If we do not, forwarding one message is not actually a
      five-minute job. And we are an Aboriginal community-controlled service.
      Before I send an outside venue's code to our families I would want to know
      this checks out, and that there is nothing about the visit that needs
      flagging for a first-time family, access, quiet space, cost beyond the
      ticket itself. I may want to run it past someone at Kalwun rather than just
      reply on my own.

      What I would simply ask rather than treat as a blocker: how many seats are
      realistically on offer if our numbers run past a handful, whether there is
      step-free access and somewhere to feed or change a baby, and whether the
      code is good for any of the seven sessions or only ones I book in advance.

      Possible in the time given: partly. Passing on a code once I have it is
      quick. Getting a real headcount and a decision back to them inside a day,
      as the phone script pushes for, is tight for a first contact from an
      organisation we have never dealt with, especially with playgroup not
      meeting to ask around at.

      REPLY_PCT: 55
    fact_check:
      - claim: Seven performances, Thursday 24 September 1pm, Friday 25 and Saturday 26 at 4pm and 7pm, Sunday 27 at 11am and 2pm.
