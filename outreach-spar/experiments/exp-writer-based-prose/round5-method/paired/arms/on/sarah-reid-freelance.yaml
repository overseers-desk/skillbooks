          big top is on our lawn these school holidays and I have a pass for four seats for you. I've
          emailed you.
  - type: review
    number: 3
    verdict: DONE
    in_character: |
      Cold pitch, but a friendly and unusually low-pressure one. A partnerships person at a small heritage
      property near Mount Nathan has a circus in a big top on her lawn for the school holidays and is
      offering me four free seats, no strings, for any of the first four days. She's upfront that there's
      no guaranteed story and that the pass stands either way, which is the kind of line that actually
      makes me more inclined to engage, because it removes the transactional feel most of these emails
      have.

      The catch is timing. This lands on the 23rd, the free window is the 24th to the 27th, and I'm in
      Byron Bay. That's a few days' notice to organise a trip across the border. The circus angle itself
      is a bit outside my usual lane. A heritage site that used to be an arrowroot mill, sitting on a
      river, with horses and animals on the property, interests me more than the circus does.

      I'd reply, but not to grab the pass as offered. I'd ask whether I could visit the property itself,
      outside a show or around one, to look at the heritage and animal side, and whether the circus can be
      worked in as a secondary hook rather than the whole story.

      What would stop me replying: nothing here is a hard stop. The offer costs me nothing, and the
      sender's own framing pre-empts the awkwardness of replying just to decline or negotiate.

      REPLY_PCT: 55

      Presupposition trace returned nothing below 3.
