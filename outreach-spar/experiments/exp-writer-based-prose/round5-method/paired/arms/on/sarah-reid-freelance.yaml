# Contact:  Sarah Reid, Adventure/Emerging/Regenerative Travel Writer, Freelance: Adventure.com (earned-media)
# Channel:  Email first 23 September, LinkedIn connection note the same day
# Language: Australian English
# Angle:    The circus is the occasion, the venue under it is the story, and she is over the border from it
decisions:
  channel: email
  channel_detail: |
    Email is the first touch on 23 September, to sarah@sarahreid.com.au, per the plan block's
    approach_sequencing. The LinkedIn note goes out beside the email rather than ahead of it. The generic
    connection-first sequence in SPAR-A section 4.2 holds the email for five days, which would land it on
    28 September, after the opening-days pass has expired on the 27th. No phone number is on the roster,
    so the campaign's secondary_channel does not apply to this contact.
  language: en-au
  angle: venue-under-the-big-top
angle_rationale: |
  Target validity. star_rating 5 clears the campaign's filter.min_star of 3. date_excluded is empty. The
  profile carries no finding against approaching, and yield 9 buys the full three challenger passes.

  Warmth: cold. The dispatcher prefetch searched both directions on sarah@sarahreid.com.au, and the name
  and organisation in subject lines, across all five configured accounts. No matches, remote IMAP. No
  approach file existed for this contact before this one. So the message carries no prior-dealing line,
  and no "we wrote before and heard nothing" line, which the campaign's a_author appendix requires only
  where the prefetch finds an unanswered earlier note. The profile records no dated conduct of hers
  towards us either. The opener therefore starts from what is being offered, not from a compliment on her
  work. New thread, no parent block.

  Channel. Email and LinkedIn are both on the roster, no phone. Both were backfilled during P and both are
  verified: the email is unmasked on her own contact page, and the LinkedIn slug was corrected from a dead
  vanity URL to sarahreidtravels and confirmed by profile fetch. The connection note is 200 characters,
  inside the free-account bound in the LinkedIn platform module, so it can ride as an invitation note
  rather than needing a direct message.

  Language: Australian English, per the campaign's language key. No override in the plan block.

  Angle. Three hooks sit in the profile and two of them fail. Her Sumba equine-wellness piece for National
  Geographic Traveller UK pairs with the Peruvian Pasos, but horses are not among this segment's three
  USPs, so leading on them would invent a pitch the campaign did not authorise. Her regenerative and
  sustainable-travel beat does not reach a family circus without straining, which is the manufactured-
  connection failure section 7.4 tests for. What holds is geography against a clock. She is a working
  travel writer with masthead bylines living over the border from a thing that exists for eleven days, and
  her one confirmed recent Australian byline, the Gidjuum Gulganyi Walk piece, covers the hinterland
  country between Byron and the border. So the proximity is evidenced rather than assumed, and it licenses
  the geographic anchor in the subject line under section 4.5. None of that research is recited back at
  her.

  The segment's deciding_interest names a school-holiday story with pictures under a big top. That fits
  most of this segment's stems, the Gold Coast Bulletin and WeekendNotes writers and the Hot Tomato
  presenters above all. It does not fit this contact, and the three challenger passes confirmed so from
  opposite directions. Pass 1 ignored the circus and reached past it for the heritage venue as the story
  she would want. Pass 2 read the circus as the whole offer and refused on beat. Pass 3, on the revised
  draft, named the mill site, the river and the animals as what interests her and said it would reply. So
  the angle departs from the segment's generic framing for this contact alone: the message names the
  circus as the occasion, names the venue under it, and leaves the story to her. That is a shift of weight
  inside the big-top-at-a-heritage-farm USP, whose own text is a circus in a big top on a heritage farm,
  not a new claim.

  Cross-reference. Nothing else in the earned-media band has been drafted yet, so no prior approach
  constrains this one. For the rest of the band the reusable part is the structure, not the angle: the
  venue-first reframing is worth repeating only for the writers whose beat the circus misses, and the Gold
  Coast locals and the family-outing writers should get the plan block's own school-holiday framing
  straight.

  Antifact pass. No stone buildings. No original or 100-year-old mill structures presented as a feature:
  the arrowroot mill is named by its operating date, circa 1910, and no surviving building is claimed. No
  vineyard. Mount Nathan is placed in relation to the Gold Coast with no mention of Tamborine Mountain and
  no Scenic Rim claim. The farming question is left alone, since the horses and animals are named as what
  the venue offers and the place is called a heritage venue, not a farm. No drive time from Byron Bay is
  stated, because no source document gives one.
response_likelihood: 35
a_note: |
  Venue-under-the-big-top angle, circus as the occasion and the heritage mill site as the story, chosen
  because her beat is adventure and regenerative travel, not family outings. Email first touch 23
  September with a same-day LinkedIn connection note, cold, Australian English. Three challenger passes,
  75 / 20 / 55 on nearly the same draft, so the spread is persona variance rather than a reading of her;
  the low pass is the better guide and the 35 is set below the final pass. Two fixes came out of the spar
  and both matter for the rest of the band: session times cut back to the four days, because the showtimes
  file does not itself list the Friday-to-Sunday starts; and "family pass of four" replaced by "a pass for
  four seats", because nothing in her profile says she has children and a solo writer reads three spare
  seats as an assumption. If she replies, expect her to ask about seeing the venue itself rather than the
  show, which all three passes converged on.
rounds:
  - type: draft
    number: 1
    chosen_usps: [opening-week-seats, free-by-code, big-top-at-a-heritage-farm]
    notes: |
      First touch is the email, not the connection note, because the offer closes before a five-day
      connection gate would release it. Seven session times listed so the ask can be answered by naming
      one.
    messages:
      - channel: email
        to: sarah@sarahreid.com.au
        bcc: partnerships@rivermill.au
        subject: A family pass to a circus big top, over the border from Byron
        body: |
          Hi Sarah,

          I'm Priyanka Das, partnerships at Historic Rivermill, a heritage venue on the Coomera River at Mount Nathan, half an hour inland from the Gold Coast, with a cafe, horses and farm animals.

          CHARC Performance has put a big top up on our lawn for the school holidays. The show is WANTED – A Cirque Heist, a family circus, fourteen performances from this Thursday 24 September through to Sunday 4 October.

          I have a family pass of four for you, good for any of the seven shows in the opening days: Thursday 1pm, Friday 4pm and 7pm, Saturday 4pm and 7pm, Sunday 11am and 2pm. Reply with the one that suits and I will send you the booking details.

          I am writing because this looks like a school-holiday story for your readers. A circus tent on the lawn of a riverside heritage venue is on for eleven days and then gone, and seeing it in the opening days leaves you the rest of the season to write into. The pass stands whether or not anything comes of it.

          Public tickets are at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924

          Priyanka Das
          Partnerships, Historic Rivermill
          950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
          partnerships@rivermill.au
      - channel: linkedin
        to: https://www.linkedin.com/in/sarahreidtravels/
        text: >-
          Sarah, I'm Priyanka from Historic Rivermill at Mount Nathan, over the border from you. A circus
          big top is on our lawn these school holidays and I have a family pass of four for you. I've
          emailed you.
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      A cold pitch from a venue partnerships person, not a PR agency, offering a free family-of-four pass
      rather than a media invite framed as a "review". No code, no price, no talk of empty seats, so it
      reads as an actual invitation rather than a favour being asked of me. The circus itself isn't really
      my beat: I write adventure, emerging-destination and regenerative travel, not family-holiday circus
      listings. But the venue underneath it, a heritage riverside property with horses and farm animals
      just over the NSW/QLD border from where I live, is closer to my usual territory than the circus is.
      So the actual hook for me isn't "circus", it's "what's this heritage farm like", with the circus as
      this week's excuse to go look.

      Is what's asked of me possible in the time given? Yes. Thursday is too soon to arrange anything, but
      Friday through Sunday gives two to four days, which is workable, especially since the pass stands
      whether or not anything comes of it.

      Nothing here stops me replying. What I'd ask in the reply, rather than object to: I'd pick Sunday
      2pm and ask, separately, whether there's a chance to see the horses and animals or talk to someone
      at the venue while I'm there, since that's the angle I'd actually want to write.

      REPLY_PCT: 75

      Presupposition table returned nothing below 3. Every presupposing phrase resolved either to the
      email itself, to the LinkedIn note quoting the email, or to something she already knows about
      herself.
    fact_check:
      - claim: The seven opening-days session times are Thursday 1pm, Friday 4pm and 7pm, Saturday 4pm and 7pm, Sunday 11am and 2pm.
        source: the website data file the showtimes document names as the home of the fourteen start times
        result: corrected
        note: |
          The times are right in the data file, but the showtimes document supplied as a fact source states
          only that the season opens Thursday 24 September at 1pm and delegates the rest. The five
          non-Thursday starts are therefore times the fact sources do not themselves list, which the
          campaign's a_challenger appendix defines as a factual error to report.
        correction: |
          All seven times cut from the message. The four days are named instead and the session times move
          into the reply, alongside the code and the booking link the a_author appendix already holds back
          for it.
      - claim: Everything else in the draft, being the fourteen-performance count, the 24 September to 4 October span, the eleven days, the seven opening-week shows, the sender identity and address, and the Eventbrite link.
        source: campaign YAML, business overview, the showtimes file
        result: verified
    antifact_check: |
      No stone-building, 100-year-building, vineyard or Tamborine Mountain claim. No code, price,
      subscriber discount, feed-bag offer or Oztix link. Nothing suggesting seats are unsold or that the
      offer serves the sender.
    revision_note: |
      Answer in this email: the five unsourced session times, cut. Leave for the reply: whether she can see
      the horses and animals or talk to someone at the venue, which she raised as her reply question rather
      than an objection, and which the segment's USP list carries no offer for. Absorb by reframing:
      nothing, since the venue sentence that gave her the hook was already in the draft and should not be
      touched. No tone change, the persona was positive on the sender identity, the absent code and price,
      and the unconditional pass.
