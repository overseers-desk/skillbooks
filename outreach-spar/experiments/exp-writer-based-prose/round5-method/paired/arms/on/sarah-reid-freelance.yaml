quality_checklist: |
  1. Structure. Root keys drawn from the section 6 set. The three draft rounds and the three review rounds
  each carry type and number. The final round holds one email and one LinkedIn message, so the email
  cardinality cap is met. Both addresses are real: sarah@sarahreid.com.au, found unmasked on her own
  contact page during P, and partnerships@rivermill.au from the campaign sender block. No profile_hash
  written, per the harness note.

  2. Coverage. fact_provenance reaches every factual claim in the final email and the LinkedIn note,
  including the two profile facts that shape the angle. Only one of those two, her Byron Bay location,
  appears in the messages at all.

  3. Presupposition. Passed. All three passes returned presupposition tables with nothing scoring below 3,
  and every presupposing phrase resolved either inside the message, to the LinkedIn note quoting the
  email, or to something she knows about herself. No sentence tells her about her own work.

  4. Manufactured connection. No claim of shared interest is made. Her beat, her bylines and her awards
  shaped which angle was chosen and are named nowhere in the message. The single fact about her that the
  message uses is her location, which the profile records from her LinkedIn topcard. The story sentence
  explicitly declines to say what her story would be, which is the fix that came out of pass 2.

  5. Concreteness. The ask answers in one sentence: name a day between Thursday 24 and Sunday 27
  September.

  6. Band pattern. This is the first draft in the earned-media band, so the check reruns when the band is
  complete. One thing for whoever drafts the rest of it: the opening two sentences here, the
