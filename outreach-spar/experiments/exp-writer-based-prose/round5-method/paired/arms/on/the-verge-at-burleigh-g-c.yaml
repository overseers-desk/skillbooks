quality_checklist: |
  1. Structure. Root keys drawn from the section 6 set. Draft and review rounds all carry type and number.
  The final round holds one email message and one phone message, so the email cardinality cap is met.
  Addresses are real: Tarmar.Christensen@retireaustralia.com.au from the Form 3 VCD, and
  partnerships@rivermill.au from the campaign sender block. No profile_hash written, per the harness note
  and issue 63. No bcc written, since the campaign sender block supplies it (section 4.7). No sender
  override block, since the campaign default sender applies.

  2. Coverage. fact_provenance reaches every factual claim in the final email and the phone script,
  including the profile facts that shape the angle without appearing in the message, and the one claim
  that is an absence: no session time beyond the Thursday 1pm opening is named, because the showtimes file
  does not list the rest. a_note carries the angle, both channels with their dates, warmth, language, the
  deliberate non-use of the award and the interview, and the deferred access question.

  3. Presupposition. Passed. The challenger's second table scored every phrase at 3 or above, and the one
  phrase scoring 0 was settled by cutting its sentence rather than by introducing the thing behind it. No
  sentence tells her something she already knows about herself: her village bus, her social committee and
  her outings shape what is asked and are never recited back.

  4. Manufactured connection. No claim of shared interest. The school-holiday hook rests on the plan
  block's deciding_interest and the offer's own dates. The bus-outing branch rests on the Form 3 VCD
  facility check, RetireAustralia's own description of the bus, and her own account of the outings she
  introduced. The profile's note that she has no confirmed history of engaging outside operators is
  respected: neither branch presumes one.

  5. Concreteness. She can answer in one sentence, either a rough number and a couple of days, or a day in
  the following week.

  6. Band-level pattern. Failed on draft 2 and fixed in draft 3. All three approaches already written for
  this campaign open with the same "I am Priyanka Das and I look after partnerships at Historic Rivermill,
  a heritage venue on the Coomera River" sentence, and draft 2 made it four. The final opens on the venue
  with the role in a supporting clause, and the subject line moves off the shared "Free circus tickets for
  X" form. Recorded in draft 3's revision_note, which also records that the final therefore differs from
  the text the challenger passed, and how.

  7. Final round email cardinality. One email, one phone. Met.
