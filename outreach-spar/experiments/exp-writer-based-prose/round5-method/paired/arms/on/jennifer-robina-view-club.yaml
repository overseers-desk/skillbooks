quality_checklist: |
  1. YAML structure. Root keys drawn from §6's canonical set. Draft and review rounds
     carry number; the final round omits it, as §6's skeleton does. Addresses are real:
     the club Gmail is on the roster, and partnerships@rivermill.au is the campaign
     sender. No validator subprocess was invoked, per §7.1.

  2. Coverage. fact_provenance runs to twenty-one entries and covers the phone script and
     the notes as well as the email, including the three claims that appear only outside
     the email body: Patricia's role and mobile, Jennifer's office, and the animals and
     horse riding. chosen_usps is present on the draft and final rounds. a_note carries
     angle, channel, warmth, language, and the two items P and R must act on.

  3. Presupposition test. One failure found and fixed at assembly. Draft 2's opening
     carried "and you passed it to your committee", which recites Jennifer's own conduct
     back to her. It is cut from the final; the Patricia sentence that follows shows the
     note travelled. "This is too quick to put to a meeting" is the one remaining line
     touching what she already knows, and it earns its place by carrying the ask: it is
     the reason the offer goes to the member list rather than to a meeting.

  4. Manufactured-connection test. Passed. The profile records no public statement about
     heritage venues, the hinterland or farm excursions, and the message asserts no
     affinity for any of them. The shared ground claimed is the April exchange, which is
     documented by date, sender and content in four messages.

  5. Concreteness. "Reply with a rough number and I'll send a code and a booking link for
     you to pass on." Answerable in one sentence, and the phone script asks the same thing
     in the same words.

  6. Band-level pattern check. Performed against the one sibling in the campaign
     directory, lynley-southport-day-view-club.yaml, which runs the same angle at another
     VIEW club in the same band. Its opener names an April note that went unanswered,
     which is what that club's record shows. This one opens on an apology for a call we
     did not make. The two cannot be read as variants of a template, and the subject lines
     use different frames: the sibling leads on the offer, this one on the event and its
     date. Worth re-reading once the third VIEW club, Surfers Paradise, is drafted.

  7. Final round email cardinality. One email, one phone script. Passed.

  Two items for the human reviewer, repeated in the director_note where they bear on
  sending. The apology rests on the absence of any record of the 22 April call, which is
  an absence across searched mailboxes and not proof the call was never made; anyone in
  the office who knows otherwise should say so before this goes. And Patricia Benson, not
  Jennifer, is the contact this club's outings run through. She has no roster row, and
  creating one is S and P work, not A's.
