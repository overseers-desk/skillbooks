quality_checklist: |
  1. YAML structure. Root keys drawn from §6's canonical set. Draft and review rounds
     carry number; the final round omits it, as §6's skeleton does. The final round holds
     one email message, so the §7.7 cardinality cap holds. Addresses are real: the club
     Gmail is on the roster and corroborated by the profile from the club's Facebook page,
     and partnerships@rivermill.au is the campaign sender. No validator subprocess was
     invoked, per §7.1.

  2. Coverage. fact_provenance runs to twenty entries and covers the phone script as well
     as the email, including the two claims that appear only in the script, the animals
     and horse riding, and the mobile number. chosen_usps is present on the draft and
     final rounds. a_note carries angle, channel, warmth, language and the identity
     caveat.

  3. Presupposition test. Passed, and separately swept by the challenger sentence by
     sentence. Nothing recites the club's own history back to it. "Your meetings look to
     be monthly" is the one line that touches what she already knows, and it earns its
     place by carrying the ask: it is the reason the offer goes to the email list rather
     than to a meeting.

  4. Manufactured-connection test. Passed. The profile records no public statement about
     heritage venues, the hinterland or farm excursions, and the message asserts no
     affinity for any of them. The only shared ground claimed is the April note, which is
     documented in the prefetch by date, sender and subject.

  5. Concreteness. "Write back with roughly how many you think your members would use."
     Answerable in one sentence, and the phone script asks the same thing in the same
     words.

  6. Band-level pattern check. Not performable here: this is the first approach file in
     the campaign directory, which was empty at authoring time, so there are no sibling
     openers to read against. The opener is anchored to a prior dealing unique to this
     contact, so it cannot be the shape a template would produce. Worth a re-read once
     the rest of the community-organisation band exists, since the club-secretary
     recipients in that band invite a common opener.

  7. Final round email cardinality. One email, one phone script. Passed.

  Two items for the human reviewer. The profile does not confirm Lynley is the current
  Secretary, and names Evelyn Berg as 2026 AGM chair; the body carries a pass-it-on line
  rather than a guess. And the "no reply" finding rests on a search keyed to the club's
  Gmail address, so a reply from a member's personal address would not have surfaced.
