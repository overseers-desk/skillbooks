quality_checklist: |
  1. Structure. Root keys from the section 6 set; both non-final rounds carry
     type and number; the final round holds one email and one phone message;
     the addresses are real. No profile_hash written, per the harness contract.
  2. Coverage. fact_provenance lists every factual claim in the final email and
     the phone script; chosen_usps is set on the draft and final rounds;
     a_note carries angle, channel, warmth, language and the two drafting
     constraints that shaped the text.
  3. Presupposition. The challenger's sentence-by-sentence table scored no
     phrase below 3. Nothing tells her something she already knows about her own
     group, and her meeting day is deliberately absent.
  4. Manufactured connection. Passes by construction. The profile records no
     public statement by this contact, so the message claims no shared interest
     at all and rests on location, group mechanism and the offer.
  5. Concreteness. The ask is a number of families, answerable in one sentence.
  6. Band pattern. Failed on draft 1 and fixed in the final. The three approaches
     already in this campaign folder open on the same self-introduction formula,
     and draft 1 was a fourth; the final leads on the venue and places the name
     after the offer.
  7. Final round email cardinality: one.
