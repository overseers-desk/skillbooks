quality_checklist: |
  1. Structure. Root keys drawn from the section 6 set. Draft and review rounds carry type and number. The
  final round holds one email message, one linkedin and one phone, so the email cardinality cap is met.
  Addresses are real: vmvicpoint@oaktreegroup.com.au and partnerships@rivermill.au, both from verified
  sources. No profile_hash written, per the harness note.

  2. Coverage. fact_provenance reaches every factual claim in the final email, the LinkedIn note and the
  phone script, including the two profile facts that shape the angle without appearing in the message.

  3. Presupposition. Passed after revision. The persona's own table scored every remaining presupposition
  at 3 or above, and the four phrases scoring 2 or below were cut or given a referent.

  4. Manufactured connection. No claim of shared interest is made. The school-holiday hook rests on the
  plan block's deciding_interest and on the offer's own dates, not on anything attributed to Megan Lia.
  The profile found no public statements by her, and none is invented. The absence of a bus and of a
  residents committee shapes what is asked for and is never stated back at her.

  5. Concreteness. The ask answers in one sentence: a rough number of tickets, or a day for a village
  group.

  6. Band pattern. The opener leads with the sender and the venue, then the circus, then the ask. Nothing
  else has been drafted in the retirement-village band yet, so this check reruns when the band is
  complete, and other drafts should vary their openers rather than repeat this one.

  7. Final email cardinality. One email in the final round.
