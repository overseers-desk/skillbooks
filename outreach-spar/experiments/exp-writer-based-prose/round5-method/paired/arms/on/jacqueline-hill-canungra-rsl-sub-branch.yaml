quality_checklist: |
  1. YAML structure. Root keys drawn from §6's canonical set only (decisions,
     angle_rationale, response_likelihood, a_note, rounds, fact_provenance,
     quality_checklist). No profile_hash, which the harness prepends (issue #63).
     Draft and review rounds carry number. Addresses are real:
     secretary@canungra.rslqld.net.au from the roster and confirmed in the profile
     as the RSL Queensland listing, in preference to the Facebook page's
     canungrarslsubbranch@outlook.com.
  2. Coverage. fact_provenance reaches every factual claim in the final email and
     the phone script, including the April prefetch line and the two contact
     numbers. chosen_usps present on the draft and final rounds.
  3. Presupposition test. The challenger's own sentence table scored every
     presupposing phrase 4 or 5 except "we heard nothing back" at 1, and that
     clause is gone from the final draft. No sentence recites her role, her
     organisation's activities or her area back to her.
  4. Manufactured-connection test. The message claims no shared interest. The
     profile records no public statement on heritage tourism or excursions, and
     the final draft asserts none; the angle is built on what she demonstrably
     does, which is write to her own members.
  5. Concreteness. The ask is answerable in one sentence: a rough number, or a day
     next week.
  6. Band-level pattern check. The opener is a named colleague's unanswered April
     note, which no other message in this band can carry, since the prefetch found
     prior correspondence for this contact alone. The second paragraph opens on the
     comparison to that note rather than on the offer, so the message does not
     share the band's standard "we have free tickets" first line.
  7. Final round email cardinality. One email and one phone message in the final
     round. Within the cap, which counts emails only.
