quality_checklist: |
  1. Structure: root keys from the canonical set; draft and review rounds carry
     number; the final round has one email and one phone message; the
     to-address is the direct address the profile confirms. Pass.
  2. Coverage: fact_provenance reaches every factual claim in the final email
     and the phone script, and names the profile-only claim that shapes the
     angle without appearing in the text. chosen_usps is on the draft and final
     rounds. Pass.
  3. Presupposition: no sentence tells Kate something she already knows about
     her own playgroup. The Kirra line is the offer's scope, and the March line
     is our conduct. The term-time calendar shaped the ask and stays out of the
     text. Pass.
  4. Manufactured connection: the message claims no shared interest. The
     profile records no farm outings or excursions, and nothing in the draft
     supposes any. Pass.
  5. Concreteness: the ask is a rough number of families, answerable in one
     sentence and answerable as a guess. Pass.
  6. Band pattern: flagged and acted on. The opener was recast because it had
     converged on the seniors-club message's opening construction; it now leads
     with the sender's name and her distance from Helensvale, and the signature
     matches the band's form. Reading the band's openers end to end remains the
     human reviewer's check before the send.
  7. Final round email cardinality: one. Pass.
