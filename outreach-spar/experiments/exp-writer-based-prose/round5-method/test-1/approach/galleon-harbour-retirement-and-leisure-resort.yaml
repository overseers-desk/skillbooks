quality_checklist: |
  1. YAML structural self-check: root keys drawn from the §6 canonical set; draft and review rounds
     carry type and number; the final round holds one channel:email message plus one channel:phone, so
     too_many_final_emails passes; both addresses are real, neither masked nor a placeholder. No
     profile_hash line written, per issue #63 the harness prepends it.
  2. Coverage and completeness: fact_provenance covers every factual claim in the final draft, including
     the two facts that appear only in the director-facing phone_note; chosen_usps set on the draft and
     final rounds; a_note carries angle, channel, warmth, language, verdict and the one thing R needs to
     watch.
  3. Presupposition test: no sentence tells Philip something he already knows about himself. The
     profile's regulatory detail (freehold CTS tenure, residents committee, absent village bus, body
     corporate finances) shapes the angle and appears nowhere in either message.
  4. Manufactured-connection test: no claim of shared interest is made. The profile records no public
     statements for this individual, and the draft asserts nothing about his views, his programme or his
     residents' habits. The offer stands on its own terms.
  5. Concreteness: the ask is answerable in one sentence, a rough number, or a day for a group visit.
  6. Band-level pattern check: this is the first approach file in the campaign directory, so there are
     no sibling openers to compare against. The opener differs from the segment's default in leading
     with a cold self-introduction rather than a shared outings context, which suits a contact with no
     prior dealing and no public footprint.
  7. Campaign-rule check: no code, no price, no discount, no Oztix link, no feed-bag or animal-food
     offer, no suggestion that seats are unsold or that the offer helps the sender; the only ticket link
     is held for the reply; tickets stated as being for the organisation's own residents, families and
     staff and not for public posting; tone is one local organisation writing to another.
  8. Antifact check: see the review round's antifact_check. Clean against every item in
     business-antifacts.md.
