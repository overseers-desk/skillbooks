quality_checklist: |
  1. Structure. Root keys are drawn from the canonical set. Draft and review
  rounds carry type and number, the final round carries one email message and
  no number, and the address is a real published one rather than a placeholder.

  2. Coverage. fact_provenance reaches every factual claim in the final draft,
  including the venue description, the seven start times, the season end, the
  pass counts, the ticket link and the not-advertised framing. chosen_usps is
  present on both draft rounds and the final round.

  3. Presupposition. No sentence tells her what she covers, where she lives, or
  who reads her. The condition on her own pass and the school-holiday framing
  carry the understanding without reciting her pages back at her.

  4. Manufactured connection. Nothing claims a shared interest. The offer is
  put as an offer. Her Brisbane and Tamborine coverage informed the angle and
  is not mentioned in the message. The profile is silent on whether she covers
  circus or live performance, and nothing in the draft assumes she does.

  5. Concreteness. The ask is answerable in one sentence: how many passes and
  which shows.

  6. Band pattern. Failed on first reading and was fixed. Against the
  organiser-wave files already in this campaign folder, the opener shared the
  clause "I look after partnerships at Historic Rivermill" verbatim with the
  Galleon Harbour approach, and the paragraph ran to the same shape as four
  siblings: self-identification, then "a circus company has put a big top up
  on our lawn", then the ask. The final draft opens with the show instead,
  which also suits a publisher better than an introduction does. No fact
  changed.

  7. Final round email cardinality. One email message, no phone message, so
  the cap holds.
