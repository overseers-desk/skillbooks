    revision_note: |
      The challenger returned DONE with no factual errors. One change was made
      after it, under the method's own quality checklist rather than the
      spar: check 6, the band-level pattern check. Read against the
      organiser-wave files already in this campaign folder, the opener shared
      the clause "I look after partnerships at Historic Rivermill" verbatim
      with the Galleon Harbour approach, and the whole first paragraph ran to
      the same shape as four siblings (self-identification, then "a circus
      company has put a big top up on our lawn"). The opener now leads with
      the show, which suits a publisher reading for a subject rather than for
      an introduction, and the self-identification follows in the same
      breath. Every fact the challenger verified is unchanged, and nothing was
      added or removed.
