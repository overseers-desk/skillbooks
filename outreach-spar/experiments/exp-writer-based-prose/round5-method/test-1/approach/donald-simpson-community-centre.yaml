quality_checklist: |
  1. YAML structure. Root keys drawn from the §6 canonical set: decisions, angle_rationale,
     response_likelihood, a_note, rounds, fact_provenance, quality_checklist. No profile_hash, which
     the harness prepends. Draft and review rounds carry number. Addresses are real, not
     placeholders. Passed.
  2. Coverage and completeness. fact_provenance covers every factual claim in the final email and
     the phone script; chosen_usps is populated on the draft and final rounds; a_note carries angle,
     channel, warmth, language and the challenger outcome. Passed.
  3. Presupposition test. Nothing tells Harpur something she already knows about OWAD. Her
     programme is named in the subject line and used as the addressee, never narrated back to her,
     and the message presupposes that circulating an offer to members is what the centre does.
     Passed.
  4. Manufactured-connection test. The one mechanism claim, that members book for themselves with
     no outing to run, rests on the profile's own evidence that OWAD runs coach trips with no pick
     up or drop off on route, which is exactly what cannot be arranged in a day. No shared interest
     is claimed that the profile does not evidence. Passed.
  5. Concreteness. The ask is a rough number of members, answerable in one sentence, which is the
     plan block's message_goal. Passed.
  6. Band-level pattern check. The opener works from the venue and the offer rather than from a
     compliment or a template greeting, and it differs in shape from the August seniors-farm-day-out
     draft to this same contact, which opened on a familiarisation visit. Passed.
  7. Final round email cardinality. One channel: email message in the final round, plus one phone
     message, which the cap permits. Passed.
