quality_checklist: |
  1. Structure: root keys from the canonical set; draft and review rounds both
     carry number; the final round holds one email and one phone message. The
     email is a reply, so it carries a parent block and omits subject and to,
     per the section 6 reply skeleton, and parent.message_id is non-empty. The
     phone number is the live office line from the roster and the profile. Pass.
  2. Coverage: fact_provenance reaches every factual claim in the final email
     and the phone script, marking which appear in the script or notes only.
     chosen_usps is on the draft and final rounds, and a_note carries the angle,
     the channel, the two-sided warmth, the language, the threading decision and
     the challenger's rejected fact-check. Pass.
  3. Presupposition: no sentence tells Gregory something he already knows about
     Legacy. The April lines are our own conduct and his office's, not his, and
     the naming of Nerang and Southport grants him permission to split a figure
     rather than reciting his own clubs at him. Pass.
  4. Manufactured connection: the message claims no shared interest. Every
     specific in it is either the offer or a profile data point (the Laurel
     Clubs, the beneficiary families, the two named clubs). The profile records
     no public statements from Gregory and no stated interest in heritage venues
     or rural outings, and the draft asserts neither. Pass.
  5. Concreteness: the ask is a rough number, answerable in one sentence, and
     the revision makes a partial number acceptable. Pass.
  6. Band pattern: the opener leads with the sender and then the quoted thread,
     where the rest of the band opens on the sender and the location. The April
     history is unique to this contact. Pass.
  7. Final round email cardinality: one. Pass.
