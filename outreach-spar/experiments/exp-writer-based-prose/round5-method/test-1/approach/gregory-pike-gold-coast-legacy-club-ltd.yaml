          Gold Coast Legacy Club <admin@goldcoastlegacy.com.au> To
          partnerships@rivermill.au, body "Thanks for the email. I will
          absolutely pass this on to the Laurel Clubs for their discussion.",
          signed Joanne Russell, Office Administrator, Gold Coast Legacy Club
          Ltd. Its Message-ID is the one the dispatcher prefetch printed as the
          2026-04-10 hit, so prefetch and mailbox agree. UID 383, dated
          2026-04-13T12:05:22+10:00, is From partnerships@rivermill.au with
          Legacy on Cc, opening "Hi Joanne, Thank you for passing it along", and
          carries the group-visit detail pack. Method 4.6 makes the challenger's
