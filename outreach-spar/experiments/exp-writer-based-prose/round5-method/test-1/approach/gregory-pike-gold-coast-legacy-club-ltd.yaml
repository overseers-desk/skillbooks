# Contact: Gregory Pike, Secretary, Gold Coast Legacy Club Ltd
# Channel: email (primary, reply on the April thread), phone (follow-up Friday morning, no reply)
# Language: en-au
# Angle: the office as conduit. It forwarded our last offer to the Laurel Clubs; this one needs only the forward.
decisions:
  channel: email
  channel_detail: |
    Email today, Wednesday 23 September, from partnerships@rivermill.au to
    admin@goldcoastlegacy.com.au, sent as a reply on the April thread. Phone
    (07) 5500 6833 on the morning of Friday 25 September where there is no
    reply. Legacy House opens Monday, Wednesday and Friday, 8:30am to 2:30pm,
    so Friday is the first office day after the email; the segment's
    approach_sequencing step 3 says the next morning, and Thursday is a closed
    day. No platform channel: the roster carries no LinkedIn, the organisation
    has a Facebook page but no personal account for Gregory, and
    facebook-group-admin is out of this campaign.
  language: en-au
  angle: office-conduit-april-thread
angle_rationale: |
  Warmth is prior contact, and unlike most of this segment it is a two-sided
  record. The dispatcher prefetch and a direct read of the mailbox agree on
  three messages in admin-rivermill-au/Partnerships. Lia Movsisyan wrote from
  partnerships@rivermill.au on 9 April 2026 to admin@goldcoastlegacy.com.au,
  subject "Midweek outing venue for Legacy Laurel Clubs", addressed to Gregory.
  Joanne Russell, Office Administrator, replied on 10 April from the same
  office address: "Thanks for the email. I will absolutely pass this on to the
  Laurel Clubs for their discussion." Priyanka Das then sent the group-visit
  detail pack on 13 April, cc'd to the office address, opening "Hi Joanne".
  Nothing since.

  That record decides the angle. The question every message in this segment
  turns on is whether the organisation will circulate an offer to its people.
  Here it is not inferred from the organisation's shape; it is on file, because
  the office did exactly that five months ago with our own material. So the ask
  is the one act they have already performed for us, and the difference worth
  naming is what follows it. April asked them to assemble a bus trip, which
  needs the clubs' calendars and a committee. This asks for a forward.

  Reply on the April thread rather than a fresh subject (method 4.1.1). Warmth
  is prior, a thread exists in the prefetch, and the contact's roster address is
  the From of a message in it, so the rule's true branch applies. The gloss
  underneath it points the same way: the rule matters most for sparse or
  long-quiet relationships, where a new subject would read as cold. The thread's
  topic, a Laurel Club visit to Rivermill, is compatible with the offer.

  Parent selection departs from the letter of 4.1.1 for a reason. The most
  recent message in the thread is our own 13 April note, addressed to
  partnerships@rivermill.au with Legacy on Cc, so threading to it would derive a
  To of our own address. The parent is therefore the message before it, Legacy's
  10 April reply, whose From is the roster address. Threading and addressing
  both come out right and the References chain still carries the whole thread.

  The cost of the decision, for the reviewer: the derived subject carries the
  recipient-specific element method 4.5 requires ("Legacy Laurel Clubs") but
  says nothing about the school holidays or the four-day window. The urgency
  sits in the body instead. It buys something the alternative cannot. The
  challenger's persona said the April history was the one thing that would stop
  him replying, because he does not recognise it, and a reply on the thread puts
  the evidence for that history directly beneath the sentence asserting it.

  The audience inside this organisation is not the Laurel Club cohort alone. The
  members are veteran widows, predominantly 60s to 90s, and the show is a family
  circus. Legacy supports roughly 850 widows, children and families of deceased
  veterans, so the message names the wider beneficiary families as well as
  grandchildren visiting over the holidays. The segment block's own objective
  uses that framing, so it is the campaign's reading rather than the author's.

  USPs. nothing-to-organise leads, because it is the lever that answers what
  stalled in April: the plan block marks it as applying where circulating an
  offer to members is already what the organisation does, and this office has
  done it. opening-week-seats carries the offer itself, seven shows Thursday 24
  to Sunday 27 September, free. not-advertised is the emotional lever in the
  framing the block gives it, written as one flat sentence with no reason
  attached, since the reasoning behind the give-away stays out of every message.
  big-top-at-a-heritage-farm is not argued; it sits in the descriptive clause
  that tells the reader what the thing is.

  group-visit-later closes the message rather than leading it. It is not in this
  segment's USP list, but the block's own first_ask prescribes the closing offer
  of a group visit next week, and here it does double duty: it gives the stalled
  April conversation a live answer, in one conditional sentence that cannot
  compete with the primary ask.
response_likelihood: 70
a_note: |
  Office-as-conduit angle (forward free opening-week tickets to Laurel Club
  members and the wider veteran families Legacy supports, no outing to run);
  email primary, sent as a reply on the April thread, with a phone follow-up
  Friday 25 September because Legacy House is shut Thursday; warmth prior
  contact, two-sided (Joanne Russell's 10 April 2026 reply undertaking to pass
  our outing offer to the clubs, our 13 April detail pack, nothing since); en-au.
  One challenger pass, verdict REVISE. Its fact-check claimed the April reply
  and the 13 April follow-up do not exist; that finding is wrong against the
  mailbox and was not applied, evidence in the round-1 fact_check. Its
  in-character objection was valid for a different reason and the draft changed
  for it: Gregory was addressee of the first note only, so the history is now
  attributed to his office and points at the quoted thread he can check.
rounds:
  - type: draft
    number: 1
    chosen_usps: [nothing-to-organise, opening-week-seats, not-advertised, big-top-at-a-heritage-farm]
    notes: |
      Element order is a-b-c per method 4.5: who I am, the ask, then the
      reasons. No code, no price, no link in the first message. Antifact pass:
      no stone buildings, no building age of any kind, no farming claim in
      either direction, no vineyard, no Tamborine Mountain; location given as
      Mount Nathan on the Coomera River.
    messages:
      - channel: email
        body: |
          Dear Gregory,

          Priyanka Das here, from Historic Rivermill, the heritage venue on the Coomera River at Mount Nathan. We wrote to your office in April about a midweek outing for the Laurel Clubs, Joanne said she would pass it to the clubs, and I sent the outing details across on 13 April. I have not heard anything since.

          I am writing now with something easier to take up. A circus company has a big top on our lawn for the school holidays, and I have free tickets to their family show, WANTED – A Cirque Heist, for your Laurel Club members and the families Legacy supports. There are seven shows between Thursday 24 and Sunday 27 September, the first at 1pm this Thursday. Reply with a rough number, and which sessions suit if anyone has a preference, and I will hold them in Legacy's name and send back a code and a booking link for you to pass on.

          There is nothing to organise at your end. No bus, no permission forms, no group to get together. Each family books the session that suits them.

          The tickets are not advertised and are not offered to the public. They are for your own members and the families you support, rather than for posting publicly.

          If a proper group visit would suit Legacy better than a forward, next week suits that. Tell me a day and I will come back to you.

          Kind regards,

          Priyanka Das
          Partnerships
          Historic Rivermill
          partnerships@rivermill.au
        director_note: |
          Sent as a reply on the April thread; the parent block is on the final
          message. The reply to his answer carries the code, the Eventbrite link
          and the Sunday cut-off.
