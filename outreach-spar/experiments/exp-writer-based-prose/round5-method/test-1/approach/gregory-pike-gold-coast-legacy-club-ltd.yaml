        to: (07) 5500 6833
        text: |
          Follow-up call the morning of Friday 25 September where the email has
          drawn no reply. Ask for a rough number, nothing more.
        script:
          - point: Who is calling
            text: "Good morning, it's Priyanka Das from Historic Rivermill, the venue out at Mount Nathan. Is Gregory available? Or Joanne, if she is in."
          - point: Why the call
            text: "I sent an email through on Wednesday about the school holidays, on the back of an older thread with your office. I thought I would ring rather than let it sit in the inbox."
          - point: The offer
            text: "There is a circus in a big top on our lawn for the holidays, a family show called WANTED – A Cirque Heist. I have free tickets for your Laurel Club members and the families Legacy supports. Shows are running today, tomorrow and Sunday."
          - point: The ask
            text: "All I need from you is a rough number. I will hold that many in Legacy's name and email you a code and a booking link this morning, and your families book whichever session suits them."
          - point: Why it is light on the office
            text: "There is nothing to arrange at your end. No bus, no forms, nobody has to be got together. It is one email for you to forward."
          - point: Where the tickets go
            text: "They are not advertised and they are not offered to the public, so I would ask that they go to your own members and the families you support rather than onto Facebook."
          - point: If a group outing comes up instead
            text: "If Legacy would rather bring a group out properly, next week suits that better anyway. Give me a day that works and I will come back to you on it."
          - point: Close
            text: "Shall I send the code and the link to admin@goldcoastlegacy.com.au?"
          - point: If Gregory and Joanne are both unavailable
            text: "No trouble. Would you let him know Priyanka from Historic Rivermill rang about the free circus tickets for the Laurel Clubs, and that the last show is Sunday? If you can give me a rough number yourself I will hold them now, and the email with the booking link goes to the office address."
        phone_note: |
          Legacy House opens Monday, Wednesday and Friday, 8:30am to 2:30pm, so
          the call is Friday morning. Gregory Pike is the Secretary; Joanne
          Russell, the Office Administrator, is the one who answered in April.
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      Today is Wednesday 23 September 2026, an office day, so I would in fact be
      reading this on the day it arrived.

      What would stop me replying: the claim that "Joanne said she would pass it
      to the clubs" and that a follow-up went out on 13 April. I don't recognise
      either of those. If someone tells me about a conversation and a document I
      have no memory of, my first reaction is not warmth, it is caution about who
      I am dealing with. Is this a form letter padded with a made-up history to
      sound personal, or has it gone to the wrong club. That would make me want
      to check with Joanne before doing anything, not refuse outright, but it is
      a genuine hesitation, not a passing question.

      What I would just ask, not an objection: which of the seven sessions still
      have room, whether the offer is Laurel Club members only or extends to the
      wider 850 families we support, and whether I can split the numbers across
      more than one club (Nerang, Southport) rather than naming one figure.

      Is it possible in the time given: yes, but only barely for tomorrow. I can
      give a rough number today for whichever club I can reach by phone this
      afternoon, but the Laurel Clubs meet monthly and I have no standing
      headcount to hand. A real rough number covering all clubs needs me to ring
      around, which is more a Friday job than a same-day one. Thursday's 1pm show
      is realistically out of reach for an organised reply from us; Friday,
      Saturday and Sunday are not.

      REPLY_PCT: 70
    fact_check:
      - claim: Joanne said she would pass it to the clubs, and the outing details went across on 13 April.
        source: Mailbox read of admin-rivermill-au/Partnerships, UIDs 352 and 383, 2026-09-23.
        result: verified
        note: |
          The challenger reported this as unsupported, saying the correspondence
