          This is a lighter thing to take up. A circus company has a big top on our lawn for the school holidays, and I have free tickets to their family show, WANTED – A Cirque Heist. They are for your Laurel Club members and for any of the families Legacy supports, not only the clubs. There are seven shows across Thursday 24 September to Sunday 27 September. The season opens at 1pm tomorrow, which is short notice for you, so the weekend sessions are the practical ones.

          Reply with a rough number and I will hold that many in Legacy's name, then send back a code and a booking link for you to pass on. It does not need to be a final figure. Start with whichever club you can reach, split it across Nerang, Southport and the others however suits, and add to it later in the week.

          There is nothing to organise at your end. No bus, no permission forms, no group to get together. Each family books the session that suits them.

          The tickets are not advertised and are not offered to the public. They are for your own members and the families you support, rather than for posting publicly.

          If a proper group visit would suit Legacy better than a forward, next week suits that. Tell me a day and I will come back to you.

          Kind regards,

          Priyanka Das
          Partnerships
          Historic Rivermill
          partnerships@rivermill.au
