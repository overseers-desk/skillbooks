          file; the correspondence record sits outside it.
      - claim: Joanne Russell is the Office Administrator at Gold Coast Legacy Club Ltd.
        source: Her own signature block in UID 352, 2026-04-10.
        result: verified
        note: Also flagged by the challenger as unsupported, on the same wrong premise.
      - claim: The season opens Thursday 24 September at 1pm.
        source: Showtimes file, 2026-09-23.
        result: verified
      - claim: Seven shows from Thursday 24 to Sunday 27 September.
        source: Campaign YAML header and the opening-week-seats USP.
        result: verified
      - claim: The free seats are not advertised and are not offered to the public.
        source: not-advertised USP.
        result: verified
        note: |
          Written flat, with no reason attached. Nothing in the draft suggests
          seats are unsold or that the offer serves the sender.
      - claim: Mount Nathan, on the Coomera River.
        source: business-overview.md, USP U1 and the address line; venue block in the campaign YAML.
        result: verified
    antifact_check: |
      Checked against every item in the antifact checklist, for both drafts and
      the phone script. No stone buildings. No 100-year-old buildings, heritage
      structures or original mill buildings; the text makes no claim about the
      age of anything built, which also keeps the April pack's "heritage
      arrowroot mill site dating back to the 1910s" out of this message. No
      farming claim in either direction. No vineyard. Not placed on Tamborine
      Mountain; the location is Mount Nathan on the Coomera River. Against the
      campaign's author appendix: no code, no price, no link of any kind, no
      discount, no Oztix link, no feed-bag or animal-food offer, and no show
      time the showtimes file does not carry.
    revision_note: |
      The persona raised five points. Sorted before the draft was touched.

      1. Does not recognise Joanne's reply or the 13 April follow-up, and reads
      unrecognised history as a padded form letter. Answered in this email; it
      is the one thing that stops the reply. The fact-check above shows the
      history is real, so the fix is attribution rather than deletion. Gregory
      was the addressee of the 9 April note and nothing after it: Joanne answered
      from the shared office address, and the 13 April pack was written to her.
      Telling him what he said describes events he was not party to. The revision
      gives the exchange to his office, cuts it from three sentences to two, and
      points at the thread quoted below the message, which he can check.

      2. Laurel Club members only, or the wider families Legacy supports?
      Answered in this email. One clause, and it widens the number he can give.

      3. Can the numbers be split across more than one club? Answered in this
      email. He named this as the reason he cannot produce a single figure, so
      leaving it for the reply leaves the ask blocked.

      4. A number covering all clubs needs a round of phone calls, more a Friday
      job, and Thursday's 1pm is out of reach. Absorbed by reframing. The draft
      led with tomorrow's 1pm opening, which set a deadline he cannot meet and
      made the offer feel out of reach. The revision names the weekend sessions
      as the practical ones and makes the figure provisional, splittable, and
      open to being added to later in the week. The offer's shape supports that:
      the sender holds a per-show tally against a reservation in the
      organisation's name, so a number that grows is what the hold is for.

      5. Which sessions still have room? Left for the reply. He asks it while
      already replying. It is also the question whose answer sits closest to the
      bar on any suggestion that seats are unsold, so it belongs in a
      held-reservation conversation rather than a first touch.

      The phone script changed with the email: the ask is pitched at a partial
      number, and the caller is told to move past the April exchange rather than
      argue it if Gregory does not recall it.
