quality_checklist: |
  1. Structure: root keys from the canonical set; both draft and review rounds
     carry number; the final round has one email and one phone message; the
     to-address is the live one from the profile's Facebook listing. Pass.
  2. Coverage: fact_provenance reaches every factual claim in the final email
     and the phone script, marking which claims appear in the script only.
     chosen_usps is on the draft and final rounds. Pass.
  3. Presupposition: no sentence tells Allan something he already knows about
     his own club. The April line is our conduct, not his. Pass.
  4. Manufactured connection: the message claims no shared interest. The club's
     inter-club travel habit shaped the choice of ask and stays out of the text,
     since naming it would be reciting his own calendar back to him. Pass.
  5. Concreteness: the ask is a rough number, answerable in one sentence. Pass.
  6. Band pattern: the opener leads with the sender and the location rather than
     the recipient's activity, and the April line is unique to this contact, so
     it will not read as the band's template. Pass.
  7. Final round email cardinality: one. Pass.
