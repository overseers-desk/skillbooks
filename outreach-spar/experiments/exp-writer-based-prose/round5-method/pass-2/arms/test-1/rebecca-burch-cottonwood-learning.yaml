quality_checklist: |
  1. Structure. Root keys drawn from §6's set. Every draft and review round
     carries type and number. The final round holds one email and one phone
     message, so the email cardinality cap holds. Both addresses are real,
     taken from the roster and confirmed in the profile.
  2. Coverage. fact_provenance covers every factual claim in the final email
     and phone script. chosen_usps is present on all three draft rounds and
     on the final round.
  3. Presupposition. No sentence recites her programme, her qualifications,
     her philosophy or her catchment back to her. The only facts about her
     world in the message are the drive time and the word "families", and
     both carry the proposition rather than perform research.
  4. Manufactured connection. The nature-education alignment is not claimed.
     The profile records no statements on farm visits or animal encounters,
     and none is implied. The closest the message comes is naming the tent as
     a real big top on a lawn, which is our own ground.
  5. Concreteness. "Tell me roughly how many families are in the group" is
     answerable in one sentence, and the campaign's message_goal asks for
     exactly that.
  6. Band pattern. The opener leads with the unanswered March note, which no
     other message in this band can carry. The subject names Cottonwood, so
     it deduplicates against every other subject in the campaign on an
     element with attention value rather than on her name.
  7. Final email cardinality. One email, one phone. Passes.
