  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      Free circus tickets arriving cold from a hinterland venue I do not
      recognise. My first instinct is mild wariness, the kind any "free"
      offer in the business inbox gets. Reading on, nothing here actually
      asks anything of me. No outing to run, no code to chase up front, just
      a rough number and then forward what she sends. That is a low bar. The
      March line is plausible; a lot comes through hello@ that I do not get
      to, and a "come and visit" invitation is a bigger ask than free
      tickets. That she is following up rather than writing me off is a point
      in her favour. The timing is tight but the ask matches it. Had she
      asked me to bring the group as an excursion by tomorrow, that would
      stop me cold. We are an outdoor nature playgroup, not a bus-charter
      operation. She has already offered the following week for that, which
      is the sensible version. The one thing that gives me pause, not enough
      to stop me but enough that I would ask it, is why a commercial season
      gives away opening week rather than discounting it. I would want to
      know it is not a mailing-list harvest before forwarding under my own
      name. Fit is a soft consideration, not a blocker; we are
      nature-and-outdoors, not circus, but our families would enjoy a free
      school-holiday outing regardless. What would stop me replying: nothing
      in the message. What I would ask: the code mechanics, and whether I can
      just pass the link on rather than hold a headcount I cannot predict two
      days out.
      REPLY_PCT: 50
    fact_check:
      - claim: Under fig trees more than a hundred years old.
        source: business-overview.md lists fig trees among the grounds' features with no age; business-antifacts.md ages the property's trees at more than 100 years with no species attached.
        result: unsupported
        note: No source ties the century-plus age to the figs rather than to another tree on the property.
        correction: Remove the claim.
      - claim: The tent stands on open lawn beside the river.
        source: Campaign YAML places the big top on the lawn at the venue; business-overview.md places the dining deck beside the Coomera River.
        result: unsupported
        note: The tent's position relative to the water is asserted, not sourced. The river-adjacent structure the sources describe is a different one.
        correction: Remove the claim. What the sources do support is a big top on our lawn, up for the school holidays only.
      - claim: Seven shows Thursday through Sunday, first at 1pm; no code, price, discount, Oztix link, feed-bag offer or unsold-seat implication.
        source: Campaign YAML mothers-group plan block and usps registry; showtimes file; a_challenger appendix.
        result: verified
    antifact_check: |
      None of the antifact claims appear: no stone buildings, no original or
      100-year-old mill structures, no vineyard, no Tamborine Mountain
      location. The tree-age claim is the inverse case, asserting more than
      the antifact file establishes, and is removed.
    revision_note: |
      Point sorting before revising.
      (1) and (2) The tree age and the tent's position: both cut. The whole
      setting sentence goes with them, since what survives is already carried
      by the introduction (a venue on the Coomera River) and the offer
      sentence (a big top on our lawn). The sourced remainder moves into the
      offer sentence: a real big top, pitched on our lawn for the school
      holidays only. The persona had already said the nature fit is soft, so
      the deletion costs the angle nothing.
      (3) Why a commercial season gives away opening week: half answered in
      this email, half left for the reply. The sanctioned half is the
      not-advertised claim, absorbed into the sentence already there about
      not posting publicly. No line is added disclaiming any interest in her
      families' details, because denying a suspicion in a first-touch email
      is what plants it. The phone note gains the same sanctioned answer for
      a caller who is asked.
      (4) Holding a headcount she cannot predict: absorb by reframing. The
      campaign needs a number to set seats aside per show, so the ask stays.
      One clause says an approximate number is all that is wanted, and "hold"
      becomes "set aside".
      (5) The code and booking mechanics: leave for the reply, named as a
      reply question in both passes.
      (6) The March follow-up reading as persistence, the ask matching the
      timing, the second-week alternative: kept unchanged.
    notes: Persona reply estimate 50%. not-advertised enters chosen_usps at draft 3.

