  - type: review
    number: 3
    verdict: DONE
    in_character: |
      A venue I do not know well, forty minutes inland, offering free circus
      tickets with no strings I can see. The ask is trivial: a rough
      headcount, then forward a code when it comes, nothing to organise on my
      end. The message explicitly is not asking me to run an excursion in a
      day and a half. The reference to writing in March and hearing nothing
      back is a fair, low-key way to reopen contact. It does not guilt-trip
      me, it explains why she is keeping this short. Points that would stop
      me replying: none. Nothing here asks for money, personal information,
      or a commitment I cannot easily undo. Points I would simply ask in my
      reply: whether the lawn and paths are pram-friendly, since my families
      bring prams and toddlers; which of the seven shows suits families with
      very young children; and I would give my rough family count once I have
      put the word out.
