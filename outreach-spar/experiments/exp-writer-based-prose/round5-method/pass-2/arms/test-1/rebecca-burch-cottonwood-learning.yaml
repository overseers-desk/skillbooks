          - point: The offer
            text: |
              There is a family circus in a real big top on our lawn for the school holidays, WANTED – A Cirque Heist. The first show is at one o'clock this afternoon, and there are seven shows through to Sunday. I have free tickets for your families.
          - point: The ask
            text: |
              Tell me roughly how many families are in the group and I will set seats aside under Cottonwood's name. A rough number is all I need. Then I will email you a code and a booking link this morning. Each family books whichever show suits them, so there is nothing for you to organise.
          - point: The boundary
            text: |
              Opening week is going to local groups rather than being advertised, so they are for your own families rather than for putting on the page.
          - point: Alternative
            text: |
              If the group would rather come together instead, next week suits that better. Give me a day and I will come back to you on seating.
          - point: Close
            text: |
              No trouble either way. If it is not for you, say so and I will leave you to the holidays.
        phone_note: |
          Her Nature Playgroup sessions run Tuesday and Thursday 9:00 to
          10:30am, so she is with families until about 10:30. Do not call
          before 10:45. If she answers mid-pack-up, offer to call back rather
          than press on. If she asks how the code works for a booking, say it
          comes with the email. If she asks why the tickets are free, say
          opening week is going to local organisations rather than being
          advertised, and leave it there. If she asks about pram or
          wheelchair access on the lawn, say you will check with the circus
          operator and come back to her, and do not answer it on the call.
        actioned_date: null
        replied_date: null
