profile_hash: sha256:d2000126456bc3ec4ec71d08063a878c422da1b943a172adbe713d0e07049d25
# Contact:  Rebecca Burch, Founding Director, Cottonwood Learning Nature Playgroup
# Channel:  Email (23 September), phone follow-up (24 September) if no reply
# Language: en-au
# Angle:    A school-holiday outing she hands to her families rather than organises
decisions:
  channel: email
  channel_detail: |
    Email plus phone, no platform channel on the roster, so SPAR-A §4.2 rule
    two. The campaign's approach_sequencing for this segment overrides the
    method's three-day phone default: phone the next morning where there is
    no reply and a number is listed. Her Nature Playgroup runs Tuesday and
    Thursday 9:00 to 10:30am, so the call is placed from 10:45.
    New subject rather than a reply on the March thread: see angle_rationale.
  language: en-au
  angle: holiday-outing-to-hand-on
angle_rationale: |
  Warmth: prior contact, one way, unanswered. The dispatcher prefetch returns
  a single outbound message, 2026-03-31, partnerships@rivermill.au to
  hello@cottonwoodlearning.com.au, subject "Nature education venue on the
  Coomera River -- visit invitation", filed in two folders of the
  admin-rivermill-au account. No inbound message from that address appears in
  any of the five accounts searched. So we wrote and heard nothing back.
  Under §4.1 that is "prior contact": reference the touchpoint, claim no
  relationship. The campaign's a_author appendix makes naming it mandatory,
  in one plain line that says what the earlier note was about.

  New subject, not a thread reply. §4.1.1's conjunction is met on two terms
  of three: warmth is prior, and the roster email appears in the chain. It
  fails on "a current thread". The chain is one unanswered outbound note from
  nearly six months ago, so there is no conversation to continue. A "Re:" on
  a March visit invitation would also put a stale subject in front of an
  offer that expires on Sunday. The appendix's instruction to name what the
  earlier note was about presupposes a message where it is not already quoted
  below the signature. §4.1.1's false branch applies: new subject, in-body
  reference to the prior touchpoint.

  Angle candidates, ordered by evidence strength:

  1. An outing for the playgroup's families, with nothing for her to
     organise. Her Nature Playgroup is 0-4 year olds attending with families,
     which is the population the seats are for. Circulating something to
     those families is what a playgroup organiser already does. That is
     exactly the condition the nothing-to-organise USP's rests_on sets, and
     exactly the case its exclusion (childcare and OSHC enrolment lists) does
     not cover. Selected as primary.
  2. The setting. Her stated founding purpose is "giving children opportunity
     for free play in nature", she holds Forest School Leader Level 3, and
     her sessions run outdoors. A tent on open lawn is a real point of
     contact with that audience. Held to one clause about our own ground,
     because the profile records no statements on farm visits or animal
     encounters, and reading nature pedagogy into a circus would be a
     manufactured connection. The challenger confirmed the fit is soft:
     "we're nature-and-outdoors, not circus, but our families would still
     enjoy a free school-holiday outing regardless of the brand."
  3. Distance. The profile names the ~40 minute drive from Currumbin as the
     main constraint. The angle answers it structurally rather than arguing
     with it: each family decides for itself, so the drive is never hers to
     justify. One clause names the distance rather than leaving her to find
     it out.
  4. Rejected as the lead: a group visit. Her programme is mobile across
     three southern Gold Coast sites and she runs drop-off holiday sessions,
     so a Rivermill session is structurally plausible. It is not achievable
     by Sunday. It survives as the closing alternative, which the segment's
     own first_ask carries.

  USPs: nothing-to-organise and opening-week-seats (functional),
  big-top-at-a-heritage-farm (emotional). not-advertised was held back for
  two passes, because its segment framing ("handing members something nobody
  else can get") invites flattery. The pass-2 reaction changed that: the
  recipient's one hesitation was not knowing why a season would give away its
  opening week, and the registry's claim answers precisely that. It entered
  at draft 3, absorbed into the sentence already governing the offer's
  non-public shape. The reasoning behind the Director's ruling stays out, as
  its own rests_on requires.

  Response likelihood held at 45 against the challenger's closing 80. The
  three persona passes ran 55, 50, 80 on a draft that changed little between
  the second and third. The drags are structural and no wording removes them:
  our March approach went unanswered, the drive is forty minutes, and the
  notice is one day. Against that, the ask is a single line to answer and
  costs her nothing.
response_likelihood: 45
a_note: |
  Angle: the holiday outing she hands to her families rather than organises,
  with the second week offered for a group. Channel: email 23 September,
  phone 24 September from 10:45am if no reply. Warmth: prior contact, one
  way, unanswered since 31 March 2026, named in the message. Language: en-au.
  Drafting note: the number asked for is the size of the group, not a
  forecast of uptake, after the persona read a headcount ask as a commitment
  she could not make two days out.
rounds:
  - type: draft
    number: 1
    chosen_usps: [nothing-to-organise, opening-week-seats, big-top-at-a-heritage-farm]
    notes: |
      Element order a-b-c per §4.5: introduce, ask, then reasons. The prior
      touchpoint is folded into the introduction rather than given its own
      paragraph. not-advertised deliberately omitted; its substance carried
      by the mandated "not for posting publicly" line.
    messages:
      - channel: email
        to: hello@cottonwoodlearning.com.au
        subject: Free circus tickets for your Cottonwood families, from tomorrow
        body: |
          Dear Rebecca,

          I am Priyanka Das and I look after partnerships at Historic Rivermill, a venue on the Coomera River at Mount Nathan, about forty minutes inland from Currumbin. I wrote to you in March inviting you to visit, and heard nothing back, so I will keep this short.

          I have free tickets to WANTED – A Cirque Heist for your Cottonwood families. It is a family circus in a big top on our lawn, seven shows from tomorrow, Thursday 24 September, through to Sunday, the first at 1pm. Reply with roughly how many families you would pass it on to and I will send you a code and a booking link for the group. Each family books the show that suits them, so there is no outing for you to run and nothing for you to arrange in the days that are left.

          They are for your own families rather than for posting publicly.

          The tent stands on open lawn beside the river, under fig trees more than a hundred years old.

          If the group would rather come together, next week suits that better. Tell me a day and I will come back to you.

          Priyanka Das
          Partnerships, Historic Rivermill
          Colourful.land Pty Ltd
          partnerships@rivermill.au
      - channel: phone
        to: 0473 021 887
        text: |
          Thursday 24 September from 10:45am, if no reply to the email. A
          one-minute call to get a yes or no on passing the tickets to her
          families, and a rough number.
        script:
          - point: Opening
            text: |
              Hi Rebecca, it's Priyanka Das from Historic Rivermill at Mount Nathan. I sent you an email yesterday about free circus tickets for your playgroup families. Have I caught you at a reasonable moment?
          - point: The offer
            text: |
              There is a family circus in a big top on our lawn for the school holidays, WANTED – A Cirque Heist. It opened at one o'clock today and runs seven shows through to Sunday. I have free tickets for your families.
          - point: The ask
            text: |
              If you can pass it around the group, tell me roughly how many families and I will email you a code and a booking link this morning. Each family books whichever show suits them, so there is nothing for you to organise.
          - point: The boundary
            text: |
              They are for your own families rather than for putting on the page.
          - point: Alternative
            text: |
              If the group would rather come together instead, next week suits that better. Give me a day and I will come back to you on seating.
          - point: Close
            text: |
              No trouble either way. If it is not for you, say so and I will leave you to the holidays.
        phone_note: |
          Her Nature Playgroup sessions run Tuesday and Thursday 9:00 to
          10:30am, so she is with families until about 10:30. Do not call
          before 10:45. If she answers mid-pack-up, offer to call back rather
          than press on.

  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      The "heard nothing back" line names the true state of things plainly
      rather than guilting me, so I am not embarrassed reading it. What would
      stop me replying: I do not know Priyanka Das or Rivermill first-hand,
      and forwarding something to my families on a stranger's word gives me a
      moment's pause before I put my name behind it. The distance weighs too.
      My families are Currumbin, Tugun and Elanora based, and Mount Nathan is
      not somewhere most of them would drive for a one-off show on short
      notice. Together those mean I am not certain the forwarding gets used,
      which makes the ask feel more like a favour to Rivermill than to my
      families. What I would just ask in my reply: how the code works when a
      family books, and whether there is anything to say about pram or
      wheelchair access on the lawn. The offer's shape is doable in the time.
      Forwarding a link to my own group by tomorrow is realistic.
      REPLY_PCT: 55
    fact_check:
      - claim: The phone script's "It opened at one o'clock today", spoken from 10:45am on Thursday 24 September.
        source: "2026-09-23-stampede-arena-showtimes.md: the season opens Thursday 24 September at 1pm."
        result: incorrect
        note: At 10:45am the first show has not yet started, so the past tense is false at the moment of delivery.
        correction: The first show is at one o'clock this afternoon, and there are seven shows through to Sunday.
      - claim: Seven shows from Thursday 24 September through to Sunday, the first at 1pm.
        source: Campaign YAML header (opening week, Thursday 24 to Sunday 27 September, seven shows) and the showtimes file (season opens Thursday 24 September at 1pm).
        result: verified
      - claim: We wrote to this contact in March inviting her to visit and heard nothing back.
        source: "Courier prefetch: outbound 2026-03-31, \"Nature education venue on the Coomera River -- visit invitation\", no inbound from hello@cottonwoodlearning.com.au in any searched account."
        result: verified
    antifact_check: |
      No code, price, discount, Oztix link, feed-bag or animal-food offer, and
      no suggestion that seats are unsold or that the offer serves the sender.
      mothers-group carries no farm or animal USP, and none appears.
    revision_note: |
      Point sorting before revising.
      (1) "It opened at one o'clock today" spoken at 10:45am: factual error,
      fixed in the phone script.
      (2) Putting her name behind a stranger's offer: answer in this email. A
      reply-stopper, not a curiosity. Absorbed two ways. The seats are set
      aside under Cottonwood's name rather than circulated as a public code,
      and the signature gains the street address so she can see we are a real
      place before forwarding anything.
      (3) The ask reads as a favour to Rivermill: absorb by reframing. The
      ask now seeks the size of the group, not a forecast of how many will
      go. No reassurance sentence was added, because any line about take-up
      edges toward implying spare seats, which the a_author appendix rules
      out.
      (4) How the code works, and pram or wheelchair access: leave for the
      reply, both named as questions rather than blockers. Access cannot be
      answered at all yet, since the campaign holds its two disability
      segments until the operator states the tent's position. The phone note
      now tells the caller to undertake to find out rather than improvise.
      (5) The March line and the offer's doable shape: read as intended, kept
      unchanged.
    notes: Persona reply estimate 55%.

