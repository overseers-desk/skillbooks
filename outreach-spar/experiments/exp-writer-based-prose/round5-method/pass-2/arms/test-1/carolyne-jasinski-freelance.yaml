  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      Reaction as Carolyne. A partnerships person from a venue she has never dealt with wants a
      reply today naming a show for tomorrow afternoon, and she is in Adelaide. There is no
      version of her getting a family of four to Mount Nathan by 1pm tomorrow, and the email does
      not pretend otherwise. That is what keeps her reading rather than deleting: the out is
      offered by the sender. The ask is not one she can meet, and the email does not require her
      to meet it.

      The venue reads right for her patch: a farm-stay and deer episode behind her, a Gold Coast
      Bulletin byline, the Overnight segment on 4BC, and a big top on a heritage lawn for the
      school holidays is the light, photogenic story that segment runs. A circus company is not
      something she would chase herself, so a partnerships person flagging it unprompted is
      useful.

      Two things needle her. The "what I want from it" line spells out a story-for-access trade.
      It is honest and she would rather know than guess, but it means she is reading a pitch
      rather than a favour, and she will treat "a look before your audience gets one" as
      marketing copy. Second, the turnaround: email today, opens tomorrow, a call before opening
      if she has not answered. That is a business chasing a deadline it set itself. Neither
      would stop her replying; both shape what she says.

      Her actual reply: not local this week, send the season dates and photographs so she can
      look at fitting it into the segment while there is season left. She might also ask whether
      a Gold Coast Bulletin colleague nearer the venue is a better first stop for hands-on
      coverage.

