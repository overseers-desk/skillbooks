quality_checklist: |
  1. YAML structure. Root keys drawn from the §6 canonical set: decisions, angle_rationale,
     response_likelihood, a_note, rounds, fact_provenance, quality_checklist. No profile_hash,
     which the harness prepends. Every draft and review round carries a number. Addresses are
     real, not placeholders. The LinkedIn message uses channel linkedin with text, the shape the
     validator's linkedin_guard reads, and the note is 276 characters against its 300-character
     cap. Passed.
  2. Coverage and completeness. fact_provenance reaches every factual claim in the final email,
     the connection note and the phone script, including the access claim the script declines to
     make. chosen_usps is populated on all four draft rounds and the final. a_note carries angle,
     channel, warmth, language, the three-pass challenger history and the two live cautions.
     Passed.
  3. Presupposition test. Nothing narrates her career back to her. Her programme's outlet appears
     once, in the subject line, as the addressing that tells her the mail is hers. The body
     presupposes that she has an audience with school holidays to fill and never says so. Passed.
  4. Manufactured-connection test. No claim of shared interest is made at all. The one
     recipient-specific element, the 4BC travel segment, is her own public self-description in
     the profile. The farmstay precedent and the TravHost mechanism, both in the profile, are
     deliberately unused because the campaign's offer is a circus season. Passed.
  5. Concreteness. The ask is a show, answerable in one sentence, which is the plan block's
     message_goal. The second path is answerable in one sentence too, which is what makes the
     message answerable from Adelaide at all. Passed.
  6. Band-level pattern check. The opener works from the venue and the offer rather than from a
     compliment or a template greeting. It differs in shape from the organiser-segment drafts
     already written in this campaign, which open on circulation to members. Passed.
  7. Final round email cardinality. One channel email message in the final round, plus one
     linkedin and one phone message, which the cap permits. Passed.
