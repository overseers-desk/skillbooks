quality_checklist: |
  1. YAML structure: root keys drawn from the section 6 set (decisions, rounds,
     angle_rationale, response_likelihood, a_note, fact_provenance,
     quality_checklist); no profile_hash, which the harness prepends (issue
     #63); every draft and review round carries type and number; addresses are
     real, taken from the roster and the campaign sender block. No validator
     subprocess was invoked.
  2. Coverage: fact_provenance lists every factual claim in the final email and
     phone script, including the two claims the phone script alone makes (the
     outside operator, the business phone number). chosen_usps present on the
     draft and final rounds. a_note carries angle, channel, warmth and language.
  3. Presupposition test: no sentence recites the sub-branch's own year back to
     it. The ANZAC Day material and the Thursday-evening meeting pattern were
     available and were left out for this reason. The April note is the sender's
     own conduct, not the recipient's.
  4. Manufactured-connection test: the angle rests on her role as Secretary,
     the sub-branch's active social programme, its member demographic and its
     location, each a profile data point. The profile's silence on heritage
     excursions and tourism is respected: the April note appears as continuity
     only, and no interest in heritage outings is attributed to her.
  5. Concreteness: the ask is a rough number of members, answerable in one
     sentence, which is the segment's message_goal.
  6. Band-level pattern check: this opener leads with the unanswered April note,
     a contact-specific opening that no other file in the band can repeat.
     Cross-check against the other approach files in the band is a band-level
     step for the reviewer, since this file is written on its own.
  7. Final round email cardinality: one email and one phone message in the final
     round, within the one-email cap.
