  - type: review
    number: 2
    verdict: REVISE
    in_character: |
      Someone I've never dealt with is offering me four free seats to a circus at a hinterland
      property I've never covered, with the show opening tomorrow and the offer good only through
      Sunday. That is not enough runway to do anything useful with it: no editor takes a pitch,
      commissions it and gets art approved in under 24 hours, and nothing about a big top at a
      farm venue sits close to what I actually write, equine culture in Sumba, a new rainforest
      trail, regenerative travel. A family-of-four circus outing reads like general what's-on
      content, which isn't a lane I work in. She's also emailed and connected on LinkedIn the
      same day, which feels less like a considered pitch to me specifically and more like a
      mail-out that landed on my details along with a lot of other people's. The venue and
      setting are pleasant enough, a heritage property on the Coomera with old fig trees, but
      that isn't enough on its own to build a story brief overnight. What would stop me replying:
      the topic doesn't match anything I cover, and the timeline makes an assignment impossible
      before the free window closes. What I'd simply ask if I did reply: whether the pass is
      transferable beyond an actual family group, and what if anything is expected in return.
      Reply estimate 25 per cent.
    fact_check:
      - claim: "I'm hoping it makes a school-holiday story for you."
        source: campaign prompt_appendices a_author and a_challenger; earned-media plan block, ask_stance and state_want; spar-campaign-yaml.md, the state_want definition.
        result: verified
        note: |
          The challenger read a_author's "does not say or imply that the offer helps us" as
          forbidding any statement of the want. That reading does not hold. The earned-media block
          sets ask_stance direct and state_want true, and spar-campaign-yaml.md defines state_want
          as whether the first message states the want outright, with direct implying true. All
          nine segments in this campaign set it true under the same a_author, so a reading that
          deletes the want makes the field unsatisfiable campaign-wide. What a_author guards is
          the seat being made contingent on coverage, which the not-advertised rests_on spells out
          as the marketing-channel reading. This sentence made nothing contingent.
        correction: |
          The sentence changed anyway, on the separate resolution score of 2. "A school-holiday
          story" tells a writer with a Lonely Planet book, a sustainable-tourism qualification and
          five awards that we take her for a listicle writer. Replaced with the want stated as the
          purpose of the seats, followed by the existing release of it.
      - claim: "Those are the opening shows, so you would see it before anything has been written about it."
        source: campaign usps registry, not-advertised, and its rests_on.
        result: error
        note: |
          The registry establishes only that the seats are not advertised and that the same shows
          sell at full price. It says nothing about whether another outlet has covered or will
          cover the season, and the segment's own stems list carries thirty contacts, which makes
          the claim improbable on its face as well as unsourced.
