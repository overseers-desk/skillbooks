          The tent is on the lawn, among fig trees more than a hundred years old. The property sits on the Coomera River. It is a straightforward drive north from Byron Bay.

          Public tickets are at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          Kind regards,

          Priyanka Das
