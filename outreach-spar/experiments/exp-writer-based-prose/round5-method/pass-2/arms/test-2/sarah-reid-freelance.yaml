  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      Nice enough note, and it lands in a week where I could actually use a local story. Mount
      Nathan, a big top on a heritage property above the Coomera, fig trees a century old, that
      is a picture editors like. I don't recognise Priyanka or Historic Rivermill, and there's no
      line telling me how she found me, but the drive from Byron Bay is nothing and the timing,
      while tight, isn't impossible: the window runs Thursday through Sunday, four days, so I can
      pick a day that works rather than scrambling for tomorrow specifically. The one number that
      doesn't quite add up is "seven opening-week shows" against "fourteen performances" total,
      not a red flag, just unexplained arithmetic I can't check from what's in front of me. No
      code, no price, nothing that smells like they're trying to fill an empty tent, just a
      straightforward pass offer and a request to name a day. I'd write back. The one thing I'd
      fold into my reply rather than treat as an objection is picking my day and asking whether
      the Sunday matinee or an evening slot works better for photos. Reply estimate 60 per cent.
    fact_check:
      - claim: The 1pm opening on Thursday 24 September, and fourteen performances in the season.
        source: plan-events showtimes file.
        result: verified
      - claim: Seven opening-week shows, Thursday 24 to Sunday 27 September.
        source: campaign preamble, the Director's ruling of 22 September; campaign usps registry, opening-week-seats.
        result: verified
        note: |
          Correct against the authority. Flagged separately at resolution score 2, because a
          reader of the message alone cannot derive seven from fourteen. That is a drafting
          fault, not a factual one.
      - claim: Public tickets at the Eventbrite listing, and no code or price anywhere.
        source: campaign usps registry, opening-week-seats; campaign prompt_appendices a_author.
        result: verified
        note: No Oztix link used, and the 130-against-500 pre-sale reasoning stays out.
      - claim: Fig trees more than a hundred years old; the Gold Coast hinterland siting; the cafe, horse riding and farm animals.
        source: business-antifacts.md; business-overview.md.
        result: verified
    antifact_check: |
      Clean. No stone buildings, no surviving mill or century-old structures, no vineyard, and no
      Tamborine Mountain siting. The century claim attaches to the trees, which is where the file
      puts it. No feed-bag or animal-food offer.
    revision_note: |
      Four points raised, sorted before touching the draft.

      1. "Seven opening-week shows" against "fourteen performances", answered in this email. The
         phrase scored 2 and the reader called it arithmetic she could not check. The count of
         shows inside her window does no work for her decision; the four days do. The ask now
         names the window and drops the partition, so the unresolvable number goes with it.
      2. No line saying how she was found, left for the reply. It did not stop the reply, and a
         line explaining the selection puts the sender's own reasoning into a message that
         otherwise only presupposes her world.
      3. Picking a day, and matinee against evening for photographs, left for the reply. She said
         she would fold it into her answer rather than treat it as an objection.
      4. Not recognising the sender or the venue, no change. The opening sentence already does
         that work and the picture landed.

      The presuppositions scoring 3, that she is a journalist, her beat, Byron Bay and the
      Coomera, all resolve against what she knows about herself, which is the intended mechanism.
      Kept.

