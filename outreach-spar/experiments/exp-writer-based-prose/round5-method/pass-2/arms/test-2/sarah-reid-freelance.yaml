quality_checklist: |
  1. YAML structure. Root keys drawn from the §6 canonical set: decisions, angle_rationale,
     response_likelihood, a_note, rounds, fact_provenance, quality_checklist. No profile_hash,
     which the harness prepends. Every draft and review round carries a number; the final round
     does not, per the §6 skeleton. Addresses are real, not placeholders. The LinkedIn message
     uses channel linkedin with text, and the note is 282 characters against its 300-character
     cap. Passed.
  2. Coverage and completeness. fact_provenance reaches every factual claim in the final email
     and the connection note, including the two the message declines to make. chosen_usps is
     populated on all four draft rounds and the final. a_note carries angle, channel, warmth,
     language, the three-pass challenger history and the two live cautions for R. Passed.
  3. Presupposition test. Nothing narrates her career back to her. Her Gondwana and Sumba pieces,
     her awards and her book are all absent, deliberately. The body presupposes that she has
     readers and a location and never says so, which the third pass scored 5 on both. Passed.
  4. Manufactured-connection test. No claim of shared interest is made. The two
     recipient-specific elements are her location, which is her own LinkedIn field, and the fact
     that she has readers, which her bylines establish. The profile's silence on Rivermill,
     farmstay and venue hire is treated as silence and nothing is built on it. Passed.
  5. Concreteness. The ask is a show, answerable in one sentence, which is the plan block's
     message_goal. The third pass confirmed it: all she has to do is reply naming a day. Passed.
  6. Band-level pattern check. Failed on first reading and fixed. Two files already in this
     campaign folder, lynley-southport-day-view-club and the-verge-at-burleigh-g-c, open with
     the same sentence this draft used, "I am Priyanka Das and I look after partnerships at
     Historic Rivermill, a heritage property ... with a cafe, horse riding and farm animals". The
     final splits that into three sentences carrying the same facts in a different shape. The
     ask itself already differs from every other file in the folder, which are organiser segments
     opening on circulation to members. Passes on re-reading.
  7. Final round email cardinality. One channel email message in the final round, plus one
     linkedin, which the cap permits. Passed.
