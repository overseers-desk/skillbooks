          A circus has pitched a big top on our lawn for the school holidays. WANTED – A Cirque Heist opens tomorrow, Thursday 24 September, at 1pm. There is a family pass of four here for you at any show from Thursday to Sunday this week. Opening week is set aside and is not advertised anywhere, and the same shows sell at full price on our own page and on the operator's ticketing. Reply with the show that suits and I will send you the booking details.

