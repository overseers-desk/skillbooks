      Six points raised, sorted before touching the draft.

      1. The timeline making an assignment impossible, answered in this email. She has conflated
         the pass window, Thursday to Sunday, with the season, which runs to 4 October. A further
         week of season stands after the window shuts, which is what the conversion funnel's step
         3 assumes. The draft carried 4 October as a buried clause; it now states the consequence.
      2. The pass unexplained, why comped, answered in this email. Cutting the sentence is not
         available because it is the ask, so the thing is introduced in the registry's own terms:
         opening week is set aside and not advertised, and the same shows sell at full price.
         That answers why it is free without touching the Director's internal reasoning.
      3. The beat mismatch, answered by reframe. The want stays, as state_want true requires, and
