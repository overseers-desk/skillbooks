          Dear Sarah,

          I'm Priyanka Das and I look after partnerships at Historic Rivermill, a heritage riverside venue at Mount Nathan in the Gold Coast hinterland, half an hour from the coast, with a cafe, horse riding and farm animals.

          CHARC Performance has pitched a big top on our lawn for the school holidays. WANTED – A Cirque Heist opens tomorrow, Thursday 24 September, at 1pm, fourteen performances running through to 4 October. There is a family pass of four here for you at any of the seven opening-week shows, Thursday to Sunday. Reply with the show that suits and I will send you the booking details.

          Opening week means you would see it before anything has been written about it. The tent stands on the lawn above the Coomera River, under fig trees more than a hundred years old. It is a straightforward drive north from Byron Bay.

          Public tickets are at https://www.eventbrite.com.au/e/wanted-a-cirque-heist-tickets-2000810786924.

          I'm hoping it makes a school-holiday story for you. If it doesn't, you would still be welcome to come and see it.

          Kind regards,

          Priyanka Das
          Partnerships, Historic Rivermill
          950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
          partnerships@rivermill.au
      - channel: linkedin
        to: https://www.linkedin.com/in/sarahreidtravels/
        text: "Sarah, I'm Priyanka, partnerships at Historic Rivermill at Mount Nathan in the Gold Coast hinterland. A circus has pitched a big top on our lawn for the school holidays, opening tomorrow. There's a family pass of four here for you at any opening-week show. I've emailed the details."
