# Contact: Sarah Reid, Adventure/Emerging/Regenerative Travel Writer, Freelance: Adventure.com
# Channel: email 23 September, LinkedIn connection note 25 September if no reply
# Language: en-au
# Angle: see-it-first-over-the-border

decisions:
  channel: email
  channel_detail: |
    Two pieces, both prepared. Email is the first touch, to sarah@sarahreid.com.au, the address
    she publishes unmasked on her own contact page and which P backfilled to the roster. A
    LinkedIn connection note follows on Friday 25 September, and only if the email draws no
    reply. There is no phone number on the roster, so there is no third piece.

    Sequencing departs from the §4.2 default for the connection-channel-plus-email case, which
    puts the connection note first and the email four to five days later. That cadence lands the
    email on 28 September, after the pass window closes on Sunday 27 September. The plan block
    governs instead: approach_sequencing step 1 is email on 23 September.

    The gap between the two pieces is deliberate and is the second departure. Draft 1 sent both
    on the same day. The role-play read the pair as a mail-out that had found her details rather
    than an invitation written to her, and the reply estimate fell to 25 per cent on the pass
    that carried it. A freelance travel journalist receives a large volume of PR, and two
    channels inside an hour is its signature. Moved to a two-day gap, the note reads as a
    follow-up on an email she can go and check.
  language: en-au
  angle: see-it-first-over-the-border

angle_rationale: |
  Target validity. star_rating 5, date_excluded null, profile yield 9, and the profile carries
  no defer or exclude signal. The §4.0 gate passes. Yield 9 sits in the top band of §4.6, which
  budgets up to three challenger passes; all three were used.

  Warmth is cold. The courier prefetch found nothing to or from sarah@sarahreid.com.au across
  all five accounts, and no subject-line hit on her name or on Adventure.com. No earlier
  approach file exists for her in this campaign folder. The profile records no dated conduct of
  hers toward us, so there is no prior dealing to name. The a_author line about naming an
  earlier unanswered note does not fire: we did not write to her. Per INVARIANTS I1 and that
  same appendix, no engagement statement of any kind appears in the message, the absence claim
  included. The opener works from the venue and the offer.

  The angle is see-it-first-over-the-border. It rests on three evidence lines and is shaped
  around one trap.

  The trap first, because it governs what the angle may not do. Her beat is adventure, emerging
  destinations and regenerative travel. The profile's confirmed work is equine wellness culture
  in Sumba and a new four-day trail through the Gondwana Rainforests, and its bearing-absence
  line records nothing public from her on Rivermill, farmstay, weddings or venue hire. A family
  circus is not her subject and no reading of the profile makes it one. Two moves are therefore
  off the table. Reciting her Gondwana or Sumba pieces back at her is the §4.5 homework gesture
  and neither piece is a circus story. Telling her what kind of story this is presumes on a beat
  that is not hers; draft 1 did exactly that with "a school-holiday story for you", and the
  role-play named it as the reason she does not work in that lane. The angle instead makes the
  pass unconditional, so the beat question is hers to answer and costs her nothing to decline.

  Evidence line one, geography. She is based in Byron Bay. Among the thirty stems in this
  segment she is one of the few not already on the Gold Coast, so the state border is the one
  anchor that distinguishes her subject line from every other in the campaign, which is what
  §4.5 asks of a subject. One clause in the body answers the first practical question a pass
  raises, which is how far.

  Evidence line two, place as the subject. She is a destination writer with a Lonely Planet
  book and a graduate certificate in sustainable tourism management. What makes this a story
  rather than a listing is the setting, so the setting is what the message describes: a tent on
  a lawn among century-old figs, on a property on the Coomera. That is the
  big-top-at-a-heritage-farm USP as a picture rather than as a label, held to what the sources
  support and no further.

  Evidence line three, firstness. The not-advertised USP, in this segment's framing of a
  reviewer seeing it before their audience does. It carries a second job: it answers why a
  stranger is offering free seats, which the role-play flagged as unresolved when the ask stood
  on its own.

  Named-entity discipline. The operator's name does not appear in the final. It resolved
  nowhere for a reader who has never dealt with us, scoring 0 in the third pass, and neither the
  campaign nor the showtimes file supplies a credential to introduce it with. Inventing one
  would be the error the same pass caught elsewhere. The show name and the Eventbrite listing
  carry the identification; the operator's name and a link belong in the reply, where the
  role-play said it would ask for them.

  Cross-reference to prior approaches in this campaign. The seven approach files already in this
  folder are organiser segments, and all open on circulating an offer to members or residents.
  That angle does not apply here: this pass is for her, not for a list she holds, and the
  nothing-to-organise USP is not in this segment's framings. The voice is consistent with those
  files and the ask is not.

response_likelihood: 40

a_note: |
  Angle see-it-first-over-the-border: an unconditional first-look pass pitched on the setting
  and on the border crossing, with no claim that a circus is her beat. Channel email 23
  September, LinkedIn connection note 25 September only if no reply, no phone on file. Warmth
  cold, no prior correspondence on any account. Language en-au. Three challenger passes, the
  yield-9 budget, ending 60 per cent in role-play; the persistent discount is the beat mismatch,
  which every pass named and which the message answers by detaching the pass from coverage
  rather than by arguing. Two things for R to watch: she will likely ask who the operator is, so
  the reply needs a link and a credential ready, and she asked whether the show suits small
  children, which no source in this campaign answers.

