quality_checklist: |
  1. YAML structure: root keys drawn from the section 6 set (decisions, rounds,
     angle_rationale, response_likelihood, a_note, fact_provenance,
     quality_checklist); no profile_hash, which the harness prepends (issue
     #63); every draft and review round carries type and number; addresses are
     real, taken from the roster and the campaign sender block. No validator
     subprocess was invoked.
  2. Coverage: fact_provenance lists every factual claim in the final email and
     the phone script, including the claims the phone script alone makes.
     chosen_usps present on the draft and final rounds. a_note carries angle,
     channel, warmth and language.
  3. Presupposition test: no sentence recites the club's own year back to it.
     The High Tea at Royal Pines, the Christmas party, the line dancing and the
     named committee were all available and left out for this reason. The
     meeting cadence is presupposed in "nothing that needs to wait for a
     meeting" rather than narrated, and the April note is the sender's own
     conduct, not the recipient's.
  4. Manufactured-connection test: the angle rests on the meeting cadence, the
     office she holds, the club's confirmed social programme, the member
     demographic and the Robina 4226 location, each a profile data point. The
     profile's recorded silence on heritage venues, hinterland and farm-style
     excursions is respected: no interest in any of them is attributed to her,
     and the April note appears as continuity only.
  5. Concreteness: the ask is a rough number of tickets, answerable in one
     sentence, which is the segment's message_goal. The unit was added in
     revision after the challenger found it open.
  6. Band-level pattern check: this opener gives the venue introduction, one
     line naming the April note, then the ask. Read against the other two
     community-organisation files already in the campaign folder, the shapes
     differ: this one carries no "this one is smaller" pivot and makes no
     assertion about the earlier note going unanswered. The full band sweep
     stays with the reviewer, since this file is written on its own.
  7. Final round email cardinality: one email and one phone message in the final
     round, within the one-email cap.
