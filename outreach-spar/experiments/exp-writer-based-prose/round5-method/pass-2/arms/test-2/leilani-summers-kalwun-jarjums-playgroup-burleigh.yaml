# Contact: Leilani Summers, Program Coordinator, Kalwun Jarjums Playgroup (Burleigh Heads)
# Channel: email (BurleighCFSSAdmin@kalwun.com.au), phone follow-up (07 5520 8600)
# Language: en-au
# Angle: free opening-week seats to hand to her own families, with nothing to organise
decisions:
  channel: email
  channel_detail: |
    Email first to the Burleigh Child, Family and Support Services inbox on
    23 September, phone follow-up to 07 5520 8600 on the morning of
    24 September where no reply has come. No LinkedIn exists for this
    contact and no personal email was located, so the branch inbox is the
    only written route. The organisation's Facebook Page is Kalwun's
    corporate Page, not a Jarjums channel, and a Page message would put the
    offer in front of the wrong part of the organisation.
  language: en-au
  angle: tickets-to-hand-on-nothing-to-organise
angle_rationale: |
  Warmth is cold. The dispatcher prefetch searched both directions on
  BurleighCFSSAdmin@kalwun.com.au, and searched the contact and
  organisation names in subject lines, across all five configured accounts.
  It returned no hits. The profile records no dated conduct by Leilani or
  Kalwun towards us. So the message carries no prior-dealing line and no
  "we wrote before and heard nothing" line: neither condition in the
  campaign's a_author appendix is met.

  The profile is institutional. Leilani has made no public statement, the
  Kalwun Page names her nowhere, and the thirty harvested Kalwun posts hold
  no excursion or outing post. The profile's absent-themes list rules out
  building an angle on nature play, outings, heritage venues or Rivermill.
  What remains is what the segment plan block's deciding_interest already
  names: a recurring group with one decision-maker, at Burleigh Heads about
  thirty minutes from Mount Nathan, delivered by employed educators, free
  to attend, with no fee-collecting history.

  That last fact picks the angle. The profile's relevance assessment says a
  paid outing has a slow or non-existent path here, and that any offer needs
  a complimentary frame. The plan block's nothing-to-organise USP is the
  shape that fits: the ask is to forward tickets, not to assemble an
  excursion. Jarjums runs in school term, so the group is unlikely to meet
  during the holidays. The forwarding shape works with that rather than
  against it, and the draft presupposes her reach over the break rather than
  asserting anything about her calendar.

  The profile also flags cultural safety: a general-population venue on
  Yugambeh country with no published First Nations programming should
  invite, not claim. The message therefore makes no cultural claim, no
  acknowledgement gesture, and no reference to country. It is one local
  organisation writing to another, which is the register the campaign
  appendix asks for.

  USPs: nothing-to-organise (functional, the one the message rests on),
  opening-week-seats (functional), big-top-at-a-heritage-farm (emotional,
  one line), and one clause of not-advertised carrying the "something your
  families could not otherwise get" framing. make-a-day-of-it is not in this
  segment's list and is left out.

  Held out of the first message by campaign rule: the code, the price, the
  Eventbrite link, any discount, and anything implying seats are unsold or
  that the offer serves us. The pass-on wording says the tickets are for her
  families rather than for posting publicly. group-visit-later appears as
  the one-line alternative the plan block's first_ask specifies.
response_likelihood: 55
a_note: |
  Angle: free opening-week seats to hand to her own families, with nothing
  to organise, plus the second-week group visit as the alternative. Channel:
  email to the Burleigh branch inbox, phone to 07 5520 8600 the next
  morning. Warmth: cold, prefetch clean in both directions. Language:
  en-au. Drafting considerations: the email lands in a shared admin inbox
  rather than a personal one, so a colleague opening it can act on it;
  Jarjums runs term-time only, so the message presupposes she reaches
  families by her own list over the break instead of through a session; no
  cultural claim is made, per the profile's cultural-safety finding.
rounds:
  - type: draft
    number: 1
    chosen_usps: [nothing-to-organise, opening-week-seats, big-top-at-a-heritage-farm, not-advertised]
    notes: |
      First touch. Element order follows the method's ask-before-justification
      rule: introduce the sender, make the ask, then supply the reasons. No
      code, price or link.
    messages:
      - channel: email
        to: BurleighCFSSAdmin@kalwun.com.au
        bcc: partnerships@rivermill.au
        subject: Free circus tickets for your Jarjums families, Thursday to Sunday
        body: |
          Hi Leilani,

          I am Priyanka Das, partnerships at Historic Rivermill, the riverside venue on Beaudesert Nerang Road at Mount Nathan, about 30 minutes inland from Burleigh Heads.

          I have free tickets to a family circus for the Jarjums families. A circus company has put a big top up on our lawn for the school holidays with a show called WANTED – A Cirque Heist, and there are seven sessions from this Thursday 24 September through to Sunday 27 September, the first at 1pm on Thursday. If you reply with a rough number of families, I will send you a booking code and the link for you to pass around the group.

          The tickets are for your families rather than for posting publicly. There is nothing to organise at your end: each family books whichever session suits them. We are not advertising these seats anywhere, and the same shows are on sale at full price, so it is something your families would not come across on their own.

          If the group would rather come out together instead, the following week suits that better. Tell me a day and I will come back to you.

          Priyanka Das
          Partnerships, Historic Rivermill (Colourful.land Pty Ltd)
          partnerships@rivermill.au | 07 3703 1307
          950 Beaudesert Nerang Rd, Mount Nathan QLD 4211
        to_note: |
          Organisational inbox for Kalwun's Burleigh Child, Family and Support
          Services branch, published by Kalwun and backfilled to the roster by
          P. Not a personal address for Leilani.
      - channel: phone
        to: 07 5520 8600
        text: |
          Follow-up call on the morning of Thursday 24 September where the
          email has drawn no reply.
        script:
          - point: Opening
            text: "Good morning, is Leilani there please? My name is Priyanka Das, I am with Historic Rivermill out at Mount Nathan. I sent an email to the Burleigh admin address yesterday about some free circus tickets and I wanted to make sure it had reached the right person."
          - point: What it is
            text: "There is a circus in a big top on our lawn for the school holidays, a family show, and I have free tickets set aside for the Jarjums families. Seven sessions between tomorrow and Sunday, and families pick whichever one suits them."
          - point: Ask
            text: "If you give me a rough number of families, I will email you a booking code and the link this morning and you can pass it around however you normally reach them."
          - point: Close
            text: "What is the best address for me to send the code to? Confirm the address, confirm the numbers, and say the code and link will be in her inbox within the hour."
        phone_note: |
          Kalwun Burleigh Child, Family and Support Services line. Ask for
          Leilani Summers. Call between 9am and 11am; if she is unavailable,
          ask when she is in and call back rather than leaving the offer with
          whoever answers.
  - type: review
    number: 1
    verdict: REVISE
    in_character: |
      An email arrives at the Burleigh admin inbox, naming me and the
      playgroup correctly, offering free tickets to a circus at a venue I had
      not previously dealt with. Nothing is asked of me beyond a headcount,
      no money changes hands, and no personal information about the children
      is requested. On its own terms it reads as what it claims to be, a
      local business inviting a local community group. I would not take it
      purely at face value: Kalwun runs on community trust, and before I
      forward anything bearing an outside brand to the families I work with I
      would want to be surer of the venue, and more practically of how I
      would reach families this week, since our Tuesday session does not run
      during the holidays the circus falls in. That is a logistics question,
      not a reason to ignore the offer. The follow-up call complicates rather
      than reassures. Ringing on the Thursday morning to say "seven sessions
      between tomorrow and Sunday" describes a circus starting the next day,
      when the email I hold says Thursday is the first day and the first show
      is at 1pm that afternoon. Nothing here would stop me replying. I would
      raise two practical things in the reply: how best to reach families
      quickly during the term break, and which shows are actually on offer,
      given the email and the call do not agree. Reply likelihood 72 per cent.
    fact_check:
      - claim: Seven sessions between tomorrow and Sunday (phone script, spoken Thursday 24 September morning).
        source: Showtimes file and the campaign YAML header, both fixing the opening show at 1pm on Thursday 24 September.
        result: wrong
        note: The email sent the day before already states "this Thursday, the first at 1pm on Thursday". Said aloud on the Thursday, "tomorrow" pushes the first show to Friday.
        correction: Name the one o'clock session on the day of the call instead of using a relative day.
      - claim: Sender name, role, organisation, sending address, bcc and phone (07 3703 1307).
        source: Campaign YAML sender block and the fees-and-service-hours business information block.
        result: verified
      - claim: Venue address, 950 Beaudesert Nerang Rd, Mount Nathan QLD 4211, described as riverside.
        source: Business overview (address and U1, the Coomera River dining deck).
        result: verified
      - claim: Seven sessions from Thursday 24 September to Sunday 27 September, the first at 1pm Thursday.
        source: Showtimes file and the campaign YAML header ruling on opening week.
        result: verified
      - claim: No code, price, discount, Oztix link or unsold-seats implication in the first message.
        source: Campaign a_author appendix and the not-advertised and opening-week-seats USP entries.
        result: verified
    antifact_check: |
      No stone buildings, no century-old or original mill structures, no
      vineyard, no farming claim, and no Tamborine Mountain placement. The
      venue is described as a riverside venue at Mount Nathan.
    revision_note: |
      The persona raised five points; each was sorted before the draft moved.
      (1) "Seven sessions between tomorrow and Sunday", scored 0: fixed in the
      draft by cutting the sentence and naming the one o'clock session on the
      day of the call. (2) "To make sure it had reached the right person",
      scored 2: cut. The call happens because no reply came, so receipt cannot
      be presupposed, and checking it aloud starts a conversation about the
      inbox rather than the tickets. (3) Who Historic Rivermill is and why a
      commercial venue gives seats to an ACCO with no strings named: left for
      the reply. The persona named it as a thought, not a blocker, and the
      only answers available to a first message are our own reasoning, which
      the campaign keeps out, or a credential this segment's USP list does not
      carry. (4) How she would reach families during the term break: absorbed
      by reframing the sentence about nothing to organise, which now
      presupposes she reaches families by her own means over the break.
      Naming the break as an obstacle would narrate her world back at her.
      (5) Which shows are on offer: this arose only from the email and the
      script disagreeing, which point 1 settles.
  - type: draft
    number: 2
    chosen_usps: [nothing-to-organise, opening-week-seats, big-top-at-a-heritage-farm, not-advertised]
    notes: |
      Email changed in one sentence, the phone script in two lines. The ask,
