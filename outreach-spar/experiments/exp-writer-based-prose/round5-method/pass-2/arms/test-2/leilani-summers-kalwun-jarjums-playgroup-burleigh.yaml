  - type: review
    number: 2
    verdict: DONE
    in_character: |
      A stranger, writing from a venue thirty minutes away I have never dealt
      with, has offered our families free circus tickets for the school
      holidays: no cost, no catch stated, no ask beyond a headcount. Nothing
      presses me for money or a decision I cannot reverse, so there is little
      downside to replying. The timing is the real question. Jarjums runs
      during school term and this lands in the middle of the holidays, so I
      have no scheduled session between now and Thursday to pass the word
      through. I would be relying on whatever phone or text list I keep for
      families outside term time. That is possible, but gathering even a rough
      number by Thursday means reaching people today. Tight, not impossible.
      Before forwarding I would want to know whether the venue and the show
      suit little ones: shade and seating, pram and wheelchair ground,
      anything culturally awkward I should check first. I would ask that in
      the reply rather than hold the reply for it. Nothing named here would
      stop me. The email came to our shared admin inbox rather than to me
      directly, so it may sit unread for a day or two before I see it. That
      is a practical filter on replying in time, not a reason not to. Reply
      likelihood 45 per cent.
