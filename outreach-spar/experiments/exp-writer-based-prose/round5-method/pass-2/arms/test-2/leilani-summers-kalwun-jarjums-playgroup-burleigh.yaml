quality_checklist: |
  1. Structure. Root keys drawn from the canonical set; no profile_hash,
     which the harness prepends. Every draft and review round carries type
     and number. The final round carries one email message and one phone
     message, which satisfies the email cardinality cap. The to-address is a
     real published inbox, not a placeholder.
  2. Coverage. fact_provenance reaches every factual claim in the final
     email and the final phone script: sender identity, venue identity and
     location, distance, phone, the show and its setting, the seven
     opening-week sessions and the 1pm Thursday opening, the free price, the
     deferred code and link, the keep-it-inside-the-organisation wording, the
     no-outing shape, the not-advertised comparison, the second-week
     alternative, and the two profile facts the message leans on. chosen_usps
     is present on both drafts and the final round. a_note carries angle,
     channel, warmth, language and the three drafting constraints.
  3. Presupposition. The message tells her nothing about herself. Her
     playgroup's name, her term calendar and her own means of reaching
     families are used as given, not explained back to her. Draft 2 removed
     the one line that risked narrating the term break at her.
  4. Manufactured connection. No claim of shared interest appears. The
     profile found no public statement and no excursion history, so the
     message asserts no affinity for outings, nature play or heritage
     venues, and makes no cultural claim about a venue with no First Nations
     programming.
  5. Concreteness. The ask is a rough number of families, answerable in one
     sentence, with a named alternative (a day next week) that is answerable
     in one sentence too.
  6. Band pattern. The opener leads with the sender's identity and location
     rather than a compliment or a question, and the second sentence carries
     the ask. The differentiators against the rest of the band are the
     Jarjums name in the subject line and the Burleigh distance in the first
     line.
  7. Final email cardinality. One email in the final round.
