quality_checklist: |
  1. Structure. Root keys drawn from the canonical set; every round carries
  type, and the draft and review rounds carry number; the final round holds
  one email message and one phone message, so the email cap of one holds;
  southportdayview@gmail.com is the roster address, so no placeholder and no
  desync. profile_hash omitted for the harness to prepend on line 1
  (issue #63). The validator was not invoked from here, per SPAR-A 7.1.

  2. Coverage. fact_provenance reaches every factual claim in the final
  email and the phone script, including the two phone numbers.

  3. Presupposition test. Pass after revision. The message tells Lynley
  nothing about her own club; the phrases the challenger could not resolve
  were cut or reframed, and the recited-history gesture is absent.

  4. Manufactured-connection test. Pass. No shared interest is claimed. The
  profile records no statements on heritage venues, hinterland or farm
  excursions, and none is asserted. The angle rests on the club's
  documented practice of circulating notices to members.

  5. Concreteness. Pass. "Reply and tell me you will pass it on, with a
  rough guess at how many people" is answerable in one sentence, and
  matches the segment's message_goal.

  6. Band-level pattern check. Not executable from this contact's context.
  The opener is contact-specific: a self-introduction followed by the April
  note. Worth a reviewer's eye across the band, since the prior-contact
  line will recur wherever the prefetch finds an unanswered outbound.

  7. Final round email cardinality. Pass, one email.

  Flag for the human, no roster_patch declared. The profile records a
  second number for the club, the mobile 0490 263 286 from Facebook,
  alongside the roster landline (07) 5538 3112. The roster carries one
  phone column, so a patch would overwrite a good number with another good
  number rather than add one. Both numbers are in the phone_note instead.
