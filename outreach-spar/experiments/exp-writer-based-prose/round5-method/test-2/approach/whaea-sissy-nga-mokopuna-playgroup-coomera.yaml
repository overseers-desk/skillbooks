quality_checklist: |
  1. Structure. Root keys drawn from the canonical set; every round carries
  type, and the draft and review rounds carry number; the final round holds
  one email message and one phone message, so the email cap of one holds;
  nga.mokopuna.qld@gmail.com is the roster address, so no placeholder and
  no desync. profile_hash omitted for the harness to prepend on line 1
  (issue #63). The validator was not invoked from here, per SPAR-A 7.1.

  2. Coverage. fact_provenance reaches every factual claim in the final
  email and the phone script, including the phone number, the term-time
  schedule behind the phone_note, and the macronised spelling of the
  group's name, which the roster carries without macrons and the profile
  and the group's own page carry with them.

  3. Presupposition test. Pass after revision. The message tells Whaea
  Sissy nothing about her own playgroup. The one phrase the challenger
  could not resolve, "the page", is cut rather than introduced, and no
  recited-history gesture appears.

  4. Manufactured-connection test. Pass. No shared interest is claimed. The
  profile records no outings, no excursions and no statements on farms,
  heritage venues or nature, and none is asserted. The angle rests on what
  the profile does evidence: a group whose organiser circulates notices to
  a community of families, 15 to 20 minutes away.

  5. Concreteness. Pass. "Reply with roughly how many families would use
  them" is answerable in one sentence, and matches the segment's
  message_goal of a reply with a rough number.

  6. Band-level pattern check. Not executable from this contact's context.
  The opener is contact-specific: a self-introduction, then the March note.
  Worth a reviewer's eye across the band, since the prior-contact line
  recurs wherever the prefetch finds an unanswered outbound, and it is the
  second such opener in this campaign after Southport Day VIEW Club.

  7. Final round email cardinality. Pass, one email.

  No roster_patch declared. No new or corrected contact detail was found;
  the roster email and phone both match the profile.
