quality_checklist: |
  1. YAML structural self-check: root keys drawn from the §6 canonical
     set; every round carries type, and both non-final rounds carry
     number; the final round holds one channel:email message plus one
     linkedin and one phone; addresses are real, not placeholders.
  2. Coverage: chosen_usps set on the draft and final rounds;
     fact_provenance reaches every factual claim in the final draft,
     including the show times, the duration, each USP claim, the venue
     description and both contact details; a_note carries angle,
     channel, warmth, language, the spar outcome and the reason the
     recorded likelihood sits below the persona's estimate.
  3. Presupposition test: no sentence tells Megan something she already
     knows about herself. The Form 3 findings about the bus and the
     committee shape what is asked of her and are never narrated back.
  4. Manufactured-connection test: no claim of shared interest. The
     profile records no public statements attributable to her, and the
     message asserts none. Every claim about the offer traces to the
     campaign's usps registry or the season's own data files.
  5. Concreteness: the ask is a rough number, answerable in one
     sentence, with a named alternative (a day the following week) that
     is answerable in one sentence too.
  6. Channel character limits: the LinkedIn note runs about 270
     characters, inside the platform's invitation-note cap.
  7. Band-level pattern check: the opener introduces the sender and the
     big top rather than opening on the recipient's organisation, which
     differs from the prior-relationship openers used where a dated
     dealing exists in this campaign.
  8. Final round email cardinality: one channel:email message in the
     final round. Passes.
