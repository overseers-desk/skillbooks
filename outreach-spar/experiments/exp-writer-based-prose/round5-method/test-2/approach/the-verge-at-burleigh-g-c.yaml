      - claim: Tomorrow afternoon, tomorrow at 1pm, Sunday 27 September.
        source: 2026-09-23-stampede-arena-showtimes.md; campaign header (Thursday 24 to Sunday 27 September, seven shows).
        result: verified
      - claim: There is no performance on those two days (Monday, Tuesday).
        source: 2026-09-23-stampede-arena-showtimes.md ("Mondays and Tuesdays are dark").
        result: verified
      - claim: The code and the ticket link are promised in the reply, not given in the first message.
        source: opening-week-seats.rests_on.
        result: verified
      - claim: Venue description (Coomera River, Mount Nathan, Gold Coast hinterland, cafe, horse riding, farm animals).
        source: business-overview.md; business-antifacts.md.
        result: verified
    antifact_check: |
      Re-checked against business-antifacts.md: no stone buildings, no
      100-year-old structures, no vineyard, not on Tamborine Mountain.
      "Farm animals" is the antifacts file's own recommended phrasing. No
      feed-bag or animal-food offer, no Oztix link, no price to residents
      implied.
    notes: |
      "The week after" scored 3, resolvable from the Sunday 27 September
      date in the same message, and the persona said it would raise the
      point in its reply rather than let it stop the reply. Under 4.6 that
      is a question the reader asks on replying, not a concern, so the draft
      is unchanged and the point is answered when the sender writes back
      with seating.
