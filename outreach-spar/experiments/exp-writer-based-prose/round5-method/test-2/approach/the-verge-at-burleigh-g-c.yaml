  - type: review
    number: 2
    verdict: DONE
    in_character: |
      I don't know Historic Rivermill and nobody has written to me from
      there before, so this lands as a cold approach. What it asks of me is
      realistic in the time it gives: nothing more than a rough headcount by
      reply, and that's something I can do between now and this afternoon
      without touching a diary. There's no bus to book, no forms, no group
      to assemble, so the tight notice doesn't actually bind me to anything.
      The one thing I'd want spelled out before I commit to a second-week
      outing is which week she means by "the week after". I can guess it's
      the week starting 28 September, since that's the week after the dates
      she's just given me, but she hasn't said so outright.

      The offer itself reads sensibly: free, not advertised, meant to stay
      off our public pages, nothing sold to me. I'd probably forward this to
      reception and to Jeff, who runs our social calendar, and reply with a
      number for opening week while asking her to confirm what "the week
      after" covers for the outing option.

      Nothing here stops me replying outright. The only point I'd raise in
      my reply rather than let pass is the week-after ambiguity.
      (REPLY_PCT: 80)

      Presupposition table: every phrase resolved at 3 or above. The lowest
      was "the week after" at 3, resolved by arithmetic from the Sunday 27
      September date given earlier in the same message.
