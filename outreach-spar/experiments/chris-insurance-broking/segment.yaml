# =============================================================================
# Single-segment campaign: ANZ C-suite controlling corporate insurance programs
#
# CURRENT SCOPE: S&P only. A-phase fields (message_goal, first_ask,
# conversion_funnel steps after S&P) are placeholders. S&P does not read them.
# =============================================================================

title: ANZ C-suite controlling corporate insurance programs
priority: Tier 1
date: 2026-04-17

objective: |
  Build a roster of ANZ-based C-level executives (CEO, CFO, CIO, owner,
  founder, managing director) who personally control the insurance program at
  companies in manufacturing, transportation/logistics, sports, tourism,
  hospitality/leisure, retail, or wholesale. Profile each contact sufficiently
  for Chris Graham to triage and, at a later stage, select approach angles for
  personalised outreach.

  Out of scope for this campaign revision: drafting or sending outreach
  messages. A-phase and R-phase will be enabled in a future revision.

discovery_criteria: |
  A valid roster row satisfies ALL of:

  1. Geography: resident in Australia or New Zealand (LinkedIn location field).
  2. Current role title contains: CEO, Chief Executive Officer, CFO, Chief
     Financial Officer, CIO, Chief Information Officer, Owner, Founder, or
     Managing Director.
  3. Current employer industry is one of: manufacturing, transportation and
     logistics, sports, tourism, hospitality/leisure, retail, or wholesale.
  4. Public signal of insurance-program engagement: has posted, commented,
     re-shared, or been quoted on a topic containing "insurance", "risk",
     "renewal", "claim", "D&O", "cyber policy", "business interruption",
     "policy wording", or "broker" — on LinkedIn, in press, or in a conference
     talk. (This rule is relaxed in S&P₂; see approach_sequencing.)

  A valid roster row must NOT match any of:

  5. Current employer is in the insurance, financial services, law, or
     management consulting industries. This excludes brokers, underwriters,
     insurer staff, loss adjusters, claims managers, insurance lawyers,
     actuaries, reinsurers, and competing risk consultants. Broker brand
     names to treat as hard-exclude employers: Marsh, Aon, WTW, Willis,
     Willis Towers Watson, Gallagher, Arthur J. Gallagher, Lockton, Howden,
     Honan, Austbrokers, Insurance Advisernet, IAA, Steadfast, JLT,
     MGA Insurance, PSC Insurance, BJS Insurance, Coverforce, Edgewise,
     Elliott Insurance.
  6. Current role title contains "Risk Manager", "Head of Risk", "Head of
     Insurance", "Insurance Manager", or "Chief Risk Officer". These people
     hold the insurance-program authority this campaign is trying to reach at
     C-suite level — they are a parallel population, not a target.

  Rationale: rules 2–4 and 5–6 together capture C-suite who personally
  control their company's insurance program. Company size is not a criterion
  because authority is already encoded — companies large enough to employ a
  Risk Manager fail rule 6; companies too small for the CEO to engage
  publicly on insurance fail rule 4.

usps:
  - id: TODO_AR_PHASE
    type: functional
    framing: |
      USP framing will be populated before A-phase. S&P does not read this.

message_goal: |
  Not applicable during S&P-only scope. To be defined before A-phase.

first_ask: |
  Not applicable during S&P-only scope. To be defined before A-phase.

conversion_funnel:
  - step: 1
    name: S&P roster build
    description: |
      S-phase discovers names matching discovery_criteria; P-phase profiles
      each and assigns a star rating. The campaign stops at the end of P in
      current scope.

approach_sequencing:
  - step: 1
    action: |
      S&P₁ — seed from two sources in parallel:
      (a) Chris Graham's LinkedIn 1st-degree connections filtered by rules
          2–3, tagged discovered_via=chris-1st-degree.
      (b) LinkedIn people search for ANZ + C-suite role titles + the
          insurance/risk keywords in rule 4, with company-industry filter
          matching the seven verticals, tagged discovered_via=linkedin-search
          with the query recorded in discovery_source.
      Apply exclusion rules 5–6 to both streams before admitting to the
      roster.
  - step: 2
    action: |
      S&P₂ — broaden beyond publicly engaged contacts. Drop rule 4 (the
      "has posted publicly" requirement). Sources:
      (a) Chris's LinkedIn 2nd-degree via contacts already profiled in S&P₁.
      (b) ASIC company register filtered by ANZSIC codes matching the seven
          industries; enrich director names with LinkedIn to check rules
          2, 5, 6.
      (c) NZ Companies Office for New Zealand residents.
      Apply the reverse-search diagnostic: extract keywords from S&P₁
      contacts' posts, re-query LinkedIn with those keywords to catch
      contacts invisible to the original search vocabulary.
  - step: 3
    action: |
      S&P₃ — snowball and long tail. Industry association member directories
      (AusCycling, Tourism Accommodation Australia, Australian Logistics
      Council, National Retail Association, NZ Retail Association, etc.).
      Conference speaker lists (ANZIIF, RIMS Australasia, industry-specific
      risk events). Web search for long-tail names. Stop when yield falls
      below 5 new contacts in the iteration.

scope_note: |
  The insurance ecosystem (brokers, underwriters, insurer staff, insurance
  lawyers, loss adjusters, actuaries, reinsurers, competing risk consultants)
  is excluded by rule 5. Risk Managers at otherwise-qualifying companies are
  excluded by rule 6 — they are not targets for this campaign.

  Chris Graham's own 1st-degree LinkedIn connections are included in S&P₁
  and tagged discovered_via=chris-1st-degree.

geographic_catchment: |
  Australia and New Zealand (ANZ). LinkedIn location field is the primary
  geographic signal.

profile_reject_if:
  - linkedin_not_invoked
  - facebook_not_invoked
