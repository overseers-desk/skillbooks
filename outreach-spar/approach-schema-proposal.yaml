# =============================================================================
# SPAR-A approach file — YAML schema
#
# Defines the structure for approach files produced by the A stage of
# the SPAR methodology. Campaign-agnostic: the same schema applies to
# any SPAR deployment. Campaign-specific content (sender address, USP
# documents, segment goals) is supplied by the campaign YAML.
#
# Provenance rule: the approach file records (a) a dated snapshot of
# profile richness (which determined round budget), and (b) decisions
# the AI made during the A stage. Fields whose single source of truth
# is elsewhere are NOT duplicated here:
#
#   - contact name, role, organisation → filename + roster
#   - response_likelihood, star_rating → roster only (SPAR-A §2)
#   - max_rounds → deterministic from profile_richness (SPAR-A §4.6)
#   - sender address → campaign YAML default; approach records the chosen sender
#   - channel sequencing/timing → methodology (SPAR-A §4.2) or campaign YAML
#   - angles list → profile "Angles" section (approach records which
#     one was selected, not the full list)
#   - USP wording → campaign USP document (approach records which
#     USP identifiers were selected, not the text)
# =============================================================================

# ---------------------------------------------------------------------------
# CONTEXT — snapshot of the profile this approach was based on
# ---------------------------------------------------------------------------

profile_date: 2026-03-30                      # date of the profile used
profile_richness: Medium (4 data points)      # richness at that date; determines A2 round budget

# ---------------------------------------------------------------------------
# DECISIONS — judgement calls the AI made during the A stage
# ---------------------------------------------------------------------------

decisions:
  warmth: Known-of                            # degree of prior relationship with the contact
  warmth_detail: ...                          # evidence supporting the warmth level; optional
  channel: LinkedIn + email + phone           # decided per SPAR-A §4.2 decision tree
  language: English                           # decided per §4.3; available languages defined in campaign YAML
  angle: ...                                  # selected from profile's ordered angle list per §4.4
  sender:
    name: Lia Movsisyan                       # chosen sender for this approach
    email: partnerships@rivermill.au          # resolved from campaign default or overridden
    # note: (present only when overriding the campaign default — reason for override)

# ---------------------------------------------------------------------------
# ANGLE SELECTION RATIONALE — the AI's reasoning for the decisions above
# ---------------------------------------------------------------------------

angle_rationale: |
  (Prose block. Why this angle was selected, why alternatives were not,
  what profile evidence supports the choice.)

# ---------------------------------------------------------------------------
# QUALITY CHECKLIST — optional (SPAR-A §7)
# ---------------------------------------------------------------------------

# quality_checklist:
#   - test: Presupposition test
#     result: pass
#     note: ...
#   - test: Manufactured-connection test
#     result: pass
#     note: ...
#   - test: Concreteness
#     result: pass
#     note: ...
#   - test: LinkedIn character count
#     result: pass
#     note: ...
#   - test: Band-level pattern check
#     result: pass
#     note: ...

# ---------------------------------------------------------------------------
# ROUNDS — the draft/review cycle
#
# Each entry is one step in the A1→A2→A1→A2→...→final sequence.
# "type" is one of: draft, review, final.
#
# CONSTRAINT: the rounds list MUST contain exactly one round with
# type: final. An approach file without a final round is invalid.
#
# Message list order implies the send sequence. Timing rules between
# messages (e.g. wait N days) are defined in the methodology or
# campaign YAML, not repeated here.
# ---------------------------------------------------------------------------

rounds:

  - type: draft
    number: 1
    chosen_usps: [...]                        # USP identifiers from campaign USP document; may change between rounds
    messages:
      - channel: linkedin                     # e.g. linkedin, email, phone, facebook, whatsapp, etc.
        text: ...
        char_count: 245                       # LinkedIn has a 300-character limit

      - channel: email
        director_note: ...                    # pre-send instruction for human reviewer; optional
        to: ...                               # from roster; AI may choose which address
        subject: ...
        body: |
          (Email body as literal block scalar. No escaping needed.)

      - channel: phone
        script:
          - point: opening
            text: ...
          - point: ask
            text: ...
          - point: if_interested
            text: ...
          - point: if_not_now
            text: ...

  - type: review
    number: 1
    in_character: |
      (A2 subagent's in-character reaction as the recipient.
      Context-isolated — no campaign files, only the profile and draft.)
    fact_check:
      - claim: ...
        source: ...                           # source document and location
        result: correct                       # one of: correct, incorrect
    verdict: DONE                             # one of: DONE, REVISE
    # revision_note: ...                      # present only when verdict is REVISE

  # Additional draft/review pairs follow the same structure.
  # A1 Draft 2 → A2 Response 2 → ... until rounds exhausted or DONE.

  - type: final
    chosen_usps: [...]                        # USP identifiers used in the final draft
    messages:
      - channel: linkedin
        actioned_date: ~                      # null until actioned; then YYYY-MM-DD
        replied_date: ~                       # null until reply received
        reply_summary: ~                      # paste or summary of reply
        text: ...
        char_count: 245

      - channel: email
        actioned_date: ~
        replied_date: ~
        reply_summary: ~
        director_note: ...
        to: ...
        subject: ...
        body: |
          (Final send-ready email body.)

      - channel: phone
        actioned_date: ~
        script:
          - point: opening
            text: ...
          - point: ask
            text: ...

# ---------------------------------------------------------------------------
# FACT PROVENANCE — maps each claim in the draft to its source document
# ---------------------------------------------------------------------------

fact_provenance:
  - claim: ...
    source: ...                               # source document and location

# ---------------------------------------------------------------------------
# ROSTER NOTE — single-line summary written to the roster a_note column
# ---------------------------------------------------------------------------

roster_note: ...
